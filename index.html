ثنين متقابلة. عند الرشّ: اشطف 15 دقيقة بالماء وأخبر المكوِّن."]], "k": ["Ce TP est le plus dangereux du module : un geste mal fait ne se rattrape pas.", "هذه الأشغال هي الأخطر في الوحدة: الحركة الخاطئة لا يمكن تداركها."], "q": ["Comment tient-on un butyromètre après le mélange ?", "كيف نمسك البوتيرومتر بعد الخلط؟"], "o": [["Par le bouchon", "Par le corps, à pleine main", "Avec un chiffon humide sur le corps"], ["من السدادة", "من الجسم باليد كلها", "بخرقة مبلّلة على الجسم"]], "a": 0, "w": ["Le butyromètre chauffe fortement : on le tient par le bouchon.", "البوتيرومتر يسخن كثيرًا: نمسكه من السدادة."], "g": [5, 20]}, {"img": "l09_07", "t": ["Le rôle de chaque réactif Gerber", "دور كل كاشف في طريقة جيربر"], "st": [["Acide sulfurique (10 mL) : il détruit les protéines et libère les globules gras de leur membrane.", "Alcool isoamylique (1 mL) : il abaisse la tension superficielle et permet une séparation nette.", "Centrifugation (5 minutes) : elle rassemble la matière grasse dans la colonne graduée.", "Lecture : MG en % = A − B ; MG en g/L = (A − B) × 10."], ["حمض الكبريتيك (10 مل): يهدم البروتينات ويحرّر الكريات الدهنية (globules gras) من غشائها.", "الكحول الإيزوأميلي (1 مل): يخفّض التوتر السطحي (tension superficielle) ويسمح بفصل واضح.", "الطرد المركزي (5 دقائق): يجمع المادة الدسمة في العمود المدرَّج.", "القراءة: MG بـ ٪ = A − B؛ MG بـ غ/ل = (A − B) × 10."]], "k": ["Sans alcool isoamylique, la limite entre l'acide et la matière grasse reste floue.", "بدون الكحول الإيزوأميلي، يبقى الحد بين الحمض والمادة الدسمة غير واضح."], "q": ["À quoi sert l'alcool isoamylique ?", "ما دور الكحول الإيزوأميلي؟"], "o": [["À colorer la colonne", "À faciliter une séparation nette", "À refroidir le butyromètre"], ["تلوين العمود", "تسهيل فصل واضح", "تبريد البوتيرومتر"]], "a": 1, "w": ["Il abaisse la tension superficielle : la colonne de matière grasse devient nette.", "يخفّض التوتر السطحي: يصبح عمود المادة الدسمة واضحًا."], "g": [1, 23, 35]}, {"img": "l09_09", "t": ["Les six étapes du dosage Gerber", "المراحل الست لمعايرة جيربر"], "st": [["Homogénéiser le lait par retournements doux, sans faire mousser. Introduire 10 mL d'acide sulfurique à la pipette et à la poire.", "Ajouter 11 mL de lait le long de la paroi, pour qu'il reste au-dessus de l'acide.", "Ajouter 1 mL d'alcool isoamylique, boucher fermement, agiter jusqu'au mélange brun homogène.", "Centrifuger 5 minutes, puis lire à hauteur des yeux : MG % = A − B."], ["جانِس الحليب بقلب لطيف دون رغوة. أدخل 10 مل من حمض الكبريتيك بالماصّة والإجاصة.", "أضف 11 مل من الحليب على طول الجدار ليبقى فوق الحمض.", "أضف 1 مل من الكحول الإيزوأميلي، أغلق بإحكام، ورجّ حتى خليط بنّي متجانس.", "اطرد مركزيًا 5 دقائق، ثم اقرأ في مستوى العينين: MG ٪ = A − B."]], "k": ["Toujours l'acide en premier ; le mélange brun homogène montre que les protéines sont dissoutes.", "دائمًا الحمض أولًا؛ والخليط البنّي المتجانس يبيّن أن البروتينات ذابت."], "q": ["Dans le butyromètre, on verse d'abord :", "في البوتيرومتر، نصبّ أولًا:"], "o": [["le lait", "l'alcool isoamylique", "l'acide sulfurique"], ["الحليب", "الكحول الإيزوأميلي", "حمض الكبريتيك"]], "a": 2, "w": ["Ordre obligatoire : acide, lait, alcool — jamais l'inverse.", "الترتيب الإجباري: حمض، حليب، كحول — وأبدًا العكس."], "g": [1, 35]}, {"img": "l09_11", "t": ["La thermobalance et l'EST par étuvage", "الميزان الحراري وEST بالتجفيف"], "st": [["La thermobalance remplace la balance de précision et l'étuve.", "On pèse 1 g de lait dans une capsule propre, on lance l'appareil et on lit après séchage complet.", "Par étuvage : EST = masse du résidu sec × 1 000 / masse de lait, en g/L.", "L'EST mesuré et l'EST calculé par Fleischmann doivent être proches : un écart marqué signale une anomalie."], ["الميزان الحراري (thermobalance) يعوّض الميزان الدقيق والفرن.", "نزن 1 غ من الحليب في جفنة (capsule) نظيفة، نشغّل الجهاز ونقرأ بعد التجفيف التام.", "بالتجفيف: EST = كتلة البقية الجافة × 1 000 / كتلة الحليب، بـ غ/ل.", "يجب أن يكون EST المقاس وEST المحسوب بفلايشمان متقاربين: الفرق الواضح يدل على خلل."]], "k": ["La thermobalance fait gagner un temps considérable au laboratoire de réception.", "الميزان الحراري يوفّر وقتًا كبيرًا في مختبر الاستقبال."], "q": ["L'EST mesuré et l'EST calculé d'un même lait sont très différents. Cela signale :", "EST المقاس وEST المحسوب لنفس الحليب مختلفان كثيرًا. هذا يدل على:"], "o": [["une anomalie à rechercher", "un lait forcément conforme", "une erreur de la formule"], ["خلل يجب البحث عنه", "حليب مطابق بالضرورة", "خطأ في الصيغة"]], "a": 0, "w": ["Les deux valeurs doivent être proches : un écart marqué signale une anomalie.", "القيمتان يجب أن تكونا متقاربتين: الفرق الواضح يدل على خلل."], "g": [20, 22, 54, 62]}, {"img": "l09_13", "t": ["Les erreurs du dosage et le croisement qui démasque", "أخطاء المعايرة والمقارنة التي تكشف"], "st": [["Lait non homogénéisé : la crème est restée en haut, résultat trop bas. Volumes approximatifs : 11 mL de lait, pas 10 ni 12.", "Agitation insuffisante : colonne trouble, lecture impossible. Lecture oblique : lire à hauteur des yeux.", "Centrifugeuse déséquilibrée : risque de casse et séparation incomplète.", "Un lait écrémé frauduleusement présente une MG basse, une densité plutôt haute et un ESD normal."], ["حليب غير مجانَس: بقيت القشدة في الأعلى، والنتيجة منخفضة جدًا. أحجام تقريبية: 11 مل من الحليب، لا 10 ولا 12.", "رجّ غير كافٍ: عمود عكِر وقراءة مستحيلة. قراءة مائلة: اقرأ في مستوى العينين.", "جهاز طرد غير متوازن: خطر الكسر وفصل غير كامل.", "الحليب المنزوع دسمه غشًّا له دسم منخفض، وكثافة مرتفعة نوعًا ما، وESD عادي."]], "k": ["MG basse + ESD normal = écrémage ; ESD bas = mouillage.", "دسم منخفض + ESD عادي = نزع الدسم؛ ESD منخفض = إضافة الماء."], "q": ["Une matière grasse basse avec un ESD normal signe :", "دسم منخفض مع ESD عادي يدل على:"], "o": [["un mouillage", "un écrémage", "un lait normal"], ["إضافة الماء", "نزع الدسم", "حليب عادي"]], "a": 1, "w": ["L'eau n'a pas été ajoutée, l'ESD reste normal : seule la MG a été retirée.", "لم يُضف الماء، فبقي ESD عاديًا: نُزعت المادة الدسمة فقط."], "g": [19, 20, 25, 34, 58]}, {"img": "l09_15", "t": ["Les calculs du TP 2", "حسابات الأشغال التطبيقية 2"], "st": [["Exemple du cours : MG 28 g/L, densité lue 1 032 à 10 °C.", "D₂₀ = 1 032 + 0,2 × (10 − 20) = 1 030.", "EST = 1,2 × 28 + 2 665 × (1 030 − 1 000) / 1 030 = 33,6 + 77,6 = 111,2 g/L. ESD = 111,2 − 28 = 83,2 g/L.", "Conclusion : EST sous 125 g/L et ESD sous 85 g/L : lait suspect, à contrôler. Toujours conclure avec les chiffres et l'unité."], ["مثال الدرس: دسم 28 غ/ل، كثافة مقروءة 1 032 في 10 °م.", "D₂₀ = 1 032 + 0,2 × (10 − 20) = 1 030.", "EST = 1,2 × 28 + 2 665 × (1 030 − 1 000) / 1 030 = 33,6 + 77,6 = 111,2 غ/ل. ESD = 111,2 − 28 = 83,2 غ/ل.", "الاستنتاج: EST أقل من 125 غ/ل وESD أقل من 85 غ/ل: حليب مشكوك فيه يجب مراقبته. استنتج دائمًا بالأرقام والوحدة."]], "k": ["Une conclusion cite toujours les chiffres et nomme l'anomalie éventuelle.", "الاستنتاج يذكر دائمًا الأرقام ويسمّي الخلل المحتمل."], "q": ["L'EST d'un lait normal se situe entre :", "المستخلص الجاف الكلي لحليب عادي يكون بين:"], "o": [["90 et 100 g/L", "160 et 180 g/L", "125 et 135 g/L"], ["90 و100 غ/ل", "160 و180 غ/ل", "125 و135 غ/ل"]], "a": 2, "w": ["EST normal : 125 à 135 g/L. En dessous, on soupçonne un mouillage.", "EST العادي: 125 إلى 135 غ/ل. أقل من ذلك نشكّ في إضافة الماء."], "g": [13, 19, 20]}], "since": "1.6"}, {"n": 10, "t": ["TP 3 — Réductase, antibiotiques et test de Teepol", "الأشغال التطبيقية 3 — الريدوكتاز، المضادات الحيوية واختبار تيبول"], "c": [{"img": "l10_08", "t": ["Cinq tests, cinq questions", "خمسة اختبارات، خمسة أسئلة"], "st": [["Réductase : combien de bactéries ce lait contient-il ?", "Antibiotiques : ce lait pourra-t-il fermenter ? Teepol : vient-il d'une mamelle saine ?", "Alcool et ébullition : supportera-t-il le traitement thermique ?", "Ces tests sont rapides, décisifs et complémentaires : un lait peut passer quatre tests et échouer au cinquième."], ["الريدوكتاز (réductase): كم من البكتيريا في هذا الحليب؟", "المضادات الحيوية (antibiotiques): هل سيتخمّر هذا الحليب؟ تيبول (Teepol): هل جاء من ضرع سليم؟", "الكحول والغليان: هل سيتحمّل المعالجة الحرارية؟", "هذه الاختبارات سريعة وحاسمة ومتكاملة: قد ينجح الحليب في أربعة اختبارات ويفشل في الخامس."]], "k": ["Chaque test répond à une question différente et mène à une décision : accepter, déclasser, refuser.", "كل اختبار يجيب عن سؤال مختلف ويؤدي إلى قرار: القبول، التصنيف في درجة أدنى، أو الرفض."], "q": ["Quel test répond à la question « ce lait vient-il d'une mamelle saine ? »", "أي اختبار يجيب عن سؤال «هل جاء هذا الحليب من ضرع سليم؟»"], "o": [["La réductase", "Le test de Teepol", "Le test d'ébullition"], ["الريدوكتاز", "اختبار تيبول", "اختبار الغليان"]], "a": 1, "w": ["Le Teepol détecte un lait de mammite, donc une mamelle malade.", "تيبول يكشف حليب التهاب الضرع، أي ضرعًا مريضًا."], "g": [44, 52]}, {"img": "l10_09", "t": ["Le test à la réductase (bleu de méthylène)", "اختبار الريدوكتاز (أزرق الميثيلين)"], "st": [["10 mL de lait + 1 mL de bleu de méthylène (5 mg/100 mL), boucher, incuber à 37 °C. On le lance en premier : il demande jusqu'à cinq heures.", "Principe : indicateur d'oxydoréduction. Plus il y a de bactéries, plus vite l'oxygène est consommé et plus vite la couleur disparaît.", "Lecture : décoloration en moins de 15 min = contamination forte ; 15 min à 1 h = moyenne ; plus de 5 h = très bonne qualité.", "Ouvrir et refermer l'étuve rapidement : une incubation irrégulière fausse le classement."], ["10 مل من الحليب + 1 مل من أزرق الميثيلين (bleu de méthylène) (5 مغ/100 مل)، أغلق، واحضن في 37 °م. نبدأ به أولًا: يحتاج حتى خمس ساعات.", "المبدأ: كاشف أكسدة واختزال (oxydoréduction). كلما كثرت البكتيريا، استُهلك الأكسجين أسرع واختفى اللون أسرع.", "القراءة: زوال اللون في أقل من 15 د = تلوث قوي؛ من 15 د إلى 1 س = متوسط؛ أكثر من 5 س = جودة جيدة جدًا.", "افتح الحاضنة (étuve) وأغلقها بسرعة: الحضن غير المنتظم يُفسد التصنيف."]], "k": ["Plus la décoloration est rapide, plus le lait est chargé en bactéries.", "كلما كان زوال اللون أسرع، كان الحليب محمّلًا بالبكتيريا أكثر."], "q": ["Le bleu de méthylène se décolore en 10 minutes. Cela signifie :", "أزرق الميثيلين يزول لونه في 10 دقائق. هذا يعني:"], "o": [["une très bonne qualité", "une contamination forte", "un lait pasteurisé"], ["جودة جيدة جدًا", "تلوثًا قويًا", "حليبًا مبسترًا"]], "a": 1, "w": ["Moins de 15 minutes : beaucoup de bactéries ont vite consommé l'oxygène.", "أقل من 15 دقيقة: بكتيريا كثيرة استهلكت الأكسجين بسرعة."], "g": [20, 44]}, {"img": "l10_11", "t": ["Le test antibiotique par bandelette", "اختبار المضادات الحيوية بالشريط"], "st": [["Mettre 1 mL de lait dans le tube spécifique et plonger la bandelette.", "Laisser reposer 5 à 10 minutes, retirer et compter les traits colorés.", "Un seul trait (le témoin) : négatif, le lait peut fermenter. Deux traits : positif, lait refusé.", "Un seul résultat positif suffit à refuser la totalité du chargement : les ferments seraient inhibés."], ["ضع 1 مل من الحليب في الأنبوب الخاص واغمس الشريط (bandelette).", "اتركه 5 إلى 10 دقائق، ثم أخرجه وعدّ الخطوط الملوّنة.", "خط واحد (الشاهد): سلبي، يمكن للحليب أن يتخمّر. خطان: إيجابي، الحليب مرفوض.", "نتيجة إيجابية واحدة تكفي لرفض الحمولة كلها: لأن الخمائر اللبنية ستُثبَّط."]], "k": ["Un trait = négatif ; deux traits = positif, refus immédiat du lot.", "خط واحد = سلبي؛ خطان = إيجابي، رفض فوري للدفعة."], "q": ["La bandelette montre deux traits colorés. Que décides-tu ?", "الشريط يُظهر خطين ملوّنين. ماذا تقرّر؟"], "o": [["Accepter le lot", "Refaire le test demain", "Refuser le lot"], ["قبول الدفعة", "إعادة الاختبار غدًا", "رفض الدفعة"]], "a": 2, "w": ["Deux traits = antibiotiques présents : le lait ne fermentera pas, refus immédiat.", "خطان = وجود مضادات حيوية: الحليب لن يتخمّر، رفض فوري."], "g": []}, {"img": "l10_12", "t": ["Le test de Teepol et le lait mammiteux", "اختبار تيبول وحليب التهاب الضرع"], "st": [["Mélanger 2 mL de lait et 2 mL de solution de Teepol à 10 %, laisser réagir.", "Floculation = agglutination des cellules somatiques : lait mammiteux.", "Le Teepol est un détergent irritant pour les yeux : lunettes, manipulation au-dessus de la paillasse.", "Le lait mammiteux se transforme mal : riche en protéines sériques et en chlorures, pH élevé, pauvre en calcium."], ["اخلط 2 مل من الحليب و2 مل من محلول تيبول 10 ٪، واتركه يتفاعل.", "التلبّد (floculation) = تكتّل الخلايا الجسدية (cellules somatiques): حليب التهاب الضرع.", "تيبول منظّف مهيّج للعينين: نظارات، والعمل فوق طاولة العمل.", "حليب التهاب الضرع يتحوّل بصعوبة: غني بالبروتينات المصلية والكلوريدات، pH مرتفع، فقير في الكالسيوم."]], "k": ["Floculation au Teepol = lait de mammite, impropre à la transformation.", "التلبّد في اختبار تيبول = حليب التهاب الضرع، غير صالح للتحويل."], "q": ["Une floculation au test de Teepol indique :", "التلبّد في اختبار تيبول يدل على:"], "o": [["un lait mammiteux", "un lait mouillé", "un lait écrémé"], ["حليب التهاب الضرع", "حليب مضاف إليه الماء", "حليب منزوع الدسم"]], "a": 0, "w": ["Le Teepol agglutine les cellules somatiques, nombreuses dans un lait de mammite.", "تيبول يكتّل الخلايا الجسدية، الكثيرة في حليب التهاب الضرع."], "g": [20, 32, 52]}, {"img": "l10_14", "t": ["Pourquoi le lait mammiteux ne se transforme pas", "لماذا لا يتحوّل حليب التهاب الضرع"], "st": [["Riche en protéines sériques : difficultés de coagulation.", "Riche en chlorures et pH élevé : difficultés à acidifier.", "Pauvre en calcium : dispersion des caséines.", "Résultat : le yaourt et le fromage se font mal ; c'est pourquoi on le détecte dès la réception."], ["غني بالبروتينات المصلية (protéines sériques): صعوبة في التخثّر.", "غني بالكلوريدات وpH مرتفع: صعوبة في التحمّض.", "فقير في الكالسيوم: تشتّت الكازيينات (caséines).", "النتيجة: الياغورت والجبن لا يُصنعان جيدًا؛ لهذا نكشفه منذ الاستقبال."]], "k": ["Protéines sériques, chlorures et manque de calcium : trois raisons d'un mauvais rendement.", "البروتينات المصلية والكلوريدات ونقص الكالسيوم: ثلاثة أسباب لمردود سيئ."], "q": ["Pourquoi un lait mammiteux s'acidifie-t-il mal ?", "لماذا يتحمّض حليب التهاب الضرع بصعوبة؟"], "o": [["Car il est pauvre en eau", "Car il est riche en chlorures, avec un pH élevé", "Car il contient trop de matière grasse"], ["لأنه فقير في الماء", "لأنه غني بالكلوريدات مع pH مرتفع", "لأنه يحتوي على دسم كثير"]], "a": 1, "w": ["Chlorures abondants et pH élevé freinent l'acidification.", "الكلوريدات الكثيرة والـ pH المرتفع يعرقلان التحمّض."], "g": [20, 32, 41, 57]}, {"img": "l10_16", "t": ["La méthode biologique des inhibiteurs", "الطريقة البيولوجية للكشف عن المثبّطات"], "st": [["Chauffer 10 minutes à 80 °C le lait à tester et un lait témoin reconstitué à partir de poudre.", "Refroidir, ensemencer à 45 °C avec une souche mixte thermophile, incuber 2 h 30 à 45 °C.", "Mesurer les acidités (et l'acidité de départ) puis calculer : (acidité témoin − acidité testée) × 100 / acidité témoin.", "Moins de 15 % : pas d'inhibiteur. Plus de 15 % : flore freinée, inhibiteurs présents."], ["سخّن 10 دقائق في 80 °م الحليب المراد اختباره وحليبًا شاهدًا (témoin) معادًا تكوينه من المسحوق.", "برّد، ثم ازرع في 45 °م بسلالة مختلطة محبة للحرارة (thermophile)، واحضن ساعتين ونصف في 45 °م.", "قِس الحموضات (والحموضة الأولية) ثم احسب: (حموضة الشاهد − الحموضة المختبَرة) × 100 / حموضة الشاهد.", "أقل من 15 ٪: لا مثبّط. أكثر من 15 ٪: الفلورا مُعرقَلة، المثبّطات (inhibiteurs) موجودة."]], "k": ["Plus lente que la bandelette mais plus sensible : c'est la référence en cas de litige.", "أبطأ من الشريط لكنها أكثر حساسية: إنها المرجع عند النزاع."], "q": ["Le taux d'inhibition calculé est de 25 %. Que conclus-tu ?", "نسبة التثبيط المحسوبة 25 ٪. ماذا تستنتج؟"], "o": [["Pas d'inhibiteur détecté", "Le test est à refaire sans témoin", "Présence d'inhibiteurs dans le lait"], ["لا يوجد مثبّط", "يجب إعادة الاختبار بدون شاهد", "وجود مثبّطات في الحليب"]], "a": 2, "w": ["Au-delà de 15 %, la flore a été freinée : des inhibiteurs sont présents.", "فوق 15 ٪ عُرقلت الفلورا: المثبّطات موجودة."], "g": [20, 26]}, {"img": "l10_07", "t": ["Stabilité thermique : alcool et ébullition", "الثبات الحراري: الكحول والغليان"], "st": [["Test à l'alcool : lait et alcool à volume égal (2 mL + 2 mL), aux degrés 68° et 76°. Observer floculation, précipitation ou grumeaux.", "Alcool 76° négatif : le lait peut être stérilisé. Positif : passer au test à 68°.", "Ébullition : 5 mL de lait au bain-marie à 100 °C pendant 5 minutes, refroidir, tourner le tube sans agiter, observer les parois.", "Grumeaux sur les parois : mauvaise stabilité thermique, lait refusé."], ["اختبار الكحول: حليب وكحول بحجم متساوٍ (2 مل + 2 مل)، بدرجتي 68° و76°. لاحظ التلبّد أو الترسّب أو الكتل.", "كحول 76° سلبي: يمكن تعقيم الحليب. إيجابي: انتقل إلى الاختبار بـ 68°.", "الغليان: 5 مل من الحليب في حمّام مائي 100 °م لمدة 5 دقائق، برّد، أدِر الأنبوب دون رجّ، ولاحظ الجدران.", "كتل على الجدران: ثبات حراري سيئ، الحليب مرفوض."]], "k": ["Ces deux tests disent si le lait supportera le traitement thermique.", "هذان الاختباران يبيّنان هل سيتحمّل الحليب المعالجة الحرارية."], "q": ["Au test à l'alcool 76°, le résultat est négatif. Cela signifie :", "في اختبار الكحول 76°، النتيجة سلبية. هذا يعني:"], "o": [["le lait peut être stérilisé", "le lait est mammiteux", "le lait est mouillé"], ["يمكن تعقيم الحليب", "الحليب مصاب بالتهاب الضرع", "الحليب مضاف إليه الماء"]], "a": 0, "w": ["Alcool 76° négatif : lait stable, il peut être stérilisé.", "كحول 76° سلبي: حليب ثابت، يمكن تعقيمه."], "g": []}, {"img": "l10_13", "t": ["Décider à la réception", "اتخاذ القرار عند الاستقبال"], "st": [["Chaque lait est instruit sur tous les tests, reportés sur un tableau de bord avec les heures réelles de lecture.", "Décision : accepter, déclasser ou refuser.", "Chaque décision cite le test qui la fonde. Une décision fondée sur l'aspect du lait n'est pas une décision.", "La fiche de décision est signée : c'est un document qui engage."], ["كل حليب يُفحص بكل الاختبارات، وتُسجَّل على لوحة قيادة (tableau de bord) مع الأوقات الحقيقية للقراءة.", "القرار: القبول، أو التصنيف في درجة أدنى (déclasser)، أو الرفض.", "كل قرار يذكر الاختبار الذي يستند إليه. القرار المبني على مظهر الحليب ليس قرارًا.", "بطاقة القرار تُوقَّع: إنها وثيقة تُلزم صاحبها."]], "k": ["À la réception, une décision se signe, donc elle se justifie par un test.", "عند الاستقبال، القرار يُوقَّع، إذن يجب أن يُبرَّر باختبار."], "q": ["Sur quoi doit reposer une décision de refus à la réception ?", "على ماذا يجب أن يستند قرار الرفض عند الاستقبال؟"], "o": [["Sur l'aspect et l'odeur du lait", "Sur un test nommé et son résultat", "Sur la réputation de l'éleveur"], ["على مظهر الحليب ورائحته", "على اختبار مسمّى ونتيجته", "على سمعة المربّي"]], "a": 1, "w": ["Chaque décision cite le test qui la fonde ; l'aspect ne suffit pas.", "كل قرار يذكر الاختبار الذي يستند إليه؛ المظهر لا يكفي."], "g": [20]}], "since": "1.6"}, {"n": 11, "t": ["Intrants, additifs et emballages", "المدخلات، المضافات والتعبئة"], "c": [{"img": "l11_03", "t": ["Chaque produit a son intrant indispensable", "لكل منتوج مُدخله الضروري"], "st": [["Yaourt : il faut des ferments. Sans eux, le lait ne s'acidifie pas et le gel ne se forme jamais.", "Fromage : il faut de la présure. Sans elle, pas de caillé ferme, donc pas d'égouttage possible.", "Fromage fondu : il faut des sels de fonte. Sans eux, l'eau, la graisse et les protéines se séparent."], ["الياغورت: يحتاج إلى خمائر (ferments). بدونها لا يتحمّض الحليب ولا يتكوّن الهلام أبدًا.", "الجبن: يحتاج إلى المنفحة (présure). بدونها لا خثارة صلبة، إذن لا تصفية ممكنة.", "الجبن المذاب: يحتاج إلى أملاح الصهر (sels de fonte). بدونها ينفصل الماء والدهن والبروتينات."]], "k": ["Le lait ne suffit pas : chaque produit laitier a un intrant sans lequel il n'existe pas.", "الحليب لا يكفي: لكل منتوج حليبي مُدخل لا يوجد بدونه."], "q": ["Sans présure, que se passe-t-il pour un fromage ?", "بدون منفحة، ماذا يحدث للجبن؟"], "o": [["Pas de caillé ferme, donc pas d'égouttage", "Le fromage devient trop salé", "Le lait ne s'acidifie plus du tout"], ["لا خثارة صلبة، إذن لا تصفية", "يصبح الجبن مالحًا جدًا", "لا يتحمّض الحليب إطلاقًا"]], "a": 0, "w": ["La présure fait le caillé ferme ; sans lui, on ne peut pas égoutter.", "المنفحة تصنع الخثارة الصلبة؛ بدونها لا يمكن التصفية."], "g": [6, 40, 47, 57, 60]}, {"img": "l11_08", "t": ["Les ferments lactiques", "الخمائر اللبنية"], "st": [["Micro-organismes utiles qui transforment le lactose en acide lactique : acidification, affinage, yaourt.", "Streptococcus thermophilus + Lactobacillus bulgaricus : le couple obligatoire du yaourt, thermophiles (40 à 45 °C).", "Lactococcus : fromages frais, camembert, mésophiles (20 à 30 °C). Leuconostoc : pâtes molles, arômes et CO₂. Lactobacillus : forte activité protéolytique, utile en affinage.", "Le choix du ferment impose la température de travail. Les cultures sont toujours utilisées en mélange d'au moins deux espèces."], ["كائنات دقيقة نافعة تحوّل اللاكتوز (lactose) إلى حمض اللبنيك: التحمّض، التنضيج (affinage)، الياغورت.", "Streptococcus thermophilus + Lactobacillus bulgaricus: الثنائي الإجباري للياغورت، محبّة للحرارة (thermophiles) (40 إلى 45 °م).", "Lactococcus: الأجبان الطرية والكامومبير، معتدلة الحرارة (mésophiles) (20 إلى 30 °م). Leuconostoc: الأجبان الرخوة، روائح وCO₂. Lactobacillus: نشاط قوي في هدم البروتين، مفيد في التنضيج.", "اختيار الخميرة يفرض درجة حرارة العمل. تُستعمل المزارع دائمًا خليطًا من نوعين على الأقل."]], "k": ["Mésophiles 20–30 °C, thermophiles 40–45 °C : le ferment impose la température.", "معتدلة الحرارة 20–30 °م، محبّة للحرارة 40–45 °م: الخميرة تفرض الحرارة."], "q": ["Quels sont les deux ferments du yaourt ?", "ما الخميرتان الخاصتان بالياغورت؟"], "o": [["Lactococcus et Leuconostoc", "S. thermophilus et L. bulgaricus", "Penicillium et Lactococcus"], ["Lactococcus وLeuconostoc", "S. thermophilus وL. bulgaricus", "Penicillium وLactococcus"]], "a": 1, "w": ["Le yaourt exige S. thermophilus et L. bulgaricus, ensemencés simultanément.", "الياغورت يتطلّب S. thermophilus وL. bulgaricus، يُزرعان في الوقت نفسه."], "g": [0, 30, 57]}, {"img": "l11_10", "t": ["La protocoopération des ferments du yaourt", "التعاون الأوّلي بين خمائر الياغورت"], "st": [["L. bulgaricus, par son activité protéolytique, libère des peptides et des acides aminés au profit du streptocoque.", "En retour, S. thermophilus fournit de l'acide formique et du CO₂ qui stimulent la croissance du lactobacille.", "Chacun nourrit l'autre : l'acidification est nettement accélérée par rapport à une culture pure.", "Si l'un prend le dessus, le goût et la texture changent. Au-dessus de 50 °C, les ferments meurent : on ensemence à 40–45 °C."], ["L. bulgaricus، بنشاطه في هدم البروتين، يحرّر ببتيدات وأحماضًا أمينية لصالح المكوّرة العقدية.", "وفي المقابل، S. thermophilus يوفّر حمض النمل (acide formique) وCO₂ اللذين ينشّطان نمو العصية اللبنية.", "كل واحد يغذّي الآخر: التحمّض أسرع بكثير مقارنة بمزرعة نقية.", "إذا طغى أحدهما تغيّر الطعم والقوام. فوق 50 °م تموت الخمائر: نزرع في 40–45 °م."]], "k": ["Protocoopération : deux ferments qui se nourrissent l'un l'autre et acidifient plus vite ensemble.", "التعاون الأوّلي (protocoopération): خميرتان تغذّي إحداهما الأخرى وتحمّضان أسرع معًا."], "q": ["Pourquoi refroidit-on le lait pasteurisé à 40–45 °C avant d'ajouter les ferments ?", "لماذا نبرّد الحليب المبستر إلى 40–45 °م قبل إضافة الخمائر؟"], "o": [["Pour faire monter la crème", "Pour dissoudre la présure", "Car au-dessus de 50 °C les ferments meurent"], ["لكي تصعد القشدة", "لإذابة المنفحة", "لأن الخمائر تموت فوق 50 °م"]], "a": 2, "w": ["Les ferments du yaourt sont thermophiles mais meurent au-dessus de 50 °C.", "خمائر الياغورت محبّة للحرارة لكنها تموت فوق 50 °م."], "g": [20, 39, 57]}, {"img": "l11_12", "t": ["Moisissures d'affinage et sel", "أعفان التنضيج والملح"], "st": [["Penicillium caseicolum : croûtes moisies. Penicillium camemberti : moisissure historique du camembert. Penicillium roqueforti : pâtes persillées.", "Salage à sec : sel fin, 200 à 400 µm. Salage en saumure : gros sel, pour les fromages industriels, les pâtes dures, la feta et la mozzarella.", "Sel alimentaire et pur : CaO < 0,01 %, MgO < 0,02 %, SO₃ < 0,05 %. Trop d'impuretés donnent des dépôts ou des croûtes indésirables.", "Le sel termine l'égouttage, sélectionne la flore de surface et freine l'acidification."], ["Penicillium caseicolum: القشور المتعفّنة. Penicillium camemberti: العفن التاريخي للكامومبير. Penicillium roqueforti: الأجبان المعرّقة (pâtes persillées).", "التمليح الجاف: ملح ناعم 200 إلى 400 ميكرومتر. التمليح في الماء المالح (saumure): ملح خشن للأجبان الصناعية والصلبة والفيتا والموزاريلا.", "ملح غذائي نقي: CaO < 0,01 ٪، MgO < 0,02 ٪، SO₃ < 0,05 ٪. كثرة الشوائب تعطي ترسّبات أو قشورًا غير مرغوبة.", "الملح يُنهي التصفية، ويختار فلورا السطح، ويعرقل التحمّض."]], "k": ["Le sel ne sert pas qu'au goût : égouttage, flore de surface, frein à l'acidification.", "الملح لا يُستعمل للطعم فقط: التصفية، فلورا السطح، عرقلة التحمّض."], "q": ["Quelle moisissure sert aux pâtes persillées ?", "أي عفن يُستعمل للأجبان المعرّقة؟"], "o": [["Penicillium roqueforti", "Penicillium camemberti", "Penicillium caseicolum"], ["Penicillium roqueforti", "Penicillium camemberti", "Penicillium caseicolum"]], "a": 0, "w": ["Penicillium roqueforti donne les pâtes persillées comme le roquefort.", "Penicillium roqueforti يعطي الأجبان المعرّقة مثل الروكفور."], "g": [0, 46, 60]}, {"img": "l11_14", "t": ["La présure", "المنفحة"], "st": [["Enzyme qui fait cailler le lait. À l'origine, extraite de la caillette, le quatrième estomac des jeunes ruminants.", "Deux enzymes : la chymosine, la plus spécifique, qui coupe la caséine et provoque le caillage ; la pepsine, moins spécifique.", "Force 10 000 : un litre coagule 10 000 litres de lait à 35 °C en 40 minutes.", "Autres sources : végétales (artichaut, gaillet jaune, tige d'ananas, latex de figuier) et présures microbiennes, de plus en plus employées."], ["إنزيم يخثّر الحليب. في الأصل يُستخرج من المِنفحة (caillette)، المعدة الرابعة للمجترّات الصغيرة.", "إنزيمان: الكيموزين (chymosine)، الأكثر تخصّصًا، يقطع الكازيين ويُحدث التخثّر؛ والببسين (pepsine)، أقل تخصّصًا.", "قوة 10 000: لتر واحد يخثّر 10 000 لتر من الحليب في 35 °م خلال 40 دقيقة.", "مصادر أخرى: نباتية (الخرشوف، الغاليوم الأصفر، ساق الأناناس، لبن التين) ومنفحات ميكروبية تُستعمل أكثر فأكثر."]], "k": ["Présure = chymosine + pepsine ; la chymosine coupe la caséine et fait le caillé.", "المنفحة = كيموزين + ببسين؛ الكيموزين يقطع الكازيين ويصنع الخثارة."], "q": ["D'où la présure est-elle extraite à l'origine ?", "من أين تُستخرج المنفحة في الأصل؟"], "o": [["De la mamelle", "De la caillette des jeunes ruminants", "D'une moisissure"], ["من الضرع", "من المعدة الرابعة (caillette) للمجترّات الصغيرة", "من عفن"]], "a": 1, "w": ["La caillette est le quatrième estomac des jeunes ruminants.", "الـ caillette هي المعدة الرابعة للمجترّات الصغيرة."], "g": [6, 40]}, {"img": "l11_13", "t": ["Calculer une dose de présure", "حساب جرعة المنفحة"], "st": [["Formule : Vp = (2 400 × Vl) / (F × t).", "Vl : volume de lait en litres ; F : force de la présure ; t : temps de coagulation en secondes ; Vp en litres.", "Exemple : 100 L, F = 10 000, 10 min (600 s) : Vp = (2 400 × 100) / (10 000 × 600) = 0,04 L, soit 40 mL.", "Autre exemple : 350 L en 20 min (1 200 s) avec F = 10 000 : Vp = 0,07 L, soit 70 mL."], ["الصيغة: Vp = (2 400 × Vl) / (F × t).", "Vl: حجم الحليب باللتر؛ F: قوة المنفحة؛ t: زمن التخثّر بالثواني؛ Vp باللتر.", "مثال: 100 ل، F = 10 000، 10 د (600 ث): Vp = (2 400 × 100) / (10 000 × 600) = 0,04 ل، أي 40 مل.", "مثال آخر: 350 ل في 20 د (1 200 ث) مع F = 10 000: Vp = 0,07 ل، أي 70 مل."]], "k": ["Le temps se met toujours en secondes dans la formule de la présure.", "الزمن يوضع دائمًا بالثواني في صيغة المنفحة."], "q": ["Pour 100 L de lait, F = 10 000 et 10 minutes de coagulation, il faut :", "لـ 100 ل من الحليب، F = 10 000 و10 دقائق تخثّر، نحتاج إلى:"], "o": [["4 mL de présure", "400 mL de présure", "40 mL de présure"], ["4 مل من المنفحة", "400 مل من المنفحة", "40 مل من المنفحة"]], "a": 2, "w": ["(2 400 × 100) / (10 000 × 600) = 0,04 L = 40 mL.", "(2 400 × 100) / (10 000 × 600) = 0,04 ل = 40 مل."], "g": [40]}, {"img": "l11_16", "t": ["Sels de fonte, stabilisants et arômes", "أملاح الصهر، المثبّتات والنكهات"], "st": [["Les sels de fonte sont les additifs des fromages fondus. Leur rôle n'est pas de saler mais de transformer la texture.", "Ils dissolvent les protéines du fromage, stabilisent le mélange eau-graisse-protéines et donnent une texture lisse et tartinable.", "Ils jouent le rôle d'émulsifiants : la matière grasse et l'eau ne se séparent pas, même après plusieurs mois.", "Stabilisants (amidon, carraghénanes), arômes et colorants règlent texture et goût des produits non protégés par l'acidité."], ["أملاح الصهر (sels de fonte) هي مضافات الأجبان المذابة. دورها ليس التمليح بل تحويل القوام.", "تذيب بروتينات الجبن، وتثبّت خليط الماء والدهن والبروتينات، وتعطي قوامًا أملس قابلًا للدهن.", "تلعب دور المستحلِبات (émulsifiants): لا تنفصل المادة الدسمة عن الماء حتى بعد عدة أشهر.", "المثبّتات (النشا، الكاراجينان carraghénanes) والنكهات والملوّنات تضبط قوام وطعم المنتجات غير المحمية بالحموضة."]], "k": ["Les sels de fonte sont des émulsifiants : ils rendent le fromage fondu lisse et homogène.", "أملاح الصهر مستحلِبات: تجعل الجبن المذاب أملس ومتجانسًا."], "q": ["Les sels de fonte servent à :", "أملاح الصهر تُستعمل لـ:"], "o": [["saler le fromage", "stabiliser le mélange eau-graisse-protéines", "conserver le lait cru"], ["تمليح الجبن", "تثبيت خليط الماء والدهن والبروتينات", "حفظ الحليب الخام"]], "a": 1, "w": ["Ils dissolvent les protéines et émulsifient : pas de séparation eau-graisse.", "تذيب البروتينات وتستحلب: لا انفصال بين الماء والدهن."], "g": [20, 47]}, {"img": "l11_18", "t": ["Quel matériau pour quel produit ?", "أي مادة لأي منتوج؟"], "st": [["PEHD : résistant aux chocs, rigide, opaque, moulable → bouteilles de lait.", "PEBD : transparent, flexible, étirable → sachets de lait et de fromage, film alimentaire. PS : opaque, moulable, peu rigide → gobelets et pots de yaourt.", "Carton multicouches (carton, polyéthylène, aluminium) : protège de la lumière et de l'oxygène → lait UHT.", "Verre : inerte, réutilisable, mais lourd et fragile. Le choix dépend du produit, de sa DLC et de sa sensibilité à la lumière et à l'oxygène."], ["PEHD (بولي إيثيلين عالي الكثافة): مقاوم للصدمات، صلب، معتم، قابل للقولبة ← قنينات الحليب.", "PEBD (بولي إيثيلين منخفض الكثافة): شفاف، مرن، قابل للتمطيط ← أكياس الحليب والجبن، غشاء غذائي. PS (بوليستيرين): معتم، قابل للقولبة، قليل الصلابة ← الأكواب وعلب الياغورت.", "الكرتون متعدد الطبقات (كرتون، بولي إيثيلين، ألومنيوم): يحمي من الضوء والأكسجين ← حليب UHT.", "الزجاج: خامل، قابل لإعادة الاستعمال، لكنه ثقيل وهشّ. الاختيار حسب المنتوج ومدة صلاحيته (DLC) وحساسيته للضوء والأكسجين."]], "k": ["PEHD bouteilles · PS pots · carton multicouches UHT.", "PEHD للقنينات · PS للعلب · الكرتون متعدد الطبقات لحليب UHT."], "q": ["Quel est l'emballage du lait UHT ?", "ما تعبئة حليب UHT؟"], "o": [["Le carton multicouches", "Le polystyrène", "Le PEBD en sachet"], ["الكرتون متعدد الطبقات", "البوليستيرين", "أكياس PEBD"]], "a": 0, "w": ["Le carton multicouches protège de la lumière et de l'oxygène.", "الكرتون متعدد الطبقات يحمي من الضوء والأكسجين."], "g": [56, 57]}, {"img": "l11_20", "t": ["Les six mentions obligatoires de l'étiquetage", "البيانات الستة الإجبارية في الملصق"], "st": [["Dénomination spécifique du produit.", "Raison sociale ou marque du fabricant ou du conditionneur.", "Date limite de validité (DLC ou DLUO).", "Taux de matière grasse (entier, demi-écrémé, écrémé).", "Contenance (liquides) ou poids net (solides).", "Température de conservation (« à conserver à… »).", "Une seule mention manquante rend le lot non commercialisable."], ["التسمية الخاصة بالمنتوج (dénomination).", "الاسم التجاري أو علامة المصنّع أو المعبّئ.", "تاريخ انتهاء الصلاحية (DLC أو DLUO).", "نسبة المادة الدسمة (كامل، نصف منزوع الدسم، منزوع الدسم).", "السعة (للسوائل) أو الوزن الصافي (للصلب).", "درجة حرارة الحفظ («يُحفظ في...»).", "غياب بيان واحد فقط يجعل الدفعة غير قابلة للتسويق."]], "k": ["Six mentions obligatoires : une seule manquante bloque la vente du lot.", "ستة بيانات إجبارية: غياب واحد منها يمنع بيع الدفعة."], "q": ["Un pot de yaourt n'indique pas sa température de conservation. Le lot est :", "علبة ياغورت لا تذكر درجة حرارة حفظها. الدفعة:"], "o": [["commercialisable tel quel", "non commercialisable", "à vendre moins cher"], ["قابلة للتسويق كما هي", "غير قابلة للتسويق", "تُباع بثمن أقل"]], "a": 1, "w": ["La température de conservation est l'une des six mentions obligatoires.", "درجة حرارة الحفظ من البيانات الستة الإجبارية."], "sn": ["1", "2", "3", "4", "5", "6", ""], "g": [58]}], "since": "1.6"}, {"n": 12, "t": ["Réception, filtration, écrémage et standardisation", "الاستقبال، الترشيح، نزع القشدة والتوحيد القياسي"], "c": [{"img": "l12_03", "t": ["Six machines entre la citerne et le pot", "ست آلات بين الصهريج والعلبة"], "st": [["Ce qui entre : un lait cru variable, plus ou moins riche en matière grasse selon la ferme, la saison et la race.", "Ce qui doit sortir : un produit constant, par exemple 30 g/L de matière grasse, quel que soit le lait reçu le matin.", "Entre les deux : filtration, dégazage, écrémage, standardisation, homogénéisation — des opérations unitaires enchaînées.", "Le métier de l'usine laitière : rendre constant un produit qui ne l'est pas."], ["ما يدخل: حليب خام (lait cru) متغيّر، غني أو فقير بالمادة الدسمة (matière grasse) حسب الضيعة والفصل والسلالة.", "ما يجب أن يخرج: منتوج ثابت، مثلًا 30 غ/ل من المادة الدسمة، مهما كان الحليب المستقبَل صباحًا.", "بينهما: الترشيح، نزع الغازات، نزع القشدة، التوحيد القياسي، التجنيس — عمليات أحادية (opérations unitaires) متتابعة.", "مهنة مصنع الحليب: جعل منتوج غير ثابت منتوجًا ثابتًا."]], "k": ["Les opérations unitaires transforment un lait cru variable en un produit constant.", "العمليات الأحادية تحوّل حليبًا خامًا متغيّرًا إلى منتوج ثابت."], "q": ["Le lait reçu varie entre 32 et 42 g/L de MG. Quelle opération permet de sortir toujours 30 g/L ?", "الحليب المستقبَل يتراوح بين 32 و42 غ/ل من المادة الدسمة. أي عملية تسمح بإخراج 30 غ/ل دائمًا؟"], "o": [["La filtration", "Le dégazage", "La standardisation"], ["الترشيح", "نزع الغازات", "التوحيد القياسي"]], "a": 2, "w": ["La standardisation écrème puis remélange pour atteindre une teneur fixée.", "التوحيد القياسي ينزع القشدة ثم يعيد الخلط للوصول إلى نسبة محددة."], "g": [17, 20, 25, 36, 48]}, {"img": "l12_07", "t": ["Le front de réception : du camion au tank", "جبهة الاستقبال: من الشاحنة إلى الخزان"], "st": [["Ramassage dans les fermes par camion-citerne.", "Pesage à l'entrée : le tonnage sert à la facturation et à la planification.", "Tests de qualité : acidité, température, densité, matière grasse, fraude, antibiotiques. C'est ici qu'on accepte ou qu'on refuse.", "Déchargement et filtration.", "Dégazage : on extrait l'air dissous avant l'aspiration.", "Refroidissement", "Stockage en cuve à double paroi à 4 °C, sous agitation continue pour garder le lait homogène.", "Le lait se garde 48 heures au maximum à 4 °C : au-delà, protéolyse et lipolyse dégradent protéines et matière grasse."], ["الجمع من الضيعات بشاحنة صهريج (camion-citerne).", "الوزن عند المدخل: الحمولة تُستعمل للفوترة وتخطيط الإنتاج.", "اختبارات الجودة: الحموضة، الحرارة، الكثافة، المادة الدسمة، الغش، المضادات الحيوية (antibiotiques). هنا يُتخذ قرار القبول أو الرفض.", "التفريغ والترشيح.", "نزع الغازات (dégazage): استخراج الهواء الذائب قبل الشفط.", "التبريد", "التخزين في خزان بجدار مزدوج في 4 درجات، مع تحريك مستمر ليبقى الحليب متجانسًا.", "يُحفظ الحليب 48 ساعة على الأكثر في 4 درجات: بعدها يُفسد التحلل البروتيني (protéolyse) والتحلل الدهني (lipolyse) البروتينات والدهون."]], "k": ["Sept étapes dans l'ordre ; la décision d'accepter se prend aux tests de qualité.", "سبع مراحل بالترتيب؛ قرار القبول يُتخذ عند اختبارات الجودة."], "q": ["À quelle étape décide-t-on d'accepter ou de refuser le lait ?", "في أي مرحلة نقرر قبول الحليب أو رفضه؟"], "o": [["Aux tests de qualité", "Au pesage", "Au stockage"], ["عند اختبارات الجودة", "عند الوزن", "عند التخزين"]], "a": 0, "w": ["Le pesage sert à facturer ; la décision se prend aux tests de qualité.", "الوزن للفوترة؛ القرار يُتخذ عند اختبارات الجودة."], "sn": ["1", "2", "3", "4", "5", "6", "7", ""], "g": [17, 20]}, {"img": "l12_09", "t": ["La filtration", "الترشيح"], "st": [["Objectif : débarrasser le lait de ses impuretés physiques — sable, insectes, paille, poils de vache.", "Principe : la différence de taille entre les solides et le lait. Un filtre en inox retient les impuretés et laisse passer le lait clair.", "Paramètres : filtre sans trou, porosité inférieure à 0,6 mm, rinçage et nettoyage après chaque déchargement.", "Le débit doit rester régulier : un débit qui chute signale un filtre colmaté."], ["الهدف: تخليص الحليب من الشوائب الفيزيائية — الرمل، الحشرات، التبن، شعر البقر.", "المبدأ: الفرق في الحجم بين المواد الصلبة والحليب. مرشِّح من الفولاذ المقاوم للصدأ (inox) يحجز الشوائب ويمرّر الحليب الصافي.", "المعايير: مرشِّح بدون ثقب، مسامية (porosité) أقل من 0,6 مم، شطف وتنظيف بعد كل تفريغ.", "يجب أن يبقى الصبيب (débit) منتظمًا: صبيب ينخفض يدل على مرشِّح مسدود (colmaté)."]], "k": ["La filtration retire les impuretés physiques, pas les micro-organismes.", "الترشيح يزيل الشوائب الفيزيائية، وليس الكائنات الدقيقة."], "q": ["Que retient la filtration du lait ?", "ماذا يحجز ترشيح الحليب؟"], "o": [["Les bactéries", "Les impuretés physiques", "La matière grasse"], ["البكتيريا", "الشوائب الفيزيائية", "المادة الدسمة"]], "a": 1, "w": ["Sable, paille, poils : la filtration ne retient pas les micro-organismes.", "رمل، تبن، شعر: الترشيح لا يحجز الكائنات الدقيقة."], "g": []}, {"img": "l12_11", "t": ["Le dégazage", "نزع الغازات"], "st": [["Objectif : extraire l'air dissous du lait, environ 5 % de son volume : CO₂, O₂ et NH₃.", "Pourquoi : la mousse gêne le conditionnement, l'homogénéisation et le traitement thermique ; l'air fausse les volumes du bilan matière.", "L'air abîme aussi les pompes centrifuges (cavitation : des bulles qui implosent) et l'oxygène dégrade les matières grasses (oxydation).", "Principe : le lait descend par gravité dans un réservoir sous vide ; une pompe à vide évacue l'air, une pompe centrifuge reprend le lait."], ["الهدف: استخراج الهواء الذائب في الحليب، حوالي 5٪ من حجمه: CO₂ وO₂ وNH₃.", "لماذا: الرغوة تعرقل التعبئة والتجنيس والمعالجة الحرارية؛ والهواء يُفسد أحجام الحصيلة المادية (bilan matière).", "الهواء يُتلف أيضًا المضخات النابذة (التجويف cavitation: فقاعات تنفجر للداخل) والأكسجين يُفسد الدهون (الأكسدة oxydation).", "المبدأ: ينزل الحليب بالجاذبية في خزان تحت الفراغ (sous vide)؛ مضخة فراغ تُخرج الهواء، ومضخة نابذة تسحب الحليب."]], "k": ["Le dégazage évite mousse, erreurs de volume, cavitation et oxydation.", "نزع الغازات يتجنب الرغوة وأخطاء الحجم والتجويف والأكسدة."], "q": ["Le dégazage sert notamment à éviter :", "نزع الغازات يُستعمل خاصة لتجنب:"], "o": [["L'acidification", "Le mouillage", "La cavitation des pompes"], ["التحمض", "إضافة الماء", "تجويف المضخات"]], "a": 2, "w": ["L'air dissous forme des bulles qui attaquent les pompes centrifuges.", "الهواء الذائب يكوّن فقاعات تهاجم المضخات النابذة."], "g": [7, 17, 25]}, {"img": "l12_13", "t": ["L'écrémage", "نزع القشدة"], "st": [["L'écrémeuse est une centrifugeuse à bol à assiettes : elle sépare la crème (phase légère) du lait écrémé (phase lourde).", "Deux sorties continues : la crème d'un côté, le lait écrémé de l'autre.", "Le bol à assiettes multiplie les surfaces de séparation ; le débourbage évacue, de façon programmée, les impuretés lourdes du bol.", "Paramètres : 45 °C, débits d'entrée et de sortie, vitesse de rotation, contrôle de la MG, fréquence de débourbage."], ["آلة نزع القشدة (écrémeuse) نابذة بوعاء ذي صحون (bol à assiettes): تفصل القشدة (الطور الخفيف) عن الحليب منزوع الدسم (الطور الثقيل).", "مخرجان مستمران: القشدة من جهة، والحليب منزوع الدسم من جهة أخرى.", "الوعاء ذو الصحون يضاعف أسطح الفصل؛ وإزالة الرواسب (débourbage) تُخرج بشكل مبرمج الشوائب الثقيلة من الوعاء.", "المعايير: 45 درجة، صبيب الدخول والخروج، سرعة الدوران، مراقبة المادة الدسمة، وتيرة إزالة الرواسب."]], "k": ["À 45 °C, la matière grasse est fluide : la séparation centrifuge est optimale.", "في 45 درجة تكون المادة الدسمة سائلة: الفصل بالطرد المركزي يكون أمثل."], "q": ["À quelle température se fait l'écrémage ?", "في أي درجة حرارة يتم نزع القشدة؟"], "o": [["Environ 4 °C", "Environ 45 °C", "Environ 72 °C"], ["حوالي 4 درجات", "حوالي 45 درجة", "حوالي 72 درجة"]], "a": 1, "w": ["À 45 °C, la matière grasse est fluide et se sépare au mieux.", "في 45 درجة تكون المادة الدسمة سائلة وتنفصل بشكل أفضل."], "g": [14, 20, 58, 59]}, {"img": "l12_15", "t": ["La standardisation", "التوحيد القياسي"], "st": [["But : produire un lait à teneur connue en matière grasse, conforme à des normes préétablies.", "Deux étapes : écrémer le lait entier, puis mélanger crème et lait écrémé dans des proportions calculées, à la main ou par standardisateur.", "Si la MG est inférieure à l'objectif, on ajoute de la crème ; si elle est supérieure, on ajoute du lait écrémé. On contrôle toujours le mélange.", "Repères : lait entier 30 g/L · demi-écrémé 15 g/L · écrémé 0 g/L · yaourt nature 11 à 18 g/L · yaourt au lait entier 30 à 38 g/L."], ["الهدف: إنتاج حليب بنسبة معروفة من المادة الدسمة، مطابق لمعايير محددة مسبقًا.", "مرحلتان: نزع قشدة الحليب الكامل، ثم خلط القشدة والحليب منزوع الدسم بنسب محسوبة، يدويًا أو بجهاز التوحيد (standardisateur).", "إذا كانت المادة الدسمة أقل من الهدف نضيف القشدة؛ وإذا كانت أكثر نضيف الحليب منزوع الدسم. نراقب الخليط دائمًا.", "مراجع: حليب كامل 30 غ/ل · نصف منزوع الدسم 15 غ/ل · منزوع الدسم 0 غ/ل · ياغورت عادي 11 إلى 18 غ/ل · ياغورت بالحليب الكامل 30 إلى 38 غ/ل."]], "k": ["Trop gras : on ajoute du lait écrémé ; pas assez : on ajoute de la crème.", "دسم زائد: نضيف حليبًا منزوع الدسم؛ دسم ناقص: نضيف القشدة."], "q": ["La MG du lait est supérieure à l'objectif. Qu'ajoute-t-on ?", "المادة الدسمة للحليب أعلى من الهدف. ماذا نضيف؟"], "o": [["Du lait écrémé", "De la crème", "De l'eau"], ["حليبًا منزوع الدسم", "قشدة", "ماء"]], "a": 0, "w": ["On dilue la matière grasse en excès avec du lait écrémé ; l'eau serait un mouillage.", "نخفّف الدسم الزائد بحليب منزوع الدسم؛ إضافة الماء غش."], "g": [20, 48, 57, 58]}, {"img": "l12_17", "t": ["La croix des mélanges", "صليب الخلط"], "st": [["Pour mélanger deux produits de teneurs différentes et atteindre une teneur visée : croix des mélanges, ou carré de Pearson.", "Poser la croix : teneurs de départ à gauche, teneur visée au centre.", "Soustraire en diagonale, toujours la plus petite de la plus grande.", "Les résultats donnent les parts de chaque produit.", "Convertir en masses selon la quantité totale voulue.", "Lait à 1 %, crème à 30 %, cible 3,25 % : 2,25 kg de crème + 26,75 kg de lait = 29 kg. Contrôle : (2,25 × 30 + 26,75) / 29 = 3,25."], ["لخلط منتوجين بنسبتين مختلفتين والوصول إلى نسبة مستهدفة: صليب الخلط (croix des mélanges) أو مربع بيرسون (carré de Pearson).", "رسم الصليب: نسب البداية على اليسار، والنسبة المستهدفة في الوسط.", "الطرح قطريًا، دائمًا الأصغر من الأكبر.", "النتائج تعطي أجزاء كل منتوج.", "التحويل إلى كتل حسب الكمية الإجمالية المطلوبة.", "مثال: حليب 1٪، قشدة 30٪، هدف 3,25٪. 2,25 كغ قشدة + 26,75 كغ حليب = 29 كغ بنسبة 3,25٪. المراقبة: (2,25 × 30 + 26,75) / 29 = 3,25."]], "k": ["Soustraire en diagonale donne les parts ; la moyenne pondérée vérifie le calcul.", "الطرح القطري يعطي الأجزاء؛ والمتوسط المرجّح يتحقق من الحساب."], "q": ["Pour 1 000 L à 30 g/L avec un lait à 38 et un écrémé à 1 g/L, combien de lait entier ?", "لإنتاج 1000 ل بـ 30 غ/ل من حليب بـ 38 وحليب منزوع الدسم بـ 1 غ/ل، كم من الحليب الكامل؟"], "o": [["500 L", "920 L", "784 L"], ["500 ل", "920 ل", "784 ل"]], "a": 2, "w": ["30 − 1 = 29 parts d'entier, 38 − 30 = 8 parts d'écrémé : 29/37 × 1 000 ≈ 784 L.", "30 − 1 = 29 جزءًا من الكامل، 38 − 30 = 8 أجزاء من منزوع الدسم: 29/37 × 1000 ≈ 784 ل."], "sn": ["", "1", "2", "3", "4", ""], "g": [10]}, {"img": "l12_16", "t": ["Calcul : un demi-écrémé à partir d'un lait à 38 g/L", "حساب: حليب نصف منزوع الدسم من حليب بـ 38 غ/ل"], "st": [["Commande : 500 L de lait à 15 g/L, avec un lait entier à 38 g/L et un lait écrémé à 0 g/L.", "Croix : entier = 15 − 0 = 15 parts ; écrémé = 38 − 15 = 23 parts ; total 38 parts.", "Volumes : entier = 15/38 × 500 ≈ 197 L ; écrémé = 23/38 × 500 ≈ 303 L.", "Vérification : (197 × 38 + 303 × 0) / 500 ≈ 15 g/L. La moyenne pondérée retombe sur la cible."], ["الطلب: 500 ل من حليب بـ 15 غ/ل، انطلاقًا من حليب كامل بـ 38 غ/ل وحليب منزوع الدسم بـ 0 غ/ل.", "الصليب: الكامل = 15 − 0 = 15 جزءًا؛ منزوع الدسم = 38 − 15 = 23 جزءًا؛ المجموع 38 جزءًا.", "الأحجام: الكامل = 15/38 × 500 ≈ 197 ل؛ منزوع الدسم = 23/38 × 500 ≈ 303 ل.", "التحقق: (197 × 38 + 303 × 0) / 500 ≈ 15 غ/ل. المتوسط المرجّح (moyenne pondérée) يعود إلى الهدف."]], "k": ["Chaque calcul de standardisation se termine par la vérification de la moyenne pondérée.", "كل حساب توحيد قياسي ينتهي بالتحقق بالمتوسط المرجّح."], "q": ["Dans la croix, combien de parts de lait écrémé pour passer de 38 à 15 g/L ?", "في الصليب، كم جزءًا من الحليب منزوع الدسم للانتقال من 38 إلى 15 غ/ل؟"], "o": [["15 parts", "23 parts", "38 parts"], ["15 جزءًا", "23 جزءًا", "38 جزءًا"]], "a": 1, "w": ["Diagonale : 38 − 15 = 23 parts d'écrémé ; 15 − 0 = 15 parts d'entier.", "قطريًا: 38 − 15 = 23 جزءًا من منزوع الدسم؛ 15 − 0 = 15 جزءًا من الكامل."], "g": [48, 58]}], "since": "1.6"}, {"n": 13, "t": ["Homogénéisation et traitements thermiques", "التجنيس والمعالجات الحرارية"], "c": [{"img": "l13_03", "t": ["Trois briques, trois durées de vie", "ثلاث علب، ثلاث مدد صلاحية"], "st": [["Lait pasteurisé : 3 jours au froid. Les pathogènes sont détruits, mais il reste de la flore banale.", "Lait UHT : 6 mois à 20 °C. Plus rien ne vit à l'intérieur, et l'emballage le protège de tout.", "Poudre de lait : 2 ans dans un placard. Il n'y a plus d'eau, donc plus de vie microbienne possible.", "Même lait de départ : ce qui change, c'est la chaleur reçue et l'eau qui reste."], ["الحليب المبستر (pasteurisé): 3 أيام في البرد. الممرضات مدمَّرة، لكن تبقى فلورا عادية (flore banale).", "حليب UHT: 6 أشهر في 20 درجة. لا شيء يعيش في الداخل، والتغليف يحميه من كل شيء.", "مسحوق الحليب: سنتان في خزانة. لم يعد فيه ماء، إذن لا حياة ميكروبية ممكنة.", "نفس الحليب في البداية: ما يتغير هو الحرارة المستقبَلة والماء المتبقي."]], "k": ["La durée de conservation dépend de la chaleur reçue et de l'eau restante.", "مدة الحفظ تتعلق بالحرارة المستقبَلة والماء المتبقي."], "q": ["Pourquoi un lait pasteurisé ne tient-il que 3 jours au froid ?", "لماذا لا يدوم الحليب المبستر إلا 3 أيام في البرد؟"], "o": [["Il reste de la flore banale", "Il contient encore des pathogènes", "Il n'a pas été homogénéisé"], ["تبقى فيه فلورا عادية", "ما زال يحتوي على ممرضات", "لم يُجنَّس"]], "a": 0, "w": ["La pasteurisation détruit les pathogènes mais pas toute la flore banale.", "البسترة تدمّر الممرضات لكن ليس كل الفلورا العادية."], "g": [20, 56]}, {"img": "l13_08", "t": ["L'homogénéisation", "التجنيس"], "st": [["Principe : forcer le lait sous très haute pression à travers une fente étroite pour réduire la taille des globules gras et empêcher la remontée de la crème.", "Pressions : lait pasteurisé 150 à 180 bars · yaourts 200 bars · lait UHT 400 bars. Lait à 45 à 60 °C pendant l'opération.", "Plus la pression est élevée, plus les globules sont petits ; plus ils sont petits, plus la remontée est lente, donc plus la DLC est longue.", "DLC : lait pasteurisé 3 jours à 4 °C · yaourt et dessert lacté 30 jours à 4 °C · lait UHT 6 mois à 20 °C."], ["المبدأ: دفع الحليب تحت ضغط عالٍ جدًا عبر شق ضيق لتصغير حبيبات الدهون (globules gras) ومنع صعود القشدة.", "الضغوط: حليب مبستر 150 إلى 180 بار · ياغورت 200 بار · حليب UHT 400 بار. الحليب في 45 إلى 60 درجة أثناء العملية.", "كلما ارتفع الضغط صغرت الحبيبات؛ وكلما صغرت أبطأ صعودها، إذن طالت مدة الصلاحية (DLC).", "مدة الصلاحية: حليب مبستر 3 أيام في 4 درجات · ياغورت وحلوى حليبية 30 يومًا في 4 درجات · حليب UHT 6 أشهر في 20 درجة."]], "k": ["Pression plus forte → globules plus petits → remontée plus lente → DLC plus longue.", "ضغط أعلى ← حبيبات أصغر ← صعود أبطأ ← صلاحية أطول."], "q": ["Quelle est la pression d'homogénéisation d'un lait UHT ?", "ما ضغط تجنيس حليب UHT؟"], "o": [["150 bars", "200 bars", "400 bars"], ["150 بار", "200 بار", "400 بار"]], "a": 2, "w": ["Le lait UHT a la DLC la plus longue : il demande la pression la plus élevée.", "حليب UHT له أطول صلاحية: يتطلب أعلى ضغط."], "g": [20, 23, 25, 56, 57]}, {"img": "l13_11", "t": ["L'indice d'homogénéisation", "مؤشر التجنيس"], "st": [["1. Stocker 1 L de lait dans une éprouvette, 48 heures à 4 à 6 °C.", "2. Siphonner la couche supérieure, un dixième du volume (100 mL), puis bien mélanger les neuf dixièmes restants.", "3. Doser la matière grasse des deux fractions par la méthode Gerber.", "4. Calculer l'indice : différence de MG entre les couches, en pourcentage de la couche supérieure. Plus l'indice est faible, meilleure est l'homogénéisation."], ["1. تخزين 1 ل من الحليب في مخبار (éprouvette)، 48 ساعة في 4 إلى 6 درجات.", "2. سحب الطبقة العليا بالسيفون، أي عُشر الحجم (100 مل)، ثم خلط الأعشار التسعة المتبقية جيدًا.", "3. معايرة المادة الدسمة في الجزأين بطريقة جربر (Gerber).", "4. حساب المؤشر: الفرق في المادة الدسمة بين الطبقتين، كنسبة مئوية من الطبقة العليا. كلما كان المؤشر ضعيفًا كان التجنيس أفضل."]], "k": ["Un indice d'homogénéisation faible signifie une bonne homogénéisation.", "مؤشر تجنيس ضعيف يعني تجنيسًا جيدًا."], "q": ["Un indice d'homogénéisation élevé indique :", "مؤشر تجنيس مرتفع يدل على:"], "o": [["Une très bonne homogénéisation", "Une homogénéisation insuffisante", "Un lait écrémé"], ["تجنيس جيد جدًا", "تجنيس غير كافٍ", "حليب منزوع الدسم"]], "a": 1, "w": ["Beaucoup plus de MG en haut : la crème est remontée, l'homogénéisation est insuffisante.", "دسم أكثر بكثير في الأعلى: القشدة صعدت، والتجنيس غير كافٍ."], "g": [20, 25, 35]}, {"img": "l13_13", "t": ["Les cinq traitements thermiques", "المعالجات الحرارية الخمس"], "st": [["Thermisation : 63 à 65 °C, 15 à 20 s. Réduit la flore, surtout psychrophile, à la réception avant stockage.", "Pasteurisation basse : 72 à 75 °C, 15 à 20 s. Détruit les pathogènes et une grande partie de la flore banale ; phosphatase négative.", "Pasteurisation haute : 82 à 85 °C, 20 s. Plus poussée, notamment pour le lait à yaourt ; contrôle par la lactoperoxydase.", "UHT : 140 à 150 °C, 2 à 4 s, commercialement stérile, conditionnement aseptique. Stérilisation : plus de 100 °C, durée longue, détruit aussi les spores."], ["التسخين الخفيف (thermisation): 63 إلى 65 درجة، 15 إلى 20 ثانية. يقلّص الفلورا، خاصة المحبة للبرودة، عند الاستقبال قبل التخزين.", "البسترة المنخفضة: 72 إلى 75 درجة، 15 إلى 20 ثانية. تدمّر الممرضات وجزءًا كبيرًا من الفلورا العادية؛ الفوسفاتاز (phosphatase) سلبي.", "البسترة العالية: 82 إلى 85 درجة، 20 ثانية. أقوى، خاصة لحليب الياغورت؛ المراقبة باللاكتوبيروكسيداز (lactoperoxydase).", "UHT: 140 إلى 150 درجة، 2 إلى 4 ثوانٍ، معقّم تجاريًا، تعبئة معقّمة (aseptique). التعقيم: أكثر من 100 درجة، مدة طويلة، يدمّر الأبواغ أيضًا."]], "k": ["Plus la température est élevée, plus le temps est court et plus la conservation est longue.", "كلما ارتفعت الحرارة قصر الزمن وطال الحفظ."], "q": ["Quel est le barème UHT ?", "ما هو برنامج UHT الحراري؟"], "o": [["85 °C / 20 s", "100 °C / 30 min", "140 °C / 2 à 4 s"], ["85 درجة / 20 ثانية", "100 درجة / 30 دقيقة", "140 درجة / 2 إلى 4 ثوانٍ"]], "a": 2, "w": ["UHT : très chaud, très court, puis conditionnement aseptique.", "UHT: حار جدًا، قصير جدًا، ثم تعبئة معقّمة."], "g": [20, 29, 37, 53, 56, 57]}, {"img": "l13_16", "t": ["L'échangeur à plaques", "المبادل الحراري ذو الصفائح"], "st": [["Le lait circule entre des plaques minces, séparé du fluide chaud ou froid par quelques millimètres d'inox : l'échange est presque instantané.", "Récupération : le lait froid entrant est préchauffé par le lait chaud sortant. Chauffage : montée à la température de pasteurisation par eau chaude.", "Chambreur : maintien 15 à 20 s, c'est le temps de séjour. Refroidissement : descente à 5 °C par eau glacée.", "Jusqu'à 90 % de l'énergie est récupérée. Si la suite demande du chaud (écrémage, fermentation), on omet la section de refroidissement."], ["يمر الحليب بين صفائح رقيقة، يفصله عن السائل الساخن أو البارد بضعة ملليمترات من الفولاذ: التبادل شبه فوري.", "الاسترجاع (récupération): الحليب البارد الداخل يُسخَّن مسبقًا بالحليب الساخن الخارج. التسخين: الرفع إلى حرارة البسترة بالماء الساخن.", "حجرة الإبقاء (chambreur): الإبقاء 15 إلى 20 ثانية، إنه زمن المكوث. التبريد: النزول إلى 5 درجات بالماء المثلّج.", "يُسترجع حتى 90٪ من الطاقة. إذا تطلبت المرحلة التالية حرارة (نزع القشدة، التخمير) نحذف قسم التبريد."]], "k": ["Quatre sections : récupération, chauffage, chambreur, refroidissement ; jusqu'à 90 % d'énergie récupérée.", "أربعة أقسام: الاسترجاع، التسخين، حجرة الإبقاء، التبريد؛ حتى 90٪ من الطاقة مسترجعة."], "q": ["À quoi sert la section de récupération ?", "ما دور قسم الاسترجاع؟"], "o": [["Préchauffer le lait entrant", "Refroidir l'eau glacée", "Filtrer le lait"], ["التسخين المسبق للحليب الداخل", "تبريد الماء المثلّج", "ترشيح الحليب"]], "a": 0, "w": ["Le lait chaud sortant cède sa chaleur au lait froid entrant.", "الحليب الساخن الخارج يعطي حرارته للحليب البارد الداخل."], "g": [8, 20]}, {"img": "l13_18", "t": ["Ce qu'on détruit, ce qu'on abîme", "ما ندمّره وما نُتلفه"], "st": [["On veut détruire : les germes pathogènes (objectif sanitaire), la flore d'altération, certaines enzymes comme la lipase.", "Les spores ne sont détruites qu'en stérilisation et en UHT.", "On risque d'abîmer : les protéines solubles, les vitamines hydrosolubles, le goût (goût de cuit) et l'aptitude fromagère.", "Un lait trop chauffé caille mal à la présure. Choisir un barème, c'est arbitrer entre sécurité et qualité."], ["نريد تدمير: الجراثيم الممرضة (الهدف الصحي)، فلورا الإفساد، وبعض الإنزيمات مثل الليباز (lipase).", "الأبواغ (spores) لا تُدمَّر إلا بالتعقيم وUHT.", "نخاطر بإتلاف: البروتينات الذائبة، الفيتامينات الذائبة في الماء، الذوق (طعم الطبخ goût de cuit) والقابلية لصنع الجبن (aptitude fromagère).", "الحليب المسخّن أكثر من اللازم يتخثر بصعوبة بالمنفحة (présure). اختيار البرنامج الحراري هو موازنة بين السلامة والجودة."]], "k": ["Un barème thermique est un compromis entre sécurité sanitaire et qualité du produit.", "البرنامج الحراري حلّ وسط بين السلامة الصحية وجودة المنتوج."], "q": ["Pourquoi ne chauffe-t-on pas au maximum un lait destiné au fromage ?", "لماذا لا نسخّن إلى الحد الأقصى حليبًا موجّهًا للجبن؟"], "o": [["Il perdrait sa couleur", "Il caillerait mal à la présure", "Il deviendrait acide"], ["سيفقد لونه", "سيتخثر بصعوبة بالمنفحة", "سيصبح حامضًا"]], "a": 1, "w": ["Trop de chaleur détruit l'aptitude fromagère : le lait ne caille plus correctement.", "الحرارة الزائدة تُفقد القابلية لصنع الجبن: الحليب لا يتخثر جيدًا."], "g": [20, 40, 56]}, {"img": "l13_20", "t": ["Deux enzymes, deux témoins", "إنزيمان، شاهدان"], "st": [["La phosphatase alcaline est détruite vers 72 °C en 15 s. Un test négatif prouve que la pasteurisation basse a bien eu lieu.", "La lactoperoxydase est détruite à 82 °C en 20 s : elle sert de témoin de la pasteurisation haute. Test au gaïacol et à l'eau oxygénée : rose = enzyme présente.", "Ces deux enzymes naturelles du lait permettent de vérifier après coup quel traitement a vraiment été appliqué.", "Un lait pasteurisé doit être phosphatase négative ; si elle est positive, le traitement est insuffisant et le lot n'est pas commercialisé."], ["الفوسفاتاز القلوي (phosphatase alcaline) يُدمَّر حوالي 72 درجة في 15 ثانية. الاختبار السلبي يثبت أن البسترة المنخفضة تمت فعلًا.", "اللاكتوبيروكسيداز يُدمَّر في 82 درجة خلال 20 ثانية: هو شاهد البسترة العالية. اختبار بالغاياكول (gaïacol) والماء الأكسجيني: وردي = إنزيم موجود.", "هذان الإنزيمان الطبيعيان في الحليب يسمحان بالتحقق لاحقًا من المعالجة المطبقة فعلًا.", "يجب أن يكون الحليب المبستر سلبي الفوسفاتاز؛ إذا كان إيجابيًا فالمعالجة غير كافية ولا تُسوَّق الدفعة."]], "k": ["Phosphatase négative = pasteurisation basse correcte ; lactoperoxydase absente = pasteurisation haute.", "فوسفاتاز سلبي = بسترة منخفضة صحيحة؛ غياب اللاكتوبيروكسيداز = بسترة عالية."], "q": ["Un lait pasteurisé donne un test phosphatase positif. Cela signifie :", "حليب مبستر يعطي اختبار فوسفاتاز إيجابيًا. هذا يعني:"], "o": [["Le lait est stérile", "La pasteurisation est correcte", "La pasteurisation est insuffisante"], ["الحليب معقّم", "البسترة صحيحة", "البسترة غير كافية"]], "a": 2, "w": ["L'enzyme aurait dû être détruite : le lot ne peut pas être vendu.", "كان يجب أن يُدمَّر الإنزيم: لا يمكن بيع الدفعة."], "g": [20, 29, 37]}], "since": "1.6"}, {"n": 14, "t": ["Concentration, séchage et fermentation", "التركيز، التجفيف والتخمير"], "c": [{"img": "l14_03", "t": ["Retirer l'eau, c'est retirer la vie", "نزع الماء هو نزع الحياة"], "st": [["Un litre de lait pèse un kilo : 3 jours au froid s'il est pasteurisé, 6 mois hors du froid s'il est UHT.", "Cent trente grammes de poudre : le même extrait sec, deux ans de conservation, huit fois moins de volume à transporter et à stocker.", "Ce qui a disparu : l'eau, et rien d'autre. Aucune vie microbienne n'est possible dans un produit à 3 % d'humidité.", "On évapore sous vide car, sous vide, l'eau bout bien en dessous de 100 °C."], ["لتر من الحليب يزن كيلوغرامًا: 3 أيام في البرد إذا كان مبسترًا، 6 أشهر خارج البرد إذا كان UHT.", "مئة وثلاثون غرامًا من المسحوق: نفس المادة الجافة (extrait sec)، سنتان من الحفظ، وحجم أقل بثماني مرات للنقل والتخزين.", "ما اختفى: الماء ولا شيء غيره. لا حياة ميكروبية ممكنة في منتوج برطوبة 3٪.", "نبخّر تحت الفراغ لأن الماء تحت الفراغ يغلي أقل بكثير من 100 درجة."]], "k": ["Sans eau, pas de vie microbienne : c'est le plus ancien procédé de conservation.", "بدون ماء لا حياة ميكروبية: إنها أقدم طريقة للحفظ."], "q": ["Pourquoi la poudre de lait se conserve-t-elle deux ans ?", "لماذا يُحفظ مسحوق الحليب سنتين؟"], "o": [["Elle ne contient plus assez d'eau pour les microbes", "Elle est stérilisée à 140 °C", "Elle contient des conservateurs"], ["لم يعد يحتوي على ماء كافٍ للميكروبات", "لأنه معقّم في 140 درجة", "لأنه يحتوي على مواد حافظة"]], "a": 0, "w": ["À 3 % d'humidité, aucune vie microbienne n'est possible.", "في رطوبة 3٪ لا حياة ميكروبية ممكنة."], "g": [20, 56]}, {"img": "l14_08", "t": ["La concentration sous vide", "التركيز تحت الفراغ"], "st": [["Objectif : concentrer le lait jusqu'à un extrait sec total de 260 à 360 g/L, pour prolonger la conservation et réduire le transport.", "Conditions : vide d'environ 0,5 bar, évaporation à 68 °C au maximum, chauffage sous vide avec agitation.", "Sous vide, l'eau bout à basse température : les protéines ne sont pas dénaturées et le lait ne prend pas de goût de cuit.", "Taux de concentration : T = volume initial / volume final ≈ 2,6. Exemple : 1 000 L qui deviennent 385 L."], ["الهدف: تركيز الحليب حتى مادة جافة كلية (extrait sec total) من 260 إلى 360 غ/ل، لإطالة الحفظ وتقليص النقل.", "الشروط: فراغ حوالي 0,5 بار، تبخير في 68 درجة على الأكثر، تسخين تحت الفراغ مع التحريك.", "تحت الفراغ يغلي الماء في حرارة منخفضة: البروتينات لا تتمسّخ (dénaturées) والحليب لا يأخذ طعم الطبخ.", "نسبة التركيز: T = الحجم الأولي / الحجم النهائي ≈ 2,6. مثال: 1000 ل تصبح 385 ل."]], "k": ["Sous vide, on évapore l'eau à 68 °C au plus, sans abîmer le lait.", "تحت الفراغ نبخّر الماء في 68 درجة على الأكثر دون إتلاف الحليب."], "q": ["Un évaporateur reçoit 5 000 L et sort 1 900 L de concentré. Quel est le taux de concentration ?", "مبخّر يستقبل 5000 ل ويُخرج 1900 ل من المركّز. ما نسبة التركيز؟"], "o": [["Environ 0,38", "Environ 2,63", "3 100"], ["حوالي 0,38", "حوالي 2,63", "3100"]], "a": 1, "w": ["T = 5 000 / 1 900 ≈ 2,63 ; les 3 100 L sont l'eau évaporée.", "T = 5000 / 1900 ≈ 2,63؛ و3100 ل هي الماء المتبخّر."], "g": [20, 51]}, {"img": "l14_10", "t": ["Le séchage : jusqu'à la poudre", "التجفيف: حتى المسحوق"], "st": [["Objectif : 3 à 4 % d'humidité (extrait sec de 960 g/kg), pour conserver et réduire les coûts d'emballage, de stockage et de transport.", "Séchage sur cylindres (Hatmaker) : chauffage brutal, faible solubilité, goût de cuit, brunissement. Réservé à l'industrie et au bétail.", "Atomisation (Spray) : concentré à 45–55 % d'extrait sec, pulvérisé en gouttelettes dans l'air chaud, puis particules sèches extraites de l'air.", "Instantanéisation : les particules recyclées s'humidifient, gonflent et forment des agglomérats poreux qui se dissolvent instantanément."], ["الهدف: رطوبة 3 إلى 4٪ (مادة جافة 960 غ/كغ)، للحفظ وتقليص تكاليف التغليف والتخزين والنقل.", "التجفيف على الأسطوانات (Hatmaker): تسخين عنيف، ذوبانية ضعيفة، طعم الطبخ، اسمرار. مخصص للصناعة وعلف الماشية.", "الرذاذ (atomisation - Spray): مركّز بـ 45–55٪ مادة جافة، يُرشّ قطيرات في هواء ساخن، ثم تُستخرج الجزيئات الجافة من الهواء.", "التذويب الفوري (instantanéisation): الجزيئات المعاد تدويرها تترطب وتنتفخ وتكوّن تكتلات مسامية تذوب فورًا."]], "k": ["L'atomisation donne une poudre soluble ; le séchage sur cylindres, une poudre peu soluble.", "الرذاذ يعطي مسحوقًا ذوّابًا؛ والتجفيف على الأسطوانات مسحوقًا قليل الذوبان."], "q": ["Quel procédé donne une poudre qui se réhydrate en quelques secondes ?", "أي طريقة تعطي مسحوقًا يتميّه في بضع ثوانٍ؟"], "o": [["Le séchage sur cylindres", "La concentration sous vide", "L'atomisation avec instantanéisation"], ["التجفيف على الأسطوانات", "التركيز تحت الفراغ", "الرذاذ مع التذويب الفوري"]], "a": 2, "w": ["Les agglomérats poreux de l'instantanéisation se dissolvent tout de suite.", "التكتلات المسامية للتذويب الفوري تذوب مباشرة."], "g": [2, 27]}, {"img": "l14_13", "t": ["Juger une poudre de lait", "تقييم مسحوق الحليب"], "st": [["Humidité 3 à 4 % : au-delà, la poudre s'agglomère, brunit et se conserve mal ; en dessous, le séchage coûte trop et les protéines souffrent.", "Solubilité : une poudre instantanée se disperse en moins de 30 s dans l'eau à 25 °C ; une poudre surchauffée laisse des grumeaux.", "Indice de protéines solubles : low heat pour la fromagerie, high heat pour la boulangerie.", "Conservation à l'abri de l'air, de l'humidité et de la lumière : une poudre grasse rancit en quelques mois, une écrémée tient deux ans."], ["الرطوبة 3 إلى 4٪: فوقها يتكتل المسحوق ويسمرّ ويُحفظ بشكل سيئ؛ وتحتها يكلّف التجفيف كثيرًا وتتضرر البروتينات.", "الذوبانية: المسحوق الفوري ينتشر في أقل من 30 ثانية في ماء بـ 25 درجة؛ والمسحوق المسخّن أكثر من اللازم يترك كتلًا.", "مؤشر البروتينات الذائبة: low heat للجبن، وhigh heat للمخبزة.", "الحفظ بعيدًا عن الهواء والرطوبة والضوء: المسحوق الدسم يتزنّخ في بضعة أشهر، والمنزوع الدسم يدوم سنتين."]], "k": ["Le traitement thermique subi décide de l'usage de la poudre, et non l'inverse.", "المعالجة الحرارية التي خضع لها المسحوق هي التي تحدد استعماله، وليس العكس."], "q": ["Quelle poudre convient à la fromagerie ?", "أي مسحوق يناسب صناعة الجبن؟"], "o": [["Une poudre low heat", "Une poudre high heat", "Une poudre séchée sur cylindres"], ["مسحوق low heat", "مسحوق high heat", "مسحوق مجفف على الأسطوانات"]], "a": 0, "w": ["Peu chauffée, elle garde ses protéines solubles et son aptitude fromagère.", "قليل التسخين، يحتفظ ببروتيناته الذائبة وقابليته لصنع الجبن."], "g": [27, 58]}, {"img": "l14_15", "t": ["La fermentation lactique et la courbe de pH", "التخمير اللبني ومنحنى pH"], "st": [["Les bactéries lactiques transforment le lactose en acide lactique. Le pH baisse, et c'est cette baisse qui transforme le lait.", "Courbe de pH : lente au départ (phase de latence), puis rapide, puis stable quand le lactose disponible s'épuise.", "En yaourterie, on suit cette courbe pour décider du moment du refroidissement.", "Repères : un yaourt part de pH 6,6 et s'arrête vers pH 4,6 ; un fromage frais descend plus bas encore."], ["البكتيريا اللبنية (bactéries lactiques) تحوّل اللاكتوز (lactose) إلى حمض اللبنيك (acide lactique). ينخفض pH، وهذا الانخفاض هو ما يحوّل الحليب.", "منحنى pH: بطيء في البداية (طور الكمون phase de latence)، ثم سريع، ثم مستقر عندما ينفد اللاكتوز المتاح.", "في معمل الياغورت نتبع هذا المنحنى لتحديد لحظة التبريد.", "مراجع: الياغورت يبدأ من pH 6,6 ويتوقف حوالي pH 4,6؛ والجبن الطري ينزل أكثر."]], "k": ["La baisse du pH, suivie sur la courbe, décide du moment de refroidir.", "انخفاض pH المتتبَّع على المنحنى يحدد لحظة التبريد."], "q": ["Comment s'appelle la phase lente du début de la courbe de pH ?", "ما اسم الطور البطيء في بداية منحنى pH؟"], "o": [["La phase de stabilisation", "La phase de latence", "La phase de réticulation"], ["طور الاستقرار", "طور الكمون", "طور التشابك"]], "a": 1, "w": ["Au départ, les ferments s'adaptent : c'est la latence, avant l'acidification rapide.", "في البداية تتأقلم الخمائر: إنه الكمون قبل التحمض السريع."], "g": [20, 30, 57]}, {"img": "l14_17", "t": ["Mésophiles ou thermophiles ?", "محبة للاعتدال أم محبة للحرارة؟"], "st": [["Mésophiles (20 à 30 °C) : Lactococcus lactis, Leuconostoc. Acidification lente, 12 à 18 h. Arômes : diacétyle du beurre, notes de crème.", "Usages mésophiles : fromages frais, pâtes molles, beurre acide, crème maturée.", "Thermophiles (40 à 45 °C) : Streptococcus thermophilus, Lactobacillus bulgaricus. Acidification rapide, 3 à 5 h, en protocoopération.", "Usages thermophiles : yaourt, laits fermentés, pâtes pressées cuites. On utilise toujours des cultures mixtes d'au moins deux espèces."], ["المحبة للاعتدال (mésophiles، 20 إلى 30 درجة): Lactococcus lactis وLeuconostoc. تحمض بطيء، 12 إلى 18 ساعة. نكهات: الدياسيتيل (diacétyle) في الزبدة، ونكهات القشدة.", "استعمالاتها: الأجبان الطرية، الأجبان ذات العجينة اللينة، الزبدة الحامضة، القشدة المنضَّجة.", "المحبة للحرارة (thermophiles، 40 إلى 45 درجة): Streptococcus thermophilus وLactobacillus bulgaricus. تحمض سريع، 3 إلى 5 ساعات، بتعاون متبادل (protocoopération).", "استعمالاتها: الياغورت، الألبان المخمّرة، الأجبان المضغوطة المطبوخة. نستعمل دائمًا مزارع مختلطة من نوعين على الأقل."]], "k": ["Le ferment se choisit selon la température de l'atelier et la vitesse d'acidification voulue.", "تُختار الخميرة حسب حرارة الورشة وسرعة التحمض المطلوبة."], "q": ["Quel couple de ferments fabrique le yaourt ?", "أي زوج من الخمائر يصنع الياغورت؟"], "o": [["Lactococcus et Leuconostoc", "Penicillium et Geotrichum", "S. thermophilus et L. bulgaricus"], ["Lactococcus وLeuconostoc", "Penicillium وGeotrichum", "S. thermophilus وL. bulgaricus"]], "a": 2, "w": ["Ce sont des thermophiles (40 à 45 °C) qui acidifient vite, ensemble.", "إنها خمائر محبة للحرارة (40 إلى 45 درجة) تحمّض بسرعة معًا."], "g": [39, 57]}, {"img": "l14_19", "t": ["Les incidents de fermentation", "حوادث التخمير"], "st": [["Une cuve qui ne s'acidifie pas est une cuve perdue : produit en pertes et ligne immobilisée.", "Quatre causes, de la plus fréquente à la moins fréquente : inhibiteurs (antibiotiques, résidus de désinfectant), bactériophages, erreurs de conduite, contaminations.", "Les bactériophages sont des virus qui détruisent les ferments lactiques. Les erreurs de conduite : température, dose ou temps non respectés.", "Prévention : test antibiotique à la réception, rotation des souches, nettoyage NEP rigoureux, et suivi de la courbe de pH qui donne l'alerte."], ["حوض لا يتحمض هو حوض ضائع: المنتوج يُتلف والخط يتوقف.", "أربعة أسباب، من الأكثر تكرارًا إلى الأقل: المثبطات (inhibiteurs: مضادات حيوية، بقايا مطهّر)، العاثيات (bactériophages)، أخطاء القيادة، التلوثات.", "العاثيات فيروسات تدمّر الخمائر اللبنية. أخطاء القيادة: عدم احترام الحرارة أو الجرعة أو الزمن.", "الوقاية: اختبار المضادات الحيوية عند الاستقبال، تناوب السلالات (rotation des souches)، تنظيف في المكان (NEP) صارم، وتتبع منحنى pH الذي يعطي الإنذار."]], "k": ["Première cause d'arrêt d'acidification : les inhibiteurs, d'où le test antibiotique à la réception.", "أول سبب لتوقف التحمض: المثبطات، ومن هنا اختبار المضادات الحيوية عند الاستقبال."], "q": ["Comment empêcher un bactériophage de s'installer dans l'atelier ?", "كيف نمنع عاثية من الاستقرار في الورشة؟"], "o": [["En chauffant plus le yaourt", "Par la rotation des souches de ferments", "En ajoutant du sel"], ["بتسخين الياغورت أكثر", "بتناوب سلالات الخمائر", "بإضافة الملح"]], "a": 1, "w": ["Changer régulièrement de souches prive le phage de sa cible.", "تغيير السلالات بانتظام يحرم العاثية من هدفها."], "g": [20, 26]}, {"img": "l14_07", "t": ["Calcul : taux de concentration et eau évaporée", "حساب: نسبة التركيز والماء المتبخّر"], "st": [["Données : un évaporateur reçoit 5 000 L de lait et sort 1 900 L de concentré.", "Taux de concentration : T = volume initial / volume final = 5 000 / 1 900 ≈ 2,63.", "Eau évaporée = volume initial − volume final = 5 000 − 1 900 = 3 100 L.", "Le résultat est cohérent avec le repère du cours : T ≈ 2,6."], ["المعطيات: مبخّر (évaporateur) يستقبل 5000 ل من الحليب ويُخرج 1900 ل من المركّز.", "نسبة التركيز: T = الحجم الأولي / الحجم النهائي = 5000 / 1900 ≈ 2,63.", "الماء المتبخّر = الحجم الأولي − الحجم النهائي = 5000 − 1900 = 3100 ل.", "النتيجة منسجمة مع مرجع الدرس: T ≈ 2,6."]], "k": ["T = volume initial / volume final ; eau évaporée = différence des deux volumes.", "T = الحجم الأولي / الحجم النهائي؛ الماء المتبخّر = الفرق بين الحجمين."], "q": ["1 000 L deviennent 385 L de concentré. Quelle quantité d'eau a été évaporée ?", "1000 ل تصبح 385 ل من المركّز. ما كمية الماء المتبخّر؟"], "o": [["385 L", "2,6 L", "615 L"], ["385 ل", "2,6 ل", "615 ل"]], "a": 2, "w": ["1 000 − 385 = 615 L d'eau ; le taux T vaut 1 000 / 385 ≈ 2,6.", "1000 − 385 = 615 ل من الماء؛ ونسبة التركيز 1000 / 385 ≈ 2,6."], "g": [20, 51]}], "since": "1.6"}, {"n": 15, "t": ["TP 4 — Fabrication du lait pasteurisé", "الأشغال التطبيقية 4 — صناعة الحليب المبستر"], "c": [{"img": "l15_08", "t": ["Qu'est-ce qu'un lait pasteurisé ?", "ما هو الحليب المبستر؟"], "st": [["Définition (décret n° 2-00-425 du 7 décembre 2000) : lait ayant subi un traitement thermique approprié.", "Ce traitement détruit tous les germes pathogènes et presque toute la flore banale, en préservant au maximum le lait (goût, valeur nutritive).", "Tous les pathogènes détruits : objectif non négociable. Presque toute la flore banale : le lait pasteurisé n'est pas stérile, il reste un produit frais.", "Trois exigences : phosphatase négative, refroidissement immédiat à 6 °C au plus, conformité microbiologique."], ["التعريف (المرسوم رقم 2-00-425 بتاريخ 7 دجنبر 2000): حليب خضع لمعالجة حرارية مناسبة.", "هذه المعالجة تدمّر كل الجراثيم الممرضة وتقريبًا كل الفلورا العادية، مع الحفاظ قدر الإمكان على الحليب (الذوق، القيمة الغذائية).", "كل الممرضات مدمَّرة: هدف غير قابل للتفاوض. تقريبًا كل الفلورا العادية: الحليب المبستر ليس معقّمًا، يبقى منتوجًا طازجًا.", "ثلاثة متطلبات: فوسفاتاز سلبي، تبريد فوري إلى 6 درجات على الأكثر، مطابقة ميكروبيولوجية."]], "k": ["Le lait pasteurisé n'est pas stérile : il reste un produit frais, sous chaîne du froid.", "الحليب المبستر ليس معقّمًا: يبقى منتوجًا طازجًا تحت سلسلة التبريد."], "q": ["Quelle affirmation sur le lait pasteurisé est exacte ?", "أي عبارة عن الحليب المبستر صحيحة؟"], "o": [["Il est stérile", "Il reste un produit frais qui garde un peu de flore banale", "Il se garde 6 mois hors du froid"], ["إنه معقّم", "يبقى منتوجًا طازجًا يحتفظ بقليل من الفلورا العادية", "يُحفظ 6 أشهر خارج البرد"]], "a": 1, "w": ["Presque toute la flore banale est détruite, pas toute : d'où la chaîne du froid.", "تقريبًا كل الفلورا العادية تُدمَّر، وليس كلها: ومن هنا سلسلة التبريد."], "g": [20, 37]}, {"img": "l15_06", "t": ["Sécurité et organisation du poste", "السلامة وتنظيم مكان العمل"], "st": [["Surfaces chaudes : l'échangeur et les canalisations dépassent 70 °C. Gants thermiques et zones chaudes signalées.", "Nettoyage avant production : aucune fabrication sur une ligne non nettoyée et non rincée ; le rinçage final est contrôlé au pH.", "Hygiène du personnel : blouse, charlotte, chaussures dédiées, mains lavées et désinfectées, ni bijou ni montre.", "Soude et acide de circuit sont corrosifs : manipulés par le formateur ou sous sa surveillance. Repérer l'arrêt d'urgence ; en cas de doute, on arrête."], ["الأسطح الساخنة: المبادل والقنوات تتجاوز 70 درجة. قفازات حرارية ومناطق ساخنة مُشار إليها.", "التنظيف قبل الإنتاج: لا تصنيع على خط غير منظف وغير مشطوف؛ الشطف النهائي يُراقب بقياس pH.", "نظافة العاملين: وزرة، غطاء رأس (charlotte)، أحذية مخصصة، أيدٍ مغسولة ومطهّرة، بلا حليّ ولا ساعة.", "الصودا وحمض الدارة مواد أكّالة: يتعامل معها المكوّن أو تحت مراقبته. حدّد زر التوقف الطارئ؛ عند الشك نوقف الآلة."]], "k": ["Aucune fabrication ne démarre avant la vérification des cinq points de sécurité.", "لا يبدأ أي تصنيع قبل التحقق من نقاط السلامة الخمس."], "q": ["Comment contrôle-t-on que le rinçage final de la ligne est correct ?", "كيف نتحقق من أن الشطف النهائي للخط صحيح؟"], "o": [["Au pH", "À l'odeur", "Au thermomètre"], ["بقياس pH", "بالرائحة", "بالمحرار"]], "a": 0, "w": ["Le pH vérifie qu'il ne reste ni soude ni acide dans le circuit.", "قياس pH يتحقق من عدم بقاء الصودا أو الحمض في الدارة."], "g": [20]}, {"img": "l15_10", "t": ["Les étapes du lait pasteurisé", "مراحل الحليب المبستر"], "st": [["Réception et filtration : contrôle du lait (température, acidité, densité, MG), puis filtration des impuretés physiques.", "Standardisation : MG ajustée à 30 g/L (entier) ou 15 g/L (demi-écrémé).", "Homogénéisation sous haute pression contre la remontée de crème.", "Pasteurisation : 72–75 °C pendant 15 à 20 s dans l'échangeur, avec récupération d'énergie.", "Refroidissement immédiat à 6 °C au plus.", "Conditionnement et étiquetage : remplissage, fermeture, numéro de lot et DLC, chambre froide. Rien n'avance sans contrôle précédent conforme."], ["الاستقبال والترشيح: مراقبة الحليب (الحرارة، الحموضة، الكثافة، المادة الدسمة)، ثم ترشيح الشوائب الفيزيائية.", "التوحيد القياسي: ضبط المادة الدسمة في 30 غ/ل (كامل) أو 15 غ/ل (نصف منزوع).", "التجنيس تحت ضغط عالٍ ضد صعود القشدة.", "البسترة: 72–75 درجة خلال 15 إلى 20 ثانية في المبادل مع استرجاع الطاقة.", "تبريد فوري إلى 6 درجات على الأكثر.", "التعبئة والتوسيم: الملء، الإغلاق، رقم الدفعة ومدة الصلاحية، غرفة التبريد. لا تقدّم دون مراقبة سابقة مطابقة."]], "k": ["Six étapes, chacune avec son point de contrôle : réception, standardisation, homogénéisation, pasteurisation, refroidissement, conditionnement.", "ست مراحل، لكل منها نقطة مراقبة: الاستقبال، التوحيد، التجنيس، البسترة، التبريد، التعبئة."], "q": ["Quelle étape vient juste après la pasteurisation ?", "ما المرحلة التي تأتي مباشرة بعد البسترة؟"], "o": [["L'homogénéisation", "Le conditionnement", "Le refroidissement immédiat"], ["التجنيس", "التعبئة", "التبريد الفوري"]], "a": 2, "w": ["Le lait sort de la section de refroidissement à 6 °C au plus avant d'être conditionné.", "يخرج الحليب من قسم التبريد في 6 درجات على الأكثر قبل تعبئته."], "sn": ["1", "2", "3", "4", "5", "6"], "g": [25, 48, 58]}, {"img": "l15_12", "t": ["Les points critiques de la ligne", "النقاط الحرجة في الخط"], "st": [["Le barème : température ET temps de séjour, les deux, pas l'un ou l'autre.", "La vanne de recyclage : un lait sous-chauffé doit repartir en amont, jamais en aval.", "La température de sortie : 6 °C au maximum, contrôlée en continu. La phosphatase : négative, sinon la pasteurisation est insuffisante.", "L'hygiène post-pasteurisation : toute recontamination après l'échangeur ruine le traitement ; c'est la première cause de non-conformité en industrie."], ["البرنامج الحراري: الحرارة و زمن المكوث، الاثنان معًا، وليس أحدهما.", "صمام إعادة التدوير (vanne de recyclage): الحليب غير المسخّن كفاية يجب أن يعود إلى بداية الخط (en amont)، وأبدًا نحو نهايته (en aval).", "حرارة الخروج: 6 درجات على الأكثر، مراقبة باستمرار. الفوسفاتاز: سلبي، وإلا فالبسترة غير كافية.", "النظافة بعد البسترة: أي تلوث جديد بعد المبادل يُفسد المعالجة؛ إنه أول سبب لعدم المطابقة في الصناعة."]], "k": ["Le barème, la vanne de recyclage, la sortie à 6 °C et l'hygiène après l'échangeur décident de la conformité.", "البرنامج الحراري، صمام إعادة التدوير، الخروج في 6 درجات والنظافة بعد المبادل تحدد المطابقة."], "q": ["Le lait n'atteint pas 72 °C dans le chambreur. Que doit faire la vanne de recyclage ?", "الحليب لا يصل إلى 72 درجة في حجرة الإبقاء. ماذا يجب أن يفعل صمام إعادة التدوير؟"], "o": [["L'envoyer au conditionnement", "Le renvoyer en amont pour être rechauffé", "Le jeter à l'égout"], ["إرساله إلى التعبئة", "إعادته إلى بداية الخط ليُسخَّن من جديد", "رميه في المجاري"]], "a": 1, "w": ["Un lait sous-chauffé repart en amont, jamais vers l'aval.", "الحليب غير المسخّن كفاية يعود إلى بداية الخط، وأبدًا نحو التعبئة."], "g": [20, 37]}, {"img": "l15_07", "t": ["Trois exigences et la traçabilité", "ثلاثة متطلبات والتتبّع"], "st": [["Phosphatase négative : preuve que la pasteurisation a été correcte.", "Refroidissement à 6 °C au plus, immédiatement après traitement.", "Conformité microbiologique du produit fini.", "Traçabilité : numéro de lot, paramètres et DLC sur l'étiquette. Un lot non tracé est un lot non vendable."], ["فوسفاتاز سلبي: دليل على أن البسترة كانت صحيحة.", "التبريد إلى 6 درجات على الأكثر، مباشرة بعد المعالجة.", "المطابقة الميكروبيولوجية للمنتوج النهائي.", "التتبّع (traçabilité): رقم الدفعة والمعايير ومدة الصلاحية على الملصق. دفعة غير متتبَّعة دفعة غير قابلة للبيع."]], "k": ["Phosphatase négative, 6 °C maximum, conformité microbiologique ; et un lot tracé.", "فوسفاتاز سلبي، 6 درجات كحد أقصى، مطابقة ميكروبيولوجية؛ ودفعة متتبَّعة."], "q": ["Après pasteurisation, à quelle température maximale refroidit-on le lait ?", "بعد البسترة، إلى أي درجة قصوى نبرّد الحليب؟"], "o": [["4 °C", "10 °C", "6 °C"], ["4 درجات", "10 درجات", "6 درجات"]], "a": 2, "w": ["C'est l'exigence réglementaire : 6 °C au plus, immédiatement.", "إنه المتطلب التنظيمي: 6 درجات على الأكثر، فورًا."], "g": [20, 37]}, {"img": "l15_09", "t": ["Rendement et pertes de la ligne", "مردود الخط والضياعات"], "st": [["Le lot est suivi du lait cru au produit fini sur la fiche de traçabilité.", "Rendement (%) = volume de produit fini / volume initial × 100.", "Pertes (L) = volume initial − volume de produit fini.", "Exemple : 5 000 L entrent, 4 850 L sont conditionnés : 150 L de pertes, rendement de 97 %. Les écarts doivent être expliqués."], ["تُتتبَّع الدفعة من الحليب الخام إلى المنتوج النهائي في بطاقة التتبّع.", "المردود (٪) = حجم المنتوج النهائي / الحجم الأولي × 100.", "الضياعات (ل) = الحجم الأولي − حجم المنتوج النهائي.", "مثال: تدخل 5000 ل وتُعبّأ 4850 ل: 150 ل ضياع، مردود 97٪. يجب تفسير الفوارق."]], "k": ["Rendement = produit fini / volume initial × 100 ; les pertes sont la différence.", "المردود = المنتوج النهائي / الحجم الأولي × 100؛ والضياعات هي الفرق."], "q": ["1 000 L de lait entrent, 960 L sont conditionnés. Quel est le rendement ?", "تدخل 1000 ل من الحليب وتُعبّأ 960 ل. ما المردود؟"], "o": [["96 %", "40 %", "104 %"], ["96٪", "40٪", "104٪"]], "a": 0, "w": ["960 / 1 000 × 100 = 96 % ; les pertes sont de 40 L.", "960 / 1000 × 100 = 96٪؛ والضياعات 40 ل."], "g": [20, 41]}], "since": "1.6"}, {"n": 16, "t": ["Fermentation, coagulation et travail du caillé", "التخمير، التخثر ومعالجة الخثارة"], "c": [{"img": "l16_03", "t": ["Trente minutes pour changer d'état", "ثلاثون دقيقة لتغيير الحالة"], "st": [["Au départ : un lait liquide, qu'on peut verser, pomper, filtrer.", "On ajoute quelques millilitres de présure, 40 mL pour 100 litres, et on n'agite plus.", "Trente minutes plus tard : un gel ferme, qu'on découpe au couteau et qui laisse échapper un sérum limpide.", "Deux voies mènent au caillé : l'acide et l'enzyme. Le lait qui tourne est une coagulation acide non maîtrisée ; le caillé du fromager, une coagulation enzymatique conduite."], ["في البداية: حليب سائل يمكن صبّه وضخّه وترشيحه.", "نضيف بضعة ملليلترات من المنفحة (présure)، 40 مل لكل 100 لتر، ولا نحرّك بعد ذلك.", "بعد ثلاثين دقيقة: هُلام (gel) متماسك يُقطع بالسكين ويُخرج مصلًا (sérum) صافيًا.", "طريقان يؤديان إلى الخثارة (caillé): الحمض والإنزيم. الحليب الذي يفسد تخثر حمضي غير متحكَّم فيه؛ وخثارة صانع الجبن تخثر إنزيمي مُدار."]], "k": ["Deux voies vers le caillé, l'acide et l'enzyme, qui ne donnent pas le même fromage.", "طريقان نحو الخثارة، الحمض والإنزيم، ولا يعطيان نفس الجبن."], "q": ["Le lait qui tourne dans une bouteille oubliée et le caillé du fromager : même phénomène ?", "الحليب الذي يفسد في قنينة منسية وخثارة صانع الجبن: نفس الظاهرة؟"], "o": [["Oui, exactement le même", "Non : l'un est acide non maîtrisé, l'autre enzymatique conduit", "Non : aucun des deux n'est une coagulation"], ["نعم، نفسها تمامًا", "لا: الأول حمضي غير متحكَّم فيه، والثاني إنزيمي مُدار", "لا: ولا واحد منهما تخثر"]], "a": 1, "w": ["Deux coagulations différentes : acide spontanée d'un côté, présure maîtrisée de l'autre.", "تخثّران مختلفان: حمضي تلقائي من جهة، وبالمنفحة متحكَّم فيه من جهة أخرى."], "g": [6, 20, 40]}, {"img": "l16_08", "t": ["La fermentation lactique avant le caillé", "التخمير اللبني قبل الخثارة"], "st": [["Les bactéries lactiques transforment le lactose en acide lactique : le pH baisse et transforme le lait.", "M
