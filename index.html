ésophiles (20 à 30 °C) pour fromages frais, pâtes molles, beurre acide ; thermophiles (40 à 45 °C) pour yaourt et pâtes pressées cuites.", "Une souche pure remplit un rôle unique ; en pratique, on utilise des cultures mixtes d'au moins deux espèces, pour un meilleur résultat technologique et sensoriel.", "Incidents : bactériophages, inhibiteurs, levures ou coliformes arrêtent l'acidification. D'où le test antibiotique systématique à la réception."], ["البكتيريا اللبنية تحوّل اللاكتوز إلى حمض اللبنيك: ينخفض pH ويحوّل الحليب.", "المحبة للاعتدال (20 إلى 30 درجة) للأجبان الطرية وذات العجينة اللينة والزبدة الحامضة؛ والمحبة للحرارة (40 إلى 45 درجة) للياغورت والأجبان المضغوطة المطبوخة.", "سلالة نقية (souche pure) تؤدي دورًا واحدًا؛ عمليًا نستعمل مزارع مختلطة (cultures mixtes) من نوعين على الأقل لنتيجة تقنية وحسية أفضل.", "الحوادث: العاثيات، المثبطات، الخمائر أو القولونيات (coliformes) توقف التحمض. ومن هنا اختبار المضادات الحيوية المنهجي عند الاستقبال."]], "k": ["En pratique, on travaille toujours avec des cultures mixtes d'au moins deux espèces.", "عمليًا نعمل دائمًا بمزارع مختلطة من نوعين على الأقل."], "q": ["Pourquoi utilise-t-on des cultures mixtes plutôt qu'une souche pure ?", "لماذا نستعمل مزارع مختلطة بدل سلالة نقية؟"], "o": [["Elles coûtent moins cher", "Elles résistent à la présure", "Meilleur résultat technologique et sensoriel"], ["لأنها أرخص", "لأنها تقاوم المنفحة", "لنتيجة تقنية وحسية أفضل"]], "a": 2, "w": ["Une souche pure ne remplit qu'un rôle ; plusieurs espèces se complètent.", "السلالة النقية تؤدي دورًا واحدًا فقط؛ وعدة أنواع تتكامل."], "g": [6, 26, 30, 57]}, {"img": "l16_10", "t": ["La maturation du lait", "إنضاج الحليب"], "st": [["Objectif : régler le taux de calcium et amener le lait à l'acidité de départ voulue, grâce aux ferments.", "Pâte molle : 12 à 22 °C pendant 12 h (pâte crémeuse, souple). Pâte pressée : 36 °C pendant 30 à 40 min (pâte plus sèche et ferme).", "Chlorure de calcium : environ 0,1 %, soit 0,1 L pour 100 L. pH visé : environ 5,2 avant emprésurage, pour les fromages.", "La pasteurisation rend une partie du calcium indisponible ; or il est indispensable à la coagulation. Le CaCl₂ donne un caillé plus ferme et régulier."], ["الهدف: ضبط نسبة الكالسيوم وإيصال الحليب إلى الحموضة الابتدائية المطلوبة بفضل الخمائر.", "عجينة لينة: 12 إلى 22 درجة لمدة 12 ساعة (عجينة كريمية ولينة). عجينة مضغوطة: 36 درجة لمدة 30 إلى 40 دقيقة (عجينة أجف وأمتن).", "كلوريد الكالسيوم (chlorure de calcium): حوالي 0,1٪، أي 0,1 ل لكل 100 ل. pH المستهدف: حوالي 5,2 قبل إضافة المنفحة، للأجبان.", "البسترة تجعل جزءًا من الكالسيوم غير متاح؛ وهو ضروري للتخثر. CaCl₂ يعطي خثارة أمتن وتخثرًا منتظمًا."]], "k": ["Pasteurisation → calcium indisponible → ajout de CaCl₂ → caillé plus ferme.", "البسترة ← كالسيوم غير متاح ← إضافة CaCl₂ ← خثارة أمتن."], "q": ["Pourquoi ajoute-t-on du chlorure de calcium au lait de fromagerie ?", "لماذا نضيف كلوريد الكالسيوم إلى حليب الجبن؟"], "o": [["La pasteurisation a rendu du calcium indisponible", "Le lait manque de sel", "Pour accélérer l'affinage"], ["البسترة جعلت جزءًا من الكالسيوم غير متاح", "الحليب ينقصه الملح", "لتسريع التنضيج"]], "a": 0, "w": ["Environ 0,1 % de CaCl₂ rétablit le calcium utile à une bonne coagulation.", "حوالي 0,1٪ من CaCl₂ تعيد الكالسيوم اللازم لتخثر جيد."], "g": [6, 20]}, {"img": "l16_12", "t": ["Coagulation acide ou enzymatique", "التخثر الحمضي أو الإنزيمي"], "st": [["Coagulation lactique : l'acidification fait précipiter les caséines vers pH 4,6. Caillé fragile, peu minéralisé, qui s'égoutte lentement : fromages frais, pâtes molles.", "Coagulation enzymatique : la présure (chymosine et pepsine) donne un coagulum élastique, souple et fortement minéralisé : pâtes pressées, pâtes dures.", "Le gel présure, ferme et élastique, supporte découpage, brassage et pressage ; le gel lactique se délite, on ne peut pas le presser.", "La plupart des fromages combinent les deux avec une dominante : lactique pour un fromage frais, présure pour une pâte pressée."], ["التخثر اللبني (coagulation lactique): التحمض يُرسّب الكازينات (caséines) حوالي pH 4,6. خثارة هشة، قليلة التمعدن، تُصفّى ببطء: أجبان طرية وذات عجينة لينة.", "التخثر الإنزيمي: المنفحة (الكيموزين chymosine والببسين pepsine) تعطي خثرة مرنة ولينة وغنية بالمعادن: أجبان مضغوطة وصلبة.", "هلام المنفحة، متماسك ومرن، يتحمل التقطيع والتحريك والضغط؛ الهلام اللبني يتفتت، لا يمكن ضغطه.", "أغلب الأجبان تجمع بين الاثنين مع غلبة أحدهما: لبنية للجبن الطري، وبالمنفحة للجبن المضغوط."]], "k": ["Caillé acide fragile et peu minéralisé ; caillé présure élastique et fortement minéralisé.", "خثارة حمضية هشة قليلة التمعدن؛ خثارة المنفحة مرنة وغنية بالمعادن."], "q": ["Un caillé obtenu par coagulation enzymatique est :", "الخثارة الناتجة عن التخثر الإنزيمي تكون:"], "o": [["Fragile et peu minéralisé", "Élastique et fortement minéralisé", "Liquide"], ["هشة وقليلة التمعدن", "مرنة وغنية بالمعادن", "سائلة"]], "a": 1, "w": ["C'est pourquoi il supporte le découpage, le brassage et le pressage.", "لهذا تتحمل التقطيع والتحريك والضغط."], "g": [6, 40]}, {"img": "l16_15", "t": ["Les trois phases de l'action de la présure", "المراحل الثلاث لتأثير المنفحة"], "st": [["Phase primaire (enzymatique) : l'enzyme coupe le chevelu de la caséine kappa et libère le caséinomacropeptide (CMP). Rien n'est encore visible.", "Phase secondaire (agrégation) : les micelles déstabilisées s'agrègent, le gel se forme et se raffermit. Elle exige une absence totale d'agitation.", "Phase tertiaire (réticulation) : de nouvelles liaisons calciques unissent les micelles ; le réseau se resserre, le gel devient élastique et expulse du sérum.", "Les trois phases se chevauchent : la deuxième commence avant la fin de la première."], ["المرحلة الأولى (الإنزيمية): الإنزيم يقطع «شعيرات» الكازين كابا (caséine kappa) ويحرر الكازينوماكروببتيد (CMP). لا شيء ظاهر بعد.", "المرحلة الثانية (التجمع agrégation): المذيلات (micelles) غير المستقرة تتجمع، يتكوّن الهلام ويتماسك. تتطلب غيابًا تامًا للتحريك.", "المرحلة الثالثة (التشابك réticulation): روابط كالسيومية جديدة تربط المذيلات؛ تنقبض الشبكة، يصبح الهلام مرنًا ويطرد المصل.", "المراحل الثلاث متداخلة: الثانية تبدأ قبل نهاية الأولى."]], "k": ["Couper le CMP, agréger les micelles, réticuler par le calcium.", "قطع CMP، تجميع المذيلات، التشابك بالكالسيوم."], "q": ["En quoi consiste la phase primaire de l'action de la présure ?", "في ماذا تتمثل المرحلة الأولى لتأثير المنفحة؟"], "o": [["Couper le chevelu de la caséine kappa", "Agréger les micelles", "Créer des liaisons calciques"], ["قطع شعيرات الكازين كابا", "تجميع المذيلات", "إنشاء روابط كالسيومية"]], "a": 0, "w": ["La coupure libère le caséinomacropeptide : la micelle perd sa stabilité.", "القطع يحرر الكازينوماكروببتيد: تفقد المذيلة استقرارها."], "sn": ["1", "2", "3", ""], "g": [20, 33, 40]}, {"img": "l16_17", "t": ["Le travail du caillé, étape par étape", "معالجة الخثارة خطوة بخطوة"], "st": [["Découpage et brassage : le caillé est découpé en grains ; plus le grain est fin, plus l'égouttage est poussé. Le brassage accélère l'expulsion du sérum.", "Délactosage et cuisson : on retire du sérum et on ajoute de l'eau pour limiter le lactose ; la cuisson, jusqu'à 55 °C, resserre le grain des pâtes cuites.", "Égouttage, moulage, pressage : en moule, avec ou sans pressage progressif ; retournements réguliers pour un égouttage symétrique.", "Salage, à sec ou en saumure : il termine l'égouttage, sélectionne la flore de surface, freine l'acidification et donne le goût."], ["التقطيع والتحريك: تُقطّع الخثارة إلى حبيبات؛ كلما كانت الحبة أدق كان التصفية أعمق. التحريك يسرّع طرد المصل.", "إزالة اللاكتوز (délactosage) والطهي: نسحب جزءًا من المصل ونضيف الماء للحد من اللاكتوز؛ والطهي حتى 55 درجة يشدّ حبيبات الأجبان المطبوخة.", "التصفية، القولبة، الضغط: في القالب، مع ضغط تدريجي أو بدونه؛ قلب منتظم لتصفية متناظرة.", "التمليح، جافًا أو في محلول ملحي (saumure): يُنهي التصفية، ينتقي فلورا السطح، يبطئ التحمض ويعطي الذوق."]], "k": ["Tout le travail du caillé consiste à contrôler la sortie de l'eau.", "كل معالجة الخثارة تتمثل في التحكم في خروج الماء."], "q": ["Le fromager veut un égouttage plus poussé. Comment découpe-t-il le caillé ?", "صانع الجبن يريد تصفية أعمق. كيف يقطّع الخثارة؟"], "o": [["En gros morceaux", "En grains fins", "Il ne le découpe pas"], ["قطعًا كبيرة", "حبيبات دقيقة", "لا يقطّعها"]], "a": 1, "w": ["Plus le grain est fin, plus la surface d'égouttage est grande et plus l'égouttage est poussé.", "كلما كانت الحبة أدق كان التصفية أعمق."], "g": [6, 18, 20, 30, 46, 60]}, {"img": "l16_20", "t": ["L'affinage", "التنضيج"], "st": [["But : améliorer la texture, la couleur, le goût et la valeur nutritionnelle du fromage après égouttage.", "Trois phénomènes : fermentation du lactose résiduel et consommation du lactate ; hydrolyse de la matière grasse et des protéines ; production d'arômes.", "Paramètres : 8 à 12 °C, humidité 90 à 95 %, aération, durée variable. La protéolyse assouplit la pâte de la croûte vers le cœur.", "La flore travaille : Penicillium camemberti, Penicillium roqueforti, Geotrichum candidum, Propionibacterium (son CO₂ forme les trous de l'emmental)."], ["الهدف: تحسين قوام الجبن ولونه وذوقه وقيمته الغذائية بعد التصفية.", "ثلاث ظواهر: تخمير اللاكتوز المتبقي واستهلاك اللاكتات؛ تحلل الدهون والبروتينات؛ إنتاج النكهات.", "المعايير: 8 إلى 12 درجة، رطوبة 90 إلى 95٪، تهوية، مدة متغيرة. التحلل البروتيني (protéolyse) يليّن العجينة من القشرة نحو القلب.", "الفلورا تعمل: Penicillium camemberti وPenicillium roqueforti وGeotrichum candidum وPropionibacterium (غاز CO₂ الذي تنتجه يكوّن ثقوب الإمنتال)."]], "k": ["Après l'égouttage, le fromage n'est pas fini : il est seulement prêt à mûrir.", "بعد التصفية لم ينتهِ الجبن: إنه فقط جاهز للنضج."], "q": ["Quelles sont les conditions d'affinage ?", "ما شروط التنضيج؟"], "o": [["4 °C et 60 % d'humidité", "20 °C et 50 % d'humidité", "8 à 12 °C et 90 à 95 % d'humidité"], ["4 درجات و60٪ رطوبة", "20 درجة و50٪ رطوبة", "8 إلى 12 درجة و90 إلى 95٪ رطوبة"]], "a": 2, "w": ["Cave fraîche et très humide, avec aération ; la durée dépend du fromage.", "كهف بارد ورطب جدًا مع تهوية؛ المدة حسب الجبن."], "g": [0, 20, 30, 60]}, {"img": "l16_22", "t": ["Le rendement fromager", "المردود الجبني"], "st": [["Le rendement fromager exprime la masse de fromage obtenue à partir d'un volume de lait, en kilos pour 100 litres.", "Il augmente avec le taux de caséine (premier facteur), le taux de matière grasse retenue et l'humidité finale ; il baisse avec les pertes en fines dans le sérum.", "Ordres de grandeur : fromage frais très humide 15 à 20 kg/100 L ; pâte molle 12 à 15 kg/100 L ; pâte pressée 9 à 11 kg/100 L.", "Plus le fromage est sec, plus le rendement est faible, mais plus il se conserve."], ["المردود الجبني (rendement fromager) يعبّر عن كتلة الجبن المحصّلة من حجم معيّن من الحليب، بالكيلوغرام لكل 100 لتر.", "يرتفع مع نسبة الكازين (العامل الأول)، ونسبة المادة الدسمة المحتجزة، والرطوبة النهائية؛ وينخفض مع ضياع الدقائق (fines) في المصل.", "مراتب القيم: جبن طري رطب جدًا 15 إلى 20 كغ/100 ل؛ عجينة لينة 12 إلى 15 كغ/100 ل؛ عجينة مضغوطة 9 إلى 11 كغ/100 ل.", "كلما كان الجبن أجف كان المردود أضعف، لكنه يُحفظ أكثر."]], "k": ["La caséine fait la masse ; plus le fromage est sec, plus le rendement est faible.", "الكازين يصنع الكتلة؛ كلما كان الجبن أجف كان المردود أضعف."], "q": ["Un fromager obtient 11 kg de fromage avec 100 L de lait. De quelle famille s'agit-il probablement ?", "صانع جبن يحصل على 11 كغ من الجبن من 100 ل من الحليب. من أي عائلة غالبًا؟"], "o": [["Fromage frais", "Pâte pressée", "Pâte molle"], ["جبن طري", "عجينة مضغوطة", "عجينة لينة"]], "a": 1, "w": ["11 kg/100 L se situe dans la plage des pâtes pressées (9 à 11 kg).", "11 كغ/100 ل تقع في مجال العجائن المضغوطة (9 إلى 11 كغ)."], "g": [20, 41, 42]}], "since": "1.6"}, {"n": 17, "t": ["TP 5 — Fabrication du yaourt ferme", "الأعمال التطبيقية 5 — صناعة الياغورت المتماسك"], "c": [{"img": "l17_08", "t": ["Le yaourt au sens du décret", "الياغورت حسب المرسوم"], "st": [["Décret n° 2-00-425 du 7 décembre 2000 : le yaourt est un lait fermenté par les seules bactéries lactiques thermophiles Lactobacillus bulgaricus et Streptococcus thermophilus.", "Deux ferments, pas un : les deux espèces sont obligatoires. Un lait fermenté par une seule espèce n'est pas un yaourt.", "Ensemencés ensemble : S. thermophilus démarre l'acidification et libère CO₂ et acide formique qui stimulent L. bulgaricus, qui libère les acides aminés utiles à S. thermophilus.", "Vivants à la vente : au moins 10 millions de bactéries par gramme dans le produit fini. C'est pourquoi le yaourt ne se stérilise jamais.", "Le yaourt, le raïbi et le lben font partie des laits fermentés."], ["المرسوم رقم 2-00-425 بتاريخ 7 دجنبر 2000: الياغورت (yaourt) حليب مخمّر فقط بالبكتيريا اللبنية المحبة للحرارة (thermophiles) Lactobacillus bulgaricus و Streptococcus thermophilus.", "خميرتان لا واحدة: النوعان إجباريان. الحليب المخمّر بنوع واحد فقط ليس ياغورت.", "تُزرعان معًا: S. thermophilus يبدأ التحميض ويطلق CO₂ وحمض الفورميك اللذين ينشّطان L. bulgaricus، وهذا الأخير يطلق الأحماض الأمينية التي يحتاجها S. thermophilus.", "حيّة عند البيع: على الأقل 10 ملايين بكتيريا في الغرام من المنتوج النهائي. لهذا لا يُعقَّم الياغورت أبدًا.", "الياغورت والرايب واللبن من الألبان المخمّرة (laits fermentés)."]], "k": ["Yaourt = S. thermophilus + L. bulgaricus, ensemencés ensemble et vivants (au moins 10 millions/g) à la vente.", "الياغورت = S. thermophilus + L. bulgaricus، يُزرعان معًا ويبقيان حيّين (10 ملايين/غ على الأقل) عند البيع."], "q": ["Pourquoi un yaourt ne se stérilise-t-il jamais ?", "لماذا لا يُعقَّم الياغورت أبدًا؟"], "o": [["Pour garder un goût de cuit", "Pour augmenter son extrait sec", "Parce que ses ferments doivent être vivants à la vente"], ["للحفاظ على طعم الطهي", "لرفع مادته الجافة", "لأن خمائره يجب أن تكون حيّة عند البيع"]], "a": 2, "w": ["Le décret exige au moins 10 millions de bactéries vivantes par gramme : stériliser les tuerait.", "المرسوم يفرض 10 ملايين بكتيريا حيّة على الأقل في الغرام: التعقيم يقتلها."], "g": [20, 57]}, {"img": "l17_10", "t": ["Les 6 étapes du yaourt ferme", "المراحل الست للياغورت المتماسك"], "st": [["Standardiser la matière grasse et enrichir en poudre de lait jusqu'à environ 145 g/L d'extrait sec (minimum OMS : 82 g/L).", "Traitement thermique à 90–95 °C pendant 5 minutes : il détruit la flore concurrente et dénature les protéines solubles, ce qui raffermit le gel.", "Refroidir à 43 °C, optimum des deux ferments.", "Ensemencer environ 2 g de ferments pour 100 litres, mélangés doucement sans incorporer d'air.", "Remplir et fermer les pots, puis étuver à 40–45 °C pendant 3 à 4 heures.", "Dès pH 4,5, refroidir vite et stocker à 4 °C."], ["ضبط المادة الدسمة وإغناء الحليب بمسحوق الحليب حتى حوالي 145 غ/ل من المادة الجافة (extrait sec) (الحد الأدنى لمنظمة الصحة العالمية: 82 غ/ل).", "المعالجة الحرارية في 90–95 درجة لمدة 5 دقائق: تقضي على الفلورا المنافسة وتمسخ البروتينات الذائبة، فيصبح الهلام أكثر تماسكًا.", "التبريد إلى 43 درجة، الحرارة المثلى للخميرتين.", "الزرع (ensemencement) بحوالي 2 غ من الخمائر لكل 100 لتر، مع خلط لطيف دون إدخال الهواء.", "ملء العلب وإغلاقها ثم الحضن (étuvage) في 40–45 درجة لمدة 3 إلى 4 ساعات.", "عند pH 4,5 تبريد سريع وتخزين في 4 درجات."]], "k": ["Quatre paramètres à retenir : 40–45 °C · 3 à 4 h · pH final 4,5 · 2 g de ferments pour 100 L.", "أربعة معايير يجب حفظها: 40–45 درجة · 3 إلى 4 ساعات · pH نهائي 4,5 · 2 غ من الخمائر لكل 100 لتر."], "q": ["À quel pH arrête-t-on l'étuvage du yaourt ferme ?", "عند أي pH يتوقف حضن الياغورت المتماسك؟"], "o": [["4,5", "5,8", "6,6"], ["4,5", "5,8", "6,6"]], "a": 0, "w": ["Dès que le pH atteint 4,5, on refroidit rapidement pour stopper l'acidification.", "عندما يبلغ pH قيمة 4,5 نبرّد بسرعة لإيقاف التحميض."], "sn": ["1", "2", "3", "4", "5", "6"], "g": [57, 62]}, {"img": "l17_06", "t": ["Cinq points avant d'ensemencer", "خمس نقاط قبل الزرع"], "st": [["Hygiène : le yaourt est un milieu vivant, toute contamination se développe pendant l'étuvage. Mains, matériel et pots doivent être irréprochables.", "Ferments : conservés au congélateur ou au froid selon le type, sortis juste avant emploi, jamais remis au froid après ouverture.", "Température d'ensemencement : 43 °C vérifiés au thermomètre. Au-dessus de 50 °C les ferments meurent ; trop froid, l'acidification ne démarre pas.", "Étuve réglée avant le TP : chaque ouverture fait chuter la température. Refroidissement final dès le pH atteint, sinon le produit devient trop acide."], ["النظافة: الياغورت وسط حيّ، وأي تلوث يتكاثر أثناء الحضن. يجب أن تكون الأيدي والأدوات والعلب نظيفة تمامًا.", "الخمائر (ferments): تُحفظ في المجمّد أو في البرودة حسب نوعها، تُخرج قبل الاستعمال مباشرة، ولا تُعاد إلى البرودة بعد فتحها.", "حرارة الزرع: 43 درجة يُتحقَّق منها بالمحرار. فوق 50 درجة تموت الخمائر؛ وإذا كان الحليب باردًا جدًا لا يبدأ التحميض.", "الحاضنة (étuve) تُضبط قبل الأعمال التطبيقية: كل فتح يُسقط الحرارة. التبريد النهائي فور بلوغ pH، وإلا يصبح المنتوج حامضًا جدًا."]], "k": ["Ni trop chaud, ni trop froid : on ensemence à 43 °C, vérifiés au thermomètre.", "لا ساخن جدًا ولا بارد جدًا: نزرع في 43 درجة مع التحقق بالمحرار."], "q": ["Que se passe-t-il si on ensemence un lait à plus de 50 °C ?", "ماذا يحدث إذا زرعنا حليبًا حرارته أكثر من 50 درجة؟"], "o": [["L'acidification est plus rapide", "Les ferments meurent", "Le yaourt devient plus ferme"], ["يصبح التحميض أسرع", "تموت الخمائر", "يصبح الياغورت أكثر تماسكًا"]], "a": 1, "w": ["Au-dessus de 50 °C, les ferments thermophiles sont tués : il faut refroidir à 43 °C.", "فوق 50 درجة تُقتل الخمائر المحبة للحرارة: يجب التبريد إلى 43 درجة."], "g": [20, 57, 62]}, {"img": "l17_11", "t": ["L'ensemencement du lait", "زرع الحليب"], "st": [["On ne peut pas ensemencer un lait qui sort du traitement thermique : il faut d'abord le refroidir à 43 °C.", "La dose est d'environ 2 g de ferments pour 100 litres de lait.", "Les ferments sont dispersés et mélangés doucement pour ne pas incorporer d'air.", "Les ferments sont sortis juste avant emploi et ne retournent jamais au froid après ouverture."], ["لا يمكن زرع حليب خارج مباشرة من المعالجة الحرارية: يجب أولًا تبريده إلى 43 درجة.", "الجرعة حوالي 2 غ من الخمائر لكل 100 لتر من الحليب.", "تُنثر الخمائر وتُخلط بلطف حتى لا يدخل الهواء.", "تُخرج الخمائر قبل الاستعمال مباشرة ولا تعود أبدًا إلى البرودة بعد فتحها."]], "k": ["Ensemencement : 2 g pour 100 L, à 43 °C, mélange doux sans air.", "الزرع: 2 غ لكل 100 لتر، في 43 درجة، بخلط لطيف دون هواء."], "q": ["Quelle est la dose de ferments pour 100 litres de lait ?", "ما جرعة الخمائر لكل 100 لتر من الحليب؟"], "o": [["Environ 20 g", "Environ 200 g", "Environ 2 g"], ["حوالي 20 غ", "حوالي 200 غ", "حوالي 2 غ"]], "a": 2, "w": ["Le cours donne environ 2 g de ferments pour 100 litres de lait.", "الدرس يعطي حوالي 2 غ من الخمائر لكل 100 لتر من الحليب."], "g": [20]}, {"img": "l17_16", "t": ["Ferme ou brassé ? L'étuvage en pot", "متماسك أم مخفوق؟ الحضن في العلبة"], "st": [["Le yaourt ferme est conditionné AVANT la fermentation : les pots sont remplis, fermés, puis placés à l'étuve.", "Le yaourt brassé fermente en cuve, puis il est brassé et conditionné.", "L'étuvage du ferme se fait à 40–45 °C pendant 3 à 4 heures, avec un suivi du pH.", "Toute ouverture de l'étuve fait chuter la température et ralentit l'acidification de tout le lot."], ["الياغورت المتماسك (yaourt ferme) يُعبّأ قبل التخمّر: تُملأ العلب وتُغلق ثم توضع في الحاضنة.", "الياغورت المخفوق (yaourt brassé) يتخمّر في الخزان، ثم يُخفق ويُعبّأ.", "حضن الياغورت المتماسك يتم في 40–45 درجة لمدة 3 إلى 4 ساعات، مع تتبّع pH.", "كل فتح للحاضنة يُسقط الحرارة ويُبطئ تحميض الدفعة كلها."]], "k": ["Le ferme fermente dans son pot ; le brassé fermente en cuve.", "المتماسك يتخمّر في علبته؛ والمخفوق يتخمّر في الخزان."], "q": ["Où fermente un yaourt ferme ?", "أين يتخمّر الياغورت المتماسك؟"], "o": [["Dans son pot, à l'étuve", "En cuve, avant d'être brassé", "Au réfrigérateur à 4 °C"], ["في علبته داخل الحاضنة", "في الخزان قبل خفقه", "في الثلاجة في 4 درجات"]], "a": 0, "w": ["Le ferme est mis en pot avant la fermentation : il fermente dans son pot.", "المتماسك يُعبّأ قبل التخمّر: يتخمّر داخل علبته."], "g": [20, 57, 62]}, {"img": "l17_13", "t": ["Six défauts du yaourt, six causes", "ستة عيوب في الياغورت، ستة أسباب"], "st": [["Synérèse, décantation : sur-acidification ou refroidissement trop lent. Production de gaz : coliformes ou levures, donc défaut d'hygiène.", "Couche de crème : homogénéisation absente ou insuffisante. Manque de fermeté : extrait sec trop faible ou dose de ferment insuffisante.", "Texture sableuse : poudre mal réhydratée ou acidification trop rapide. Goût de cuit : traitement thermique trop intense.", "Réflexe du technicien : on remonte le diagramme étape par étape. La cause est presque toujours un paramètre dépassé : température, durée ou dose."], ["انفصال المصل (synérèse): تحميض زائد أو تبريد بطيء جدًا. إنتاج الغاز: القولونيات أو الخمائر، أي خلل في النظافة.", "طبقة القشدة: غياب التجنيس (homogénéisation) أو نقصه. نقص التماسك: مادة جافة ضعيفة أو جرعة خمائر غير كافية.", "قوام رملي: مسحوق سيئ الإذابة أو تحميض سريع جدًا. طعم الطهي: معالجة حرارية قوية جدًا.", "ردّ فعل التقني: نرجع إلى المخطط مرحلة بمرحلة. السبب غالبًا معيار تم تجاوزه: حرارة أو مدة أو جرعة."]], "k": ["Chaque défaut renvoie à un paramètre dépassé du diagramme.", "كل عيب يرجع إلى معيار تم تجاوزه في مخطط الصنع."], "q": ["Un yaourt produit du gaz dans le pot. Quelle est la cause probable ?", "ياغورت ينتج غازًا داخل العلبة. ما السبب المحتمل؟"], "o": [["Un extrait sec trop faible", "Des coliformes ou des levures : défaut d'hygiène", "Un traitement thermique trop intense"], ["مادة جافة ضعيفة جدًا", "قولونيات أو خمائر: خلل في النظافة", "معالجة حرارية قوية جدًا"]], "a": 1, "w": ["Le gaz vient de coliformes ou de levures : c'est un défaut d'hygiène.", "الغاز مصدره القولونيات أو الخمائر: إنه خلل في النظافة."], "g": [20, 25, 49, 57]}, {"img": "l17_12", "t": ["Durée d'étuvage, pH et texture", "مدة الحضن وpH والقوام"], "st": [["Le pH, la fermeté et la sérosité (acidité, synérèse) sont liés.", "Plus l'étuvage dure, plus le pH descend et plus le produit devient acide.", "Trente minutes d'étuvage en trop suffisent à changer le produit.", "Sans refroidissement rapide au pH 4,5, l'acidification continue."], ["pH والتماسك والمصلية (sérosité) (الحموضة وانفصال المصل) مرتبطة فيما بينها.", "كلما طال الحضن انخفض pH وأصبح المنتوج أكثر حموضة.", "ثلاثون دقيقة إضافية من الحضن تكفي لتغيير المنتوج.", "بدون تبريد سريع عند pH 4,5 يستمر التحميض."]], "k": ["Dans un yaourt, ce sont les ferments qui travaillent : notre métier est de leur donner les bonnes conditions.", "في الياغورت، الخمائر هي التي تعمل: مهمتنا أن نوفّر لها الظروف المناسبة."], "q": ["Combien de temps d'étuvage en trop suffit à changer le produit ?", "كم من الحضن الزائد يكفي لتغيير المنتوج؟"], "o": [["Trente minutes", "Deux jours", "Une semaine"], ["ثلاثون دقيقة", "يومان", "أسبوع"]], "a": 0, "w": ["Le TP le montre : trente minutes d'étuvage en trop changent déjà le produit.", "الأعمال التطبيقية تبيّن ذلك: ثلاثون دقيقة زائدة تغيّر المنتوج."], "g": [20, 49, 57, 62]}], "since": "1.6"}, {"n": 18, "t": ["TP 6 — Fabrication d'un dessert lacté", "الأعمال التطبيقية 6 — صناعة حلوى لبنية"], "c": [{"img": "l18_08", "t": ["Qu'est-ce qu'un dessert lacté ?", "ما هي الحلوى اللبنية؟"], "st": [["Préparation avec une proportion majoritaire de lait (environ 70 %) ou de crème, du sucre et des arômes.", "Famille : laits gélifiés, laits emprésurés aromatisés, mousses, crèmes desserts et flans nappés.", "Valeurs du cours : pH ≤ 6,88, produit stérilisé, DLC d'au moins 30 jours à 4 °C.", "Sans protection acide, sa fabrication exige un traitement thermique et un conditionnement soignés."], ["مستحضر يحتوي على نسبة غالبة من الحليب (حوالي 70 %) أو القشدة، مع السكر والمنكّهات.", "العائلة: الحليب المهلّم، الحليب المنفّح المنكّه، الموس، كريمات الحلوى والفلان المغطّى.", "قيم الدرس: pH ≤ 6,88، منتوج معقَّم، تاريخ حد الاستهلاك (DLC) 30 يومًا على الأقل في 4 درجات.", "بدون حماية حمضية، يحتاج صنعه إلى معالجة حرارية وتعبئة دقيقتين."]], "k": ["Sans acidité pour le protéger, un dessert lacté ne pardonne aucune faute d'hygiène.", "بدون حموضة تحميه، لا تتسامح الحلوى اللبنية مع أي خطأ في النظافة."], "q": ["Qu'est-ce qui protège le yaourt mais PAS le dessert lacté ?", "ما الذي يحمي الياغورت ولا يحمي الحلوى اللبنية؟"], "o": [["L'emballage", "Le traitement thermique", "L'acidité"], ["التغليف", "المعالجة الحرارية", "الحموضة"]], "a": 2, "w": ["Le yaourt est protégé par son pH de 4,5 ; le dessert lacté a un pH proche de 6,8.", "الياغورت محمي بـ pH 4,5؛ أما الحلوى اللبنية فـ pH قريب من 6,8."], "g": [20]}, {"img": "l18_10", "t": ["Les 6 étapes du dessert lacté", "المراحل الست للحلوى اللبنية"], "st": [["Peser et pré-mélanger les secs : sucre, poudre de lait, amidon, gélifiant, colorant.", "Mettre d'abord les liquides : lait, crème, arômes liquides.", "Disperser le pré-mélange dans le lait à environ 50 °C, sous agitation, pour hydrater complètement les poudres.", "Cuire jusqu'au gonflement puis à l'éclatement des grains d'amidon : c'est là que la viscosité se développe.", "Homogénéiser si la formule contient de la crème, puis conditionner à chaud en pots operculés.", "Refroidir vite et sans secousse."], ["الوزن والخلط المسبق للمواد الجافة: السكر، مسحوق الحليب، النشا، المادة المهلّمة، الملوّن.", "وضع السوائل أولًا: الحليب، القشدة، المنكّهات السائلة.", "نثر الخليط المسبق في الحليب عند حوالي 50 درجة مع التحريك، لترطيب المساحيق كليًا.", "الطهي حتى انتفاخ حبيبات النشا ثم انفجارها: هنا تتطور اللزوجة (viscosité).", "التجنيس إذا احتوت الوصفة على قشدة، ثم التعبئة ساخنة في علب مغلقة بغشاء.", "التبريد بسرعة ودون اهتزاز."]], "k": ["Liquides d'abord, poudres pré-mélangées ensuite, dispersion à 50 °C.", "السوائل أولًا، ثم المساحيق المخلوطة مسبقًا، والنثر في 50 درجة."], "q": ["Quand la viscosité du dessert se développe-t-elle ?", "متى تتطور لزوجة الحلوى؟"], "o": [["Au pré-mélange des poudres", "À l'éclatement des grains d'amidon pendant la cuisson", "Au moment de l'operculage"], ["عند الخلط المسبق للمساحيق", "عند انفجار حبيبات النشا أثناء الطهي", "عند إغلاق العلب"]], "a": 1, "w": ["La cuisson fait gonfler puis éclater l'amidon : c'est là que la viscosité apparaît.", "الطهي يجعل النشا ينتفخ ثم ينفجر: هنا تظهر اللزوجة."], "sn": ["1", "2", "3", "4", "5", "6"], "g": [20, 24]}, {"img": "l18_11", "t": ["Le pré-mélange des poudres", "الخلط المسبق للمساحيق"], "st": [["On mélange d'abord les produits secs entre eux : ce pré-mélange évite les grumeaux.", "L'ordre est impératif : liquides d'abord, poudres ensuite. L'ordre d'incorporation est la cause n° 1 des grumeaux.", "Verser les poudres directement dans le lait froid donne des grumeaux visibles dans le produit fini.", "Amidon, gélifiant et poudre de lait se dispersent lentement : masque recommandé, pas de courant d'air au-dessus du bac."], ["نخلط أولًا المواد الجافة فيما بينها: هذا الخلط المسبق يمنع التكتلات (grumeaux).", "الترتيب إجباري: السوائل أولًا ثم المساحيق. ترتيب الإضافة هو السبب الأول للتكتلات.", "صبّ المساحيق مباشرة في الحليب البارد يعطي تكتلات ظاهرة في المنتوج النهائي.", "النشا والمادة المهلّمة ومسحوق الحليب تنتشر ببطء: يُنصح بالكمامة، ولا تيار هواء فوق الحوض."]], "k": ["Pré-mélanger les secs, puis les verser dans le lait chaud : zéro grumeau.", "اخلط المواد الجافة مسبقًا ثم صبّها في الحليب الساخن: لا تكتلات."], "q": ["Quelle est la cause n° 1 des grumeaux ?", "ما السبب الأول للتكتلات؟"], "o": [["Le non-respect de l'ordre d'incorporation", "Un excès de sucre", "Un refroidissement trop rapide"], ["عدم احترام ترتيب الإضافة", "فائض السكر", "تبريد سريع جدًا"]], "a": 0, "w": ["Poudres versées dans le lait froid ou avant les liquides : grumeaux assurés.", "المساحيق المصبوبة في الحليب البارد أو قبل السوائل: تكتلات مؤكدة."], "g": [20, 24]}, {"img": "l18_16", "t": ["Conditionner à chaud, refroidir sans secousse", "التعبئة ساخنًا والتبريد دون اهتزاز"], "st": [["Les pots sont remplis chauds puis operculés : attention aux brûlures et à la déformation des pots.", "Le refroidissement doit être rapide et sans secousse.", "C'est pendant le refroidissement que le gel se forme : toute agitation le détruirait.", "Le produit n'est pas protégé par l'acidité : hygiène et traitement thermique garantissent seuls la conservation."], ["تُملأ العلب ساخنة ثم تُغلق بغشاء: انتبه للحروق ولتشوّه العلب.", "يجب أن يكون التبريد سريعًا ودون اهتزاز.", "أثناء التبريد يتكوّن الهلام (gel): أي تحريك يدمّره.", "المنتوج غير محمي بالحموضة: النظافة والمعالجة الحرارية وحدهما تضمنان الحفظ."]], "k": ["Le gel se forme au refroidissement : aucune agitation à ce moment-là.", "الهلام يتكوّن عند التبريد: لا تحريك في هذه اللحظة."], "q": ["Pendant quelle phase le gel du dessert se forme-t-il ?", "في أي مرحلة يتكوّن هلام الحلوى؟"], "o": [["Pendant la dispersion à 50 °C", "Pendant la pesée", "Pendant le refroidissement"], ["أثناء النثر في 50 درجة", "أثناء الوزن", "أثناء التبريد"]], "a": 2, "w": ["Le gel prend au refroidissement : c'est pourquoi on ne secoue pas les pots.", "الهلام يتكوّن عند التبريد: لذلك لا نهزّ العلب."], "g": [20]}, {"img": "l18_13", "t": ["Les défauts du dessert lacté", "عيوب الحلوى اللبنية"], "st": [["Décalottage (exsudation de sérum) : extrait sec trop faible (amidon ou poudre), défaut d'homogénéisation ou refroidissement mal conduit.", "Points noirs : contamination par des levures ou des moisissures.", "Goût de cuit : traitement thermique trop intense ou trop long.", "Réflexe de formulation : devant une synérèse, on augmente d'abord l'extrait sec avant de toucher au gélifiant. Trop de gélifiant donne une texture caoutchouteuse."], ["انفصال الطبقة العليا (décalottage) (خروج المصل): مادة جافة ضعيفة (نشا أو مسحوق)، أو خلل في التجنيس، أو تبريد سيئ.", "النقط السوداء: تلوث بالخمائر أو الأعفان.", "طعم الطهي: معالجة حرارية قوية جدًا أو طويلة جدًا.", "ردّ فعل التركيب: أمام انفصال المصل نرفع أولًا المادة الجافة قبل لمس المادة المهلّمة. فائض المهلّم يعطي قوامًا مطاطيًا."]], "k": ["Décalottage : on augmente d'abord l'extrait sec (poudre de lait ou amidon).", "انفصال الطبقة العليا: نرفع أولًا المادة الجافة (مسحوق الحليب أو النشا)."], "q": ["Des points noirs apparaissent sur un dessert. Quelle est la cause ?", "ظهرت نقط سوداء على حلوى. ما السبب؟"], "o": [["Un excès de gélifiant", "Des levures ou des moisissures", "Un extrait sec trop élevé"], ["فائض المادة المهلّمة", "خمائر أو أعفان", "مادة جافة مرتفعة جدًا"]], "a": 1, "w": ["Les points noirs viennent d'une contamination par des levures ou des moisissures.", "النقط السوداء ناتجة عن تلوث بالخمائر أو الأعفان."], "g": [16, 24, 25, 49]}, {"img": "l18_07", "t": ["Texturants, crème et formule", "المواد المكسبة للقوام والقشدة والوصفة"], "st": [["Épaississants : ils augmentent la viscosité (carraghénanes, caroube, guar, xanthane, amidon modifié). Gélifiants : ils forment un réseau qui emprisonne l'eau.", "Sucre et arômes portent le goût ; le sucre participe aussi à la texture. 2 à 10 % de poudre de lait augmentent la fermeté et la viscosité.", "La crème (30 à 40 % de MG) fixe les arômes et l'onctuosité ; elle s'incorpore dans un lait à 60 °C, à hauteur de 0 à 50 %.", "Une formule se choisit sur trois critères à la fois : texture, goût et coût matière. La texture se juge au test d'écoulement."], ["المكثّفات (épaississants): ترفع اللزوجة (الكاراجينان، الخرّوب، الغوار، الزانثان، النشا المعدّل). المهلّمات (gélifiants): تكوّن شبكة تحبس الماء.", "السكر والمنكّهات تعطي الطعم؛ والسكر يساهم أيضًا في القوام. 2 إلى 10 % من مسحوق الحليب ترفع التماسك واللزوجة.", "القشدة (30 إلى 40 % مادة دسمة) تثبّت النكهات والنعومة؛ تُضاف في حليب عند 60 درجة، بنسبة 0 إلى 50 %.", "تُختار الوصفة بثلاثة معايير معًا: القوام، الطعم وكلفة المواد. ويُقيَّم القوام باختبار السيلان (test d'écoulement)."]], "k": ["Une bonne formule équilibre texture, goût et coût matière.", "الوصفة الجيدة توازن بين القوام والطعم وكلفة المواد."], "q": ["Quel est le rôle d'un gélifiant ?", "ما دور المادة المهلّمة؟"], "o": [["Donner la consistance en formant un réseau qui emprisonne l'eau", "Fixer les arômes", "Acidifier le produit"], ["إعطاء التماسك بتكوين شبكة تحبس الماء", "تثبيت النكهات", "تحميض المنتوج"]], "a": 0, "w": ["Le gélifiant forme un réseau qui emprisonne l'eau et donne la consistance.", "المهلّم يكوّن شبكة تحبس الماء ويعطي التماسك."], "g": [24, 61]}, {"img": "l18_06", "t": ["Sécurité au poste du dessert lacté", "السلامة في مركز الحلوى اللبنية"], "st": [["Le produit n'est pas protégé par l'acidité : pH proche de 6,8, seuls le traitement thermique et l'hygiène garantissent sa conservation.", "À la cuisson, le mélange épaissit brutalement et peut projeter : agitation constante, gants thermiques.", "La casserole n'est jamais remplie à plus des deux tiers.", "Remplissage à chaud : attention aux brûlures. Refroidissement rapide et sans secousse."], ["المنتوج غير محمي بالحموضة: pH قريب من 6,8، والمعالجة الحرارية والنظافة وحدهما تضمنان حفظه.", "عند الطهي يتكثّف الخليط فجأة وقد يتطاير: تحريك مستمر وقفازات حرارية.", "لا تُملأ القِدر أبدًا بأكثر من الثلثين.", "التعبئة ساخنًا: انتبه للحروق. تبريد سريع ودون اهتزاز."]], "k": ["À la cuisson : agitation constante, gants thermiques, casserole remplie aux deux tiers au plus.", "عند الطهي: تحريك مستمر، قفازات حرارية، قِدر مملوءة بالثلثين على الأكثر."], "q": ["Pourquoi agiter en continu pendant la cuisson ?", "لماذا نحرّك باستمرار أثناء الطهي؟"], "o": [["Pour refroidir le mélange", "Parce que le mélange épaissit brutalement et peut projeter", "Pour acidifier le produit"], ["لتبريد الخليط", "لأن الخليط يتكثّف فجأة وقد يتطاير", "لتحميض المنتوج"]], "a": 1, "w": ["L'amidon épaissit d'un coup : sans agitation, le mélange accroche et projette.", "النشا يتكثّف دفعة واحدة: بدون تحريك يلتصق الخليط ويتطاير."], "g": [20]}], "since": "1.6"}, {"n": 19, "t": ["TP 7 — Fabrication du beurre", "الأعمال التطبيقية 7 — صناعة الزبدة"], "c": [{"img": "l19_08", "t": ["Le beurre au sens réglementaire", "الزبدة حسب التنظيم"], "st": [["Produit obtenu exclusivement par barattage du lait, de la crème ou de leur mélange, ou du petit-lait (et de sa partie riche en graisse).", "Seuils : au minimum 82 % de matière grasse, au maximum 18 % de matière non grasse et au maximum 16 % d'eau.", "Beurre acide : crème maturée par des ferments. Beurre doux : non acide, sans maturation biologique (emballage bleu).", "Barattage = inversion de l'émulsion : la matière grasse dispersée dans l'eau devient de l'eau dispersée dans la matière grasse."], ["منتوج يُحصل عليه حصريًا بخضّ (barattage) الحليب أو القشدة أو خليطهما، أو مصل الجبن (petit-lait) وجزئه الغني بالدهون.", "الحدود: 82 % مادة دسمة على الأقل، 18 % مادة غير دسمة على الأكثر، و16 % ماء على الأكثر.", "الزبدة الحامضة: قشدة منضَّجة بالخمائر. الزبدة الحلوة: غير حامضة، بدون إنضاج بيولوجي (تغليف أزرق).", "الخض = قلب المستحلب (émulsion): الدهن المنتشر في الماء يصبح ماءً منتشرًا في الدهن."]], "k": ["Beurre : au moins 82 % de MG et au plus 16 % d'eau.", "الزبدة: 82 % مادة دسمة على الأقل و16 % ماء على الأكثر."], "q": ["Quelle est la teneur minimale en matière grasse d'un beurre ?", "ما الحد الأدنى للمادة الدسمة في الزبدة؟"], "o": [["72 %", "82 %", "92 %"], ["72 %", "82 %", "92 %"]], "a": 1, "w": ["82 % de MG est le seuil réglementaire : en dessous, ce n'est plus du beurre.", "82 % مادة دسمة هو الحد التنظيمي: تحته لم يعد المنتوج زبدة."], "g": [4]}, {"img": "l19_10", "t": ["Les 6 étapes du beurre", "المراحل الست لصناعة الزبدة"], "st": [["Normaliser la crème, généralement entre 35 et 40 % de MG.", "Maturer : physique (refroidissement contrôlé qui cristallise la MG) et, pour le beurre acide, biologique (ferments).", "Baratter : remplissage 40–50 %, crème à 14 °C, pH 4,5 et environ 30 °D (beurre acide), 20 à 30 tours/min pendant 30 à 60 min.", "Arrêter quand les grains font 2 à 5 mm.", "Soutirer et peser le babeurre, laver les grains avec 1,25 fois son volume d'eau à 5 °C.", "Malaxer pour souder les grains et répartir l'eau, saler éventuellement, mettre en forme et conditionner."], ["تسوية القشدة، عادة بين 35 و40 % مادة دسمة.", "الإنضاج: فيزيائي (تبريد مضبوط يبلور الدهن) وبيولوجي بالخمائر للزبدة الحامضة.", "الخض: ملء 40–50 %، قشدة في 14 درجة، pH 4,5 وحوالي 30 درجة دورنيك (°D) للزبدة الحامضة، 20 إلى 30 دورة/دقيقة لمدة 30 إلى 60 دقيقة.", "التوقف عندما تبلغ الحبيبات 2 إلى 5 مم.", "سحب اللبن المخيض (babeurre) ووزنه، وغسل الحبيبات بماء في 5 درجات حجمه 1,25 مرة حجم اللبن المخيض.", "العجن (malaxage) للحام الحبيبات وتوزيع الماء، التمليح عند الحاجة، التشكيل والتعبئة."]], "k": ["Repère industriel : 20 L de lait → environ 2 kg de crème → environ 1 kg de beurre.", "مرجع صناعي: 20 لترًا من الحليب ← حوالي 2 كغ من القشدة ← حوالي 1 كغ من الزبدة."], "q": ["À quelle température la crème est-elle barattée ?", "في أي درجة حرارة تُخضّ القشدة؟"], "o": [["5 °C", "14 °C", "43 °C"], ["5 درجات", "14 درجة", "43 درجة"]], "a": 1, "w": ["La crème est barattée à 14 °C ; l'eau de lavage, elle, est à 5 °C.", "تُخضّ القشدة في 14 درجة؛ أما ماء الغسل ففي 5 درجات."], "sn": ["1", "2", "3", "4", "5", "6"], "g": [3, 4, 11, 12, 31]}, {"img": "l19_06", "t": ["La baratte : sécurité et remplissage", "المخضّة: السلامة والملء"], "st": [["Aucune ouverture ni main dans la baratte pendant la rotation : l'arrêt complet est vérifié avant toute intervention.", "Remplissage à 40–50 % du volume : trop pleine, la baratte ne baratte pas ; trop vide, elle projette.", "Chaîne du froid : crème et eau de lavage froides, on travaille vite car le beurre se ramollit à température ambiante.", "Le beurre est un produit gras peu acide : tout résidu sur le matériel devient un défaut de goût."], ["لا فتح ولا يد داخل المخضّة (baratte) أثناء الدوران: يُتحقق من التوقف التام قبل أي تدخل.", "الملء بين 40 و50 % من الحجم: إذا امتلأت كثيرًا لا تخضّ؛ وإذا كانت فارغة جدًا تتطاير.", "سلسلة التبريد: القشدة وماء الغسل باردان، ونعمل بسرعة لأن الزبدة تلين في حرارة الغرفة.", "الزبدة منتوج دهني قليل الحموضة: أي بقايا على الأدوات تصبح عيبًا في الطعم."]], "k": ["Baratte remplie à 40–50 % : ni trop pleine, ni trop vide.", "المخضّة تُملأ بين 40 و50 %: لا ممتلئة جدًا ولا فارغة جدًا."], "q": ["Que se passe-t-il si la baratte est trop pleine ?", "ماذا يحدث إذا كانت المخضّة ممتلئة جدًا؟"], "o": [["Elle projette", "Le beurre fond", "Elle ne baratte pas"], ["تتطاير", "تذوب الزبدة", "لا تخضّ"]], "a": 2, "w": ["Trop pleine, la baratte ne baratte pas ; c'est trop vide qu'elle projette.", "الممتلئة جدًا لا تخضّ؛ أما الفارغة جدًا فهي التي تتطاير."], "g": [4, 20]}, {"img": "l19_11", "t": ["La formation des grains", "تكوّن الحبيبات"], "st": [["Le choc mécanique rompt la membrane des globules gras ; les globules s'agglomèrent en grains.", "Le barattage s'arrête quand les grains atteignent 2 à 5 mm : c'est le point de contrôle visuel.", "L'arrêt se juge sur la taille des grains, pas au hasard ni au chronomètre seul.", "Un barattage trop long donne un beurre gras et collant, difficile à malaxer ; trop court, la MG reste dans le babeurre."], ["الصدمة الميكانيكية تكسر غشاء الكريات الدهنية؛ فتتجمّع الكريات في حبيبات.", "يتوقف الخض عندما تبلغ الحبيبات 2 إلى 5 مم: إنها نقطة المراقبة بالعين.", "يُحكم على التوقف بحجم الحبيبات، لا عشوائيًا ولا بالميقاتية وحدها.", "الخض الطويل جدًا يعطي زبدة دهنية لزجة صعبة العجن؛ والقصير جدًا يترك المادة الدسمة في اللبن المخيض."]], "k": ["On arrête le barattage aux grains de 2 à 5 mm.", "نوقف الخض عند حبيبات من 2 إلى 5 مم."], "q": ["Quelle taille de grains marque l'arrêt du barattage ?", "ما حجم الحبيبات الذي يحدد توقف الخض؟"], "o": [["2 à 5 mm", "0,5 mm", "2 cm"], ["2 إلى 5 مم", "0,5 مم", "2 سم"]], "a": 0, "w": ["Grains de 2 à 5 mm : c'est le point de contrôle visuel du barattage.", "حبيبات من 2 إلى 5 مم: نقطة المراقبة بالعين للخض."], "g": [3, 4, 20, 23, 31]}, {"img": "l19_18", "t": ["Lavage et malaxage", "الغسل والعجن"], "st": [["Le babeurre est soutiré puis pesé, jamais jeté sans pesée.", "Les grains sont lavés avec une eau à 5 °C, à raison de 1,25 fois le volume de babeurre, pour éliminer ses traces.", "Le malaxage soude les grains et répartit l'eau ; on sale éventuellement puis on met en forme.", "Un beurre trop humide (plus de 16 % d'eau) vient d'un malaxage insuffisant ou d'un lavage mal égoutté. On le contrôle par étuvage d'un échantillon."], ["يُسحب اللبن المخيض ثم يوزن، ولا يُرمى أبدًا دون وزن.", "تُغسل الحبيبات بماء في 5 درجات، بحجم 1,25 مرة حجم اللبن المخيض، لإزالة آثاره.", "العجن يلحم الحبيبات ويوزّع الماء؛ نملّح عند الحاجة ثم نشكّل.", "الزبدة الرطبة جدًا (أكثر من 16 % ماء) سببها عجن غير كافٍ أو غسل سيئ التصفية. نراقبها بتجفيف عيّنة في الحاضنة (étuvage)."]], "k": ["Eau de lavage = 1,25 × le babeurre, à 5 °C.", "ماء الغسل = 1,25 × اللبن المخيض، في 5 درجات."], "q": ["D'où vient un beurre trop humide ?", "من أين تأتي الزبدة الرطبة جدًا؟"], "o": [["D'une crème trop grasse", "D'un malaxage insuffisant ou d'un lavage mal égoutté", "D'un barattage trop long"], ["من قشدة دسمة جدًا", "من عجن غير كافٍ أو غسل سيئ التصفية", "من خض طويل جدًا"]], "a": 1, "w": ["Le malaxage répartit et chasse l'eau : insuffisant, il laisse un beurre trop humide.", "العجن يوزّع الماء ويطرده: إذا كان غير كافٍ تبقى الزبدة رطبة جدًا."], "g": [3, 20, 31, 62]}, {"img": "l19_13", "t": ["Où part le rendement ?", "أين يضيع المردود؟"], "st": [["Barattage trop court : la MG reste dispersée dans le babeurre. Crème trop chaude : grains mous, mal formés, pertes au soutirage.", "Soutirage précipité : des grains partent avec le babeurre. Lavage trop chaud : le beurre fond et passe dans l'eau de lavage.", "Beurre resté au matériel : parois de la baratte, malaxeur, spatules.", "Mesure qui tranche : doser la MG du babeurre par la méthode Gerber. Plus de 0,5 % de MG signale un barattage mal conduit."], ["خض قصير جدًا: تبقى المادة الدسمة منتشرة في اللبن المخيض. قشدة ساخنة جدًا: حبيبات رخوة سيئة التكوين وخسائر عند السحب.", "سحب متسرّع: تذهب حبيبات مع اللبن المخيض. غسل ساخن جدًا: تذوب الزبدة وتمر في ماء الغسل.", "زبدة باقية على الأدوات: جدران المخضّة، العجّانة، الملاعق.", "القياس الحاسم: معايرة المادة الدسمة في اللبن المخيض بطريقة جربر (Gerber). أكثر من 0,5 % يدل على خض سيئ."]], "k": ["En beurrerie, le rendement se gagne au geste, pas à la matière.", "في صناعة الزبدة، يُربح المردود بالحركة لا بالمادة."], "q": ["Un babeurre dosé à plus de 0,5 % de MG signale :", "لبن مخيض بأكثر من 0,5 % مادة دسمة يدل على:"], "o": [["Un beurre trop salé", "Un barattage mal conduit", "Une eau de lavage trop froide"], ["زبدة مالحة جدًا", "خض سيئ", "ماء غسل بارد جدًا"]], "a": 1, "w": ["Au-delà de 0,5 % de MG dans le babeurre, le barattage a été mal conduit.", "فوق 0,5 % من المادة الدسمة في اللبن المخيض، كان الخض سيئًا."], "g": [3, 4, 35, 41]}, {"img": "l19_15", "t": ["Le bilan matière du beurre", "الحصيلة المادية للزبدة"], "st": [["MG totale = masse de crème × taux de MG. Beurre théorique = MG totale ÷ 0,82.", "Babeurre = crème − beurre théorique. Pertes de MG ≈ 0,3 % du babeurre. Eau de lavage = 1,25 × babeurre.", "Exemple : 120 kg de crème à 40 % → 48 kg de MG → 58,54 kg de beurre théorique → 61,46 kg de babeurre.", "Pertes 0,18 kg → beurre réel ≈ 58,3 kg → rendement ≈ 48,6 % ; eau de lavage ≈ 76,8 L à 5 °C."], ["المادة الدسمة الكلية = كتلة القشدة × نسبة المادة الدسمة. الزبدة النظرية = المادة الدسمة الكلية ÷ 0,82.", "اللبن المخيض = القشدة − الزبدة النظرية. خسائر المادة الدسمة ≈ 0,3 % من اللبن المخيض. ماء الغسل = 1,25 × اللبن المخيض.", "مثال: 120 كغ قشدة بـ 40 % ← 48 كغ مادة دسمة ← 58,54 كغ زبدة نظرية ← 61,46 كغ لبن مخيض.", "الخسائر 0,18 كغ ← زبدة حقيقية ≈ 58,3 كغ ← مردود ≈ 48,6 %؛ ماء الغسل ≈ 76,8 لترًا في 5 درجات."]], "k": ["Beurre théorique = MG totale ÷ 0,82 (le beurre contient 82 % de MG).", "الزبدة النظرية = المادة الدسمة الكلية ÷ 0,82 (الزبدة تحتوي 82 % مادة دسمة)."], "q": ["Avec 48 kg de MG, combien de beurre théorique obtient-on ?", "بـ 48 كغ من المادة الدسمة، كم نحصل من الزبدة النظرية؟"], "o": [["39,4 kg", "48 kg", "58,54 kg"], ["39,4 كغ", "48 كغ", "58,54 كغ"]], "a": 2, "w": ["48 ÷ 0,82 = 58,54 kg : on divise, car le beurre n'est pas 100 % gras.", "48 ÷ 0,82 = 58,54 كغ: نقسم لأن الزبدة ليست دهنًا بنسبة 100 %."], "g": [3, 41]}, {"img": "l19_14", "t": ["Refaire le calcul : 200 kg à 38 %", "إعادة الحساب: 200 كغ بـ 38 %"], "st": [["MG totale : 200 × 0,38 = 76 kg.", "Beurre théorique : 76 ÷ 0,82 ≈ 92,7 kg. Babeurre : 200 − 92,7 ≈ 107,3 kg.", "Pertes : 0,003 × 107,3 ≈ 0,32 kg de MG.", "Rendement = beurre obtenu ÷ crème × 100 ≈ 46 %."], ["المادة الدسمة الكلية: 200 × 0,38 = 76 كغ.", "الزبدة النظرية: 76 ÷ 0,82 ≈ 92,7 كغ. اللبن المخيض: 200 − 92,7 ≈ 107,3 كغ.", "الخسائر: 0,003 × 107,3 ≈ 0,32 كغ من المادة الدسمة.", "المردود = الزبدة المحصّلة ÷ القشدة × 100 ≈ 46 %."]], "k": ["Rendement (%) = masse de beurre obtenu ÷ masse de crème × 100.", "المردود (%) = كتلة الزبدة المحصّلة ÷ كتلة القشدة × 100."], "q": ["Pour 200 kg de crème à 38 %, quelle est la masse de babeurre ?", "لـ 200 كغ من القشدة بـ 38 %، ما كتلة اللبن المخيض؟"], "o": [["76 kg", "Environ 107,3 kg", "Environ 92,7 kg"], ["76 كغ", "حوالي 107,3 كغ", "حوالي 92,7 كغ"]], "a": 1, "w": ["Babeurre = crème − beurre théorique = 200 − 92,7 ≈ 107,3 kg.", "اللبن المخيض = القشدة − الزبدة النظرية = 200 − 92,7 ≈ 107,3 كغ."], "g": [3, 41]}], "since": "1.6"}, {"n": 20, "t": ["TP 8 — Fabrication d'un fromage frais", "الأعمال التطبيقية 8 — صناعة جبن طري"], "c": [{"img": "l20_08", "t": ["Qu'est-ce qu'un fromage frais ?", "ما هو الجبن الطري؟"], "st": [["« Fromage blanc » : fromage non affiné qui, lorsqu'il est fermenté, a subi une fermentation principalement lactique.", "Valeurs : pH 4,6 · humidité d'au moins 70 % · gras sur sec de 40 à 60 % · extrait sec de 20 à 30 %.", "Coagulation lactique : ce sont les ferments qui font le caillé, la présure n'est qu'un appoint. Sans affinage : ni flore d'affinage, ni croûte.", "Pâtes fraîches : fromage blanc, petit-suisse (fromage frais lissé, enrichi en crème), demi-sel."], ["«الجبن الأبيض» (fromage blanc): جبن غير معتّق خضع، عند تخميره، لتخمّر لبني أساسًا.", "القيم: pH 4,6 · رطوبة 70 % على الأقل · دسم على المادة الجافة من 40 إلى 60 % · مادة جافة من 20 إلى 30 %.", "تخثّر لبني (coagulation lactique): الخمائر هي التي تصنع الخثارة، والمنفحة (présure) مجرد مساعد. بدون تعتيق: لا فلورا تعتيق ولا قشرة.", "العجائن الطرية: الجبن الأبيض، البوتي سويس (جبن طري ناعم مُغنى بالقشدة)، ونصف المالح."]], "k": ["Fromage frais : coagulation surtout lactique, pas d'affinage, 70 % d'eau ou plus.", "الجبن الطري: تخثّر لبني أساسًا، بدون تعتيق، 70 % ماء أو أكثر."], "q": ["Dans un fromage frais, qui fait surtout le caillé ?", "في الجبن الطري، من يصنع الخثارة أساسًا؟"], "o": [["La présure", "Les ferments lactiques", "La chaleur"], ["المنفحة", "الخمائر اللبنية", "الحرارة"]], "a": 1, "w": ["La coagulation est majoritairement lactique : la présure n'est qu'un appoint.", "التخثّر لبني أساسًا: المنفحة مجرد مساعد."], "g": [0, 6, 20, 40]}, {"img": "l20_10", "t": ["Les 6 étapes du fromage frais", "المراحل الست للجبن الطري"], "st": [["Homogénéiser et pasteuriser à 85 °C pendant 2 min, barème plus poussé que pour un lait de consommation.", "Refroidir à 20–28 °C et ensemencer en ferments mésophiles (optimum 20–30 °C).", "Emprésurer légèrement : 1 à 20 mL de présure pour 100 L.", "Coaguler 16 à 24 h à 20–28 °C, sans agitation, jusqu'à pH 4,6.", "Égoutter : lent en toile ou en moule, ou rapide par centrifugation ou ultrafiltration puis lissage.", "Saler à 1 à 2 %, en surface ou dans la masse, conditionner en pots et mettre au froid (0 à 4 °C)."], ["التجنيس والبسترة في 85 درجة لمدة 2 دقيقة، وهو برنامج أقوى من حليب الاستهلاك.", "التبريد إلى 20–28 درجة والزرع بخمائر محبة للاعتدال (mésophiles) (الأمثل 20–30 درجة).", "تنفيح خفيف: 1 إلى 20 مل من المنفحة لكل 100 لتر.", "التخثير 16 إلى 24 ساعة في 20–28 درجة دون تحريك حتى pH 4,6.", "التصفية (égouttage): بطيئة في قماش أو قالب، أو سريعة بالطرد المركزي أو الترشيح الفائق ثم التنعيم.", "التمليح بـ 1 إلى 2 %، على السطح أو في الكتلة، ثم التعبئة في علب ووضعها في البرودة (0 إلى 4 درجات)."]], "k": ["Paramètres : 85 °C / 2 min · 20–28 °C · 16 à 24 h · pH 4,6 · sel 1 à 2 %.", "المعايير: 85 درجة / 2 دقيقة · 20–28 درجة · 16 إلى 24 ساعة · pH 4,6 · ملح 1 إلى 2 %."], "q": ["Combien de temps dure la coagulation d'un fromage frais ?", "كم تدوم مدة تخثير الجبن الطري؟"], "o": [["45 à 50 minutes", "3 à 4 heures", "16 à 24 heures"], ["45 إلى 50 دقيقة", "3 إلى 4 ساعات", "16 إلى 24 ساعة"]], "a": 2, "w": ["La coagulation lactique est lente : 16 à 24 h à 20–28 °C.", "التخثّر اللبني بطيء: 16 إلى 24 ساعة في 20–28 درجة."], "sn": ["1", "2", "3", "4", "5", "6"], "g": [40, 60]}, {"img": "l20_06", "t": ["Caillé, présure, sérum : les règles", "الخثارة والمنفحة والمصل: القواعد"], "st": [["Un caillé frais n'est ni chauffé ni affiné : rien ne rattrape une contamination. Matériel stérilisé, mains désinfectées.", "La présure est conservée au froid, à l'abri de la lumière, et dosée à la pipette ; mal conservée, elle perd sa force.", "Le sérum est récupéré et pesé, jamais jeté avant pesée : c'est la moitié du bilan matière.", "Le fromage frais se conserve entre 0 et 4 °C : les pots partent au froid dès le conditionnement."], ["الخثارة (caillé) الطرية لا تُسخّن ولا تُعتّق: لا شيء يصلح التلوث. أدوات معقّمة وأيدٍ مطهّرة.", "تُحفظ المنفحة في البرودة بعيدًا عن الضوء وتُقاس بالماصة؛ وإذا حُفظت بشكل سيئ فقدت قوتها.", "يُجمع المصل (sérum) ويوزن، ولا يُرمى أبدًا قبل الوزن: إنه نصف الحصيلة المادية.", "يُحفظ الجبن الطري بين 0 و4 درجات: تذهب العلب إلى البرودة فور التعبئة."]], "k": ["Le sérum se pèse avant d'être jeté : c'est la moitié du bilan matière.", "المصل يوزن قبل رميه: إنه نصف الحصيلة المادية."], "q": ["Pourquoi l'hygiène est-elle si critique pour un fromage frais ?", "لماذا النظافة حاسمة جدًا في الجبن الطري؟"], "o": [["Parce qu'il n'est ni chauffé ni affiné après caillage", "Parce qu'il est très salé", "Parce qu'il est stérilisé"], ["لأنه لا يُسخّن ولا يُعتّق بعد التخثّر", "لأنه مالح جدًا", "لأنه معقّم"]], "a": 0, "w": ["Après le caillage, aucune étape ne détruit les germes : rien ne rattrape une contamination.", "بعد التخثّر لا توجد مرحلة تقتل الجراثيم: لا شيء يصلح التلوث."], "g": [0, 6, 20, 40]}, {"img": "l20_15", "t": ["L'égouttage en toile", "التصفية في القماش"], "st": [["Égouttage traditionnel lent : caillé en toile suspendue ou en moule, avec retournements.", "Le sérum est pesé toutes les trente minutes pour tracer la courbe d'égouttage.", "Les deux modes d'égouttage divergent nettement dès la première heure.", "En fin d'égouttage : pesée du caillé et mesure de l'extrait sec par étuvage."], ["التصفية التقليدية البطيئة: الخثارة في قماش معلّق أو في قالب، مع التقليب.", "يوزن المصل كل ثلاثين دقيقة لرسم منحنى التصفية.", "طريقتا التصفية تختلفان بوضوح منذ الساعة الأولى.", "في نهاية التصفية: وزن الخثارة وقياس المادة الجافة بالتجفيف في الحاضنة."]], "k": ["L'égouttage se suit en pesant le sérum à intervalles réguliers.", "تُتابع التصفية بوزن المصل في فترات منتظمة."], "q": ["Que se passe-t-il si on prolonge l'égouttage ?", "ماذا يحدث إذا مدّدنا التصفية؟"], "o": [["Le rendement augmente", "Le rendement baisse et l'extrait sec augmente", "Rien ne change"], ["يرتفع المردود", "ينخفض المردود وترتفع المادة الجافة", "لا شيء يتغير"]], "a": 1, "w": ["Chaque heure d'égouttage retire de l'eau, donc de la masse : moins de rendement, plus d'EST.", "كل ساعة تصفية تُزيل ماءً، أي كتلة: مردود أقل ومادة جافة أكثر."], "g": [6, 20, 60, 62]}, {"img": "l20_12", "t": ["Ce qui décide du rendement fromager", "ما يحدد المردود الجبني"], "st": [["Le taux de caséine : c'est lui, pas la matière grasse, qui fait le fromage.", "Le pH au décaillage : trop bas, le caillé se déminéralise et s'égoutte trop.", "La finesse du découpage : plus le grain est fin, plus le sérum part. La durée d'égouttage : chaque heure retire de l'eau.", "Les pertes de fines : des particules de caillé partent avec le sérum."], ["نسبة الكازيين (caséine): هو الذي يصنع الجبن، لا المادة الدسمة.", "pH عند تقطيع الخثارة (décaillage): إذا كان منخفضًا جدًا تفقد الخثارة معادنها وتتصفّى أكثر من اللازم.", "دقة التقطيع: كلما كانت الحبيبة أدق خرج مصل أكثر. مدة التصفية: كل ساعة تُزيل ماءً.", "خسائر الدقائق (fines): جزيئات من الخثارة تذهب مع المصل."]], "k": ["Le rendement fromager dépend surtout du taux de caséine.", "المردود الجبني يرتبط أساسًا بنسبة الكازيين."], "q": ["Quel constituant du lait fait surtout le fromage ?", "أي مكوّن في الحليب يصنع الجبن أساسًا؟"], "o": [["La caséine", "La matière grasse", "Le lactose"], ["الكازيين", "المادة الدسمة", "اللاكتوز"]], "a": 0, "w": ["C'est la caséine qui forme le caillé : un lait riche en caséines donne plus de fromage.", "الكازيين هو الذي يكوّن الخثارة: الحليب الغني بالكازيين يعطي جبنًا أكثر."], "g": [6, 15, 20, 41, 42, 60]}, {"img": "l20_27", "t": ["Calculer le rendement fromager", "حساب المردود الجبني"], "st": [["Rendement = masse de fromage obtenu ÷ volume de lait mis en œuvre.", "Il s'exprime en kg de fromage pour 100 litres de lait.", "Pour un fromage frais très humide, il est élevé : de l'ordre de 15 à 20 kg pour 100 L.", "Un rendement doit toujours être donné avec son unité."], ["المردود = كتلة الجبن المحصّل ÷ حجم الحليب المستعمل.", "يُعبَّر عنه بالكيلوغرام من الجبن لكل 100 لتر من الحليب.", "في الجبن الطري الرطب جدًا يكون مرتفعًا: حوالي 15 إلى 20 كغ لكل 100 لتر.", "يجب دائمًا إعطاء المردود مع وحدته."]], "k": ["Rendement fromager en kg pour 100 L ; fromage frais : environ 15 à 20 kg/100 L.", "المردود الجبني بالكيلوغرام لكل 100 لتر؛ الجبن الطري: حوالي 15 إلى 20 كغ/100 لتر."], "q": ["En quelle unité exprime-t-on le rendement fromager ?", "بأي وحدة يُعبَّر عن المردود الجبني؟"], "o": [["En % de MG", "En kg de fromage pour 100 L de lait", "En °D"], ["بنسبة المادة الدسمة", "بالكيلوغرام من الجبن لكل 100 لتر من الحليب", "بدرجة دورنيك"]], "a": 1, "w": ["Le cours exprime le rendement fromager en kg de fromage pour 100 L de lait.", "الدرس يعبّر عن المردود الجبني بالكيلوغرام من الجبن لكل 100 لتر من الحليب."], "g": [20, 41, 42]}, {"img": "l20_11", "t": ["Égouttage lent ou rapide ?", "تصفية بطيئة أم سريعة؟"], "st": [["Fromages de campagne : égouttage lent en toile ou en moule, texture granuleuse.", "Fromages lissés : égouttage rapide par centrifugation ou ultrafiltration, puis lissage, texture lisse.", "Compromis : plus de rendement mais un produit plus humide, ou moins de rendement mais une meilleure tenue.", "Un rendement élevé n'est pas toujours le bon choix : tout dépend de la texture recherchée."], ["أجبان الريف: تصفية بطيئة في قماش أو قالب، وقوام محبّب.", "الأجبان الناعمة: تصفية سريعة بالطرد المركزي (centrifugation) أو الترشيح الفائق (ultrafiltration) ثم التنعيم، وقوام ناعم.", "حل وسط: مردود أكبر لكن منتوج أرطب، أو مردود أقل لكن تماسك أفضل.", "المردود المرتفع ليس دائمًا الخيار الصحيح: كل شيء يتوقف على القوام المطلوب."]], "k": ["Égouttage lent → texture granuleuse ; rapide puis lissage → texture lisse.", "تصفية بطيئة ← قوام محبّب؛ سريعة ثم تنعيم ← قوام ناعم."], "q": ["Quelle texture donne un égouttage lent en toile ?", "ما القوام الذي تعطيه التصفية البطيئة في القماش؟"], "o": [["Lisse", "Caoutchouteuse", "Granuleuse"], ["ناعم", "مطاطي", "محبّب"]], "a": 2, "w": ["L'égouttage lent donne une texture granuleuse ; l'égouttage rapide suivi d'un lissage, une texture lisse.", "التصفية البطيئة تعطي قوامًا محبّبًا؛ والسريعة مع التنعيم قوامًا ناعمًا."], "g": [20, 41, 60]}], "since": "1.6"}, {"n": 21, "t": ["TP 9 — Fromage à pâte molle", "الأعمال التطبيقية 9 — جبن ذو عجينة طرية"], "c": [{"img": "l21_07", "t": ["Qu'est-ce qu'une pâte molle ?", "ما هي العجينة الطرية؟"], "st": [["Fromages affinés dont la pâte n'est ni pressée ni cuite.", "Élaborés à partir de lait de vache, ou de crème, cru ou pasteurisé, plus ou moins écrémé.", "Gamme de 20 à 75 % de gras sur sec, avec un extrait sec de 40 à 50 %.", "Ni pressée, ni cuite : la pâte molle garde son eau, et c'est l'affinage qui fait le produit."], ["أجبان معتّقة (affinés) عجينتها غير مضغوطة وغير مطبوخة.", "تُصنع من حليب البقر أو من القشدة، نيئًا أو مبسترًا، منزوع الدسم جزئيًا بدرجات مختلفة.", "نطاق من 20 إلى 75 % من الدسم على المادة الجافة، مع مادة جافة من 40 إلى 50 %.", "غير مضغوطة وغير مطبوخة: العجينة الطرية تحتفظ بمائها، والتعتيق هو الذي يصنع المنتوج."]], "k": ["Pâte molle : ni pressée ni cuite, affinée, extrait sec de 40 à 50 %.", "العجينة الطرية: غير مضغوطة وغير مطبوخة، معتّقة، مادة جافة من 40 إلى 50 %."], "q": ["Une pâte molle est une pâte :", "العجينة الطرية هي عجينة:"], "o": [["pressée et cuite", "ni pressée ni cuite", "pressée non cuite"], ["مضغوطة ومطبوخة", "غير مضغوطة وغير مطبوخة", "مضغوطة غير مطبوخة"]], "a": 1, "w": ["La pâte molle n'est ni pressée ni cuite : elle garde son eau.", "العجينة الطرية غير مضغوطة وغير مطبوخة: تحتفظ بمائها."], "g": [0, 20, 58]}, {"img": "l21_08", "t": ["Quatre types d'affinage", "أربعة أنواع من التعتيق"], "st": [["Sans croûte : la feta, conservée en saumure, sans flore de surface.", "Croûte fleurie : le camembert, avec Penicillium camemberti en surface ; plus de 50 % d'eau, pH ≤ 4,5, DLC de 30 jours à 4 °C.", "Croûte lavée : le maroilles, lavé à l'eau salée ; affinage de 5 à 7 semaines avec lavages fréquents.", "Bleus : le roquefort, à Penicillium roqueforti."], ["بدون قشرة: الفيتا (feta)، تُحفظ في محلول ملحي (saumure)، بدون فلورا سطحية.", "قشرة مزهرة: الكاممبير، مع Penicillium camemberti على السطح؛ أكثر من 50 % ماء، pH ≤ 4,5، مدة صلاحية 30 يومًا في 4 درجات.", "قشرة مغسولة: الماروال، يُغسل بالماء المالح؛ تعتيق من 5 إلى 7 أسابيع مع غسل متكرر.", "الأجبان الزرقاء: الروكفور، بـ Penicillium roqueforti."]], "k": ["Sans croûte, croûte fleurie, croûte lavée, bleus : c'est l'affinage qui distingue les pâtes molles.", "بدون قشرة، قشرة مزهرة، قشرة مغسولة، زرقاء: التعتيق هو الذي يميّز العجائن الطرية."], "q": ["Quel fromage est une pâte molle sans croûte, conservée en saumure ?", "أي جبن ذو عجينة طرية بدون قشرة ويُحفظ في محلول ملحي؟"], "o": [["Le camembert", "Le roquefort", "La feta"], ["الكاممبير", "الروكفور", "الفيتا"]], "a": 2, "w": ["La feta n'a pas de flore de surface : elle est conservée en saumure.", "الفيتا بدون فلورا سطحية: تُحفظ في محلول ملحي."], "g": [0, 20, 46]}, {"img": "l21_10", "t": ["Les 6 étapes de la feta", "المراحل الست للفيتا"], "st": [["Maturer le lait avec des ferments jusqu'à l'acidité de départ voulue.", "Emprésurer à 32–34 °C ; caillage de 45 à 50 min jusqu'à un caillé ferme.", "Découper en grains réguliers et brasser doucement.", "Mouler sans pressage ; égoutter 18 à 24 h à 16–18 °C avec retournements réguliers.", "Démouler, découper, saler à sec puis en saumure 1 à 2 jours : sel final d'environ 3 %.", "Affiner en cave à 16–18 °C pendant 10 à 15 jours : le pH atteint alors 4,60."], ["إنضاج الحليب بالخمائر حتى الحموضة الأولية المطلوبة.", "التنفيح في 32–34 درجة؛ تخثّر من 45 إلى 50 دقيقة حتى خثارة صلبة.", "التقطيع إلى حبيبات منتظمة والتحريك بلطف.", "القولبة دون ضغط؛ التصفية 18 إلى 24 ساعة في 16–18 درجة مع تقليب منتظم.", "إخراج من القالب، تقطيع، تمليح جاف ثم في محلول ملحي 1 إلى 2 يوم: ملح نهائي حوالي 3 %.", "التعتيق في الكهف (cave) في 16–18 درجة لمدة 10 إلى 15 يومًا: يبلغ pH حينها 4,60."]], "k": ["Feta : présure à 32–34 °C · caillage 45–50 min · égouttage 18–24 h à 16–18 °C · sel ≈ 3 %.", "الفيتا: منفحة في 32–34 درجة · تخثّر 45–50 دقيقة · تصفية 18–24 ساعة في 16–18 درجة · ملح ≈ 3 %."], "q": ["À quelle température emprésure-t-on la feta ?", "في أي حرارة تُنفّح الفيتا؟"], "o": [["20–22 °C", "32–34 °C", "45–50 °C"], ["20–22 درجة", "32–34 درجة", "45–50 درجة"]], "a": 1, "w": ["L'emprésurage de la feta se fait à 32–34 °C, caillage de 45 à 50 minutes.", "تنفيح الفيتا يتم في 32–34 درجة، مع تخثّر من 45 إلى 50 دقيقة."], "sn": ["1", "2", "3", "4", "5", "6"], "g": [6, 40, 46, 60]}, {"img": "l21_12", "t": ["Du décaillage au démoulage", "من تقطيع الخثارة إلى إخراجها من القالب"], "st": [["Point de décaillage : trop tôt, perte de fines ; trop tard, caillé trop ferme. Test au doigt ou au couteau : le caillé doit se casser net, sans coller.", "Taille des grains régulière : c'est elle qui donne un égouttage homogène.", "Brassage doux et continu, jamais brutal : un brassage brutal casse les grains et libère des fines qui partent en sérum.", "Retournements réguliers, sinon le fromage s'égoutte de travers."], ["نقطة التقطيع (décaillage): مبكرًا جدًا، ضياع الدقائق؛ متأخرًا جدًا، خثارة صلبة جدًا. اختبار بالإصبع أو السكين: يجب أن تنكسر الخثارة بشكل نظيف دون التصاق.", "حجم حبيبات منتظم: هو الذي يعطي تصفية متجانسة.", "تحريك لطيف ومستمر، لا عنيف أبدًا: التحريك العنيف يكسر الحبيبات ويحرّر دقائق تذهب مع المصل.", "تقليب منتظم، وإلا تتصفّى الجبنة بشكل مائل."]], "k": ["Sur une pâte molle, la qualité se joue entre le décaillage et le démoulage.", "في العجينة الطرية، تُحسم الجودة بين التقطيع والإخراج من القالب."], "q": ["Que provoque un brassage brutal du caillé ?", "ماذا يسبب التحريك العنيف للخثارة؟"], "o": [["Il casse les grains et libère des fines", "Il augmente le rendement", "Il accélère l'affinage"], ["يكسر الحبيبات ويحرّر الدقائق", "يرفع المردود", "يسرّع التعتيق"]], "a": 0, "w": ["Les grains cassés libèrent des fines qui partent avec le sérum : c'est une perte.", "الحبيبات المكسورة تحرّر دقائق تذهب مع المصل: إنها خسارة."], "g": [6, 15, 20, 60]}, {"img": "l21_11", "t": ["Le rôle du sel", "دور الملح"], "st": [["Salage d'environ 3 % : il règle l'affinage autant que le goût.", "Le sel termine l'égouttage.", "Il sélectionne la flore de surface et il freine l'acidification.", "Un fromage mal salé s'affine mal, quelles que soient les conditions de cave."], ["التمليح بحوالي 3 %: ينظّم التعتيق بقدر ما ينظّم الطعم.", "الملح يُكمل التصفية.", "ينتقي الفلورا السطحية ويُبطئ التحميض.", "الجبن السيئ التمليح يُعتّق بشكل سيئ، مهما كانت ظروف الكهف."]], "k": ["Le sel n'est pas qu'un assaisonnement : il termine l'égouttage, sélectionne la flore et freine l'acidification.", "الملح ليس مجرد تتبيل: يُكمل التصفية وينتقي الفلورا ويُبطئ التحميض."], "q": ["Lequel n'est PAS un rôle du sel dans une pâte molle ?", "أيّ مما يلي ليس دورًا للملح في العجينة الطرية؟"], "o": [["Terminer l'égouttage", "Freiner l'acidification", "Faire coaguler le lait"], ["إكمال التصفية", "إبطاء التحميض", "تخثير الحليب"]], "a": 2, "w": ["C'est la présure qui fait coaguler le lait ; le sel agit après, au démoulage.", "المنفحة هي التي تخثّر الحليب؛ الملح يتدخل بعد ذلك عند الإخراج من القالب."], "g": [0, 20, 60]}, {"img": "l21_06", "t": ["Cave, saumure, températures", "الكهف والمحلول الملحي ودرجات الحرارة"], "st": [["L'affinage est le moment où le fromage est le plus exposé : cave nettoyée, claies désinfectées, mains gantées pour les retournements.", "Saumure : concentration contrôlée, température maîtrisée, saumure filtrée et suivie. Une saumure vieillie contamine tous les fromages.", "Températures : emprésurage à 32–34 °C, égouttage à 16–18 °C, affinage à 16–18 °C pour la feta ; chaque écart modifie le produit.", "pH et température sont relevés à chaque étape et notés dans le carnet."], ["التعتيق هو اللحظة التي يكون فيها الجبن أكثر عرضة: كهف منظّف، رفوف مطهّرة، أيدٍ بقفازات عند التقليب.", "المحلول الملحي (saumure): تركيز مضبوط، حرارة متحكَّم فيها، محلول مصفّى ومتابَع. المحلول القديم يلوّث كل الأجبان.", "درجات الحرارة: تنفيح في 32–34 درجة، تصفية في 16–18 درجة، تعتيق في 16–18 درجة للفيتا؛ كل انحراف يغيّر المنتوج.", "يُسجَّل pH والحرارة في كل مرحلة ويُدوَّنان في الدفتر."]], "k": ["Une saumure vieillie contamine tous les fromages : elle se filtre et se suit.", "المحلول الملحي القديم يلوّث كل الأجبان: يُصفّى ويُتابَع."], "q": ["Pourquoi surveille-t-on la saumure ?", "لماذا نراقب المحلول الملحي؟"], "o": [["Parce qu'une saumure vieillie contamine tous les fromages", "Pour colorer la croûte", "Pour faire cailler le lait"], ["لأن المحلول القديم يلوّث كل الأجبان", "لتلوين القشرة", "لتخثير الحليب"]], "a": 0, "w": ["La saumure touche tous les fromages : vieillie, elle les contamine tous.", "المحلول الملحي يلامس كل الأجبان: إذا قدم لوّثها كلها."], "g": [0, 20, 46, 60]}, {"img": "l21_09", "t": ["Les conditions d'affinage", "ظروف التعتيق"], "st": [["Conditions générales d'affinage : 8 à 12 °C.", "Humidité de 90 à 95 % et aération contrôlée.", "La durée dépend du type de fromage ; la feta, elle, s'affine 10 à 15 jours à 16–18 °C.", "Un carnet d'affinage suit chaque fromage : aspect, odeur et pH à chaque passage en cave."], ["الظروف العامة للتعتيق: 8 إلى 12 درجة.", "رطوبة من 90 إلى 95 % وتهوية مضبوطة.", "المدة حسب نوع الجبن؛ أما الفيتا فتُعتّق من 10 إلى 15 يومًا في 16–18 درجة.", "دفتر التعتيق يتابع كل جبنة: المظهر والرائحة وpH عند كل مرور بالكهف."]], "k": ["Affinage : 8 à 12 °C · humidité 90–95 % · aération · durée selon le type.", "التعتيق: 8 إلى 12 درجة · رطوبة 90–95 % · تهوية · المدة حسب النوع."], "q": ["Quelle humidité faut-il dans une cave d'affinage ?", "ما الرطوبة المطلوبة في كهف التعتيق؟"], "o": [["50 à 60 %", "70 à 80 %", "90 à 95 %"], ["50 إلى 60 %", "70 إلى 80 %", "90 إلى 95 %"]], "a": 2, "w": ["Le cours donne 90 à 95 حليب المبستر", "الجبن", "الحليب منزوع الدسم"]], "a": 1, "w": ["Le lait d'été coagule plus lentement et donne un rendement fromager dégradé.", "حليب الصيف يتخثر ببطء ويعطي مردود جبن ضعيفًا."]}, {"q": ["Le taux protéique d'un élevage chute en quelques jours. Quel facteur vérifies-tu d'abord ?", "نسبة البروتين في ضيعة تنخفض في أيام قليلة. أيّ عامل تتحقق منه أولًا؟"], "o": [["La race du troupeau", "L'âge des vaches", "La ration alimentaire"], ["سلالة القطيع", "عمر الأبقار", "العلف"]], "a": 2, "w": ["L'alimentation est le facteur le plus rapide sur le taux protéique.", "التغذية هي العامل الأسرع تأثيرًا في نسبة البروتين."]}]}, "3": {"obj": [["Citer les cinq constituants du lait avec leur ordre de grandeur en g/L.", "تذكر المكوّنات الخمسة للحليب مع قيمها التقريبية بالغرام في اللتر."], ["Calculer l'EST, l'ESD et le sérum d'un lait.", "تحسب المادة الجافة الكلية والمادة الجافة منزوعة الدسم والمصل لحليب."], ["Décrire le lactose et le globule gras, et en déduire écrémage et homogénéisation.", "تصف اللاكتوز والحبيبة الدهنية، وتستنتج منهما نزع الدسم والتجانس."]], "sum": [["Un litre : environ 900 g d'eau, 50 g de lactose, 40 g de MG, 34 g de protéines, 7 g de minéraux.", "لتر واحد: حوالي 900 غ ماء، 50 غ لاكتوز، 40 غ دسم، 34 غ بروتينات، 7 غ معادن."], ["ESD = EST − MG ; sérum = 100 − MG.", "ESD = EST − MG؛ المصل = 100 − MG."], ["Lactose : glucose + galactose, stable, fermentescible, responsable du Maillard.", "اللاكتوز: غلوكوز + غالاكتوز، مستقر، قابل للتخمر، ومسؤول عن تفاعل مايار."], ["Globule gras : 3 à 4 µm, une membrane, 98 % de triglycérides ; il remonte au repos.", "الحبيبة الدهنية: 3 إلى 4 ميكرومتر، غشاء، 98 % ثلاثيات غليسيريد؛ تصعد عند السكون."]], "q3": [{"q": ["Au labo, un lait a 12,5 % d'EST et 3,5 % de MG. Quel est son ESD ?", "في المختبر، حليب فيه 12,5 % من EST و3,5 % من MG. كم هو ESD؟"], "o": [["9 %", "16 %", "96,5 %"], ["9 %", "16 %", "96,5 %"]], "a": 0, "w": ["ESD = EST − MG = 12,5 − 3,5 = 9 %.", "المادة الجافة منزوعة الدسم = EST − MG = 12,5 − 3,5 = 9 %."]}, {"q": ["Un lait stérilisé sort beige avec un goût de cuit. Qu'est-ce qui s'est passé ?", "حليب معقَّم خرج بلون بيج وطعم الطهي. ماذا حدث؟"], "o": [["Une lipolyse par la lipase", "Une fermentation du lactose", "Une réaction de Maillard entre lactose et protéines"], ["تحلل الدهون بالليباز", "تخمر اللاكتوز", "تفاعل مايار بين اللاكتوز والبروتينات"]], "a": 2, "w": ["Chauffé fortement, le lactose réagit avec les protéines : couleur beige, goût de cuit.", "عند التسخين القوي يتفاعل اللاكتوز مع البروتينات: لون بيج وطعم الطهي."]}]}, "4": {"obj": [["Opposer caséines et protéines solubles face à l'acide, à la présure et à la chaleur.", "تقارن بين الكازينات والبروتينات الذائبة أمام الحمض والمنفحة والحرارة."], ["Décrire la micelle de caséine et le rôle du calcium dans la coagulation.", "تصف مذيلة الكازين ودور الكالسيوم في التخثر."], ["Expliquer pourquoi la phosphatase et la peroxydase servent de témoins de pasteurisation.", "تشرح لماذا يُستعمل الفوسفاتاز والبيروكسيداز شاهدين على البسترة."]], "sum": [["Caséines (26 à 29 g/L) → le fromage ; protéines solubles (4 à 6 g/L) → le sérum et la chaleur.", "الكازينات (26 إلى 29 غ/ل) ← الجبن؛ البروتينات الذائبة (4 إلى 6 غ/ل) ← المصل والحرارة."], ["La micelle : un cœur, du phosphate de calcium, un chevelu de caséine kappa en surface.", "المذيلة: قلب، فوسفات الكالسيوم، وشعيرات من كازين كابا على السطح."], ["Présure : coupure, déstabilisation, agrégation, réticulation par le calcium.", "المنفحة: قطع، زعزعة الاستقرار، تكتل، ثم تشبيك بالكالسيوم."], ["Phosphatase → pasteurisation basse ; peroxydase → pasteurisation haute ; lipase et plasmine abîment le produit.", "الفوسفاتاز ← البسترة المنخفضة؛ البيروكسيداز ← البسترة المرتفعة؛ الليباز والبلاسمين يُفسدان المنتوج."]], "q3": [{"q": ["Un contrôle sur du lait pasteurisé donne : phosphatase négative, peroxydase positive. Ta conclusion ?", "مراقبة حليب مبستر تعطي: فوسفاتاز سلبي، بيروكسيداز إيجابي. ما استنتاجك؟"], "o": [["Lait cru mélangé : à refuser", "Pasteurisé, mais pas surchauffé", "Lait surchauffé, vitamines détruites"], ["حليب خام مخلوط: يُرفض", "مبستر لكن دون تسخين مفرط", "حليب مسخَّن بإفراط وفيتاميناته متلفة"]], "a": 1, "w": ["La phosphatase est détruite à 72 °C, la peroxydase seulement vers 80 °C.", "الفوسفاتاز يُتلف في 72 °C، أما البيروكسيداز فلا يُتلف إلا حوالي 80 °C."]}, {"q": ["À la fromagerie, le caillé d'un lait pasteurisé reste mou, la présure est correcte. Que fais-tu ?", "في المجبنة، خثارة حليب مبستر تبقى رخوة والمنفحة صحيحة. ماذا تفعل؟"], "o": [["Tu doubles la dose de présure", "Tu chauffes le lait à 75 °C", "Tu ajoutes du chlorure de calcium"], ["تضاعف كمية المنفحة", "تسخّن الحليب إلى 75 °C", "تضيف كلوريد الكالسيوم"]], "a": 2, "w": ["La chaleur a rendu une partie du calcium insoluble : il manque du calcium libre pour souder le réseau.", "الحرارة جعلت جزءًا من الكالسيوم غير ذائب: ينقص الكالسيوم الحر للحم الشبكة."]}]}, "5": {"obj": [["Citer les trois familles de contaminants du lait et leur origine.", "تذكر العائلات الثلاث لملوِّثات الحليب ومصدرها."], ["Reconnaître un lait anormal à partir d'une description.", "تتعرف على حليب غير طبيعي انطلاقًا من وصف."], ["Décider d'accepter, déclasser ou refuser un lot, et justifier par un résultat.", "تقرر قبول دفعة أو خفض تصنيفها أو رفضها، وتبرر ذلك بنتيجة."]], "sum": [["Trois familles de contaminants : microbiologiques, chimiques (antibiotiques, antiseptiques), physiques.", "ثلاث عائلات من الملوِّثات: ميكروبيولوجية، كيميائية (مضادات حيوية، مطهرات)، فيزيائية."], ["Deux flores : originelle (sortie du pis) et de contamination (traite, transport, stockage) ; seuil < 100 000 UFC/mL.", "فلورتان: أصلية (الخروج من الضرع) وفلورا التلوث (الحلب، النقل، التخزين)؛ العتبة أقل من 100 000 UFC/مل."], ["Laits anormaux : liés à la mamelle, altérés, pathogènes, fraudés.", "الألبان غير الطبيعية: مرتبطة بالضرع، مُفسَدة، ممرضة، مغشوشة."], ["Toute décision de réception se justifie par un résultat écrit, jamais par une impression.", "كل قرار استقبال يُبرَّر بنتيجة مكتوبة، وليس بانطباع أبدًا."]], "q3": [{"q": ["À la réception, une citerne arrive  = D(T) + 0,2 × (T − 20)."], ["Un chiffre ne conclut rien tout seul : c'est le croisement qui décide.", "رقم واحد لا يحسم شيئًا: المقارنة هي التي تقرر."]], "q3": [{"q": ["Au quai, un lait donne 1,4 mL de soude Dornic et une densité corrigée de 1 026 g/L. Ta conclusion ?", "في الرصيف، حليب يعطي 1,4 مل من صودا دورنيك وكثافة مصحَّحة 1 026 غ/ل. ما استنتاجك؟"], "o": [["Lait frais et normal", "Lait écrémé frauduleusement", "Suspicion de mouillage, analyses à pousser"], ["حليب طازج وطبيعي", "حليب منزوع الدسم احتياليًا", "شك في إضافة الماء، ويجب تعميق التحاليل"]], "a": 2, "w": ["14 °D est en limite basse et 1 026 est sous 1 028 : les deux chiffres croisés font suspecter un mouillage.", "14 °D في الحد الأدنى و1 026 أقل من 1 028: الرقمان معًا يُثيران الشك في إضافة الماء."]}, {"q": ["Un lait a un pH normal mais une acidité Dornic anormale. Que suspectes-tu ?", "حليب له pH عادي لكن حموضة دورنيك غير عادية. بماذا تشك؟"], "o": [["Une neutralisation frauduleuse", "Un lait parfaitement frais", "Une erreur de lactodensimètre"], ["تعديل احتيالي للحموضة", "حليب طازج تمامًا", "خطأ في مقياس الكثافة"]], "a": 0, "w": ["C'est le cas d'école du cours : pH normal et Dornic anormal = lait neutralisé.", "إنها الحالة النموذجية في الدرس: pH عادي ودورنيك غير عادي = حليب مُعدَّل."]}]}, "7": {"obj": [["Réaliser un titrage Dornic et calculer le degré Dornic.", "تُنجز معايرة دورنيك وتحسب درجة دورنيك."], ["Mesurer le pH et corriger une densité à 20 °C.", "تقيس الـ pH وتصحّح الكثافة إلى 20 °م."], ["Croiser les trois mesures pour rendre un verdict sur un lait.", "تقارن القياسات الثلاثة لتُصدر حكمًا على الحليب."]], "sum": [["Titrage : 10 mL de lait, phénolphtaléine, soude N/9 jusqu'au rose persistant ; °D = V × 10.", "المعايرة: 10 مل حليب، فينول فتالين، صودا N/9 حتى الوردي الثابت؛ °D = الحجم × 10."], ["Références : 14–18 °D, pH 6,6–6,8, densité 1 028–1 033.", "المراجع: 14–18 °D، pH من 6,6 إلى 6,8، كثافة 1 028–1 033."], ["Densité corrigée : D₂₀ = D(T) + 0,2 × (T − 20).", "الكثافة المصحَّحة: D₂₀ = D(T) + 0,2 × (T − 20)."], ["Trois essais par mesure : un écart entre essais est une erreur de geste.", "ثلاث محاولات لكل قياس: الفرق بين المحاولات خطأ في الحركة."], ["On note ce qu'on lit, jamais ce qu'on attend.", "نسجّل ما نقرأ، وأبدًا ما نتوقع."]], "q3": [{"q": ["Un lait de citerne donne 20 °D et un pH de 6,5. Que conclus-tu ?", "حليب صهريج يعطي 20 °D وpH يساوي 6,5. ماذا تستنتج؟"], "o": [["Lait mouillé", "Lait en début d'acidification", "Lait parfaitement frais"], ["حليب مضاف إليه الماء", "حليب في بداية التحمّض", "حليب طازج تمامًا"]], "a": 1, "w": ["Dornic au-dessus de 18 °D et pH qui baisse : l'acidification a commencé.", "دورنيك فوق 18 °D والـ pH ينخفض: بدأ التحمّض."]}, {"q": ["Tu lis une densité de 1 029 à 10 °C. Quelle densité corrigée écris-tu ?", "تقرأ كثافة 1 029 في 10 °م. ما الكثافة المصحَّحة التي تكتب؟"], "o": [["1 029", "1 031", "1 027"], ["1 029", "1 031", "1 027"]], "a": 2, "w": ["D₂₀ = 1 029 + 0,2 × (10 − 20) = 1 029 − 2 = 1 027.", "الكثافة المصحَّحة: D₂₀ = 1 029 + 0,2 × (10 − 20) = 1 029 − 2 = 1 027."]}]}, "8": {"obj": [["Expliquer la méthode Gerber et lire un butyromètre.", "تشرح طريقة جيربر وتقرأ البوتيرومتر."], ["Calculer l'EST par Fleischmann puis l'ESD.", "تحسب EST بصيغة فلايشمان ثم ESD."], ["Identifier un mouillage, un écrémage ou une double fraude.", "تتعرّف على إضافة الماء أو نزع الدسم أو الغش المزدوج."]], "sum": [["Gerber : acide 10 mL, lait 11 mL, alcool isoamylique 1 mL, centrifugation 5 min ; MG % = A − B.", "جيربر: حمض 10 مل، حليب 11 مل، كحول إيزوأميلي 1 مل، طرد 5 د؛ MG ٪ = A − B."], ["EST = 1,2 MG + 2 665 (D₂₀ − 1 000)/D₂₀ ; ESD = EST − MG.", "EST = 1,2 MG + 2 665 (D₂₀ − 1 000)/D₂₀؛ ESD = EST − MG."], ["Lait normal : EST 125 à 135 g/L, ESD environ 90 g/L.", "الحليب العادي: EST من 125 إلى 135 غ/ل، ESD حوالي 90 غ/ل."], ["La densité soupçonne, la MG oriente, l'ESD prouve.", "الكثافة تثير الشك، والدسم يوجّه، وESD يُثبت."], ["Un lait mouillé se refuse : on ne corrige pas la fraude d'un fournisseur.", "الحليب المضاف إليه الماء يُرفض: لا نصحّح غش المورّد."]], "q3": [{"q": ["Un lait donne : densité 1 034, MG 24 g/L, ESD 90 g/L. Quel verdict écris-tu ?", "حليب يعطي: كثافة 1 034، دسم 24 غ/ل، ESD يساوي 90 غ/ل. ما الحكم الذي تكتب؟"], "o": [["Écrémage", "Mouillage", "Lait conforme"], ["نزع الدسم", "إضافة الماء", "حليب مطابق"]], "a": 0, "w": ["Densité haute + MG basse + ESD normal : c'est un écrémage.", "كثافة مرتفعة + دسم منخفض + ESD عادي: إنه نزع الدسم."]}, {"q": ["Un collègue calcule l'EST avec une densité lue à 12 °C, sans correction. Que lui dis-tu ?", "زميل يحسب EST بكثافة مقروءة في 12 °م دون تصحيح. ماذا تقول له؟"], "o": [["C'est correct, la différence est négligeable", "Il faut d'abord corriger la densité à 20 °C", "Il faut calculer l'ESD en premier"], ["هذا صحيح، الفرق مهمل", "يجب أولًا تصحيح الكثافة إلى 20 °م", "يجب حساب ESD أولًا"]], "a": 1, "w": ["L'ordre est : densité corrigée, puis EST, puis ESD.", "الترتيب: الكثافة المصحَّحة، ثم EST، ثم ESD."]}]}, "9": {"obj": [["Conduire un dosage Gerber en respectant la sécurité.", "تُجري معايرة جيربر مع احترام السلامة."], ["Mesurer l'EST par étuvage et le comparer au calcul.", "تقيس EST بالتجفيف وتقارنه بالحساب."], ["Démasquer un lait écrémé en croisant les résultats.", "تكشف حليبًا منزوع الدسم بمقارنة النتائج."]], "sum": [["Acide sulfurique : gants, lunettes, blouse ; butyromètre tenu par le bouchon.", "حمض الكبريتيك: قفازات، نظارات، وزرة؛ البوتيرومتر يُمسك من السدادة."], ["Ordre : acide, lait, alcool ; centrifugeuse équilibrée deux par deux.", "الترتيب: حمض، حليب، كحول؛ جهاز الطرد متوازن اثنين اثنين."], ["EST par étuvage = résidu × 1 000 / masse de lait ; il doit être proche de l'EST calculé.", "EST بالتجفيف = البقية × 1 000 / كتلة الحليب؛ ويجب أن يقارب EST المحسوب."], ["MG basse + ESD normal = écrémage ; ESD bas = mouillage.", "دسم منخفض + ESD عادي = نزع الدسم؛ ESD منخفض = إضافة الماء."]], "q3": [{"q": ["Pendant le TP, un binôme verse le lait avant l'acide. Que fais-tu ?", "أثناء الأشغال، ثنائي يصبّ الحليب قبل الحمض. ماذا تفعل؟"], "o": [["On continue, l'ordre n'a pa
