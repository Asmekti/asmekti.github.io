, "الأقل كلفة في المواد", "التي تُطهى أطول مدة"]], "a": 1, "w": ["Une formule se choisit sur texture, goût et coût : à égalité, le coût décide.", "تُختار الوصفة بالقوام والطعم والكلفة: عند التساوي تحسم الكلفة."]}]}, "19": {"obj": [["Régler un barattage : remplissage, température, vitesse, durée.", "تضبط الخض: الملء، الحرارة، السرعة، المدة."], ["Calculer le bilan matière et le rendement du beurre.", "تحسب الحصيلة المادية ومردود الزبدة."], ["Identifier où part la matière grasse perdue.", "تحدد أين تضيع المادة الدسمة."]], "sum": [["Beurre : au moins 82 % de MG, au plus 16 % d'eau ; acide ou doux.", "الزبدة: 82 % مادة دسمة على الأقل و16 % ماء على الأكثر؛ حامضة أو حلوة."], ["Barattage : 40–50 % de remplissage, 14 °C, 20–30 tours/min, 30 à 60 min.", "الخض: ملء 40–50 %، 14 درجة، 20–30 دورة/دقيقة، 30 إلى 60 دقيقة."], ["Arrêt aux grains de 2 à 5 mm ; lavage avec 1,25 × le babeurre à 5 °C.", "التوقف عند حبيبات 2 إلى 5 مم؛ غسل بـ 1,25 × اللبن المخيض في 5 درجات."], ["Beurre théorique = MG totale ÷ 0,82 ; les pertes partent dans le babeurre.", "الزبدة النظرية = المادة الدسمة الكلية ÷ 0,82؛ والخسائر تذهب في اللبن المخيض."]], "q3": [{"q": ["Ton babeurre dosé au Gerber contient 0,9 % de MG. Que conclus-tu ?", "اللبن المخيض المعايَر بجربر يحتوي 0,9 % مادة دسمة. ماذا تستنتج؟"], "o": [["Le barattage est bien conduit", "Le beurre est trop salé", "Le barattage est mal conduit : il y a des pertes"], ["الخض جيد", "الزبدة مالحة جدًا", "الخض سيئ: هناك خسائر"]], "a": 2, "w": ["Au-delà de 0,5 % de MG dans le babeurre, le barattage a été mal conduit.", "فوق 0,5 % من المادة الدسمة في اللبن المخيض، كان الخض سيئًا."]}, {"q": ["Tu as 61,46 kg de babeurre. Quel volume d'eau de lavage prépares-tu ?", "لديك 61,46 كغ من اللبن المخيض. ما حجم ماء الغسل الذي تحضّره؟"], "o": [["Environ 76,8 L à 5 °C", "Environ 30,7 L à 20 °C", "Environ 122,9 L à 14 °C"], ["حوالي 76,8 لترًا في 5 درجات", "حوالي 30,7 لترًا في 20 درجة", "حوالي 122,9 لترًا في 14 درجة"]], "a": 0, "w": ["Eau de lavage = 1,25 × 61,46 ≈ 76,8 L, à 5 °C.", "ماء الغسل = 1,25 × 61,46 ≈ 76,8 لترًا، في 5 درجات."]}]}, "20": {"obj": [["Conduire un fromage frais à coagulation surtout lactique.", "تنجز جبنًا طريًا بتخثّر لبني أساسًا."], ["Comparer égouttage lent et égouttage rapide.", "تقارن بين التصفية البطيئة والتصفية السريعة."], ["Calculer un rendement fromager en kg pour 100 L.", "تحسب مردودًا جبنيًا بالكيلوغرام لكل 100 لتر."]], "sum": [["Coagulation surtout lactique : ferments mésophiles, présure en appoint (1 à 20 mL/100 L).", "تخثّر لبني أساسًا: خمائر محبة للاعتدال، ومنفحة مساعدة (1 إلى 20 مل/100 لتر)."], ["85 °C / 2 min · 20–28 °C · 16 à 24 h · pH 4,6 · sel 1 à 2 % · 0–4 °C.", "85 درجة / 2 دقيقة · 20–28 درجة · 16 إلى 24 ساعة · pH 4,6 · ملح 1 إلى 2 % · 0–4 درجات."], ["Égouttage lent : texture granuleuse ; rapide puis lissage : texture lisse.", "التصفية البطيئة: قوام محبّب؛ السريعة ثم التنعيم: قوام ناعم."], ["Rendement en kg pour 100 L : il dépend surtout des caséines.", "المردود بالكيلوغرام لكل 100 لتر: يرتبط أساسًا بالكازيين."]], "q3": [{"q": ["Tu obtiens 18 kg de fromage avec 100 L de lait. Comment écris-tu le rendement ?", "حصلت على 18 كغ من الجبن من 100 لتر حليب. كيف تكتب المردود؟"], "o": [["18 %", "18 kg pour 100 L", "18"], ["18 %", "18 كغ لكل 100 لتر", "18"]], "a": 1, "w": ["Le rendement fromager s'exprime en kg pour 100 L, toujours avec son unité.", "المردود الجبني يُعبَّر عنه بالكيلوغرام لكل 100 لتر، دائمًا مع وحدته."]}, {"q": ["Le client veut un fromage frais bien lisse. Quel égouttage choisis-tu ?", "الزبون يريد جبنًا طريًا ناعمًا جدًا. أي تصفية تختار؟"], "o": [["Lent en toile suspendue", "Lent en moule avec retournements", "Rapide par centrifugation, puis lissage"], ["بطيئة في قماش معلّق", "بطيئة في قالب مع التقليب", "سريعة بالطرد المركزي ثم التنعيم"]], "a": 2, "w": ["L'égouttage rapide suivi d'un lissage donne une texture lisse.", "التصفية السريعة متبوعة بالتنعيم تعطي قوامًا ناعمًا."]}]}, "21": {"obj": [["Définir une pâte molle et citer ses quatre types d'affinage.", "تعرّف العجينة الطرية وتذكر أنواع تعتيقها الأربعة."], ["Conduire une feta en respectant ses paramètres.", "تنجز جبن الفيتا مع احترام معاييره."], ["Expliquer le rôle du sel et les conditions d'affinage.", "تشرح دور الملح وظروف التعتيق."]], "sum": [["Pâte molle : ni pressée ni cuite, affinée, extrait sec de 40 à 50 %.", "العجينة الطرية: غير مضغوطة وغير مطبوخة، معتّقة، مادة جافة من 40 إلى 50 %."], ["Feta : présure à 32–34 °C, caillage 45–50 min, égouttage 18–24 h à 16–18 °C, sel ≈ 3 %.", "الفيتا: منفحة في 32–34 درجة، تخثّر 45–50 دقيقة، تصفية 18–24 ساعة في 16–18 درجة، ملح ≈ 3 %."], ["La qualité se joue entre le décaillage et le démoulage : grains réguliers, brassage doux.", "الجودة تُحسم بين التقطيع والإخراج من القالب: حبيبات منتظمة وتحريك لطيف."], ["Affinage : 8 à 12 °C, humidité 90–95 %, aération, durée selon le type.", "التعتيق: 8 إلى 12 درجة، رطوبة 90–95 %، تهوية، المدة حسب النوع."]], "q3": [{"q": ["Au test du couteau, ton caillé colle et ne se casse pas net. Que fais-tu ?", "في اختبار السكين، خثارتك تلتصق ولا تنكسر بشكل نظيف. ماذا تفعل؟"], "o": [["Tu découpes tout de suite", "Tu attends encore avant de décailler", "Tu ajoutes du sel"], ["تقطّع فورًا", "تنتظر قليلًا قبل التقطيع", "تضيف الملح"]], "a": 1, "w": ["Un caillé qui colle n'est pas prêt : décailler trop tôt fait perdre des fines.", "الخثارة التي تلتصق غير جاهزة: التقطيع المبكر يُضيّع الدقائق."]}, {"q": ["Plusieurs fromages de la cave présentent le même défaut de surface. Que contrôles-tu en priorité ?", "عدة أجبان في الكهف تظهر نفس العيب السطحي. ماذا تراقب أولًا؟"], "o": [["L'état de la saumure", "La taille des moules", "La couleur du lait"], ["حالة المحلول الملحي", "حجم القوالب", "لون الحليب"]], "a": 0, "w": ["La saumure touche tous les fromages : vieillie, elle les contamine tous.", "المحلول الملحي يلامس كل الأجبان: إذا قدم لوّثها كلها."]}]}, "22": {"obj": [["Conduire une pâte pressée, du lait au pressage.", "تنجز عجينة مضغوطة، من الحليب إلى الضغط."], ["Expliquer le délactosage et les règles du pressage.", "تشرح إزالة اللاكتوز وقواعد الضغط."], ["Comparer les fabrications du module par leur teneur en eau.", "تقارن منتوجات الوحدة حسب نسبة الماء فيها."]], "sum": [["Pâte pressée : coagulation présure, pressage, environ 40 % d'humidité, affinage long.", "العجينة المضغوطة: تخثّر بالمنفحة، ضغط، رطوبة حوالي 40 %، تعتيق طويل."], ["72 °C / 20 s, puis 37 °C ; cuisson du caillé à environ 55 °C pour les pâtes cuites.", "72 درجة / 20 ثانية ثم 37 درجة؛ طبخ الخثارة في حوالي 55 درجة للعجائن المطبوخة."], ["Délactosage : retirer du sérum, ajouter de l'eau, pour moins d'acidification en cave.", "إزالة اللاكتوز: سحب المصل وإضافة الماء، لتحميض أقل في الكهف."], ["Moins d'eau, plus longue conservation : frais 70 %, molle plus de 50 %, pressée environ 40 %.", "ماء أقل، حفظ أطول: الطري 70 %، الطري المعتّق أكثر من 50 %، المضغوط حوالي 40 %."]], "q3": [{"q": ["À la coupe, ta pâte pressée montre des poches de sérum. Quelle est la cause probable ?", "عند القطع، تظهر في عجينتك المضغوطة جيوب مصل. ما السبب المحتمل؟"], "o": [["Un salage trop long", "Un pressage brutal dès le départ", "Une cave trop humide"], ["تمليح طويل جدًا", "ضغط عنيف منذ البداية", "كهف رطب جدًا"]], "a": 1, "w": ["Une pression forte d'emblée ferme la croûte et emprisonne le sérum.", "الضغط القوي من البداية يُغلق القشرة ويحبس المصل."]}, {"q": ["On veut une pâte pressée plus douce, moins acide en fin d'affinage. Quelle étape utilises-tu ?", "نريد عجينة مضغوطة أقل حموضة في نهاية التعتيق. أي مرحلة تستعمل؟"], "o": [["Le délactosage", "Un emprésurage plus chaud", "Un salage plus faible"], ["إزالة اللاكتوز", "تنفيح أسخن", "تمليح أضعف"]], "a": 0, "w": ["Moins de lactose, donc moins d'acidification en cave : la pâte est plus douce.", "لاكتوز أقل يعني تحميضًا أقل في الكهف: العجينة أقل حموضة."]}]}}, "card": {"l01_10": {"lvl": 1, "ex": ["Dans le Gharb ou le Souss-Massa, le petit éleveur livre chaque jour son lait de ferme à la coopérative, qui le refroidit.", "في الغرب أو سوس ماسة، يسلّم المربّي الصغير حليب ضيعته كل يوم إلى التعاونية التي تبرّده."]}, "l01_12": {"lvl": 1, "cmp": ["Prim'Holstein, c'est le camion : beaucoup de volume. Montbéliarde, c'est le lait « riche ». Oulmès-Zaër, c'est la robuste du bled.", "البريم هولشتاين مثل الشاحنة: حجم كبير. المونبليارد هي الحليب «الغني». وأولماس زعير هي القوية الصبورة في البادية."]}, "l01_15": {"lvl": 2, "trap": ["« Un peu d'eau dans le lait, ce n'est pas grave. » Faux : c'est une addition, donc une fraude, le mouillage.", "«قليل من الماء في الحليب ليس مشكلة». خطأ: إنها إضافة، أي غش (mouillage)."], "ex": ["Au souk, le lait de chamelle doit être vendu sous ce nom : seul le lait de vache s'appelle « lait » tout court.", "في السوق، يجب أن يُباع حليب الناقة بهذا الاسم: حليب البقر وحده يُسمّى «حليبًا» فقط."]}, "l01_16": {"lvl": 1, "cmp": ["La lactation, c'est comme une colline : on monte vite au pic, on redescend lentement, puis la vache se repose.", "الإدرار مثل تلّة: نصعد بسرعة إلى الذروة، ثم ننزل ببطء، ثم ترتاح البقرة."]}, "l01_17": {"lvl": 2, "trap": ["« Le colostrum est plus riche, donc meilleur pour l'usine. » Faux : il coagule à la chaleur et il est refusé.", "«اللبأ أغنى، إذن هو أفضل للمصنع». خطأ: إنه يتخثر بالحرارة ويُرفض."], "ex": ["Une vache vient de vêler à la ferme : son lait de la première semaine va au veau, pas au bidon de la coopérative.", "بقرة ولدت للتوّ في الضيعة: حليب أسبوعها الأول يذهب للعجل، لا إلى سطل التعاونية."]}, "l01_18": {"lvl": 1, "cmp": ["Le sphincter, c'est le bouchon de la bouteille : quand il reste ouvert, les bactéries entrent.", "العضلة العاصرة مثل سدّادة القارورة: عندما تبقى مفتوحة تدخل البكتيريا."]}, "l01_21": {"lvl": 2, "trap": ["« Les premiers jets, c'est du bon lait, on les garde. » Faux : ce sont les plus chargés en bactéries.", "«الدفقات الأولى حليب جيد، نحتفظ بها». خطأ: إنها الأكثر حملًا للبكتيريا."], "ex": ["Un bol à fond noir coûte peu : dans une petite ferme, il montre tout de suite les grumeaux d'une mammite.", "الوعاء ذو القعر الأسود رخيص: في ضيعة صغيرة يُظهر فورًا كتل التهاب الضرع."]}, "l01_24": {"lvl": 2, "ex": ["À la coopérative, un seul bidon de lait d'une vache traitée peut bloquer la cuve de lben de toute l'usine.", "في التعاونية، سطل واحد من حليب بقرة معالَجة قد يُوقف حوض اللبن في المصنع كله."]}, "l01_25": {"lvl": 2, "trap": ["« Le froid tue les microbes. » Faux : il les endort. Un lait déjà contaminé le reste.", "«البرودة تقتل الميكروبات». خطأ: إنها تُنوّمها. والحليب الملوث يبقى ملوثًا."], "cmp": ["Le froid, c'est la pause sur une vidéo : tout s'arrête, mais rien n'est effacé.", "البرودة مثل زر الإيقاف المؤقت في فيديو: كل شيء يتوقف، لكن لا شيء يُمحى."]}, "l02_05": {"lvl": 2, "cmp": ["L'usine est comme une cuisinière qui reçoit des légumes différents chaque jour : elle ajuste la recette, pas le potager.", "المصنع مثل طبّاخة تتلقى خضرًا مختلفة كل يوم: تعدّل الوصفة، لا البستان."]}, "l02_07": {"lvl": 1, "ex": ["Une coopérative qui veut faire du jben choisit des Montbéliardes : leur lait plus riche en protéines donne plus de fromage.", "تعاونية تريد صنع الجبن البلدي تختار المونبليارد: حليبها الأغنى بالبروتينات يعطي جبنًا أكثر."]}, "l02_09": {"lvl": 2, "trap": ["« Plus il y a de lait, plus il est riche. » Faux : volume et richesse varient en sens inverse.", "«كلما كثر الحليب كان أغنى». خطأ: الحجم والغنى يتغيّران في اتجاهين متعاكسين."], "cmp": ["C'est comme un thé qu'on allonge d'eau : plus de volume, moins de goût.", "إنه مثل الشاي الذي نزيد فيه الماء: حجم أكثر، وطعم أقل."]}, "l02_10": {"lvl": 1, "ex": ["Au Maroc, la collecte industrielle est très majoritairement bovine : le lait de vache remplit les citernes.", "في المغرب، التجميع الصناعي بقري في أغلبه: حليب البقر هو الذي يملأ الصهاريج."]}, "l02_11": {"lvl": 1, "trap": ["« L'eau n'a pas d'effet sur le lait. » Faux : privée d'eau, la vache baisse immédiatement sa production.", "«الماء لا يؤثر في الحليب». خطأ: البقرة المحرومة من الماء ينخفض إنتاجها فورًا."]}, "l02_13": {"lvl": 2, "ex": ["En juillet, une laiterie régionale programme plutôt du lben et du raïb, et garde les fromages pour l'hiver.", "في يوليوز، تبرمج لبنية جهوية اللبن والرايب، وتحتفظ بالأجبان لفصل الشتاء."]}, "l02_15": {"lvl": 2, "trap": ["« Un litre est un litre, quel que soit le lait. » Faux : c'est la MG et les protéines qui font le rendement.", "«اللتر لتر مهما كان الحليب». خطأ: الدسم والبروتينات هي التي تصنع المردود."], "ex": ["Pour un atelier de beurre et de smen, un lait d'été moins gras donne moins de beurre à volume égal.", "في ورشة الزبدة والسمن، حليب الصيف الأقل دسمًا يعطي زبدة أقل بنفس الحجم."]}, "l02_17": {"lvl": 2, "cmp": ["Pasteuriser un mauvais lait, c'est comme laver une pomme pourrie : elle est propre, mais toujours abîmée.", "بسترة حليب رديء مثل غسل تفاحة فاسدة: تصبح نظيفة لكنها تبقى فاسدة."]}, "l03_07": {"lvl": 1, "cmp": ["Le lait, c'est surtout de l'eau : sur un verre, presque tout est eau, et la valeur tient dans une petite cuillère de solides.", "الحليب ماء في أغلبه: في كأس، كل شيء تقريبًا ماء، والقيمة كلها في ملعقة صغيرة من المواد الصلبة."]}, "l03_09": {"lvl": 2, "trap": ["« L'ESD, c'est l'extrait sec sans l'eau. » Faux : c'est l'extrait sec sans la matière grasse.", "«ESD هي المادة الجافة بدون ماء». خطأ: إنها المادة الجافة بدون مادة دسمة."], "ex": ["Quand on égoutte le raïb pour faire du jben, le liquide qui coule est le sérum.", "عندما نصفّي الرايب لصنع الجبن البلدي، السائل الذي يسيل هو المصل."]}, "l03_11": {"lvl": 1, "cmp": ["L'eau libre, c'est l'eau d'une éponge qu'on presse ; l'eau liée, c'est celle qui reste même après avoir essoré.", "الماء الحر مثل ماء إسفنجة نعصرها؛ والماء المرتبط هو الذي يبقى حتى بعد العصر."]}, "l03_13": {"lvl": 1, "trap": ["« Le lait est sucré parce qu'il contient beaucoup de sucre. » Faux : le lactose sucre six fois moins que le saccharose.", "«الحليب حلو لأنه يحتوي على سكر كثير». خطأ: اللاكتوز أقل حلاوة بست مرات من السكروز."]}, "l03_15": {"lvl": 1, "ex": ["Le lben et le raïb sont plus acides que le lait : les ferments ont transformé une partie du lactose en acide lactique.", "اللبن والرايب أكثر حموضة من الحليب: الخمائر حوّلت جزءًا من اللاكتوز إلى حمض اللبنيك."]}, "l03_17": {"lvl": 1, "cmp": ["Le globule gras, c'est une goutte d'huile dans un sachet fin : la membrane l'empêche de se mélanger aux autres.", "الحبيبة الدهنية مثل قطرة زيت في كيس رقيق: الغشاء يمنعها من الاختلاط بالأخرى."]}, "l03_20": {"lvl": 1, "ex": ["Un beurre qui a pris un goût rance a subi la lipase : les acides gras courts ont été libérés.", "زبدة أخذت طعم الزناخة تعرضت لإنزيم الليباز: الأحماض الدهنية القصيرة تحررت."]}, "l03_22": {"lvl": 2, "trap": ["« Un lait homogénéisé a perdu sa crème. » Faux : la crème est toujours là, en globules trop petits pour remonter.", "«الحليب المتجانس فقد قشدته». خطأ: القشدة ما زالت فيه، في حبيبات أصغر من أن تصعد."], "ex": ["Le lait de ferme laissé une nuit au frais montre une couche de crème ; la brique homogénéisée, jamais.", "حليب الضيعة المتروك ليلة في مكان بارد تظهر فيه طبقة قشدة؛ أما العلبة المتجانسة فلا."]}, "l03_24": {"lvl": 2, "ex": ["Pour faire du beurre, on garde les globules gras ; le babeurre et le lait écrémé sont ce qu'on accepte de perdre.", "لصنع الزبدة نحتفظ بالحبيبات الدهنية؛ واللبن الناتج والحليب منزوع الدسم هما ما نقبل بفقدانه."]}, "l04_07": {"lvl": 2, "trap": ["« Toutes les protéines du lait finissent dans le fromage. » Faux : les protéines solubles partent avec le sérum.", "«كل بروتينات الحليب تنتهي في الجبن». خطأ: البروتينات الذائبة تذهب مع المصل."], "ex": ["Quand on chauffe fort le petit-lait, des flocons blancs apparaissent : ce sont les protéines solubles qui précipitent.", "عندما نسخّن مصل اللبن بقوة تظهر ندف بيضاء: إنها البروتينات الذائبة تترسب."]}, "l04_09": {"lvl": 2, "cmp": ["La micelle, c'est une pelote de laine : le cœur est serré, les poils de surface empêchent les pelotes de se coller.", "المذيلة مثل كرة صوف: القلب مضغوط، والشعيرات على السطح تمنع الكرات من الالتصاق."]}, "l04_12": {"lvl": 2, "trap": ["« La présure cuit le lait. » Faux : il n'y a ni chaleur ni acide ; elle coupe un chevelu, puis le calcium soude le gel.", "«المنفحة تطبخ الحليب». خطأ: لا حرارة ولا حمض؛ إنها تقطع شعيرات، ثم يلحم الكالسيوم الهلام."], "ex": ["À la fromagerie de la coopérative, on ajoute du chlorure de calcium au lait pasteurisé pour obtenir un caillé ferme.", "في مجبنة التعاونية نضيف كلوريد الكالسيوم إلى الحليب المبستر للحصول على خثارة متماسكة."]}, "l04_14": {"lvl": 1, "ex": ["L'arôme typique d'un bon beurre vient du diacétyle, produit par les ferments à partir des citrates.", "النكهة المميزة للزبدة الجيدة تأتي من الدياسيتيل الذي تنتجه الخمائر من السترات."]}, "l04_16": {"lvl": 2, "ex": ["Sur une brique de lait demi-écrémé, tu peux lire l'enrichissement en vitamines A et D.", "على علبة حليب نصف منزوع الدسم يمكنك قراءة الإغناء بفيتاميني A وD."], "cmp": ["Les liposolubles voyagent dans le « bateau » de la crème : si on retire le bateau, elles partent avec.", "الفيتامينات الذائبة في الدهون تسافر في «قارب» القشدة: إذا نزعنا القارب ذهبت معه."]}, "l04_19": {"lvl": 2, "trap": ["« Phosphatase positive = lait bien pasteurisé. » Faux : positive veut dire traitement raté ou lait cru mélangé.", "«فوسفاتاز إيجابي = حليب مبستر جيدًا». خطأ: الإيجابي يعني معالجة فاشلة أو حليب خام مخلوط."], "cmp": ["La phosphatase est un témoin qui disparaît à 72 °C : s'il est encore là, le lait n'a pas été assez chauffé.", "الفوسفاتاز شاهد يختفي في 72 °C: إذا كان ما زال موجودًا، فالحليب لم يُسخَّن بما يكفي."]}, "l04_18": {"lvl": 2, "ex": ["Une brique de lait UHT oubliée des mois au fond d'une épicerie peut devenir gélifiée : c'est la plasmine.", "علبة حليب UHT منسية أشهرًا في عمق دكان قد تصبح متهلّمة: إنه البلاسمين."]}, "l04_21": {"lvl": 1, "trap": ["« Un lait mouillé se voit à sa couleur. » Faux : seul le point de congélation ou la densité le révèle.", "«الحليب المضاف إليه الماء يُعرف بلونه». خطأ: وحدها نقطة التجمد أو الكثافة تكشفه."]}, "l05_07": {"lvl": 1, "cmp": ["Le lait, c'est un buffet ouvert pour les bactéries : tout y est servi, à bonne température.", "الحليب مائدة مفتوحة للبكتيريا: كل شيء مقدَّم فيها وبحرارة مناسبة."]}, "l05_09": {"lvl": 2, "trap": ["« Le lait sort du pis déjà plein de microbes. » Faux : il sort presque stérile ; la contamination vient après.", "«الحليب يخرج من الضرع مليئًا بالميكروبات». خطأ: يخرج شبه معقَّم؛ والتلوث يأتي بعد ذلك."], "ex": ["Des mains sales, un seau mal lavé ou de la paille souillée suffisent à contaminer le lait de ferme.", "أيادٍ متسخة أو سطل سيئ الغسل أو تبن ملوث تكفي لتلويث حليب الضيعة."]}, "l05_11": {"lvl": 1, "ex": ["Les ferments du lben sont la flore utile ; un raïb qui gonfle et sent mauvais signale une flore d'altération.", "خمائر اللبن هي الفلورا النافعة؛ والرايب الذي ينتفخ وتسوء رائحته علامة على فلورا الإفساد."]}, "l05_14": {"lvl": 2, "trap": ["« Un peu d'eau de Javel dans le lait le rend plus sûr. » Faux : c'est une fraude, et cela bloque la fermentation.", "«قليل من ماء جافيل في الحليب يجعله أكثر أمانًا». خطأ: إنه غش، ويوقف التخمر."]}, "l05_16": {"lvl": 2, "ex": ["Un lait amer d'une vache malade, un lait aigre après une traite oubliée, un lait jaune après vêlage : mammite, rétention, colostral.", "حليب مرّ من بقرة مريضة، حليب حامض بعد حلبة منسية، حليب أصفر بعد الولادة: التهاب الضرع، احتباس، لبأ."]}, "l05_18": {"lvl": 1, "cmp": ["Le lait malpropre est une faute ; le lait fraudé est une tricherie.", "الحليب غير النظيف خطأ؛ والحليب المغشوش احتيال."]}, "l05_20": {"lvl": 2, "trap": ["« Un lait mouillé se reconnaît au goût. » Faux : aucune fraude ne se voit ; seul le laboratoire les détecte.", "«الحليب المضاف إليه الماء يُعرف بطعمه». خطأ: لا يُرى أي غش؛ المختبر وحده يكشفه."], "ex": ["Un lait mouillé puis « rattrapé » à l'amidon se démasque par un simple test à l'eau iodée.", "الحليب المضاف إليه الماء ثم «المُصلَح» بالنشا يُكشف باختبار بسيط بماء اليود."]}, "l05_23": {"lvl": 2, "trap": ["« Dans le doute, on refuse tout. » Faux : un refus injustifié coûte aussi cher qu'une acceptation à tort.", "«عند الشك نرفض كل شيء». خطأ: الرفض غير المبرر مكلف مثل القبول الخاطئ."]}, "l06_07": {"lvl": 2, "ex": ["À l'arrivée de la citerne au quai, on regarde et on sent le lait avant tout test : c'est l'analyse sensorielle.", "عند وصول الصهريجة إلى الرصيف، ننظر إلى الحليب ونشمّه قبل أي اختبار: إنه التحليل الحسي."]}, "l06_09": {"lvl": 1, "trap": ["« On arrête au premier rose. » Faux : on arrête quand la couleur rose persiste.", "«نتوقف عند أول لون وردي». خطأ: نتوقف عندما يثبت اللون الوردي."]}, "l06_12": {"lvl": 2, "cmp": ["L'échelle Dornic, c'est un feu tricolore : 14 à 18 vert, au-delà de 18 orange, 26 et plus rouge.", "سلّم دورنيك مثل إشارة المرور: 14 إلى 18 أخضر، فوق 18 برتقالي، و26 فما فوق أحمر."], "ex": ["Un lait de ferme laissé au soleil au souk peut vite dépasser 18 °D, puis cailler dès qu'on le chauffe.", "حليب ضيعة متروك في الشمس بالسوق قد يتجاوز بسرعة 18 °D، ثم يتخثر بمجرد تسخينه."]}, "l06_14": {"lvl": 2, "trap": ["« Plus le °D est bas, plus le lait est frais. » Faux : sous 14 °D, le lait est anormal.", "«كلما انخفضت درجة دورنيك كان الحليب أطزج». خطأ: تحت 14 °D يكون الحليب غير طبيعي."], "cmp": ["L'acidité naturelle est le salaire de base ; l'acidité développée, ce sont les heures perdues qui s'ajoutent.", "الحموضة الطبيعية هي الأجر الأساسي؛ والحموضة المكتسبة هي الساعات الضائعة التي تُضاف."]}, "l06_16": {"lvl": 1, "trap": ["« On peut mesurer sans étalonner, l'appareil est neuf. » Faux : on étalonne avant chaque série.", "«يمكن القياس دون معايرة لأن الجهاز جديد». خطأ: نعاير قبل كل سلسلة."]}, "l06_18": {"lvl": 2, "cmp": ["Le pH est une photo de l'instant ; le Dornic est l'inventaire de tout le magasin.", "الـ pH صورة للحظة؛ ودورنيك جرد للمخزن كله."]}, "l06_20": {"lvl": 2, "trap": ["« On lit la densité et c'est fini. » Faux : il faut toujours corriger la lecture à 20 °C.", "«نقرأ الكثافة وانتهى الأمر». خطأ: يجب دائمًا تصحيح القراءة إلى 20 °C."]}, "l06_23": {"lvl": 2, "trap": ["« Densité normale = lait normal. » Faux : un lait mouillé et écrémé peut retrouver une densité normale.", "«كثافة عادية = حليب طبيعي». خطأ: الحليب المضاف إليه الماء والمنزوع الدسم قد يسترجع كثافة عادية."], "cmp": ["Enlever la crème alourdit, ajouter de l'eau allège : les deux fraudes ensemble s'annulent sur le lactodensimètre.", "نزع القشدة يُثقل وإضافة الماء تُخفف: الغشّان معًا يُلغي أحدهما الآخر على مقياس الكثافة."]}, "l06_25": {"lvl": 1, "ex": ["Au centre de collecte, un tube et une flamme suffisent pour le test à l'ébullition avant d'envoyer le lait à l'usine.", "في مركز التجميع، يكفي أنبوب ولهب لاختبار الغليان قبل إرسال الحليب إلى المصنع."]}, "l07_07": {"lvl": 2, "trap": ["« Le pH suffit, pas besoin du Dornic. » Faux : un lait neutralisé a un pH normal mais un Dornic anormal.", "«الـ pH يكفي، لا حاجة لدورنيك». خطأ: الحليب المُعادَل له pH عادي لكن دورنيك غير عادي."], "cmp": ["Le pH est une photo de l'instant ; le Dornic est un inventaire de tout l'acide formé.", "الـ pH صورة للّحظة؛ ودورنيك جرد لكل الحمض المتكوّن."]}, "l07_11": {"lvl": 1, "ex": ["Au laboratoire de la coopérative laitière, 1,6 mL de soude pour le lait du matin donne 16 °D : lait frais.", "في مختبر التعاونية الحليبية، 1,6 مل من الصودا لحليب الصباح تعطي 16 °D: حليب طازج."]}, "l07_13": {"lvl": 1, "cmp": ["La phénolphtaléine, c'est le signal du titrage : le rose dit « stop ».", "الفينول فتالين هو إشارة المعايرة: اللون الوردي يقول «توقّف»."]}, "l07_10": {"lvl": 2, "trap": ["« Deux essais différents, c'est le lait qui varie. » Non : sur le même lait, l'écart vient du geste.", "«محاولتان مختلفتان، إذن الحليب يتغيّر». لا: على نفس الحليب، الفرق يأتي من الحركة."]}, "l07_08": {"lvl": 1, "trap": ["« Je lis 1 025 à 8 °C, donc le lait est à 1 025. » Faux : il faut d'abord corriger à 20 °C.", "«أقرأ 1 025 في 8 °م، إذن الحليب 1 025». خطأ: يجب التصحيح أولًا إلى 20 °م."], "ex": ["Le lait de ferme arrive froid du tank : sa densité lue doit toujours être corrigée.", "حليب الضيعة يصل باردًا من الخزان: كثافته المقروءة يجب تصحيحها دائمًا."]}, "l07_15": {"lvl": 2, "cmp": ["Un résultat faux ressemble à un résultat juste : seul le bon geste fait la différence.", "النتيجة الخاطئة تشبه النتيجة الصحيحة: الحركة السليمة وحدها تصنع الفرق."]}, "l07_05": {"lvl": 1, "ex": ["Comme au souk on ne secoue pas les œufs, on retourne doucement le flacon de lait, sans le secouer.", "كما لا نرجّ البيض في السوق، نقلب قارورة الحليب بلطف دون رجّها."]}, "l08_03": {"lvl": 2, "cmp": ["Deux fraudes sur la densité, c'est comme ajouter et retirer du poids : la balance ne voit rien.", "غشّان على الكثافة مثل إضافة وزن ونزعه: الميزان لا يرى شيئًا."]}, "l08_07": {"lvl": 1, "trap": ["« On peut verser le lait puis l'acide. » Jamais : l'acide se verse toujours en premier.", "«يمكن صبّ الحليب ثم الحمض». أبدًا: الحمض يُصبّ دائمًا أولًا."]}, "l08_10": {"lvl": 2, "trap": ["« Je lis en regardant d'en haut. » Faux : une lecture en plongée fait perdre un demi-point, soit 5 g/L.", "«أقرأ وأنا أنظر من الأعلى». خطأ: القراءة من الأعلى تُفقد نصف نقطة، أي 5 غ/ل."]}, "l08_13": {"lvl": 1, "ex": ["À la réception, le Gerber décide vite ; si l'éleveur conteste, on passe à Röse-Gottlieb.", "عند الاستقبال، جيربر يقرّر بسرعة؛ وإذا احتجّ المربّي ننتقل إلى روز-غوتليب."]}, "l08_15": {"lvl": 1, "cmp": ["L'EST, c'est tout ce qui reste quand on enlève l'eau ; l'ESD, c'est ce reste sans le gras.", "EST هو كل ما يبقى عند نزع الماء؛ وESD هو هذا الباقي بدون الدسم."]}, "l08_17": {"lvl": 2, "ex": ["Un lait de collecte à densité normale mais EST bas : l'éleveur a pu écrémer puis ajouter de l'eau.", "حليب جمع كثافته عادية لكن EST منخفض: قد يكون المربّي نزع الدسم ثم أضاف الماء."]}, "l08_19": {"lvl": 2, "trap": ["« Je calcule l'EST avec 1 025 lu. » Faux : il faut d'abord corriger la densité à 20 °C.", "«أحسب EST بـ 1 025 المقروءة». خطأ: يجب أولًا تصحيح الكثافة إلى 20 °م."]}, "l08_22": {"lvl": 2, "ex": ["À la coopérative, un camion de lait mouillé est refusé et l'éleveur est prévenu, même si la correction est possible.", "في التعاونية، تُرفض شاحنة حليب مضاف إليه الماء ويُنبَّه المربّي، حتى لو كان التصحيح ممكنًا."]}, "l09_05": {"lvl": 1, "trap": ["« J'enlève mes lunettes pour mieux lire. » Jamais : les protections restent du début à la fin.", "«أنزع نظاراتي لأقرأ أحسن». أبدًا: وسائل الحماية تبقى من البداية إلى النهاية."]}, "l09_07": {"lvl": 1, "cmp": ["L'acide casse l'emballage des globules gras, l'alcool les aide à se regrouper, la centrifugeuse les fait monter.", "الحمض يكسر غلاف الكريات الدهنية، والكحول يساعدها على التجمّع، والطرد يرفعها."]}, "l09_09": {"lvl": 2, "trap": ["« 10 ou 12 mL de lait, c'est pareil. » Faux : il faut 11 mL exacts, la lecture en dépend.", "«10 أو 12 مل من الحليب، نفس الشيء». خطأ: يجب 11 مل بالضبط، فالقراءة تتعلق بذلك."]}, "l09_11": {"lvl": 1, "ex": ["Au laboratoire de réception d'une laiterie, la thermobalance donne l'EST sans attendre l'étuve.", "في مختبر استقبال معمل الحليب، الميزان الحراري يعطي EST دون انتظار الفرن."]}, "l09_13": {"lvl": 2, "ex": ["Un éleveur retire la crème pour faire son smen : son lait a une MG basse mais un ESD normal.", "مربٍّ ينزع القشدة ليصنع السمن: حليبه دسمه منخفض لكن ESD عادي."]}, "l09_15": {"lvl": 2, "trap": ["« 111,2 » tout seul ne vaut rien : un résultat s'écrit toujours avec son unité, 111,2 g/L.", "«111,2» وحدها لا قيمة لها: النتيجة تُكتب دائمًا بوحدتها، 111,2 غ/ل."]}, "l10_08": {"lvl": 1, "cmp": ["Cinq tests, c'est cinq portes : le lait doit toutes les franchir pour entrer au tank.", "خمسة اختبارات مثل خمسة أبواب: يجب أن يعبرها الحليب كلها ليدخل الخزان."]}, "l10_09": {"lvl": 2, "trap": ["« Le bleu reste longtemps, le lait est mauvais. » C'est l'inverse : plus il dure, meilleur est le lait.", "«الأزرق يبقى طويلًا، الحليب سيئ». العكس: كلما دام أكثر، كان الحليب أفضل."], "cmp": ["Les bactéries « boivent » l'oxygène : plus elles sont nombreuses, plus vite le bleu s'efface.", "البكتيريا «تشرب» الأكسجين: كلما كثرت، زال الأزرق أسرع."]}, "l10_11": {"lvl": 1, "ex": ["Une vache soignée aux antibiotiques : son lait, mélangé au camion, empêche le lben de se faire à l'usine.", "بقرة عولجت بالمضادات الحيوية: حليبها، إذا خُلط في الشاحنة، يمنع صنع اللبن في المصنع."]}, "l10_12": {"lvl": 1, "ex": ["Un lait de mammite mélangé à la citerne de la coopérative donne un jben qui caille mal.", "حليب التهاب الضرع المخلوط في صهريج التعاونية يعطي جبنًا يتخثّر بصعوبة."]}, "l10_14": {"lvl": 2}, "l10_16": {"lvl": 2, "trap": ["« Je compare seulement les acidités finales. » Faux : sans l'acidité de départ des deux laits, le calcul n'a aucun sens.", "«أقارن الحموضات النهائية فقط». خطأ: بدون الحموضة الأولية للحليبين، الحساب بلا معنى."]}, "l10_07": {"lvl": 1, "ex": ["Un lait instable qui caille dans l'échangeur à plaques bloque toute la ligne de pasteurisation.", "حليب غير ثابت يتخثّر في المبادل الحراري ذي الصفائح يعطّل كل خط البسترة."]}, "l10_13": {"lvl": 2, "trap": ["« Il est blanc et sent bon, j'accepte. » Non : une décision fondée sur l'aspect n'est pas une décision.", "«هو أبيض ورائحته طيبة، أقبله». لا: القرار المبني على المظهر ليس قرارًا."]}, "l11_03": {"lvl": 1, "ex": ["Sans ferments, pas de raïb ; sans présure, pas de jben ferme.", "بدون خمائر لا رايب؛ وبدون منفحة لا جبن صلب."]}, "l11_08": {"lvl": 1, "trap": ["« Tous les ferments travaillent à la même température. » Faux : mésophiles 20–30 °C, thermophiles 40–45 °C.", "«كل الخمائر تعمل في نفس الحرارة». خطأ: معتدلة الحرارة 20–30 °م، ومحبّة للحرارة 40–45 °م."]}, "l11_10": {"lvl": 2, "cmp": ["Comme deux ouvriers qui se passent des outils : ensemble, ils travaillent plus vite.", "مثل عاملين يتبادلان الأدوات: معًا يعملان أسرع."]}, "l11_12": {"lvl": 1, "ex": ["Le cahier des charges du sel acheté par une fromagerie fixe les limites en CaO, MgO et SO₃.", "دفتر تحمّلات الملح الذي تشتريه معملة الجبن يحدّد حدود CaO وMgO وSO₃."]}, "l11_14": {"lvl": 1, "cmp": ["La chymosine, ce sont des ciseaux précis qui coupent la caséine.", "الكيموزين مقصّ دقيق يقطع الكازيين."]}, "l11_13": {"lvl": 2, "trap": ["« Je mets t en minutes. » Faux : le temps se met en secondes, sinon la dose est fausse.", "«أضع t بالدقائق». خطأ: الزمن يوضع بالثواني، وإلا تكون الجرعة خاطئة."]}, "l11_16": {"lvl": 1, "trap": ["« Les sels de fonte servent à saler. » Non : ils émulsifient et donnent la texture lisse.", "«أملاح الصهر للتمليح». لا: إنها تستحلب وتعطي القوام الأملس."]}, "l11_18": {"lvl": 2, "ex": ["Au souk, le lait pasteurisé se vend en sachet souple, le lait UHT en brique multicouches.", "في السوق، الحليب المبستر يُباع في كيس مرن، وحليب UHT في علبة متعددة الطبقات."]}, "l11_20": {"lvl": 1}, "l12_03": {"lvl": 2, "ex": ["À la coopérative, le lait de ferme d'été et celui d'hiver n'ont pas la même MG. Le lait en sachet, lui, doit rester identique.", "في التعاونية، حليب الضيعة صيفًا وشتاءً ليس له نفس المادة الدسمة. أما الحليب في الأكياس فيجب أن يبقى مماثلًا."], "cmp": ["L'usine, c'est un moule : ce qui entre change chaque jour, ce qui sort a toujours la même forme.", "المصنع مثل قالب: ما يدخل يتغير كل يوم، وما يخرج له دائمًا نفس الشكل."]}, "l12_07": {"lvl": 1, "trap": ["« À 4 °C, le lait se garde aussi longtemps qu'on veut. » Faux : 48 heures au maximum. Le froid ralentit, il ne stérilise pas.", "«في 4 درجات يُحفظ الحليب المدة التي نريد». خطأ: 48 ساعة على الأكثر. البرد يبطئ ولا يعقّم."], "ex": ["Le camion-citerne arrive des fermes de la région. On pèse, on teste, puis seulement on décharge.", "تصل الشاحنة الصهريج من ضيعات المنطقة. نزن، نختبر، ثم فقط نفرغ."]}, "l12_09": {"lvl": 1, "trap": ["« Le filtre enlève les microbes. » Faux : il retient la paille et le sable, pas les bactéries.", "«المرشِّح يزيل الميكروبات». خطأ: يحجز التبن والرمل، وليس البكتيريا."], "cmp": ["Le filtre, c'est la passoire du couscous : il retient ce qui est gros, il laisse passer le liquide.", "المرشِّح مثل الكسكاس: يحجز ما هو كبير ويمرّر السائل."]}, "l12_11": {"lvl": 1, "cmp": ["La cavitation, ce sont des milliers de petites bulles qui éclatent contre la pompe, comme des coups de marteau.", "التجويف آلاف الفقاعات الصغيرة التي تنفجر على المضخة، مثل ضربات مطرقة."]}, "l12_13": {"lvl": 1, "ex": ["Le lait laissé au repos à la ferme fait remonter sa crème. L'écrémeuse fait la même chose, mais en continu et très vite.", "الحليب المتروك في الضيعة تصعد قشدته. آلة نزع القشدة تفعل نفس الشيء، لكن باستمرار وبسرعة كبيرة."], "trap": ["« On écrème le lait froid, à 4 °C. » Non : on travaille vers 45 °C, quand la matière grasse est fluide.", "«ننزع قشدة الحليب البارد في 4 درجات». لا: نعمل حوالي 45 درجة، عندما تكون المادة الدسمة سائلة."]}, "l12_15": {"lvl": 2, "trap": ["« Le lait est trop gras, on ajoute de l'eau. » Jamais : c'est un mouillage, une fraude. On ajoute du lait écrémé.", "«الحليب دسم أكثر من اللازم، نضيف الماء». أبدًا: إنه غش بالماء. نضيف حليبًا منزوع الدسم."], "ex": ["La crème retirée à l'écrémage n'est pas perdue : elle peut servir au beurre ou au smen de la coopérative.", "القشدة المنزوعة ليست ضائعة: يمكن أن تُستعمل للزبدة أو للسمن في التعاونية."]}, "l12_17": {"lvl": 2, "trap": ["« On soustrait dans n'importe quel sens. » Non : toujours la plus petite teneur de la plus grande, en diagonale.", "«نطرح في أي اتجاه». لا: دائمًا النسبة الأصغر من الأكبر، قطريًا."], "cmp": ["La croix, c'est une balance : plus un produit est loin de la cible, moins il en faut.", "الصليب مثل ميزان: كلما ابتعد منتوج عن الهدف قلّت الكمية اللازمة منه."]}, "l12_16": {"lvl": 2, "ex": ["Commande du jour à la laiterie : 500 L de demi-écrémé. Tu poses la croix, tu calcules, puis tu vérifies avant de lancer.", "طلبية اليوم في المحلبة: 500 ل من نصف منزوع الدسم. ترسم الصليب، تحسب، ثم تتحقق قبل الانطلاق."]}, "l13_03": {"lvl": 2, "ex": ["Au hanout, le lait en sachet est au frigo ; la brique UHT et la poudre restent sur l'étagère.", "في الحانوت، الحليب في الكيس داخل الثلاجة؛ وعلبة UHT والمسحوق يبقيان على الرف."], "trap": ["« Le lait pasteurisé est stérile. » Faux : il garde de la flore banale, d'où le froid et la DLC courte.", "«الحليب المبستر معقّم». خطأ: يحتفظ بفلورا عادية، ومن هنا البرد والصلاحية القصيرة."]}, "l13_08": {"lvl": 1, "cmp": ["De gros ballons remontent vite dans l'eau ; de minuscules billes restent en suspension. C'est pareil pour les globules gras.", "البالونات الكبيرة تصعد بسرعة في الماء؛ والكريات الصغيرة جدًا تبقى معلّقة. نفس الشيء لحبيبات الدهون."], "trap": ["« L'homogénéisation détruit les microbes. » Non : elle réduit la taille des globules gras, c'est tout.", "«التجنيس يدمّر الميكروبات». لا: يصغّر حبيبات الدهون فقط."]}, "l13_11": {"lvl": 2, "ex": ["Le dosage Gerber vu au TP 2 sert ici à valider une opération de l'atelier.", "معايرة جربر التي رأيتها في الأشغال التطبيقية 2 تُستعمل هنا للتحقق من عملية في الورشة."]}, "l13_13": {"lvl": 1, "cmp": ["C'est comme un four : très chaud mais très court, ou moins chaud mais plus long.", "إنه مثل الفرن: حار جدًا لكن قصير جدًا، أو أقل حرارة لكن أطول."], "trap": ["« Le lait à yaourt est chauffé fort pour la sécurité seulement. » Non : c'est surtout pour dénaturer les protéines solubles et raffermir le gel.", "«حليب الياغورت يُسخَّن بقوة للسلامة فقط». لا: خاصة لتمسيخ البروتينات الذائبة وتقوية الهلام."]}, "l13_16": {"lvl": 1, "trap": ["« Atteindre 72 °C suffit. » Non : sans chambreur, la température est atteinte mais pas maintenue.", "«الوصول إلى 72 درجة يكفي». لا: بدون حجرة الإبقاء نصل إلى الحرارة لكن لا نحافظ عليها."], "cmp": ["La récupération, c'est deux personnes qui se croisent : celle qui a chaud réchauffe celle qui a froid.", "الاسترجاع مثل شخصين يتقاطعان: من يشعر بالحرارة يدفّئ من يشعر بالبرد."]}, "l13_18": {"lvl": 2, "ex": ["Pour faire du jben, la coopérative évite de surchauffer le lait : il doit encore bien cailler.", "لصنع الجبن البلدي، تتجنب التعاونية تسخين الحليب أكثر من اللازم: يجب أن يبقى قادرًا على التخثر جيدًا."]}, "l13_20": {"lvl": 2, "trap": ["« Test phosphatase positif = bon lait. » Faux : positif veut dire enzyme présente, donc pasteurisation insuffisante.", "«اختبار فوسفاتاز إيجابي = حليب جيد». خطأ: إيجابي يعني أن الإنزيم موجود، إذن البسترة غير كافية."], "cmp": ["Les deux enzymes sont des témoins : si le témoin est encore vivant, le traitement n'a pas été assez fort.", "الإنزيمان شاهدان: إذا بقي الشاهد حيًا فالمعالجة لم تكن قوية كفاية."]}, "l14_03": {"lvl": 2, "ex": ["Le khlii et les figues séchées se gardent longtemps pour la même raison : on leur a retiré l'eau.", "الخليع والتين المجفف يُحفظان مدة طويلة لنفس السبب: نزعنا منهما الماء."]}, "l14_08": {"lvl": 2, "trap": ["« On fait bouillir le lait à 100 °C pour l'évaporer. » Non : sous vide, il bout à 68 °C au plus, sans goût de cuit.", "«نغلي الحليب في 100 درجة لتبخيره». لا: تحت الفراغ يغلي في 68 درجة على الأكثر، بدون طعم الطبخ."], "cmp": ["En montagne, l'eau du thé bout avant 100 °C. L'évaporateur crée cette « montagne » artificielle avec le vide.", "في الجبل يغلي ماء الشاي قبل 100 درجة. المبخّر يصنع هذا «الجبل» الاصطناعي بالفراغ."]}, "l14_10": {"lvl": 2, "trap": ["« Toutes les poudres se dissolvent pareil. » Faux : la poudre sur cylindres ne se dissout jamais complètement.", "«كل المساحيق تذوب بنفس الطريقة». خطأ: مسحوق الأسطوانات لا يذوب أبدًا بالكامل."], "cmp": ["L'atomisation, c'est un brumisateur géant dans un courant d'air chaud.", "الرذاذ مثل بخّاخ عملاق داخل تيار هواء ساخن."]}, "l14_13": {"lvl": 1, "ex": ["Dans une boulangerie qui prépare le msemen ou les pains au lait, une poudre high heat convient.", "في مخبزة تحضّر المسمن أو خبز الحليب، يناسب مسحوق high heat."]}, "l14_15": {"lvl": 1, "ex": ["Le raïb maison suit la même courbe : le lait reste liquide un moment, puis s'épaissit vite.", "الرايب في البيت يتبع نفس المنحنى: يبقى الحليب سائلًا مدة، ثم يتخثر بسرعة."], "trap": ["« Pendant la latence, rien ne se passe. » Faux : c'est pendant cette heure calme que tout se joue.", "«أثناء الكمون لا يحدث شيء». خطأ: في هذه الساعة الهادئة يتقرر كل شيء."]}, "l14_17": {"lvl": 1, "cmp": ["Le couple du yaourt, c'est deux cyclistes en tandem : ensemble, ils vont deux fois plus vite.", "زوج الياغورت مثل درّاجين على دراجة مزدوجة: معًا يسيران أسرع بمرتين."]}, "l14_19": {"lvl": 2, "trap": ["« Une cuve qui ne prend pas, c'est la faute du ferment. » Pas d'abord : la cause la plus fréquente, ce sont les inhibiteurs.", "«حوض لا يتخثر، الخطأ من الخميرة». ليس أولًا: السبب الأكثر تكرارًا هو المثبطات."], "ex": ["Une vache soignée aux antibiotiques ne doit pas livrer son lait : il bloquerait les cuves de lben.", "بقرة عولجت بالمضادات الحيوية لا يجب أن يُسلَّم حليبها: سيوقف أحواض اللبن."]}, "l14_07": {"lvl": 2, "trap": ["« T = volume final / volume initial. » Non : c'est l'inverse, et T est toujours plus grand que 1.", "«T = الحجم النهائي / الحجم الأولي». لا: العكس، وT دائمًا أكبر من 1."]}, "l15_08": {"lvl": 2, "ex": ["Le lait en sachet de la laiterie de ta ville est un lait pasteurisé : il va directement au frigo.", "الحليب في الأكياس من محلبة مدينتك حليب مبستر: يذهب مباشرة إلى الثلاجة."]}, "l15_06": {"lvl": 1, "trap": ["« Ma montre ne gêne pas. » Si : ni bijou ni montre sur une ligne alimentaire.", "«ساعتي لا تزعج». بل تزعج: لا حليّ ولا ساعة على خط غذائي."]}, "l15_10": {"lvl": 1, "cmp": ["La ligne, c'est une course de relais : chaque étape passe le lait à la suivante seulement si son contrôle est bon.", "الخط مثل سباق التتابع: كل مرحلة تسلّم الحليب للتالية فقط إذا كانت مراقبتها جيدة."]}, "l15_12": {"lvl": 2, "trap": ["« Une fois pasteurisé, le lait ne risque plus rien. » Faux : la recontamination après l'échangeur est la première cause de non-conformité.", "«بعد البسترة لا خطر على الحليب». خطأ: التلوث بعد المبادل هو أول سبب لعدم المطابقة."], "cmp": ["La vanne de recyclage, c'est un contrôleur à la porte : lait pas assez chaud, retour au départ.", "صمام إعادة التدوير مثل مراقب عند الباب: حليب غير ساخن كفاية، عودة إلى البداية."]}, "l15_07": {"lvl": 1, "ex": ["Si un client de Fès signale un problème, le numéro de lot permet de retrouver le lait cru et les relevés du jour.", "إذا أبلغ زبون من فاس عن مشكل، يسمح رقم الدفعة بإيجاد الحليب الخام وتسجيلات ذلك اليوم."]}, "l15_09": {"lvl": 2, "trap": ["« Rendement = volume initial / produit fini. » Non : c'est le produit fini divisé par le volume initial, fois 100.", "«المردود = الحجم الأولي / المنتوج النهائي». لا: المنتوج النهائي مقسوم على الحجم الأولي، مضروب في 100."]}, "l16_03": {"lvl": 2, "ex": ["Le raïb prend par l'acide des ferments ; une pâte pressée est caillée par la présure.", "الرايب يتخثر بحمض الخمائر؛ والجبن المضغوط يُخثَّر بالمنفحة."]}, "l16_08": {"lvl": 2, "trap": ["« Une seule bonne souche suffit. » En pratique, non : on utilise toujours des cultures mixtes.", "«سلالة واحدة جيدة تكفي». عمليًا لا: نستعمل دائمًا مزارع مختلطة."]}, "l16_10": {"lvl": 2, "cmp": ["Le calcium, c'est le ciment du caillé : la pasteurisation en retire une partie, le CaCl₂ la remet.", "الكالسيوم هو إسمنت الخثارة: البسترة تنزع جزءًا منه، وCaCl₂ يعيده."], "trap": ["« On ajoute du chlorure de calcium pour saler. » Non : c'est pour la coagulation, pas pour le goût.", "«نضيف كلوريد الكالسيوم للتمليح». لا: إنه للتخثر، وليس للذوق."]}, "l16_12": {"lvl": 1, "ex": ["Un jben frais est à dominante lactique ; une pâte pressée est à dominante présure.", "الجبن البلدي الطري بغلبة لبنية؛ والجبن المضغوط بغلبة المنفحة."], "cmp": ["Le gel lactique est comme du sable mouillé qui s'effrite ; le gel présure, comme une gomme qu'on coupe net.", "الهلام اللبني مثل رمل مبلل يتفتت؛ وهلام المنفحة مثل ممحاة تُقطع بشكل نظيف."]}, "l16_15": {"lvl": 1, "trap": ["« Pendant la phase primaire, on voit le lait épaissir. » Non : rien n'est encore visible dans la cuve.", "«أثناء المرحلة الأولى نرى الحليب يتكاثف». لا: لا شيء ظاهر بعد في الحوض."], "cmp": ["Couper, coller, serrer : on coupe les cheveux des micelles, elles se collent, puis le calcium serre le tout.", "قطع، لصق، شدّ: نقطع شعيرات المذيلات، فتلتصق، ثم يشدّ الكالسيوم الكل."]}, "l16_17": {"lvl": 2, "ex": ["Pour un fromage frais très humide, le fromager découpe peu et presse peu ; pour une pâte pressée, il découpe fin et presse.", "لجبن طري رطب جدًا، يقطّع صانع الجبن قليلًا ويضغط قليلًا؛ ولجبن مضغوط يقطّع دقيقًا ويضغط."]}, "l16_20": {"lvl": 1, "trap": ["« Le fromage est fini à la sortie du moule. » Non : il est seulement prêt à mûrir.", "«الجبن جاهز عند خروجه من القالب». لا: إنه فقط جاهز للنضج."]}, "l16_22": {"lvl": 2, "trap": ["« Un gros rendement, c'est toujours mieux. » Pas forcément : un fromage plus humide pèse plus mais se conserve moins.", "«مردود كبير أفضل دائمًا». ليس بالضرورة: جبن أرطب يزن أكثر لكنه يُحفظ أقل."], "ex": ["À la coopérative, le jben frais donne plus de kilos pour 100 L qu'une pâte pressée.", "في التعاونية، الجبن الطري يعطي كيلوغرامات أكثر لكل 100 ل من الجبن المضغوط."]}, "l17_08": {"lvl": 1, "trap": ["« Un lait fermenté par un seul ferment, c'est un yaourt. » Faux : il faut les deux espèces.", "«حليب مخمّر بخميرة واحدة هو ياغورت». خطأ: يجب النوعان معًا."], "cmp": ["Les deux ferments sont comme deux voisins qui s'échangent des services : chacun nourrit l'autre.", "الخميرتان مثل جارين يتبادلان الخدمات: كل واحدة تغذّي الأخرى."]}, "l17_10": {"lvl": 1, "ex": ["Dans une coopérative laitière, le lait est enrichi en poudre avant de devenir yaourt ferme en pots.", "في تعاونية حليبية، يُغنى الحليب بالمسحوق قبل أن يصبح ياغورتًا متماسكًا في علب."]}, "l17_06": {"lvl": 2, "trap": ["« Plus c'est chaud, plus les ferments travaillent vite. » Faux : au-dessus de 50 °C, ils meurent.", "«كلما كان أسخن عملت الخمائر أسرع». خطأ: فوق 50 درجة تموت."]}, "l17_11": {"lvl": 1, "ex": ["Au labo, tu vérifies 43 °C au thermomètre avant de verser les ferments, jamais « à la main ».", "في المختبر، تتحقق من 43 درجة بالمحرار قبل صب الخمائر، لا «باليد» أبدًا."]}, "l17_16": {"lvl": 1, "cmp": ["Le ferme, c'est un gâteau cuit dans son moule ; le brassé, une pâte préparée en bassine puis répartie.", "المتماسك مثل كعكة تُطهى في قالبها؛ والمخفوق مثل عجين يُحضَّر في إناء ثم يُوزَّع."], "trap": ["« On peut ouvrir l'étuve pour regarder. » Non : chaque ouverture ralentit l'acidification du lot.", "«يمكن فتح الحاضنة للنظر». لا: كل فتح يُبطئ تحميض الدفعة."]}, "l17_13": {"lvl": 2, "ex": ["Un raïb qui rend beaucoup de petit-lait dans le pot fait penser à une sur-acidification.", "رايب يُخرج كثيرًا من المصل في العلبة يوحي بتحميض زائد."]}, "l17_12": {"lvl": 2, "ex": ["Un lben laissé trop longtemps au chaud devient très acide : c'est la même logique.", "اللبن المتروك طويلًا في الحرارة يصبح حامضًا جدًا: إنه نفس المنطق."]}, "l18_08": {"lvl": 2, "cmp": ["Le yaourt a une armure : son acidité. Le dessert lacté n'en a pas, seule la chaleur le protège.", "للياغورت درع: حموضته. أما الحلوى اللبنية فبلا درع، والحرارة وحدها تحميها."]}, "l18_10": {"lvl": 2, "ex": ["C'est comme pour une crème maison : on ne jette pas la maïzena d'un coup dans le lait froid.", "كما في كريمة البيت: لا نرمي النشا دفعة واحدة في الحليب البارد."]}, "l18_11": {"lvl": 1, "trap": ["« Les poudres d'abord, le lait ensuite, c'est pareil. » Faux : l'ordre est la cause n° 1 des grumeaux.", "«المساحيق أولًا ثم الحليب، نفس الشيء». خطأ: الترتيب هو السبب الأول للتكتلات."]}, "l18_16": {"lvl": 1, "trap": ["« On peut secouer le chariot de pots pour aller plus vite. » Non : le gel en formation se casse.", "«يمكن هزّ عربة العلب للإسراع». لا: الهلام الذي يتكوّن ينكسر."]}, "l18_13": {"lvl": 2, "trap": ["« Du sérum sur le dessert ? On double le gélifiant. » Non : d'abord l'extrait sec, sinon texture caoutchouteuse.", "«مصل فوق الحلوى؟ نضاعف المهلّم». لا: أولًا المادة الجافة، وإلا قوام مطاطي."], "ex": ["Un flan vendu au souk avec des points noirs : pense levures ou moisissures, donc hygiène.", "فلان يُباع في السوق بنقط سوداء: فكّر في الخمائر أو الأعفان، أي النظافة."]}, "l18_07": {"lvl": 1, "cmp": ["Le gélifiant, c'est un filet de pêche : il retient l'eau dans ses mailles.", "المهلّم مثل شبكة صيد: يحبس الماء في عيونها."]}, "l18_06": {"lvl": 2, "ex": ["Comme pour une bouillie qui épaissit sur le feu : on remue sans arrêt, sinon elle projette.", "كما في عصيدة تتكثّف على النار: نحرّك دون توقف، وإلا تتطاير."]}, "l19_08": {"lvl": 1, "cmp": ["Dans la crème, des gouttes de gras nagent dans l'eau ; dans le beurre, des gouttes d'eau nagent dans le gras.", "في القشدة، قطرات دهن تسبح في الماء؛ وفي الزبدة، قطرات ماء تسبح في الدهن."], "ex": ["Le lben de la ferme qui reste après la zebda, c'est un babeurre.", "اللبن الذي يبقى في الضيعة بعد استخراج الزبدة هو لبن مخيض."]}, "l19_10": {"lvl": 1}, "l19_06": {"lvl": 2, "trap": ["« On remplit la baratte à ras pour aller plus vite. » Faux : trop pleine, elle ne baratte pas.", "«نملأ المخضّة حتى الحافة لنسرع». خطأ: الممتلئة جدًا لا تخضّ."]}, "l19_11": {"lvl": 1, "ex": ["Dans la chekoua, la femme de la ferme regarde aussi apparaître les grains avant d'arrêter.", "في الشكوة، تراقب امرأة الضيعة أيضًا ظهور الحبيبات قبل التوقف."]}, "l19_18": {"lvl": 2, "trap": ["« L'eau du robinet suffit pour laver. » Non : elle doit être à 5 °C, sinon le beurre fond.", "«ماء الصنبور يكفي للغسل». لا: يجب أن يكون في 5 درجات، وإلا تذوب الزبدة."]}, "l19_13": {"lvl": 2, "cmp": ["Le babeurre est le « ticket de caisse » du barattage : sa MG dit combien tu as perdu.", "اللبن المخيض هو «فاتورة» الخض: مادته الدسمة تقول كم خسرت."]}, "l19_15": {"lvl": 2, "trap": ["« Beurre théorique = MG × 0,82. » Faux : on divise par 0,82, le beurre pèse plus que sa MG.", "«الزبدة النظرية = المادة الدسمة × 0,82». خطأ: نقسم على 0,82، فالزبدة أثقل من مادتها الدسمة."]}, "l19_14": {"lvl": 2, "ex": ["Une coopérative qui reçoit 200 kg de crème à 38 % peut prévoir environ 46 % de rendement.", "تعاونية تستقبل 200 كغ من القشدة بـ 38 % يمكنها توقّع مردود حوالي 46 %."]}, "l20_08": {"lvl": 1, "ex": ["Le jben frais du souk est proche de cette famille : un caillé égoutté, non affiné.", "الجبن البلدي الطري في السوق قريب من هذه العائلة: خثارة مصفّاة غير معتّقة."], "cmp": ["Même départ que le yaourt, mais ici on égoutte : on concentre les caséines.", "نفس بداية الياغورت، لكن هنا نصفّي: نركّز الكازيين."]}, "l20_10": {"lvl": 1, "trap": ["« Plus de présure, c'est plus rapide et c'est pareil. » Non : la présure reste un appoint, 1 à 20 mL/100 L.", "«منفحة أكثر أسرع ونفس الشيء». لا: المنفحة تبقى مساعدة، 1 إلى 20 مل/100 لتر."]}, "l20_06": {"lvl": 2, "trap": ["« Le sérum, on le jette à l'évier. » Non : il se pèse d'abord, c'est la moitié du bilan.", "«المصل نرميه في المغسلة». لا: يوزن أولًا، إنه نصف الحصيلة."]}, "l20_15": {"lvl": 2, "ex": ["À la ferme, le jben s'égoutte dans un tissu suspendu : c'est l'égouttage lent en toile.", "في الضيعة، يتصفّى الجبن في قماش معلّق: إنها التصفية البطيئة في القماش."]}, "l20_12": {"lvl": 1, "trap": ["« Un lait plus gras donne toujours plus de fromage. » Faux : c'est la caséine qui fait le fromage.", "«الحليب الأكثر دسمًا يعطي دائمًا جبنًا أكثر». خطأ: الكازيين هو الذي يصنع الجبن."]}, "l20_27": {"lvl": 1, "ex": ["100 L de lait donnent environ 15 à 20 kg de fromage frais : le reste part en sérum.", "100 لتر من الحليب تعطي حوالي 15 إلى 20 كغ من الجبن الطري: والباقي يذهب مصلًا."]}, "l20_11": {"lvl": 2, "cmp": ["Égoutter, c'est essorer une éponge : plus tu essores, plus elle est légère et ferme.", "التصفية مثل عصر الإسفنجة: كلما عصرت أكثر صارت أخف وأصلب."]}, "l21_07": {"lvl": 1, "trap": ["« Pâte molle = fromage frais. » Faux : la pâte molle est affinée, le fromage frais non.", "«العجينة الطرية = الجبن الطري». خطأ: العجينة الطرية معتّقة، والجبن الطري لا."]}, "l21_08": {"lvl": 1, "cmp": ["Même caillé de départ, quatre « habits » différents : sans croûte, fleurie, lavée ou bleue.", "نفس الخثارة في البداية، وأربعة «ألبسة» مختلفة: بدون قشرة، مزهرة، مغسولة أو زرقاء."]}, "l21_10": {"lvl": 1, "ex": ["Une petite fromagerie de coopérative peut produire une feta en saumure avec ce diagramme.", "يمكن لمجبنة صغيرة في تعاونية إنتاج فيتا في محلول ملحي بهذا المخطط."]}, "l21_12": {"lvl": 2, "trap": ["« Brasser fort, ça égoutte plus vite. » Faux : on casse les grains et on perd des fines.", "«التحريك بقوة يسرّع التصفية». خطأ: نكسر الحبيبات ونفقد الدقائق."], "cmp": ["Le caillé se traite comme des œufs : avec douceur, sinon il se casse.", "تُعامل الخثارة مثل البيض: بلطف، وإلا انكسرت."]}, "l21_11": {"lvl": 2, "ex": ["Les olives et le jben conservés dans l'eau salée profitent aussi du sel qui freine les germes.", "الزيتون والجبن المحفوظان في الماء المالح يستفيدان أيضًا من الملح الذي يكبح الجراثيم."]}, "l21_06": {"lvl": 2, "trap": ["« La saumure se garde indéfiniment. » Non : vieillie, elle contamine tous les fromages.", "«المحلول الملحي يُحفظ إلى الأبد». لا: إذا قدم لوّث كل الأجبان."]}, "l21_09": {"lvl": 1}, "l22_08": {"lvl": 1, "trap": ["« Tous les fromages sont caillés par l'acidité. » Faux : la pâte pressée est caillée par la présure.", "«كل الأجبان تتخثّر بالحموضة». خطأ: العجينة المضغوطة تتخثّر بالمنفحة."]}, "l22_10": {"lvl": 1}, "l22_06": {"lvl": 2, "ex": ["Dans une fromagerie, on vérifie le thermomètre de la cave la veille, avant d'y entrer les meules.", "في مجبنة، نتحقق من محرار الكهف في اليوم السابق، قبل إدخال الأقراص."]}, "l22_12": {"lvl": 2, "cmp": ["Presser un fromage, c'est comme essorer du linge : doucement d'abord, puis plus fort.", "ضغط الجبن مثل عصر الثياب: بلطف أولًا ثم بقوة أكبر."], "trap": ["« Plus je presse fort au début, plus il sèche vite. » Faux : la croûte se ferme et piège le sérum.", "«كلما ضغطت بقوة في البداية جفّ أسرع». خطأ: القشرة تُغلق وتحبس المصل."]}, "l22_11": {"lvl": 1}, "l22_09": {"lvl": 2, "cmp": ["Le lactose est le « carburant » de l'acidité : on en retire une partie, la pâte reste plus douce.", "اللاكتوز هو «وقود» الحموضة: نزيل جزءًا منه فتبقى العجينة أقل حموضة."]}, "l22_07": {"lvl": 2, "ex": ["Le jben frais se garde quelques jours au froid ; une meule de pâte pressée se garde des mois.", "الجبن الطري يُحفظ بضعة أيام في البرودة؛ وقرص العجينة المضغوطة يُحفظ شهورًا."]}}, "chap": {"1": {"mnemo": [{"t": ["Les références du lait normal", "مراجع الحليب العادي"], "x": ["« 14-18, 6-6-8, 28-33 » : 14 à 18 °D, pH 6,6 à 6,8, densité 1 028 à 1 033. Et « 125-135 » pour l'EST.", "«14-18، 6-6-8، 28-33»: من 14 إلى 18 °D، pH من 6,6 إلى 6,8، كثافة 1 028 إلى 1 033. و«125-135» للمستخلص الجاف الكلي."], "s": [6, 7, 8, 9]}, {"t": ["Soupçonne, oriente, prouve", "تشكّ، توجّه، تُثبت"], "x": ["« DMP » : la Densité soupçonne, la MG oriente, l'ESD Prouve. C'est le croisement qui décide.", "«ك-د-م»: الكثافة تشكّ، والدسم يوجّه، والمستخلص الجاف منزوع الدسم يُثبت. المقارنة هي التي تقرّر."], "s": [8, 9]}, {"t": ["L'ordre Gerber", "ترتيب جيربر"], "x": ["« A-L-A » : Acide, Lait, Alcool — 10, 11, 1 mL. L'acide toujours en premier.", "«ح-ح-ك»: حمض، حليب، كحول — 10، 11، 1 مل. الحمض دائمًا أولًا."], "s": [8, 9]}], "map": {"c": ["Maîtriser le lait qui entre à l'usine", "التحكم في الحليب الذي يدخل المصنع"], "b": [{"t": ["Le lait à la ferme", "الحليب في الضيعة"], "i": [["Sécrétion normale, sans addition ni soustraction", "إفراز عادي، دون إضافة ولا نزع"], ["Traite hygiénique, froid à 4 °C", "حلب صحي، تبريد إلى 4 °م"], ["Facteurs : animal, élevage, milieu", "العوامل: الحيوان، التربية، الوسط"]]}, {"t": ["Composition", "التركيب"], "i": [["Eau 900 à 910 g/L", "الماء 900 إلى 910 غ/ل"], ["Caséines → fromage ; protéines solubles → sérum", "الكازيينات ← الجبن؛ البروتينات الذائبة ← المصل"], ["EST 125 à 135 g/L, ESD ≈ 90 g/L", "EST من 125 إلى 135 غ/ل، ESD ≈ 90 غ/ل"]]}, {"t": ["Laits anormaux", "أنواع الحليب غير العادي"], "i": [["Colostral, mammiteux, de rétention", "اللبأ، حليب التهاب الضرع، حليب الاحتباس"], ["Mouillé, écrémé, neutralisé", "مضاف إليه الماء، منزوع الدسم، مُعادَل"], ["Antibiotiques : ferments inhibés", "المضادات الحيوية: الخمائر مثبَّطة"]]}, {"t": ["Analyses physico-chimiques", "التحاليل الفيزيائية والكيميائية"], "i": [["Dornic, pH, densité corrigée", "دورنيك، pH، كثافة مصحَّحة"], ["Gerber, EST, ESD", "جيربر، EST، ESD"], ["Croiser : densité, MG, ESD", "المقارنة: الكثافة، الدسم، ESD"]]}, {"t": ["Tests de réception", "اختبارات الاستقبال"], "i": [["Réductase : charge microbienne", "الريدوكتاز: الحمولة الميكروبية"], ["Antibiotiques, Teepol", "المضادات الحيوية، تيبول"], ["Alcool, ébullition : stabilité", "الكحول، الغليان: الثبات"], ["Accepter, déclasser, refuser", "القبول، التصنيف الأدنى، الرفض"]]}, {"t": ["Intrants et emballages", "المدخلات والتعبئة"], "i": [["Ferments, présure, sels de fonte", "الخمائر، المنفحة، أملاح الصهر"], ["Vp = 2 400 × Vl / (F × t)", "حجم المنفحة: Vp = 2 400 × Vl / (F × t)"], ["PEHD, PS, carton multicouches", "PEHD، PS، الكرتون متعدد الطبقات"]]}]}, "case": {"t": ["Le camion de 6 h à la coopérative", "شاحنة السادسة صباحًا في التعاونية"], "ctx": ["Tu es au laboratoire de réception d'une coopérative laitière du Souss. Un camion-citerne de lait cru arrive à 6 h. Le chauffeur est pressé de décharger.", "أنت في مختبر الاستقبال لتعاونية حليبية في سوس. تصل شاحنة صهريج من الحليب الخام في السادسة صباحًا. السائق مستعجل لتفريغ الحمولة."], "steps": [{"q": ["Le lait est blanc, froid et sans odeur. Le chauffeur dit : « Il est parfait, pas besoin d'analyse. » Que fais-tu ?", "الحليب أبيض وبارد وبدون رائحة. يقول السائق: «إنه ممتاز، لا حاجة للتحليل». ماذا تفعل؟"], "o": [["Tu acceptes, l'aspect est bon", "Tu fais les analyses de réception", "Tu goûtes le lait"], ["تقبل، المظهر جيد", "تُجري تحاليل الاستقبال", "تتذوّق الحليب"]], "a": 1, "fb": ["Une décision se justifie par un résultat, jamais par une impression. Tu lances la réductase et les tests rapides.", "القرار يُبرَّر بنتيجة، وأبدًا بانطباع. تبدأ الريدوكتاز والاختبارات السريعة."]}, {"q": ["La bandelette antibiotique montre un seul trait. Le Dornic donne 16 °D. Que conclus-tu à ce stade ?", "شريط المضادات الحيوية يُظهر خطًا واحدًا. دورنيك يعطي 16 °D. ماذا تستنتج في هذه المرحلة؟"], "o": [["Pas d'antibiotique, acidité normale : on continue les analyses", "Le lait est refusé", "Le lait est en acidification"], ["لا مضادات حيوية، حموضة عادية: نكمل التحاليل", "الحليب مرفوض", "الحليب في طور التحمّض"]], "a": 0, "fb": ["Un trait = négatif ; 16 °D est dans la plage 14–18 °D. Il reste à vérifier la composition.", "خط واحد = سلبي؛ و16 °D ضمن المجال 14–18 °D. يبقى التحقق من التركيب."]}, {"q": ["La densité lue est 1 026 à 10 °C. Quelle densité corrigée retiens-tu ?", "الكثافة المقروءة 1 026 في 10 °م. ما الكثافة المصحَّحة التي تعتمد؟"], "o": [["1 026", "1 028", "1 024"], ["1 026", "1 028", "1 024"]], "a": 2, "fb": ["D₂₀ = 1 026 + 0,2 × (10 − 20) = 1 024 : c'est sous 1 028, le mouillage est soupçonné.", "D₂₀ = 1 026 + 0,2 × (10 − 20) = 1 024: أقل من 1 028، نشكّ في إضافة الماء."]}, {"q": ["La MG Gerber est de 34 g/L, l'EST calculé est très inférieur à 125 g/L et l'ESD est bas. Quel verdict ?", "دسم جيربر 34 غ/ل، وEST المحسوب أقل بكثير من 125 غ/ل، وESD منخفض. ما الحكم؟"], "o": [["Écrémage", "Mouillage", "Lait conforme"], ["نزع الدسم", "إضافة الماء", "حليب مطابق"]], "a": 1, "fb": ["Densité basse + EST bas + MG normale : mouillage. L'ESD bas le prouve.", "كثافة منخفضة + EST منخفض + دسم عادي: إضافة الماء. وESD المنخفض يُثبت ذلك."]}, {"q": ["Le chef propose d'ajouter de la poudre de lait pour rattraper le lot. Quelle est la bonne décision ?", "يقترح الرئيس إضافة مسحوق الحليب لتدارك الدفعة. ما القرار الصحيح؟"], "o": [["Corriger avec la poudre et accepter", "Mélanger au tank avec un bon lait", "Refuser le lot, signer la fiche et alerter le fournisseur"], ["التصحيح بالمسحوق والقبول", "الخلط في الخزان مع حليب جيد", "رفض الدفعة، توقيع البطاقة، وتنبيه المورّد"]], "a": 2, "fb": ["Corriger la fraude reviendrait à l'accepter. Le refus est écrit, daté, signé et fondé sur les analyses.", "تصحيح الغش يعني قبوله. الرفض مكتوب ومؤرَّخ وموقَّع ومبني على التحاليل."]}], "end": ["Tu as appris qu'un lait se juge sur des chiffres croisés, pas sur son aspect, et qu'une décision de réception se justifie et se signe.", "تعلّمت أن الحليب يُحكم عليه بأرقام متقاطعة لا بمظهره، وأن قرار الاستقبال يُبرَّر ويُوقَّع."]}, "hot": {"l07_07": [{"x": 17, "y": 28, "t": ["Acidité Dornic", "حموضة دورنيك"], "d": ["Mesure l'acide lactique déjà formé : 14 à 18 °D pour un lait frais.", "تقيس حمض اللبنيك المتكوّن: من 14 إلى 18 °D لحليب طازج."]}, {"x": 51, "y": 28, "t": ["pH", "الـ pH"], "d": ["Acidité libre à l'instant de la mesure : 6,6 à 6,8.", "الحموضة الحرة لحظة القياس: من 6,6 إلى 6,8."]}, {"x": 83, "y": 28, "t": ["Densité", "الكثافة"], "d": ["1 028 à 1 033 à 20 °C : en dessous mouillage, au-dessus écrémage.", "من 1 028 إلى 1 033 في 20 °م: أقل إضافة الماء، أكثر نزع الدسم."]}, {"x": 50, "y": 79, "t": ["Lait neutralisé", "الحليب المُعادَل"], "d": ["pH normal mais Dornic anormal : on fait toujours les deux mesures.", "pH عادي لكن دورنيك غير عادي: نقوم دائمًا بالقياسين."]}], "l08_17": [{"x": 14, "y": 22, "t": ["Lait conforme", "حليب مطابق"], "d": ["Densité, MG et EST normaux.", "الكثافة والدسم وEST عادية."]}, {"x": 38, "y": 22, "t": ["Lait mouillé", "حليب مضاف إليه الماء"], "d": ["Densité basse, EST bas, MG normale.", "كثافة منخفضة، EST منخفض، دسم عادي."]}, {"x": 62, "y": 22, "t": ["Lait écrémé", "حليب منزوع الدس , "920 ل", "784 ل"]], "a": 2, "fb": ["Croix : 29 parts d'entier et 8 d'écrémé, soit 784 L et 216 L. La moyenne pondérée retombe sur 30 g/L.", "الصليب: 29 جزءًا من الكامل و8 من منزوع الدسم، أي 784 ل و216 ل. المتوسط المرجّح يعود إلى 30 غ/ل."]}, {"q": ["Après pasteurisation, le test phosphatase est positif. Que décides-tu ?", "بعد البسترة، اختبار الفوسفاتاز إيجابي. ماذا تقرر؟"], "o": [["On conditionne quand même", "On bloque le lot : la pasteurisation est insuffisante", "On ajoute du lait écrémé"], ["نعبّئ رغم ذلك", "نوقف الدفعة: البسترة غير كافية", "نضيف حليبًا منزوع الدسم"]], "a": 1, "fb": ["La phosphatase aurait dû être détruite vers 72 °C en 15 s. On contrôle le barème, le chambreur et la vanne de recyclage.", "كان يجب أن يُدمَّر الفوسفاتاز حوالي 72 درجة في 15 ثانية. نراقب البرنامج الحراري وحجرة الإبقاء وصمام إعادة التدوير."]}, {"q": ["Pour le jben, le lait pasteurisé donne un caillé mou. Que fais-tu à la maturation ?", "للجبن البلدي، الحليب المبستر يعطي خثارة رخوة. ماذا تفعل أثناء الإنضاج؟"], "o": [["J'ajoute environ 0,1 % de CaCl₂", "Je chauffe à 85 °C", "J'agite après la présure"], ["أضيف حوالي 0,1٪ من CaCl₂", "أسخّن إلى 85 درجة", "أحرّك بعد المنفحة"]], "a": 0, "fb": ["La pasteurisation a rendu du calcium indisponible. Avec le CaCl₂, le caillé devient ferme et régulier.", "البسترة جعلت جزءًا من الكالسيوم غير متاح. مع CaCl₂ تصبح الخثارة متماسكة ومنتظمة."]}], "end": ["Chaque opération a un but et un contrôle : c'est ainsi qu'un lait variable devient un produit constant, sûr et bon à transformer.", "لكل عملية هدف ومراقبة: هكذا يصبح حليب متغيّر منتوجًا ثابتًا وآمنًا وصالحًا للتحويل."]}, "hot": {"l12_13": [{"x": 14, "y": 43, "t": ["Lait entier à 45 °C", "حليب كامل في 45 درجة"], "d": ["Le lait entre chaud : la matière grasse est fluide et se sépare mieux.", "يدخل الحليب ساخنًا: المادة الدسمة سائلة وتنفصل بشكل أفضل."]}, {"x": 44, "y": 44, "t": ["Écrémeuse (bol à assiettes)", "آلة نزع القشدة (وعاء ذو صحون)"], "d": ["La centrifugation sépare les globules gras, légers, du hiffres, ⚡ duel éclair avec les camarades en ligne et 📚 salle de révision.", "👥 Mission et guerre des groupes, 🔥 binômes avec flamme partagée, 👏 encouragements et 🎴 album de stickers à échanger.", "🎲 Jeux à plusieurs sur un seul téléphone : duel buzzer, tour de table, devine le mot et mime du labo."], "ar": ["🌐 أسمكتي أصبح على الإنترنت! أنشئ ملفك باسم مستعار (لا اسم حقيقي) وانضم إلى مجموعة قسمك.", "🏆 ترتيب أفضل 20: المجموعة أو المؤسسة أو كل المغرب، أسبوعيًا أو شهريًا أو منذ البداية. مرتبتك والفارق مع التالي.", "🥇 دوريات الأسبوع (برونزي ← سيد المختبر)، السجل والكؤوس.", "📅 تحدي اليوم لكل المغرب، 🏟️ دوري نهاية الأسبوع و⚔️ مبارزات تُرسل عبر واتساب.", "📡 مسابقة مباشرة برمز من 4 أرقام، ⚡ مبارزة سريعة مع الزملاء المتصلين و📚 قاعة مراجعة.", "👥 مهمة وحرب المجموعات، 🔥 ثنائيات بشعلة مشتركة، 👏 تشجيعات و🎴 ألبوم ملصقات للتبادل.", "🎲 ألعاب جماعية على هاتف واحد: مبارزة الزر، دورة الطاولة، خمّن الكلمة والتمثيل الصامت."]}, {"v": "1.9", "d": "27/09/2026", "fr": ["🔢 Étapes mieux numérotées : dans les méthodes (analyse microbiologique, nettoyage-désinfection, fabrications laitières…), chaque étape a désormais son propre numéro."], "ar": ["🔢 ترقيم أوضح للخطوات: في الطرق (التحليل الميكروبيولوجي، التنظيف والتطهير، التصنيع اللبني…) أصبح لكل خطوة رقمها الخاص."]}, {"v": "1.8", "d": "27/09/2026", "fr": ["🎧 Lecture suivie : pendant l'écoute, le texte de la carte défile et la phrase lue s'illumine (et même le mot, si ton téléphone le permet).", "👆 Touche une phrase pour reprendre la lecture à cet endroit. ↺ relit la phrase précédente.", "⚙️ Choisis la vitesse (0,8× à 1,2×), la taille du texte (A− / A+) et passe du français à l'arabe sans quitter l'écoute.", "🎯 Séance écoutée jusqu'au bout = cartes révisées, +15 XP et mini-test proposé."], "ar": ["🎧 قراءة متتبَّعة: أثناء الاستماع يتحرك نص البطاقة وتُضاء الجملة المقروءة (وحتى الكلمة إذا سمح هاتفك بذلك).", "👆 المس جملة لتستأنف القراءة منها. ↺ يعيد الجملة السابقة.", "⚙️ اختر السرعة (من 0,8× إلى 1,2×) وحجم النص (A− / A+) وانتقل بين الفرنسية والعربية د ": "1.4", "d": "26/09/2026", "fr": ["👋 Tes mascottes changent de nom : voici Nouran et Fahim ! Choisis la tienne dans Mon profil."], "ar": ["👋 مرافقاك يغيّران اسميهما: إليك نوران وفهيم! اختر مرافقك في ملفي."]}, {"v": "1.3", "d": "26/09/2026", "fr": ["✨ Page de garde allégée : la version s'affiche sans la date."], "ar": ["✨ صفحة غلاف أخف: يظهر رقم الإصدار بدون التاريخ."]}, {"v": "1.2", "d": "26/09/2026", "fr": ["🥽 Nouvelles tenues illustrées pour les avatars : lunettes au labo, loupe, toque d'hygiène et toque de diplômé·e.", "🔒 Les accessoires de niveau (gants, microscope, médaille) portent un cadenas jusqu'à ce que tu les gagnes."], "ar": ["🥽 ألبسة مرسومة جديدة للشخصيات: نظارات في المختبر، عدسة، قبعة النظافة وقبعة التخرج.", "🔒 إكسسوارات المستوى (قفازات، مجهر، ميدالية) تبقى مقفلة حتى تربحها."]}, {"v": "1.1", "d": "26/09/2026", "fr": ["🤝 Choisis ta mascotte : Nouran ou Fahim. Va dans Mon profil (touche ton avatar sur l'accueil).", "📲 Installe Asmekti sur ton téléphone en un geste : bouton « Installer » sur l'accueil, avec un guide pour iPhone.", "🧑‍🎓 10 nouveaux avatars de stagiaires à choisir dans Mon profil."], "ar": ["🤝 اختر مرافقك: نوران أو فهيم. ادخل إلى ملفي (المس شخصيتك في الصفحة الرئيسية).", "📲 ثبّت Asmekti على هاتفك بلمسة واحدة: زر «تثبيت» في الصفحة الرئيسية، مع دليل خاص بالآيفون.", "🧑‍🎓 10 شخصيات جديدة للمتدربين تختار منها في ملفي."]}, {"v": "1.0", "d": "25/09/2026", "fr": ["Première version"], "ar": ["الإصدار الأول"]}], "v": "2.3"};

let MODID="micro", S_BY={}, ALL=[];
function curMod(){return DATA.modules.find(m=>m.id===MODID)||DATA.modules[0]}
const mk=k=>MODID==="micro"?k:k+"_"+MODID;            // clés de stockage propres à chaque module
function useModule(id){
  MODID=DATA.mods[id]?id:"micro"; save("mr_mod",MODID); const M=DATA.mods[MODID];
  Object.assign(DATA,{seances:M.seances,chaps:M.chaps,glossary:M.glossary,seq:M.seq,pairs:M.pairs,who:M.who,ped:M.ped});
  S_BY={}; DATA.seances.forEach(s=>S_BY[s.n]=s);
  ALL=[]; DATA.seances.forEach(s=>s.c.forEach((c,i)=>ALL.push({s:s.n,i})));
  try{VF_POOL=ALL.filter(r=>!/\bPAS\b|n'est pas/i.test(S_BY[r.s].c[r.i].q[0]))}catch(e){}
  try{PED=DATA.ped}catch(e){}
  try{st.last=load(mk("mr_last"),null);st.deck=null;st.xdeck=null;st.game=null;st.exam=null;st.qz=null;st.cs=null;st.au=null}catch(e){}
}
function openModule(id){useModule(id);seenItem("m_"+id);go("m")}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
useModule(load("mr_mod","micro"));

function P(img){return st.prog[img]||{}}

function applyLang(){
  const ar=st.lang==="ar";
  document.documentElement.lang=ar?"ar":"fr"; document.documentElement.dir=ar?"rtl":"ltr";
  document.getElementById("lang").textContent=ar?"FR":"ع";
  document.getElementById("back").textContent=ar?"›":"‹";
}
document.getElementById("lang").onclick=()=>{st.lang=st.lang==="ar"?"fr":"ar";save("mr_lang",st.lang);applyLang();render()};
function inExam(){return location.hash==="#e"&&st.exam&&!st.exam.done}
function leave(to){if(inExam()&&!confirm(T("examQuit")))return;if(inExam()){clearInterval(st.timer);st.exam=null}go(to)}
document.getElementById("back").onclick=()=>{const h=location.hash.slice(1);
  if(h==="c"){return go(st.mode==="q"?"q":st.mode==="w"?"e":"")}
  if(h[0]==="W"&&h!=="W"){return go(/^WX./.test(h)?"WX":/^WQ\d/.test(h)?(rpc("room_leave",{p_code:h.slice(2)}).catch(()=>{}),"W"):"W")}
  leave(/^s\d+$/.test(h)?"m":/^[vpodyi]$/.test(h)?"j":"")};
document.getElementById("home").onclick=()=>leave("");
document.querySelector(".top .logo").onclick=()=>{if(location.hash)leave("")};

function go(h){ if(location.hash==="#"+h||(!h&&!location.hash)) render(); else location.hash=h; }

function setTop(title,sub,back){
  document.getElementById("ttl").innerHTML=esc(title)+(sub?`<small>${esc(sub)}</small>`:"");
  document.getElementById("back").hidden=!back;
  document.getElementById("home").hidden=!back;
}
function counts(list){let seen=0,ok=0;list.forEach(r=>{const p=P(S_BY[r.s].c[r.i].img);if(p.seen)seen++;if(p.ok)ok++});return{seen,ok}}
function sessCards(n){return S_BY[n].c.map((c,i)=>({s:n,i}))}

function render(){
  applyLang(); applyPrefs();
  const h=location.hash.slice(1);
  document.getElementById("pager").innerHTML="";
  stopSpeak(); if(h!=="e"&&h!=="v") clearInterval(st.timer);
  if(h==="m") return vModule();
  if(/^s\d+$/.test(h)) return vSessIntro(+h.slice(1));
  if(h==="Q") return vQuiz();
  if(/^n[A-Z0-9]$/.test(h)) return vMap(h[1]);
  if(/^z[A-Z0-9]$/.test(h)) return vCase(h[1]);
  if(h==="h") return vHub();
  if(/^a\d*$/.test(h)) return vAudio(+h.slice(1)||0);
  if(h==="r") return vBilan();
  if(h[0]==="W") return vWeb(h.slice(1));
  if(h[0]==="R") return vTeacher(h.slice(1));
  if(h==="x") return vExpress();
  if(h==="c") return st.deck?cardView():vHome();
  if(h==="e") return vExam();
  if(h==="f") return vFav();
  if(h==="q") return vSearch();
  if(h==="g") return vGlossary();
  if(h==="b") return vBadges();
  if(h==="k") return vFlip();
  if(h==="j") return vGames();
  if(h==="v") return vVF();
  if(h==="p") return vPairs();
  if(h==="o") return vOrder();
  if(h==="d") return vDefi();
  if(h==="y") return vWho();
  if(h==="t") return vSettings();
  if(h==="u") return vProfile();
  vHome();
}

let voices=[], SPK=0;
function loadVoices(){try{voices=speechSynthesis.getVoices()||[]}catch(e){voices=[]}}

const V_MALE=/thomas|nicolas|paul\b|henri|claude|antoine|jean|mathieu|guillaume|daniel|r[eé]my|gilles|alain|yves|fabrice|j[eé]r[oô]me|olivier|pierre|arnaud|louis|beno[iî]t|gerard|g[eé]rard|maged|majed|naayf|hamed|shakir|tarik|tariq|omar|hamza|ahmed|ahmad|moaz|zayd|salem|fahed|bassel|rami\b|hasan|hassan|\bmale\b|homme|x-frd|x-frb|x-ard|x-arz|-frd-|-ard-|-arz-|standard-b|standard-d|wavenet-b|wavenet-d|neural2-b|neural2-d/i;
const V_FEMALE=/am[eé]lie|audrey|aur[eé]lie|marie|julie|denise|hortense|virginie|chantal|c[eé]line|l[eé]a\b|elsa|[eé]lo[iï]se|sylvie|brigitte|charlotte|coralie|jacqueline|jos[eé]phine|yvette|laila|layla|mariam|maryam|zariyah|hoda|salma|amira|fatima|zeina|sana\b|mouna|salwa|female|femme|woman|x-frc|x-vlf|x-arc|-frc-|-vlf-|-arc-|standard-a|standard-c|standard-e|wavenet-a|wavenet-c|wavenet-e/i;
function voiceList(l){loadVoices();const lang=l?"ar":"fr";return voices.filter(v=>(v.lang||"").toLowerCase().replace("_","-").startsWith(lang))}
function vScore(v,l){const n=(v.name+" "+(v.voiceURI||"")).toLowerCase();let s=0;if(V_MALE.test(n))s+=10;if(V_FEMALE.test(n))s-=10;
  if(/natural|neural|premium|enhanced|online|wavenet|am[eé]lior/i.test(n))s+=3;if(!l&&/fr[-_]fr/i.test(v.lang))s+=1;if(l&&/ar[-_](sa|ma)/i.test(v.lang))s+=1;return s}
function isMaleVoice(v){const n=(v.name+" "+(v.voiceURI||"")).toLowerCase();return V_MALE.test(n)&&!V_FEMALE.test(n)}
function pickVoice(l){const vs=voiceList(l);if(!vs.length)return null;const pref=load("mr_voice_"+(l?"ar":"fr"),null);
  if(pref){const v=vs.find(x=>x.voiceURI===pref||x.name===pref);if(v)return v}
  return vs.slice().sort((a,b)=>vScore(b,l)-vScore(a,l))[0]}
function speechText(t,l){t=String(t||"");
  if(l)t=t.replace(/\(([^()]*[A-Za-z][^()]*)\)/g,"");            // en arabe : on ne lit pas les termes français entre parenthèses
  t=t.replace(/(\d)\s?[–—-]\s?(\d)/g,l?"$1 إلى $2":"$1 à $2");
  const R=l?[[/\bg\/L\b/g," غرام في اللتر "],[/\bmL\b/g," مليلتر "],[/\bkg\b/g," كيلوغرام "],[/°\s*C/g," درجة مئوية "],[/°\s*D/g," درجة دورنيك "],[/°/g," درجة "],[/%/g," في المائة "],[/→|⇒|➜/g,"، ثم "],[/×/g," ضرب "],[/÷/g," على "],[/≤/g," أقل من أو يساوي "],[/≥/g," أكبر من أو يساوي "],[/</g," أقل من "],[/>/g," أكبر من "],[/[·•|]/g,"، "],[/\s[–—-]\s/g,"، "],[/\//g," على "]]
           :[[/°\s*C/g," degrés "],[/°\s*D/g," degrés Dornic "],[/°/g," degrés "],[/%/g," pour cent "],[/\bg\/L\b/g," grammes par litre "],[/\bmL\b/g," millilitres "],[/\bkg\b/g," kilos "],[/\bmin\b/g," minutes "],[/(\d)\s?h\b/g,"$1 heures"],[/(\d)\s?s\b/g,"$1 secondes"],
             [/→|⇒|➜/g,", puis "],[/×/g," fois "],[/÷/g," divisé par "],[/≤/g," inférieur ou égal à "],[/≥/g," supérieur ou égal à "],[/</g," inférieur à "],[/>/g," supérieur à "],[/[·•|]/g,", "],[/\s[–—]\s/g,", "],[/\s-\s/g,", "],
             [/\bUFC\b/g,"U. F. C."],[/\bpH\b/g,"p. H."],[/\bDLC\b/g,"D. L. C."],[/\bEST\b/g,"E. S. T."],[/\bESD\b/g,"E. S. D."],[/\bMG\b/g,"matière grasse"],[/\bUHT\b/g,"U. H. T."],[/\bHACCP\b/g,"H. A. C. C. P."],[/\bIAA\b/g,"I. A. A."],[/\bBPH\b/g,"B. P. H."],[/\bAw\b/g,"A. W."],[/\s\/\s/g," sur "]];
  R.forEach(([a,b])=>t=t.replace(a,b));return t.replace(/\s+/g," ").replace(/\s+([,.;:!?،])/g,"$1").trim()}
function sentences(t){return t.split(/(?<=[.!?؟;:])\s+/).flatMap(s=>s.length>170?s.split(/(?<=[,،])\s+/):[s]).map(s=>s.trim()).filter(Boolean)}
// lit une liste de textes, l'un après l'autre (une phrase = un énoncé : plus fluide et pas de coupure sur Chrome)
function sayList(parts,onEach,onEnd){
  if(!("speechSynthesis" in window)){toast(T("noVoice"));return false}
  const l=L(),v=pickVoice(l);if(l&&!v&&voiceList(0).length){toast(T("noVoice"),5000);return false}
  const tok=++SPK,male=v?isMaleVoice(v):false,queue=[];
  parts.forEach((p,k)=>sentences(speechText(p,l)).forEach(s=>queue.push([k,s])));
  let q=0;const next=()=>{if(tok!==SPK)return;if(q>=queue.length){onEnd&&onEnd();return}
    const [k,s]=queue[q++];onEach&&onEach(k);const u=new SpeechSynthesisUtterance(s);u.lang=v?v.lang:(l?"ar-SA":"fr-FR");if(v)u.voice=v;
    u.rate=(l?0.88:0.92)*raRate();u.pitch=male?1:0.78;                 // si le téléphone n'a pas de voix d'homme : voix plus grave
    u.onend=()=>setTimeout(next,k!==(queue[q]||[k])[0]?350:120);u.onerror=()=>setTimeout(next,50);
    try{speechSynthesis.speak(u)}catch(e){}};
  try{speechSynthesis.cancel()}catch(e){}setTimeout(next,60);return true}

let soundOn=load("mr_sound",true);
let actx=null;
function beep(freqs,dur){if(!soundOn)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  freqs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type="sine";o.frequency.value=f;
    const t0=actx.currentTime+i*dur;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.18,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.02)})}catch(e){}}
function buzz(ms){if(!soundOn)return;try{if(NATIVE&&NP.Haptics)NP.Haptics.vibrate({duration:Array.isArray(ms)?ms[0]:ms}).catch(()=>{});else navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
function sfx(kind){if(kind==="ok"){beep([660,880],.09);buzz(25)}else if(kind==="ko"){beep([220,180],.12);buzz([40,40,40])}else if(kind==="win"){beep([523,659,784,1047],.1);buzz(60)}}
function toggleSound(){soundOn=!soundOn;save("mr_sound",soundOn);render()}
function confetti(){
  const cv=document.createElement("canvas");cv.className="confetti";document.body.appendChild(cv);
  const W=cv.width=innerWidth,H=cv.height=innerHeight,ctx=cv.getContext("2d");
  const cols=["#1F5A8C","#2E7BB8","#E3A21A","#1E8A55","#D9480F","#8ecae6"];
  const P=Array.from({length:130},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*11,vy:-Math.random()*12-4,r:Math.random()*6+3,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));
  let t=0;(function f(){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=.2;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
    if(++t<110)requestAnimationFrame(f);else cv.remove()})();
}

function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function seededShuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

    return}

const LOCK=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="#fff" fill-opacity=".78"/><text x="${x}" y="${y+r*0.42}" text-anchor="middle" font-size="${r*1.15}">🔒</text>`;
function avatar(a,mood,size,outfit,lvl){
  size=size||64;outfit=outfit||"base";lvl=lvl||0;a=a||AVATARS[0];
  const T8=AVT[a.i]&&AVT[a.i][outfit];
  if(T8){ // vignette illustrée : portrait (diamètre 232 px) ramené à 100 unités
    const[w,h,cx,cy,ch]=T8,k=100/232,X=50-cx*k,Y=50-cy*k;
    let s=`<image href="${MASC["avt_"+a.i+"_"+outfit]}" x="${X.toFixed(2)}" y="${Y.toFixed(2)}" width="${(w*k).toFixed(2)}" height="${(h*k).toFixed(2)}"/>`;
    ch.forEach(([x,y],j)=>{if(lvl<j+1)s+=LOCK(+(X+x*k).toFixed(2),+(Y+y*k).toFixed(2),12.5)});
    return `<svg class="mekti avatar" width="${size}" height="${Math.round(size*120/112)}" viewBox="-4 -12 112 120" style="overflow:visible" role="img" aria-label="avatar">${s}</svg>`;
  }
  let s=`<circle cx="50" cy="50" r="50" fill="#fff"/><image href="${MASC["av_"+a.i]}" x="1.5" y="1.5" width="97" height="97"/><circle cx="50" cy="50" r="48.8" fill="none" stroke="#fff" stroke-width="2.4"/>`;
  if(outfit==="hygiene"){ // charlotte
    s+=`<path d="M14 26Q12 -6 50 -8Q88 -6 86 26Q70 18 50 18Q30 18 14 26z" fill="#F4FAFE" stroke="#B9D3E6" stroke-width="1.4"/>`;
    s+=`<g fill="none" stroke="#CFE0EC" stroke-width="1" stroke-linecap="round"><path d="M28 0q3 7 2 14M40 -5q2 8 1 20M50 -6v22M60 -5q-2 8-1 20M72 0q-3 7-2 14"/></g>`;
    s+=`<path d="M14 26Q30 17 50 17Q70 17 86 26" fill="none" stroke="#B9D3E6" stroke-width="2.6" stroke-linecap="round"/>`;
  }
  if(outfit==="labo"){ // lunettes de protection relevées sur le front
    s+=`<path d="M14 16Q50 4 86 16" stroke="#2d3142" stroke-width="2.6" fill="none"/><g stroke="#2d3142" stroke-width="2"><rect x="27" y="8" width="20" height="12" rx="5.5" fill="#BFE3F5" fill-opacity=".85"/><rect x="53" y="8" width="20" height="12" rx="5.5" fill="#BFE3F5" fill-opacity=".85"/></g><path d="M47 14h6" stroke="#2d3142" stroke-width="2"/><path d="M31 11l4-1.5M57 11l4-1.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>`;
  }
  if(outfit==="grad"){ // toque de diplômé
    s+=`<path d="M18 2L50 -10L82 2L50 14z" fill="#1F5A8C"/><path d="M31 7v9q19 8 38 0v-9l-19 7z" fill="#12385a"/><path d="M82 2v16" stroke="#E3A21A" stroke-width="1.6"/><circle cx="82" cy="19.5" r="2.6" fill="#E3A21A"/>`;
  }
  if(outfit==="enquete"){ // loupe
    s+=`<path d="M8 104l10-12" stroke="#5e3822" stroke-width="5" stroke-linecap="round"/><circle cx="22" cy="86" r="10" fill="#DDF0FA" fill-opacity=".6" stroke="#8a5528" stroke-width="3"/><path d="M18 81q3-3 7-2" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
  }
  // accessoires gagnés avec les niveaux
  [[1,"🧤"],[2,"🔬"],[3,"🏅"]].forEach(([n,e],j)=>{const y=34+j*19;s+=`<circle cx="99" cy="${y}" r="8.5" fill="#fff" stroke="#E3A21A" stroke-width="1.4"/><text x="99" y="${y+3.6}" text-anchor="middle" font-size="10">${e}</text>`;if(lvl<n)s+=LOCK(99,y,8.6)});
  // le ⵣ d'Asmekti
  s+=`<circle cx="86" cy="89" r="8" fill="#1F5A8C" stroke="#fff" stroke-width="1.6"/><text x="86" y="93" text-anchor="middle" font-size="10.5" font-weight="800" fill="#fff" font-family="DejaVu Sans,Noto Sans Tifinagh,sans-serif">ⵣ</text>`;
  return `<svg class="mekti avatar" width="${size}" height="${Math.round(size*120/112)}" viewBox="-4 -12 112 120" style="overflow:visible" role="img" aria-label="avatar">${s}</svg>`;

function mekMsg(){
  const l=L(),due=dueList().length,sk=streak(),seen=counts(ALL).seen,d=daily();
  if(!seen)return[l?`مرحبًا! أنا ${mascName()}. ابدأ بـ «تعلّم في 5 دقائق».`:`Salut, moi c'est ${mascName()} ! Commence par « Apprendre 5 min ».`,"smile"];
  if(due)return[l?`لديك ${due} بطاقة للمراجعة اليوم. هيا بنا؟`:`Tu as ${due} carte${due>1?"s":""} à réviser aujourd'hui. On s'y met ?`,"surprise"];
  if(d.bonus)return[l?"أنجزت تحدي اليوم، أحسنت! 🎯":"Défi du jour réussi, bravo ! 🎯","wink"];
  if(sk>=3)return[l?`🔥 ${sk} أيام متتالية، استمر!`:`🔥 ${sk} jours de suite, continue comme ça !`,"ok"];
  st.tip=(st.tip===undefined?Math.floor(Math.random()*TIPS.length):st.tip);
  return[TIPS[st.tip][l],"wink"];
}
function mekBubble(){const[m,mood]=mekMsg();return `<div class="mekrow" onclick="st.tip=((st.tip||0)+1)%TIPS.length;const b=this.querySelector('.bub');b.textContent=TIPS[st.tip][L()]">${mimg(MOODIMG[mood]||"c_talk",74)}<div class="bub">${esc(m)}</div></div>`}
