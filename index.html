tion des premiers jets, désinfection des trayons après traite, refroidissement immédiat à 4 °C.", "La pasteurisation tue les germes, mais ne retire ni leurs toxines, ni les enzymes déjà libérées, ni le goût déjà donné."], ["في درجة حرارة الغرفة، تتضاعف الفلورا الميكروبية للحليب كل عشرين دقيقة: كل تأخير له ثمن.", "ما يُفسدها: أدوات حلب سيئة التنظيف، تبريد متأخر أو غير كافٍ، التهابات ضرع غير مكتشفة.", "ما يحميها: التخلص من الدفقات الأولى، تطهير الحلمات بعد الحلب، التبريد الفوري إلى 4 °C.", "البسترة (pasteurisation) تقتل الجراثيم، لكنها لا تُزيل سمومها، ولا الإنزيمات التي أطلقتها، ولا الطعم الذي أعطته."]], "k": ["Aucun traitement à l'usine ne rattrape un mauvais lait de ferme.", "لا توجد معالجة في المصنع تُصلح حليب ضيعة رديئًا."], "q": ["Que NE retire PAS la pasteurisation d'un lait mal conservé ?", "ما الذي لا تُزيله البسترة من حليب سيئ الحفظ؟"], "o": [["Les germes vivants", "Les toxines et enzymes déjà produites", "Les bactéries pathogènes vivantes"], ["الجراثيم الحية", "السموم والإنزيمات المنتَجة من قبل", "البكتيريا الممرضة الحية"]], "a": 1, "w": ["La pasteurisation tue les germes, pas leurs toxines ni leurs enzymes.", "البسترة تقتل الجراثيم، لا سمومها ولا إنزيماتها."], "g": [32]}], "since": "1.6"}, {"n": 3, "t": ["Composition du lait (1) — eau, glucides et lipides", "تركيب الحليب (1) — الماء، السكريات والدهون"], "c": [{"img": "l03_07", "t": ["Un litre de lait, constituant par constituant", "لتر من الحليب، مكوّنًا بعد مكوّن"], "st": [["Un litre de lait pèse 1 028 à 1 034 g. Eau : 900 à 910 g, la phase continue où tout est dissous, dispersé ou en suspension.", "Lactose : 47 à 52 g, le sucre que les ferments transforment en acide lactique. Matière grasse : 33 à 45 g, en globules, matière première du beurre et de la crème.", "Matières azotées totales : 33 à 36 g, dont 31 à 34 g de protéines vraies (caséines et protéines solubles).", "Minéraux : 7 à 7,5 g (K, Ca, Cl, P, Na) ; le calcium joue un rôle direct dans la coagulation. Extrait sec total : 125 à 135 g/L."], ["يزن لتر الحليب من 1 028 إلى 1 034 غ. الماء: 900 إلى 910 غ، وهو الطور المستمر الذي يُذاب فيه كل شيء أو يُشتَّت أو يُعلَّق.", "اللاكتوز (lactose): 47 إلى 52 غ، السكر الذي تحوّله الخمائر إلى حمض اللبنيك. المادة الدسمة: 33 إلى 45 غ، على شكل حبيبات، وهي المادة الأولية للزبدة والقشدة.", "المواد الآزوتية الكلية: 33 إلى 36 غ، منها 31 إلى 34 غ بروتينات حقيقية (الكازينات والبروتينات الذائبة).", "المعادن: 7 إلى 7,5 غ (K، Ca، Cl، P، Na)؛ والكالسيوم يلعب دورًا مباشرًا في التخثر. المادة الجافة الكلية: 125 إلى 135 غ/ل."]], "k": ["On n'achète pas un volume de lait : on achète son extrait sec.", "لا نشتري حجمًا من الحليب: بل نشتري مادته الجافة."], "q": ["Combien de lactose contient environ un litre de lait ?", "كم يحتوي تقريبًا لتر الحليب من اللاكتوز؟"], "o": [["47 à 52 g", "7 à 7,5 g", "900 à 910 g"], ["47 إلى 52 غ", "7 إلى 7,5 غ", "900 إلى 910 غ"]], "a": 0, "w": ["Le lactose représente 47 à 52 g par litre.", "يمثل اللاكتوز من 47 إلى 52 غ في اللتر."], "g": [20, 30]}, {"img": "l03_09", "t": ["EST, ESD et sérum", "المادة الجافة الكلية، المادة الجافة منزوعة الدسم والمصل"], "st": [["EST, extrait sec total : tous les solides du lait. EST (%) = 100 − eau (%), ou MG + protéines + glucides + minéraux.", "ESD, extrait sec dégraissé (ou SNG) : tous les solides sauf la matière grasse. ESD = EST − MG ; ex. : 12,8 − 3,8 = 9 %.", "Sérum : tout le lait sauf la matière grasse. Sérum (%) = 100 − MG ; ex. : 100 − 3,8 = 96,2 %.", "L'EST se vend (poudre, fromage, yaourt) ; l'ESD se surveille (un mouillage le fait chuter avant tout le reste) ; le sérum s'écoule à l'égouttage."], ["EST، المادة الجافة الكلية (extrait sec total): كل المواد الصلبة في الحليب. EST (%) = 100 − الماء (%)، أو الدسم + البروتينات + السكريات + المعادن.", "ESD، المادة الجافة منزوعة الدسم (extrait sec dégraissé): كل المواد الصلبة ما عدا الدسم. ESD = EST − MG؛ مثال: 12,8 − 3,8 = 9 %.", "المصل (sérum): كل الحليب ما عدا المادة الدسمة. المصل (%) = 100 − MG؛ مثال: 100 − 3,8 = 96,2 %.", "الـ EST يُباع (مسحوق، جبن، ياغورت)؛ الـ ESD يُراقَب (إضافة الماء تُخفضه قبل كل شيء)؛ والمصل يسيل أثناء التصفية."]], "k": ["ESD = EST − MG : retiens cette seule formule, les autres en découlent.", "ESD = EST − MG: احفظ هذه الصيغة وحدها، والباقي يُستنتج منها."], "q": ["Un lait a 12,8 % d'EST et 3,8 % de MG. Quel est son ESD ?", "حليب فيه 12,8 % من EST و3,8 % من MG. كم هو ESD؟"], "o": [["16,6 %", "9 %", "96,2 %"], ["16,6 %", "9 %", "96,2 %"]], "a": 1, "w": ["ESD = EST − MG = 12,8 − 3,8 = 9 %.", "ESD = EST − MG = 12,8 − 3,8 = 9 %."], "g": [19, 20, 34, 57, 60]}, {"img": "l03_11", "t": ["L'eau libre et l'eau liée", "الماء الحر والماء المرتبط"], "st": [["L'eau du lait existe sous deux formes qui ne se comportent pas de la même façon.", "Eau libre, 90 % : elle contient les éléments en solution ; elle part à l'égouttage.", "Eau liée, 10 % : retenue par les caséines et les globules gras ; elle reste dans le caillé et c'est la plus difficile et la plus chère à retirer au séchage.", "On ne peut pas éliminer toute l'eau : une poudre de lait conserve 3 à 4 % d'humidité."], ["ماء الحليب موجود في شكلين لا يتصرفان بالطريقة نفسها.", "الماء الحر (eau libre)، 90 %: يحتوي على العناصر الذائبة؛ ويخرج أثناء التصفية (égouttage).", "الماء المرتبط (eau liée)، 10 %: تحتجزه الكازينات والحبيبات الدهنية؛ يبقى في الخثارة، وهو الأصعب والأغلى إزالةً أثناء التجفيف.", "لا يمكن إزالة كل الماء: مسحوق الحليب يحتفظ بـ 3 إلى 4 % من الرطوبة."]], "k": ["Eau libre : facile à enlever. Eau liée : difficile et chère à enlever.", "الماء الحر: سهل الإزالة. الماء المرتبط: صعب ومكلف الإزالة."], "q": ["Quelle eau reste dans le caillé après l'égouttage ?", "أيّ ماء يبقى في الخثارة بعد التصفية؟"], "o": [["L'eau liée", "L'eau libre", "Aucune eau"], ["الماء المرتبط", "الماء الحر", "لا يبقى أي ماء"]], "a": 0, "w": ["L'eau liée est retenue par les caséines et les globules gras.", "الماء المرتبط تحتجزه الكازينات والحبيبات الدهنية."], "g": [6, 20, 23, 60]}, {"img": "l03_13", "t": ["Le lactose, le sucre du lait", "اللاكتوز، سكر الحليب"], "st": [["Le lactose est un glucide présent uniquement dans le lait. C'est un dioside : glucose + galactose, reliés par une liaison osidique.", "Il est stable : sa teneur varie peu d'un lait à l'autre, ce qui rend le point de congélation si fiable.", "Il est peu sucrant : six fois moins que le saccharose.", "Il est fermentescible : les bactéries lactiques le transforment en acide lactique. Pas de lactose, pas d'acidification, donc ni yaourt ni fromage."], ["اللاكتوز سكّر لا يوجد إلا في الحليب. إنه سكر ثنائي (dioside): غلوكوز + غالاكتوز، مرتبطان برابطة غليكوزيدية (liaison osidique).", "إنه مستقر: تركيزه يتغير قليلًا من حليب لآخر، وهذا ما يجعل نقطة التجمد موثوقة جدًا.", "إنه قليل الحلاوة: أقل بست مرات من السكروز (saccharose).", "إنه قابل للتخمر: البكتيريا اللبنية تحوّله إلى حمض اللبنيك (acide lactique). بدون لاكتوز لا تحميض، إذن لا ياغورت ولا جبن."]], "k": ["Lactose = glucose + galactose : stable, peu sucrant, fermentescible.", "اللاكتوز = غلوكوز + غالاكتوز: مستقر، قليل الحلاوة، قابل للتخمر."], "q": ["Le lactose est un dioside composé de :", "اللاكتوز سكر ثنائي مكوّن من:"], "o": [["Glucose + fructose", "Glucose + saccharose", "Glucose + galactose"], ["غلوكوز + فركتوز", "غلوكوز + سكروز", "غلوكوز + غالاكتوز"]], "a": 2, "w": ["Deux oses simples : le glucose et le galactose.", "سكران بسيطان: الغلوكوز والغالاكتوز."], "g": [20, 30, 57]}, {"img": "l03_15", "t": ["Ce que fait le lactose", "ماذا يفعل اللاكتوز"], "st": [["Il fermente : les bactéries lactiques le transforment en acide lactique ; le pH descend, les caséines se déstabilisent (yaourt, fromage frais, crème acide).", "Il brunit à la chaleur : avec les protéines, c'est la réaction de Maillard ; goût de cuit, couleur beige des laits stérilisés et des poudres surchauffées.", "Il part dans le lactosérum à l'égouttage : un fromage affiné n'en contient presque plus.", "Faute de lactase, il se digère mal (intolérance) ; les laits fermentés sont mieux tolérés.", "Un lait contenant des antibiotiques ne s'acidifie pas : les ferments sont détruits, le lactose reste intact."], ["يتخمر: البكتيريا اللبنية تحوّله إلى حمض اللبنيك؛ ينخفض الـ pH وتضطرب الكازينات (ياغورت، جبن طري، قشدة حامضة).", "يَسمَرّ بالحرارة: مع البروتينات، إنه تفاعل مايار (réaction de Maillard)؛ طعم الطهي واللون البيج للحليب المعقَّم والمساحيق المسخَّنة بإفراط.", "يذهب مع مصل اللبن (lactosérum) أثناء التصفية: الجبن المُعتَّق لا يكاد يحتوي عليه.", "بدون إنزيم اللاكتاز (lactase) يُهضم بصعوبة (عدم التحمل)؛ والألبان المخمَّرة تُتحمَّل أفضل.", "الحليب الذي يحتوي على مضادات حيوية لا يتحمّض: الخمائر مقتولة واللاكتوز يبقى سليمًا."]], "k": ["Le lactose fermente, brunit, part dans le sérum et se digère mal sans lactase.", "اللاكتوز يتخمر، يَسمَرّ، يذهب مع المصل، ويُهضم بصعوبة بدون لاكتاز."], "q": ["Le brunissement d'un lait stérilisé s'explique par :", "اسمرار الحليب المعقَّم يُفسَّر بـ:"], "o": [["La réaction de Maillard", "La lipolyse", "L'acidification"], ["تفاعل مايار", "تحلل الدهون", "التحميض"]], "a": 0, "w": ["À forte chaleur, le lactose réagit avec les protéines : réaction de Maillard.", "في حرارة مرتفعة يتفاعل اللاكتوز مع البروتينات: تفاعل مايار."], "g": [0, 20, 30, 43, 57, 60]}, {"img": "l03_17", "t": ["Le globule gras", "الحبيبة الدهنية"], "st": [["Les lipides ne sont pas dissous : ils sont dispersés en globules gras, en émulsion dans la phase aqueuse.", "Carte d'identité : diamètre moyen 3 à 4 µm ; 10 milliards de globules par mL ; membrane de 5 à 10 nm qui stabilise l'émulsion.", "Plus légers que l'eau, les globules remontent au repos.", "Composition de la MG : triglycérides 98 % ; phospholipides 1 %, surtout dans la membrane ; insaponifiables 1 % (vitamines A, D, E, K, carotène, cholestérol)."], ["الدهون ليست ذائبة: إنها مشتتة في شكل حبيبات دهنية (globules gras)، في مستحلب داخل الطور المائي.", "بطاقة التعريف: قطر متوسط 3 إلى 4 ميكرومتر؛ 10 مليارات حبيبة في كل مل؛ غشاء من 5 إلى 10 نانومتر يثبّت المستحلب.", "الحبيبات أخف من الماء، فتصعد إلى الأعلى عند السكون.", "تركيب المادة الدسمة: ثلاثيات الغليسيريد (triglycérides) 98 %؛ الدهون الفوسفورية 1 %، خاصة في الغشاء؛ مواد غير قابلة للتصبّن 1 % (فيتامينات A وD وE وK، كاروتين، كوليسترول)."]], "k": ["Petits, protégés par une membrane, plus légers que l'eau.", "صغيرة، محمية بغشاء، وأخف من الماء."], "q": ["La matière grasse du lait est constituée à 98 % de :", "تتكوّن المادة الدسمة للحليب بنسبة 98 % من:"], "o": [["Phospholipides", "Triglycérides", "Cholestérol"], ["الدهون الفوسفورية", "ثلاثيات الغليسيريد", "الكوليسترول"]], "a": 1, "w": ["Triglycérides 98 %, phospholipides et insaponifiables 1 % chacun.", "ثلاثيات الغليسيريد 98 %، والدهون الفوسفورية وغير القابلة للتصبّن 1 % لكل منهما."], "g": [23]}, {"img": "l03_20", "t": ["Pourquoi le beurre fond dans la main", "لماذا تذوب الزبدة في اليد"], "st": [["Plus de 400 acides gras différents : c'est ce qui donne au beurre son arôme et sa plasticité.", "Des acides gras à chaîne courte, propres au lait (butyrique, caproïque, caprylique) : libérés par la lipase, ils donnent le goût rance.", "Un point de fusion étalé de 28 à 36 °C : le beurre est tartinable à 18 °C et fond en bouche.", "Une cristallisation pilotable : en refroidissant la crème selon un profil choisi (maturation physique), on décide de la dureté du beurre."], ["أكثر من 400 حمض دهني مختلف: هذا ما يعطي الزبدة نكهتها وليونتها.", "أحماض دهنية قصيرة السلسلة خاصة بالحليب (البوتيريك، الكابرويك، الكابريليك): عندما يحررها إنزيم الليباز (lipase) تعطي طعم الزناخة (rance).", "نقطة انصهار ممتدة من 28 إلى 36 °C: الزبدة قابلة للدهن في 18 °C وتذوب في الفم.", "تبلور يمكن التحكم فيه: بتبريد القشدة وفق منحنى مختار (النضج الفيزيائي maturation physique)، نحدد صلابة الزبدة."]], "k": ["La matière grasse laitière ne fond pas d'un coup : elle fond progressivement de 28 à 36 °C.", "دسم الحليب لا يذوب دفعة واحدة: بل يذوب تدريجيًا من 28 إلى 36 °C."], "q": ["Quelle enzyme libère les acides gras courts responsables du goût rance ?", "أيّ إنزيم يحرر الأحماض الدهنية القصيرة المسؤولة عن طعم الزناخة؟"], "o": [["La présure", "La phosphatase", "La lipase"], ["المنفحة", "الفوسفاتاز", "الليباز"]], "a": 2, "w": ["La lipase coupe les triglycérides et libère les acides gras courts.", "الليباز يقطع ثلاثيات الغليسيريد ويحرر الأحماض الدهنية القصيرة."], "g": [20]}, {"img": "l03_22", "t": ["Lait cru ou lait homogénéisé ?", "حليب خام أم حليب متجانس؟"], "st": [["Lait cru au repos : les globules se regroupent en amas qui remontent ; une couche de crème se forme en quelques heures ; la membrane reste intacte.", "Cette remontée est exploitée par l'écrémage, accéléré par la centrifugation.", "Lait homogénéisé : les globules sont fractionnés à moins de 1 µm, trop petits pour remonter ; la caséine recouvre les nouveaux globules.", "Le lait homogénéisé paraît plus blanc, plus onctueux, et sa stabilité est prolongée."], ["الحليب الخام في السكون: تتجمع الحبيبات في كتل تصعد؛ تتكوّن طبقة قشدة في ساعات قليلة؛ والغشاء يبقى سليمًا.", "هذا الصعود يستغله نزع الدسم (écrémage)، ويُسرَّع بالطرد المركزي (centrifugation).", "الحليب المتجانس (homogénéisé): تُجزَّأ الحبيبات إلى أقل من 1 ميكرومتر، فتصبح أصغر من أن تصعد؛ ويغطي الكازين الحبيبات الجديدة.", "يبدو الحليب المتجانس أكثر بياضًا وقوامًا، ويدوم استقراره مدة أطول."]], "k": ["Écrémer, c'est aider les globules à remonter ; homogénéiser, c'est les en empêcher définitivement.", "نزع الدسم هو مساعدة الحبيبات على الصعود؛ والتجانس هو منعها من ذلك نهائيًا."], "q": ["Pourquoi un lait homogénéisé ne forme-t-il plus de couche de crème ?", "لماذا لا يكوّن الحليب المتجانس طبقة قشدة؟"], "o": [["Ses globules sont trop petits pour remonter", "Sa matière grasse a été retirée", "Sa membrane est intacte"], ["لأن حبيباته أصغر من أن تصعد", "لأن مادته الدسمة نُزعت", "لأن غشاءه سليم"]], "a": 0, "w": ["Fractionnés à moins de 1 µm, les globules ne remontent plus.", "بعد تجزئتها إلى أقل من 1 ميكرومتر لا تصعد الحبيبات."], "g": [20, 25]}, {"img": "l03_24", "t": ["Séparer ou transformer", "الفصل أو التحويل"], "st": [["Séparer, c'est utiliser une différence de densité ou de taille pour isoler un constituant.", "Exemples : globules gras → crème et beurre ; eau libre → concentré et poudre ; sérum → caillé et lactosérum.", "Transformer, c'est laisser un ferment ou une enzyme changer un constituant en un autre.", "Exemples : lactose → acide lactique → yaourt ; lactose + protéines → goût de cuit ; triglycérides → acides gras libres."], ["الفصل هو استعمال اختلاف في الكثافة أو الحجم لعزل مكوّن.", "أمثلة: الحبيبات الدهنية ← القشدة والزبدة؛ الماء الحر ← المركَّز والمسحوق؛ المصل ← الخثارة ومصل اللبن.", "التحويل هو ترك خميرة أو إنزيم يغيّر مكوّنًا إلى مكوّن آخر.", "أمثلة: اللاكتوز ← حمض اللبنيك ← الياغورت؛ اللاكتوز + البروتينات ← طعم الطهي؛ ثلاثيات الغليسيريد ← أحماض دهنية حرة."]], "k": ["Avant chaque fabrication : quel constituant retenir, lequel accepter de perdre ?", "قبل كل صناعة: أيّ مكوّن نحتفظ به، وأيّه نقبل بفقدانه؟"], "q": ["Le passage « lactose → acide lactique → yaourt » est un exemple de :", "المرور «لاكتوز ← حمض اللبنيك ← ياغورت» مثال على:"], "o": [["Séparation", "Transformation", "Concentration"], ["الفصل", "التحويل", "التركيز"]], "a": 1, "w": ["Un ferment change un constituant en un autre : c'est transformer.", "خميرة تغيّر مكوّنًا إلى آخر: إنه التحويل."], "g": [6, 20, 23, 30, 57]}], "since": "1.6"}, {"n": 4, "t": ["Composition (2) — protéines, minéraux, vitamines, enzymes", "التركيب (2) — البروتينات، المعادن، الفيتامينات، الإنزيمات"], "c": [{"img": "l04_07", "t": ["Caséines ou protéines solubles ?", "الكازينات أم البروتينات الذائبة؟"], "st": [["Caséines, 26 à 29 g/L : elles précipitent à pH 4,6, coagulent sous la présure, résistent bien à la chaleur ; organisées en micelles avec calcium et phosphore.", "Protéines solubles, 4 à 6 g/L : solubles même à pH 4,5, elles ne coagulent ni par la présure ni par l'acide, mais précipitent dès 70 à 75 °C (principe de la ricotta).", "À l'égouttage, la caséine fait l'essentiel du fromage ; les protéines solubles partent avec le sérum.", "Les protéines solubles (lactalbumine, lactoglobuline, immunoglobulines) contiennent tous les acides aminés essentiels : boissons protéinées, enrichissement des yaourts."], ["الكازينات (caséines)، 26 إلى 29 غ/ل: تترسب عند pH 4,6، وتتخثر بالمنفحة (présure)، وتقاوم الحرارة جيدًا؛ منظَّمة في مذيلات مع الكالسيوم والفوسفور.", "البروتينات الذائبة، 4 إلى 6 غ/ل: ذائبة حتى عند pH 4,5، لا تتخثر بالمنفحة ولا بالحمض، لكنها تترسب ابتداءً من 70 إلى 75 °C (مبدأ الريكوتا).", "أثناء التصفية، يشكّل الكازين أغلب الجبن؛ والبروتينات الذائبة تذهب مع المصل.", "البروتينات الذائبة (لاكتالبومين، لاكتوغلوبولين، غلوبولينات مناعية) تحتوي على كل الأحماض الأمينية الأساسية: مشروبات بروتينية وإغناء الياغورت."]], "k": ["Les caséines font le fromage ; les protéines solubles partent dans le lactosérum.", "الكازينات تصنع الجبن؛ والبروتينات الذائبة تذهب في مصل اللبن."], "q": ["Les protéines solubles précipitent :", "البروتينات الذائبة تترسب:"], "o": [["À pH 4,6", "Sous l'action de la présure", "À la chaleur, dès 70 à 75 °C"], ["عند pH 4,6", "بتأثير المنفحة", "بالحرارة، ابتداءً من 70 إلى 75 °C"]], "a": 2, "w": ["Elles résistent à l'acide et à la présure, pas à la chaleur.", "إنها تقاوم الحمض والمنفحة، لكن لا تقاوم الحرارة."], "g": [33, 40, 57, 60]}, {"img": "l04_09", "t": ["La micelle de caséine", "مذيلة الكازين"], "st": [["Les caséines sont assemblées en micelles, des sphères de 50 à 300 nm tenues par du calcium.", "Quatre caséines : alpha-s1, alpha-s2, bêta et kappa. Un ciment : le phosphate de calcium colloïdal, entre les sous-unités.", "Un cœur hydrophobe (caséines alpha et bêta, à l'abri de l'eau) et, en surface, un chevelu de caséine kappa chargé négativement : les micelles se repoussent, le lait reste liquide.", "Les micelles diffusent la lumière dans toutes les directions : c'est pourquoi le lait est blanc ; un lactosérum clair est translucide."], ["الكازينات مجمَّعة في مذيلات (micelles)، وهي كريات من 50 إلى 300 نانومتر يمسكها الكالسيوم.", "أربعة كازينات: ألفا-s1، ألفا-s2، بيتا وكابا. والإسمنت: فوسفات الكالسيوم الغروي (colloïdal) بين الوحدات.", "قلب كاره للماء (hydrophobe) (كازينات ألفا وبيتا، بعيدًا عن الماء)، وعلى السطح شعيرات من كازين كابا مشحونة سلبيًا: المذيلات تتنافر ويبقى الحليب سائلًا.", "المذيلات تنشر الضوء في كل الاتجاهات: لهذا الحليب أبيض؛ ومصل اللبن الصافي شبه شفاف."]], "k": ["La micelle : un cœur, un ciment de phosphate de calcium, un chevelu de caséine kappa en surface.", "المذيلة: قلب، إسمنت من فوسفات الكالسيوم، وشعيرات من كازين كابا على السطح."], "q": ["Pourquoi les micelles ne se collent-elles pas dans un lait frais ?", "لماذا لا تلتصق المذيلات في الحليب الطازج؟"], "o": [["Le chevelu de caséine kappa les fait se repousser", "Le lactose les sépare", "La matière grasse les entoure"], ["شعيرات كازين كابا تجعلها تتنافر", "اللاكتوز يفصل بينها", "المادة الدسمة تحيط بها"]], "a": 0, "w": ["Chargé négativement, le chevelu de kappa fait se repousser les micelles.", "شعيرات كابا المشحونة سلبيًا تجعل المذيلات تتنافر."], "g": [20, 33]}, {"img": "l04_12", "t": ["Ce que fait la présure", "ماذا تفعل المنفحة"], "st": [["Coupure : l'enzyme de la présure coupe le chevelu de caséine kappa.", "Déstabilisation : les micelles ne se repoussent plus. Agrégation : elles s'accrochent les unes aux autres.", "Réticulation : le calcium soude le réseau, le gel est ferme.", "Sans calcium libre, le réseau ne se soude pas : on ajoute du chlorure de calcium à un lait pasteurisé. Un caillé mou malgré une présure correcte vient presque toujours de là."], ["القطع: إنزيم المنفحة يقطع شعيرات كازين كابا.", "زعزعة الاستقرار: المذيلات لم تعد تتنافر. التكتل: تتشبث ببعضها البعض.", "التشبيك (réticulation): الكالسيوم يلحم الشبكة، فيصبح الهلام متماسكًا.", "بدون كالسيوم حر لا تلتحم الشبكة: لذلك نضيف كلوريد الكالسيوم إلى الحليب المبستر. والخثارة الرخوة رغم منفحة صحيحة تأتي غالبًا من هنا."]], "k": ["Couper le chevelu → les micelles se rapprochent → le calcium fige le tout.", "قطع الشعيرات ← تقترب المذيلات ← الكالسيوم يُجمّد الكل."], "q": ["Un caillé reste mou malgré une présure correcte. Cause la plus probable ?", "تبقى الخثارة رخوة رغم منفحة صحيحة. ما السبب الأكثر احتمالًا؟"], "o": [["Trop de lactose", "Manque de calcium libre", "Trop de protéines solubles"], ["لاكتوز كثير", "نقص الكالسيوم الحر", "بروتينات ذائبة كثيرة"]], "a": 1, "w": ["Sans calcium libre, le réseau ne se soude pas : on ajoute du chlorure de calcium.", "بدون كالسيوم حر لا تلتحم الشبكة: نضيف كلوريد الكالسيوم."], "g": [6, 20, 33, 40]}, {"img": "l04_14", "t": ["Les minéraux du lait", "معادن الحليب"], "st": [["Environ 7 g/L. Sels solubles : potassium 1,5 g, chlore 1,3 g, sodium 0,58 g ; ils font la conductivité, utilisée pour détecter les mammites.", "Calcium 1,3 g et phosphore 1 g : la moitié est liée aux micelles (phosphate de calcium colloïdal), l'autre moitié est en solution ; cet équilibre commande la coagulation.", "Citrates 1,8 g, magnésium 0,12 g, soufre 0,35 g : les citrates tamponnent le lait et donnent le diacétyle, l'arôme du beurre.", "Le chauffage rend une partie du calcium insoluble ; l'acidification le remet en solution."], ["حوالي 7 غ/ل. أملاح ذائبة: البوتاسيوم 1,5 غ، الكلور 1,3 غ، الصوديوم 0,58 غ؛ وهي تحدد الموصلية (conductivité)، المستعملة لكشف التهاب الضرع.", "الكالسيوم 1,3 غ والفوسفور 1 غ: النصف مرتبط بالمذيلات (فوسفات الكالسيوم الغروي)، والنصف الآخر ذائب؛ وهذا التوازن يتحكم في التخثر.", "السترات (citrates) 1,8 غ، المغنيزيوم 0,12 غ، الكبريت 0,35 غ: السترات تنظّم حموضة الحليب وتعطي الدياسيتيل (diacétyle)، نكهة الزبدة.", "التسخين يجعل جزءًا من الكالسيوم غير ذائب؛ والتحميض يعيده إلى المحلول."]], "k": ["Ce n'est pas la quantité de calcium qui compte, mais sa répartition.", "ليست كمية الكالسيوم هي المهمة، بل توزيعه."], "q": ["Quel minéral commande directement la coagulation par son équilibre ?", "أيّ معدن يتحكم مباشرة في التخثر بتوازنه؟"], "o": [["Le sodium", "Le calcium", "Le soufre"], ["الصوديوم", "الكالسيوم", "الكبريت"]], "a": 1, "w": ["L'équilibre calcium colloïdal / calcium soluble commande la coagulation.", "توازن الكالسيوم الغروي والكالسيوم الذائب يتحكم في التخثر."], "g": [20, 32, 33]}, {"img": "l04_16", "t": ["Les vitamines : deux familles, deux destins", "الفيتامينات: عائلتان ومصيران"], "st": [["Liposolubles (A, D, E, K, carotène) : elles suivent la matière grasse ; écrémer un lait, c'est l'en appauvrir.", "A et carotène donnent la couleur du beurre ; D aide à fixer le calcium ; E protège la MG de l'oxydation.", "Hydrosolubles (groupe B, C) : elles restent dans le sérum, fragiles à la chaleur et à la lumière ; B2 détruite par la lumière, B12 et B9 sensibles à l'UHT, C largement perdue.", "D'où l'enrichissement réglementaire des laits écrémés et demi-écrémés en A et D, et la vente en brique opaque."], ["الذائبة في الدهون (liposolubles) (A، D، E، K، كاروتين): تتبع المادة الدسمة؛ نزع دسم الحليب يُفقره منها.", "A والكاروتين يعطيان لون الزبدة؛ D يساعد على تثبيت الكالسيوم؛ E يحمي الدسم من الأكسدة.", "الذائبة في الماء (hydrosolubles) (مجموعة B، C): تبقى في المصل، لكنها هشة أمام الحرارة والضوء؛ B2 يتلفه الضوء، B12 وB9 حساسان للـ UHT، وC يضيع أغلبه.", "لهذا تُغنى قانونيًا الألبان منزوعة الدسم ونصف منزوعة الدسم بـ A وD، ويُباع الحليب في علب غير شفافة."]], "k": ["Liposolubles : suivent la crème. Hydrosolubles : craignent la chaleur et la lumière.", "الذائبة في الدهون: تتبع القشدة. الذائبة في الماء: تخشى الحرارة والضوء."], "q": ["Que deviennent les vitamines A et D d'un lait écrémé ?", "ماذا يحدث لفيتاميني A وD في الحليب منزوع الدسم؟"], "o": [["Elles sont intactes", "Elles sont retirées avec la crème", "Elles sont détruites par la lumière"], ["يبقيان سليمين", "يُنزعان مع القشدة", "يتلفهما الضوء"]], "a": 1, "w": ["Liposolubles, elles suivent la matière grasse retirée.", "لأنهما ذائبان في الدهون، يتبعان المادة الدسمة المنزوعة."], "g": [20, 56, 58]}, {"img": "l04_19", "t": ["Les enzymes témoins : phosphatase et peroxydase", "الإنزيمات الشاهدة: الفوسفاتاز والبيروكسيداز"], "st": [["Phosphatase alcaline : détruite vers 72 °C en 15 secondes, exactement le barème de la pasteurisation basse.", "Test phosphatase négatif : lait bien pasteurisé. Positif : traitement raté, ou lait cru mélangé au lait traité.", "Lactoperoxydase : plus résistante, elle survit à 72 °C mais est détruite vers 80 °C.", "Phosphatase négative et peroxydase positive : le lait a été pasteurisé, mais pas surchauffé."], ["الفوسفاتاز القلوي (phosphatase alcaline): يُتلف حوالي 72 °C في 15 ثانية، وهو بالضبط جدول البسترة المنخفضة.", "اختبار فوسفاتاز سلبي: حليب مبستر جيدًا. إيجابي: معالجة فاشلة، أو حليب خام مخلوط بالحليب المعالَج.", "اللاكتوبيروكسيداز (lactoperoxydase): أكثر مقاومة، يبقى بعد 72 °C لكنه يُتلف حوالي 80 °C.", "فوسفاتاز سلبي وبيروكسيداز إيجابي: الحليب مبستر لكن دون تسخين مفرط."]], "k": ["Phosphatase → pasteurisation basse ; peroxydase → pasteurisation haute.", "الفوسفاتاز ← البسترة المنخفضة؛ البيروكسيداز ← البسترة المرتفعة."], "q": ["Un lait pasteurisé donne un test phosphatase positif. Que conclure ?", "حليب مبستر يعطي اختبار فوسفاتاز إيجابيًا. ماذا نستنتج؟"], "o": [["Le lait est surchauffé", "Le lait est parfaitement traité", "Traitement raté ou lait cru mélangé"], ["الحليب مسخَّن بإفراط", "الحليب معالَج بشكل كامل", "معالجة فاشلة أو حليب خام مخلوط"]], "a": 2, "w": ["La phosphatase aurait dû être détruite à 72 °C en 15 s.", "كان يجب أن يُتلف الفوسفاتاز في 72 °C خلال 15 ثانية."], "g": [20, 29, 37]}, {"img": "l04_18", "t": ["Les enzymes ennemies : lipase et plasmine", "الإنزيمات العدوة: الليباز والبلاسمين"], "st": [["Deux enzymes prouvent un traitement ; deux autres abîment le produit.", "Lipase, ennemie du goût : elle coupe les triglycérides et libère les acides gras courts ; c'est la lipolyse, au goût de rance.", "La lipase est activée par l'agitation, le pompage et les chocs thermiques : on ne pompe jamais un lait cru plus que nécessaire.", "Plasmine, ennemie de la conservation : protéase très thermorésistante, elle survit à l'UHT et dégrade lentement les caséines ; elle fait gélifier un lait UHT oublié plusieurs mois."], ["إنزيمان يُثبتان المعالجة؛ وإنزيمان آخران يُفسدان المنتوج.", "الليباز، عدو الطعم: يقطع ثلاثيات الغليسيريد ويحرر الأحماض الدهنية القصيرة؛ إنه تحلل الدهون (lipolyse) بطعم الزناخة.", "الليباز ينشط بالخلط والضخ والصدمات الحرارية: لذلك لا نضخ الحليب الخام أكثر من اللازم.", "البلاسمين (plasmine)، عدو الحفظ: إنزيم بروتيني مقاوم جدًا للحرارة، يبقى بعد الـ UHT ويُحلل الكازينات ببطء؛ فيجعل حليب UHT المنسي عدة أشهر يتهلّم."]], "k": ["Lipase = goût de rance ; plasmine = gélification du lait UHT.", "الليباز = طعم الزناخة؛ البلاسمين = تهلّم حليب UHT."], "q": ["Un lait UHT stocké plusieurs mois se gélifie. Quelle enzyme en est responsable ?", "حليب UHT مخزّن عدة أشهر يتهلّم. أيّ إنزيم مسؤول؟"], "o": [["La plasmine", "La lipase", "La phosphatase alcaline"], ["البلاسمين", "الليباز", "الفوسفاتاز القلوي"]], "a": 0, "w": ["La plasmine survit à l'UHT et dégrade lentement les caséines.", "البلاسمين يبقى بعد الـ UHT ويُحلل الكازينات ببطء."], "g": [20, 56]}, {"img": "l04_21", "t": ["La carte d'identité physico-chimique du lait", "بطاقة التعريف الفيزيائية الكيميائية للحليب"], "st": [["pH à 20 °C : 6,5 à 6,7 ; une baisse traduit un début de fermentation du lactose.", "Acidité titrable : 14 à 18 °D ; au-delà de 18 °D, le lait est en cours d'acidification.", "Masse volumique à 20 °C : 1 028 à 1 033 g/L ; elle chute si le lait est mouillé et monte s'il est écrémé.", "Point de congélation : −0,55 à −0,51 °C ; très stable, c'est la mesure la plus fiable du mouillage.", "Autres constantes : ébullition 100,17 °C ; viscosité 1,8 à 2 cP ; environ 275 kJ pour 100 mL."], ["الـ pH في 20 °C: من 6,5 إلى 6,7؛ انخفاضه يدل على بداية تخمر اللاكتوز.", "الحموضة القابلة للمعايرة: 14 إلى 18 درجة دورنيك (°D)؛ فوق 18 °D يكون الحليب في طور التحمّض.", "الكتلة الحجمية في 20 °C: 1 028 إلى 1 033 غ/ل؛ تنخفض إذا أضيف الماء وترتفع إذا نُزع الدسم.", "نقطة التجمد (point de congélation): −0,55 إلى −0,51 °C؛ مستقرة جدًا، وهي القياس الأكثر موثوقية لكشف إضافة الماء.", "ثوابت أخرى: الغليان 100,17 °C؛ اللزوجة 1,8 إلى 2 سنتيبواز؛ حوالي 275 كيلوجول لكل 100 مل."]], "k": ["Ces constantes sont les références de toutes les analyses de réception.", "هذه الثوابت هي مراجع كل تحاليل الاستقبال."], "q": ["Quelle mesure est la plus fiable pour détecter un mouillage ?", "ما القياس الأكثر موثوقية لكشف إضافة الماء؟"], "o": [["Le pH", "La viscosité", "Le point de congélation"], ["الـ pH", "اللزوجة", "نقطة التجمد"]], "a": 2, "w": ["Le point de congélation est très stable d'un lait à l'autre.", "نقطة التجمد مستقرة جدًا من حليب لآخر."], "g": [11, 12, 20, 30, 34, 58]}], "since": "1.6"}, {"n": 5, "t": ["Contaminants et laits anormaux", "الملوِّثات والألبان غير الطبيعية"], "c": [{"img": "l05_07", "t": ["Le lait, un excellent milieu de culture", "الحليب، وسط زرع ممتاز"], "st": [["Par sa composition, le lait est un excellent substrat pour les microbes : eau, sucre, protéines, minéraux, pH proche de la neutralité, température idéale à la sortie du pis.", "Sans froid ni traitement, la population microbienne double toutes les vingt minutes.", "Un lait normal doit contenir moins de 100 000 UFC par mL (UFC : unité formant colonie).", "Au-delà de ce seuil, le lait est déclassé ou refusé selon la grille de l'usine."], ["بتركيبه، الحليب وسط ممتاز لنمو الميكروبات: ماء، سكر، بروتينات، معادن، pH قريب من التعادل، وحرارة مثالية عند خروجه من الضرع.", "بدون تبريد ولا معالجة، يتضاعف عدد الميكروبات كل عشرين دقيقة.", "يجب أن يحتوي الحليب الطبيعي على أقل من 100 000 UFC في كل مل (UFC: وحدة مكوّنة لمستعمرة).", "فوق هذه العتبة، يُخفَّض تصنيف الحليب أو يُرفض حسب جدول المصنع."]], "k": ["Ce qui nourrit le veau nourrit aussi les bactéries : seuil < 100 000 UFC/mL.", "ما يُغذّي العجل يُغذّي البكتيريا أيضًا: العتبة أقل من 100 000 UFC/مل."], "q": ["Quel est le seuil de charge microbienne d'un lait normal ?", "ما هي عتبة الحمولة الميكروبية للحليب الطبيعي؟"], "o": [["Moins de 100 000 UFC/mL", "Moins de 1 000 UFC/mL", "Moins de 10 millions d'UFC/mL"], ["أقل من 100 000 UFC/مل", "أقل من 1 000 UFC/مل", "أقل من 10 ملايين UFC/مل"]], "a": 0, "w": ["Un lait normal contient moins de 100 000 UFC/mL.", "الحليب الطبيعي يحتوي على أقل من 100 000 UFC/مل."], "g": [20, 55]}, {"img": "l05_09", "t": ["Flore originelle ou flore de contamination ?", "الفلورا الأصلية أم فلورا التلوث؟"], "st": [["Flore originelle : présente à la sortie du pis ; le lait qui sort du pis est pratiquement stérile ; flore peu abondante, souvent non pathogène, surtout des bactéries lactiques.", "Flore de contamination : apportée pendant la traite, le transport et le stockage ; souvent pathogène.", "La flore originelle dépend de l'animal et de son alimentation ; la flore de contamination dépend entièrement de l'hygiène.", "Germes d'origine fécale : clostridies, entérobactéries, coliformes, Salmonella, Yersinia, Campylobacter. D'animaux malades : Streptococcus agalactiae, Staphylococcus aureus, Brucella, Listeria."], ["الفلورا الأصلية (flore originelle): موجودة عند الخروج من الضرع؛ الحليب الخارج من الضرع شبه معقَّم؛ فلورا قليلة، غالبًا غير ممرضة، وأغلبها بكتيريا لبنية.", "فلورا التلوث (flore de contamination): تأتي أثناء الحلب والنقل والتخزين؛ وغالبًا ما تكون ممرضة.", "الفلورا الأصلية تتعلق بالحيوان وتغذيته؛ أما فلورا التلوث فتتعلق كليًا بالنظافة.", "جراثيم من أصل برازي: المطثيات، البكتيريا المعوية، القولونيات، Salmonella، Yersinia، Campylobacter. ومن حيوانات مريضة: Streptococcus agalactiae، Staphylococcus aureus، Brucella، Listeria."]], "k": ["Le lait sort du pis presque stérile : ce qu'on y trouve ensuite vient de l'hygiène.", "الحليب يخرج من الضرع شبه معقَّم: وما نجده فيه بعد ذلك مصدره النظافة."], "q": ["De quoi dépend entièrement la flore de contamination ?", "بماذا تتعلق فلورا التلوث كليًا؟"], "o": [["De la race de la vache", "De l'hygiène", "Du lactose du lait"], ["بسلالة البقرة", "بالنظافة", "بلاكتوز الحليب"]], "a": 1, "w": ["Elle vient des mains, du matériel, de la litière ou de l'air : c'est l'hygiène qui la contrôle.", "تأتي من الأيدي والأدوات والفراش والهواء: النظافة هي التي تتحكم فيها."], "g": [20]}, {"img": "l05_11", "t": ["Les bons, les mauvais et les dangereux", "النافعة، الضارة والخطيرة"], "st": [["Flore utile : Lactobacillus, Streptococcus thermophilus, levures, moisissures d'affinage ; elle fabrique yaourt, fromage et arômes ; on l'ajoute volontairement.", "Flore d'altération : coliformes, germes psychrotrophes ; mauvais goûts, gonflements, textures anormales ; elle signale un manque d'hygiène.", "Flore pathogène : E. coli, Salmonella, Listeria, Staphylococcus aureus ; elle rend le consommateur malade : refus du lot, parfois rappel de produits.", "Leur présence dépend de l'hygiène et des conditions de traite et de conservation."], ["الفلورا النافعة: Lactobacillus، Streptococcus thermophilus، الخمائر، فطريات التعتيق؛ تصنع الياغورت والجبن والنكهات؛ ونضيفها عمدًا.", "فلورا الإفساد (altération): القولونيات والجراثيم المحبة للبرودة؛ طعوم سيئة، انتفاخ، قوام غير طبيعي؛ وهي علامة على نقص النظافة.", "الفلورا الممرضة (pathogène): E. coli، Salmonella، Listeria، Staphylococcus aureus؛ تُمرض المستهلك: رفض الدفعة، وأحيانًا سحب المنتوجات.", "وجودها يتعلق بالنظافة وبظروف الحلب والحفظ."]], "k": ["On favorise la flore utile, on limite l'altération, on refuse le pathogène.", "نشجّع الفلورا النافعة، نحدّ من فلورا الإفساد، ونرفض الممرضة."], "q": ["Les coliformes et les psychrotrophes appartiennent à quelle flore ?", "القولونيات والجراثيم المحبة للبرودة تنتمي إلى أيّ فلورا؟"], "o": [["Flore utile", "Flore pathogène", "Flore d'altération"], ["الفلورا النافعة", "الفلورا الممرضة", "فلورا الإفساد"]], "a": 2, "w": ["Ils abîment le lait (goût, gonflement, texture) sans rendre malade.", "إنها تُفسد الحليب (طعم، انتفاخ، قوام) دون أن تُمرض."], "g": [0, 57]}, {"img": "l05_14", "t": ["Les contaminants chimiques", "الملوِّثات الكيميائية"], "st": [["Antibiotiques : ils ralentissent ou inhibent les ferments lactiques, donc l'acidification ; le lait produit pendant le traitement doit être rejeté, et le délai d'attente respecté.", "Dépistage sur chaque chargement à l'usine : un lot positif bloque toute la cuve.", "Antiseptiques et détergents : résidus mal rincés (eau de Javel, eau oxygénée) qui nuisent à la fermentation ; ajoutés pour masquer une mauvaise qualité, c'est une fraude.", "Autres : pesticides et métaux lourds, venant de l'alimentation de l'animal ou de l'environnement.", "Le yaourt ne prend pas, le fromage ne caille pas : la cuve est perdue, et l'incident découvert plusieurs heures après."], ["المضادات الحيوية: تُبطئ الخمائر اللبنية أو توقفها، إذن توقف التحميض؛ يجب رفض الحليب المنتَج أثناء العلاج واحترام مدة الانتظار (délai d'attente).", "الكشف على كل حمولة في المصنع: دفعة إيجابية واحدة تُوقف الحوض كله.", "المطهرات والمنظفات: بقايا غير مشطوفة جيدًا (ماء جافيل، الماء الأكسجيني) تضر بالتخمر؛ وإضافتها لإخفاء جودة رديئة غش.", "أخرى: المبيدات والمعادن الثقيلة، الآتية من تغذية الحيوان أو من البيئة.", "الياغورت لا يتماسك والجبن لا يتخثر: يضيع الحوض، ولا يُكتشف الحادث إلا بعد عدة ساعات."]], "k": ["Antibiotiques et antiseptiques bloquent les ferments : test systématique à la réception.", "المضادات الحيوية والمطهرات توقف الخمائر: اختبار منهجي عند الاستقبال."], "q": ["Pourquoi teste-t-on les antibiotiques sur CHAQUE chargement ?", "لماذا نختبر المضادات الحيوية في كل حمولة؟"], "o": [["Un seul lot positif bloque toute la cuve", "Ils changent la couleur du lait", "Ils augmentent la densité"], ["دفعة إيجابية واحدة توقف الحوض كله", "لأنها تغيّر لون الحليب", "لأنها ترفع الكثافة"]], "a": 0, "w": ["Les ferments sont bloqués : la fabrication entière est perdue.", "الخمائر تتوقف: فتضيع الصناعة كلها."], "g": [20, 57]}, {"img": "l05_16", "t": ["Les laits liés à un trouble de la mamelle", "الألبان المرتبطة باضطراب في الضرع"], "st": [["Ces laits traduisent un mauvais fonctionnement de la mamelle : ils sont saisis, impropres à la consommation humaine.", "Lait colostral : première semaine après le vêlage ; très riche en protéines, il coagule à la chaleur ; il appartient au veau.", "Lait de mammite : moins de caséine, de MG et de lactose ; pH plus élevé ; plus de chlorures ; mauvais rendement fromager ; peut contenir des pathogènes.", "Lait de rétention : resté plus de douze heures dans la mamelle (traite incomplète ou oubliée) ; il devient acide ou prend un mauvais goût."], ["هذه الألبان تدل على خلل في عمل الضرع: تُحجز لأنها غير صالحة للاستهلاك البشري.", "الحليب اللبئي (colostral): الأسبوع الأول بعد الولادة؛ غني جدًا بالبروتينات، يتخثر بالحرارة؛ وهو ملك للعجل.", "حليب التهاب الضرع: كازين ودسم ولاكتوز أقل؛ pH أعلى؛ كلوريدات أكثر؛ مردود جبن ضعيف؛ وقد يحتوي على ممرضات.", "حليب الاحتباس (rétention): بقي أكثر من اثنتي عشرة ساعة في الضرع (حلب غير كامل أو منسي)؛ يصبح حامضًا أو يأخذ طعمًا سيئًا."]], "k": ["Trois causes différentes, une seule conséquence : ces laits n'entrent pas à l'usine.", "ثلاثة أسباب مختلفة ونتيجة واحدة: هذه الألبان لا تدخل المصنع."], "q": ["Une traite du soir a été oubliée ; le lait est aigre et épais. De quel lait s'agit-il ?", "نُسيت حلبة المساء؛ الحليب حامض وكثيف. أيّ حليب هذا؟"], "o": [["Lait colostral", "Lait de mammite", "Lait de rétention"], ["حليب لبئي", "حليب التهاب الضرع", "حليب الاحتباس"]], "a": 2, "w": ["Resté plus de 12 h dans la mamelle, le lait de rétention s'acidifie.", "حليب الاحتباس يتحمض بعد بقائه أكثر من 12 ساعة في الضرع."], "g": [9, 30, 32, 41, 42]}, {"img": "l05_18", "t": ["Laits altérés et laits fraudés", "الألبان المُفسَدة والألبان المغشوشة"], "st": [["Lait répugnant : couleur, odeur, saveur ou consistance anormale (ex. : odeur d'oignon après stockage dans un local mal aéré).", "Lait malpropre : matières étrangères en suspension (matières fécales, poussières, poils, paille), support des micro-organismes.", "Lait pathogène : bactéries, virus ou molécules chimiques (métaux lourds, dioxines).", "Lait fraudé : composition volontairement modifiée après la traite ; la catégorie la plus difficile à détecter.", "Les trois premiers relèvent d'un défaut d'hygiène ou d'environnement ; le quatrième relève d'une intention."], ["حليب منفِّر (répugnant): لون أو رائحة أو طعم أو قوام غير طبيعي (مثال: رائحة البصل بعد تخزينه في مكان سيئ التهوية).", "حليب غير نظيف (malpropre): مواد غريبة عالقة (فضلات، غبار، شعر، تبن) تحمل الكائنات الدقيقة.", "حليب ممرض: بكتيريا أو فيروسات أو جزيئات كيميائية (معادن ثقيلة، ديوكسينات).", "حليب مغشوش (fraudé): تركيبه مُعدَّل عمدًا بعد الحلب؛ وهو الصنف الأصعب كشفًا.", "الأصناف الثلاثة الأولى سببها خلل في النظافة أو البيئة؛ أما الرابع فسببه نيّة."]], "k": ["Un défaut d'hygiène se corrige avec l'éleveur ; une fraude rompt le contrat.", "خلل النظافة يُصحَّح مع المربّي؛ أما الغش فيُنهي العقد."], "q": ["Quel lait anormal relève d'une intention et non d'un défaut d'hygiène ?", "أيّ حليب غير طبيعي سببه نيّة وليس خللًا في النظافة؟"], "o": [["Le lait fraudé", "Le lait malpropre", "Le lait répugnant"], ["الحليب المغشوش", "الحليب غير النظيف", "الحليب المنفِّر"]], "a": 0, "w": ["La fraude est une modification volontaire de la composition après la traite.", "الغش تعديل متعمَّد للتركيب بعد الحلب."], "g": []}, {"img": "l05_20", "t": ["Quatre façons de tricher sur un lait", "أربع طرق للغش في الحليب"], "st": [["Mouillage : ajout d'eau pour augmenter le volume ; détecté par la densité et surtout le point de congélation ; peut être masqué par eau sucrée, lactosérum ou amidon (test à l'eau iodée).", "Neutralisants : chaux, soude, carbonate ou bicarbonate de sodium, pour cacher l'acidité d'un lait déjà acide ; le °D paraît normal.", "Écrémage frauduleux : retirer une partie de la MG ; il faut croiser MG, densité et ESD.", "Substitution et masquage : autre espèce, lait reconstitué de poudre, antibiotique ou antiseptique ajouté.", "Aucune fraude ne se voit à l'œil nu : toutes se détectent au laboratoire de réception."], ["إضافة الماء (mouillage): لزيادة الحجم؛ تُكشف بالكثافة وخاصة بنقطة التجمد؛ ويمكن إخفاؤها بماء محلّى أو مصل اللبن أو النشا (اختبار ماء اليود).", "المُعادِلات (neutralisants): الجير، الصودا، كربونات أو بيكربونات الصوديوم، لإخفاء حموضة حليب حامض أصلًا؛ فتبدو درجة دورنيك عادية.", "نزع الدسم الاحتيالي: نزع جزء من المادة الدسمة؛ ويجب مقارنة الدسم والكثافة والـ ESD.", "الاستبدال والإخفاء: نوع حيواني آخر، حليب مُعاد تكوينه من المسحوق، إضافة مضاد حيوي أو مطهر.", "لا يُرى أي غش بالعين المجردة: كلها تُكشف في مختبر الاستقبال."]], "k": ["Mouillage, neutralisation, écrémage, substitution : seul le laboratoire les démasque.", "إضافة الماء، التعديل، نزع الدسم، الاستبدال: المختبر وحده يكشفها."], "q": ["Un lait acide a été « rattrapé » au bicarbonate. Quelle fraude est-ce ?", "حليب حامض «أُصلِح» بالبيكربونات. ما نوع الغش؟"], "o": [["Mouillage", "Addition de neutralisants", "Écrémage frauduleux"], ["إضافة الماء", "إضافة مُعادِلات", "نزع الدسم الاحتيالي"]], "a": 1, "w": ["Le bicarbonate neutralise l'acidité : le degré Dornic paraît normal.", "البيكربونات يُعادل الحموضة: فتبدو درجة دورنيك عادية."], "g": [11, 12, 19, 34, 58]}, {"img": "l05_23", "t": ["Accepter, déclasser ou refuser", "القبول، خفض التصنيف أو الرفض"], "st": [["Refus immédiat : test antibiotique positif ; température de livraison nettement supérieure à 6 °C ; lait colostral, mammiteux ou visiblement altéré ; acidité hors norme ou coagulation au test d'ébullition.", "Déclassement : charge microbienne élevée mais sous le seuil critique ; MG ou protéines sous le contrat ; propreté insuffisante sans danger sanitaire.", "Un lot déclassé part vers un produit moins exigeant : un lait peut être sain mais ne pas convenir à la fabrication prévue.", "Toute décision se justifie par un résultat d'analyse écrit, daté et signé (traçabilité) ; un refus injustifié coûte aussi cher qu'une acceptation à tort."], ["رفض فوري: اختبار مضادات حيوية إيجابي؛ حرارة تسليم أعلى بوضوح من 6 °C؛ حليب لبئي أو بالتهاب الضرع أو فاسد ظاهريًا؛ حموضة خارج المعيار أو تخثر في اختبار الغليان.", "خفض التصنيف (déclassement): حمولة ميكروبية مرتفعة لكن تحت العتبة الحرجة؛ دسم أو بروتينات أقل من العقد؛ نظافة غير كافية دون خطر صحي.", "الدفعة المخفَّضة تذهب إلى منتوج أقل تطلبًا: قد يكون الحليب سليمًا لكنه لا يناسب الصناعة المبرمجة.", "كل قرار يُبرَّر بنتيجة تحليل مكتوبة ومؤرخة وموقّعة (التتبع traçabilité)؛ والرفض غير المبرر مكلف مثل القبول الخاطئ."]], "k": ["Une décision de réception se justifie par un résultat, jamais par une impression.", "قرار الاستقبال يُبرَّر بنتيجة، وليس بانطباع أبدًا."], "q": ["Un lait sain a un taux de MG sous le contrat. Quelle décision ?", "حليب سليم لكن نسبة دسمه أقل من العقد. ما القرار؟"], "o": [["Refus immédiat", "Acceptation sans remarque", "Déclassement vers un produit moins exigeant"], ["رفض فوري", "قبول دون ملاحظة", "خفض التصنيف نحو منتوج أقل تطلبًا"]], "a": 2, "w": ["Pas de danger sanitaire : le lot est déclassé, pas refusé.", "لا خطر صحي: تُخفَّض الدفعة ولا تُرفض."], "g": [9, 32]}], "since": "1.6"}, {"n": 6, "t": ["Acidité Dornic, pH et densité — la théorie", "حموضة دورنيك، الـ pH والكثافة — الجانب النظري"], "c": [{"img": "l06_07", "t": ["Les quatre types d'analyses", "الأنواع الأربعة للتحاليل"], "st": [["Physico-chimiques : acidité Dornic, pH, densité, MG, matière protéique, extrait sec, point de congélation.", "Microbiologiques : flore mésophile aérobie totale, coliformes, pathogènes ; elles demandent une incubation, le résultat n'arrive pas le jour même.", "Sensorielles : aspect, couleur, odeur, goût ; gratuites et immédiates, dès l'ouverture de la citerne.", "Contrôle des fraudes : tests d'antibiotiques, test de Teepol, tests de stabilité, cryoscopie.", "Les analyses rapides décident de l'acceptation du lot ; les analyses longues suivent un fournisseur dans le temps."], ["فيزيائية كيميائية: حموضة دورنيك، الـ pH، الكثافة، الدسم، المادة البروتينية، المادة الجافة، نقطة التجمد.", "ميكروبيولوجية: الفلورا الهوائية المتوسطة الحرارة الكلية، القولونيات، الممرضات؛ تحتاج إلى حضن، فلا تصل النتيجة في اليوم نفسه.", "حسية: المظهر، اللون، الرائحة، الطعم؛ مجانية وفورية، منذ فتح الصهريج.", "مراقبة الغش: اختبارات المضادات الحيوية، اختبار تيبول (Teepol)، اختبارات الثبات، قياس نقطة التجمد (cryoscopie).", "التحاليل السريعة تقرر قبول الدفعة؛ والتحاليل الطويلة تتبع المورّد مع الوقت."]], "k": ["Le camion ne peut pas attendre 48 h : la décision se prend sur les analyses rapides.", "الشاحنة لا تستطيع الانتظار 48 ساعة: القرار يُتخذ على أساس التحاليل السريعة."], "q": ["Pourquoi les analyses microbiologiques ne décident-elles pas l'acceptation du camion ?", "لماذا لا تقرر التحاليل الميكروبيولوجية قبول الشاحنة؟"], "o": [["Elles sont trop imprécises", "Elles demandent une incubation", "Elles ne concernent que la couleur"], ["لأنها غير دقيقة", "لأنها تحتاج إلى حضن", "لأنها تخص اللون فقط"]], "a": 1, "w": ["Le résultat n'arrive pas le jour même : elles servent à suivre le fournisseur.", "النتيجة لا تصل في اليوم نفسه: إنها تُستعمل لتتبع المورّد."], "g": [11, 12, 52]}, {"img": "l06_09", "t": ["L'acidité Dornic : le mode opératoire", "حموضة دورنيك: طريقة العمل"], "st": [["Objectif : déterminer la quantité d'acide lactique du lait pour connaître sa fraîcheur.", "Préparer la burette de soude Dornic (NaOH N/9) au trait zéro ; prélever 10 mL de lait dans un bécher ; ajouter quelques gouttes de phénolphtaléine.", "Titrer : verser la soude goutte à goutte en agitant, jusqu'à persistance d'une couleur rose ; noter le volume.", "Calcul : °D = V NaOH (mL) × 10 ; 1 °D = 0,1 g d'acide lactique par litre. Ex. : 1,6 mL → 16 °D, soit 1,6 g/L."], ["الهدف: تحديد كمية حمض اللبنيك في الحليب لمعرفة طزاجته.", "تحضير السحاحة (burette) بصودا دورنيك (NaOH N/9) عند خط الصفر؛ أخذ 10 مل من الحليب في كأس؛ إضافة بضع قطرات من الفينول فتالين (phénolphtaléine).", "المعايرة (titrage): صبّ الصودا قطرة قطرة مع التحريك، حتى يثبت لون وردي؛ ثم تسجيل الحجم.", "الحساب: °D = حجم NaOH (مل) × 10؛ و1 °D = 0,1 غ من حمض اللبنيك في اللتر. مثال: 1,6 مل ← 16 °D، أي 1,6 غ/ل."]], "k": ["°D = volume de soude (mL) × 10 ; 1 °D = 0,1 g d'acide lactique par litre.", "°D = حجم الصودا (مل) × 10؛ و1 °D = 0,1 غ من حمض اللبنيك في اللتر."], "q": ["On verse 1,7 mL de soude Dornic sur 10 mL de lait. Quelle est l'acidité ?", "صببنا 1,7 مل من صودا دورنيك على 10 مل من الحليب. كم الحموضة؟"], "o": [["17 °D", "1,7 °D", "170 °D"], ["17 °D", "1,7 °D", "170 °D"]], "a": 0, "w": ["°D = 1,7 × 10 = 17 °D, un lait frais.", "°D = 1,7 × 10 = 17 °D، حليب طازج."], "g": [11, 12, 38]}, {"img": "l06_12", "t": ["L'échelle du degré Dornic", "سلّم درجة دورنيك"], "st": [["Moins de 14 °D : lait anormal (mouillé, de mammite ou neutralisé frauduleusement) ; il faut pousser les analyses.", "14 à 18 °D : lait frais et normal ; 16 °D = lait sain, prêt à être transformé.", "Au-delà de 18 °D : acidification en cours, le lactose devient acide lactique ; risque de coagulation au traitement thermique.", "À partir de 26 °D : coagulation à chaud, le lait ne peut plus être pasteurisé. Au-delà de 70 °D : coagulation à froid, lait perdu pour la transformation."], ["أقل من 14 °D: حليب غير طبيعي (مضاف إليه الماء، أو من التهاب الضرع، أو مُعدَّل بالغش)؛ يجب تعميق التحاليل.", "من 14 إلى 18 °D: حليب طازج وطبيعي؛ 16 °D = حليب سليم جاهز للتحويل.", "فوق 18 °D: التحمّض جارٍ، اللاكتوز يصير حمض اللبنيك؛ خطر التخثر أثناء المعالجة الحرارية.", "ابتداءً من 26 °D: تخثر بالحرارة، ولا يمكن بسترة الحليب. فوق 70 °D: تخثر في البرودة، وحليب ضائع للتحويل."]], "k": ["Trois seuils : 14–18 normal, 26 coagulation à chaud, 70 coagulation à froid.", "ثلاث عتبات: 14–18 طبيعي، 26 تخثر بالحرارة، 70 تخثر في البرودة."], "q": ["À partir de quelle acidité un lait coagule-t-il dès qu'on le chauffe ?", "ابتداءً من أيّ حموضة يتخثر الحليب بمجرد تسخينه؟"], "o": [["18 °D", "26 °D", "70 °D"], ["18 °D", "26 °D", "70 °D"]], "a": 1, "w": ["Dès 26 °D : coagulation à chaud. Au-delà de 70 °D : même à froid.", "ابتداءً من 26 °D: تخثر بالحرارة. وفوق 70 °D: حتى في البرودة."], "g": [11, 12, 30, 32, 34]}, {"img": "l06_14", "t": ["Acidité naturelle ou acidité développée ?", "الحموضة الطبيعية أم الحموضة المكتسبة؟"], "st": [["Acidité naturelle, 14 à 18 °D : présente dès la sortie du pis ; elle vient des caséines, phosphates, citrates et du gaz carbonique dissous, pas de l'acide lactique.", "Acidité développée : elle s'ajoute au fil des heures ; c'est l'acide lactique produit par les bactéries à partir du lactose ; elle mesure le temps perdu et la température subie.", "Le titrage Dornic mesure la somme des deux : un lait à 22 °D a environ 4 à 8 °D d'acidité développée, le signal d'alerte.", "Un lait n'est jamais à 0 °D ; sous 14 °D, il n'est pas « très frais » : il est anormal (mouillage ou neutralisation)."], ["الحموضة الطبيعية، 14 إلى 18 °D: موجودة منذ الخروج من الضرع؛ مصدرها الكازينات والفوسفات والسترات وثاني أكسيد الكربون الذائب، وليس حمض اللبنيك.", "الحموضة المكتسبة (développée): تُضاف مع مرور الساعات؛ إنها حمض اللبنيك الذي تنتجه البكتيريا من اللاكتوز؛ وتقيس الوقت الضائع والحرارة التي تعرض لها الحليب.", "معايرة دورنيك تقيس مجموع الاثنتين: حليب بـ 22 °D فيه حوالي 4 إلى 8 °D من الحموضة المكتسبة، وهي إشارة الإنذار.", "الحليب لا يكون أبدًا بـ 0 °D؛ وتحت 14 °D ليس «طازجًا جدًا» بل غير طبيعي (إضافة الماء أو تعديل)."]], "k": ["L'acidité naturelle est là dès le départ ; l'acidité développée est le prix du retard.", "الحموضة الطبيعية موجودة منذ البداية؛ والحموضة المكتسبة ثمن التأخير."], "q": ["Un lait mesuré à 10 °D est :", "حليب قيست حموضته بـ 10 °D هو:"], "o": [["Particulièrement frais", "Prêt pour la fromagerie", "Anormal, à contrôler"], ["طازج بشكل خاص", "جاهز لصناعة الجبن", "غير طبيعي ويجب مراقبته"]], "a": 2, "w": ["Sous 14 °D : mouillage ou neutralisation frauduleuse.", "تحت 14 °D: إضافة الماء أو تعديل احتيالي."], "g": [11, 12, 20, 30, 34]}, {"img": "l06_16", "t": ["Le pH du lait", "الـ pH في الحليب"], "st": [["Objectif : vérifier la fraîcheur du lait ; l'électrode mesure la concentration en ions H+.", "Bon usage du pH-mètre : étalonner avant chaque série avec les solutions tampons ; respecter la température de mesure ; rincer l'électrode et la conserver dans sa solution.", "Valeur normale d'un lait frais : pH 6,6 à 6,8.", "pH qui baisse : début de fermentation du lactose. pH qui monte : lait de mammite, dégradation des protéines ou ajout frauduleux de substances alcalines."], ["الهدف: التحقق من طزاجة الحليب؛ القطب الكهربائي (électrode) يقيس تركيز أيونات H+.", "الاستعمال الصحيح لجهاز الـ pH: المعايرة قبل كل سلسلة بالمحاليل المنظِّمة (solutions tampons)؛ احترام حرارة القياس؛ شطف القطب وحفظه في محلوله.", "القيمة الطبيعية للحليب الطازج: pH من 6,6 إلى 6,8.", "pH ينخفض: بداية تخمر اللاكتوز. pH يرتفع: حليب التهاب الضرع، أو تحلل البروتينات، أو إضافة احتيالية لمواد قلوية."]], "k": ["pH qui baisse = fermentation ; pH qui monte = composition anormale.", "pH ينخفض = تخمر؛ pH يرتفع = تركيب غير طبيعي."], "q": ["Que faut-il faire avant chaque série de mesures au pH-mètre ?", "ماذا يجب فعله قبل كل سلسلة قياسات بجهاز الـ pH؟"], "o": [["Étalonner avec les solutions tampons", "Chauffer le lait à 72 °C", "Sécher l'électrode à l'air"], ["المعايرة بالمحاليل المنظِّمة", "تسخين الحليب إلى 72 °C", "تجفيف القطب في الهواء"]], "a": 0, "w": ["Sans étalonnage, la mesure n'est pas fiable.", "بدون معايرة لا يكون القياس موثوقًا."], "g": [30, 32]}, {"img": "l06_18", "t": ["pH ou degré Dornic ?", "الـ pH أم درجة دورنيك؟"], "st": [["Le pH, une photographie : il mesure les ions H+ libres à l'instant de la lecture ; résultat immédiat, sans réactif.", "Échelle logarithmique : de 6,7 à 6,4, l'acidité a doublé. Le pH est indispensable en fabrication (yaourterie, fromagerie).", "Le Dornic, un inventaire : il mesure l'acidité totale titrable, libre et combinée ; échelle linéaire en grammes d'acide lactique ; indispensable en réception.", "Cas d'école : un lait neutralisé frauduleusement a un pH normal et un Dornic anormal ; c'est pourquoi on fait les deux."], ["الـ pH، صورة فوتوغرافية: يقيس أيونات H+ الحرة لحظة القراءة؛ نتيجة فورية دون كاشف.", "سلّم لوغاريتمي: من 6,7 إلى 6,4 تتضاعف الحموضة. الـ pH ضروري في التصنيع (الياغورت، الجبن).", "دورنيك، جرد: يقيس الحموضة الكلية القابلة للمعايرة، الحرة والمرتبطة؛ سلّم خطي بالغرامات من حمض اللبنيك؛ ضروري عند الاستقبال.", "حالة نموذجية: الحليب المُعدَّل احتياليًا له pH عادي ودورنيك غير عادي؛ لهذا نقوم بالقياسين."]], "k": ["Le pH dit où en est le lait maintenant ; le Dornic dit combien d'acide il contient en tout.", "الـ pH يقول أين وصل الحليب الآن؛ ودورنيك يقول كم من الحمض يحتوي في المجموع."], "q": ["Quelle mesure décide de l'acceptation d'un lot à la réception ?", "أيّ قياس يقرر قبول الدفعة عند الاستقبال؟"], "o": [["Le degré Dornic", "Le pH seul", "La couleur du lait"], ["درجة دورنيك", "الـ pH وحده", "لون الحليب"]], "a": 0, "w": ["Le Dornic, lisible en grammes d'acide lactique, est l'outil de la réception.", "دورنيك، المقروء بالغرامات من حمض اللبنيك، هو أداة الاستقبال."], "g": [11, 12, 20, 57]}, {"img": "l06_20", "t": ["La densité au lactodensimètre", "الكثافة بمقياس كثافة الحليب"], "st": [["Objectif : vérifier le mouillage et l'écrémage. La densité est le rapport de la masse volumique du lait à celle de l'eau, à 20 °C.", "Remplir une éprouvette d'environ 50 mL de lait ; plonger le lactodensimètre doucement, sans le lâcher ; attendre la stabilisation ; lire la densité et la température.", "Correction : D20 = D(T) + 0,2 × (T − 20), avec D(T) = 1 000 + valeur lue.", "Exemple : lecture 25 à 8 °C → D20 = 1 025 + 0,2 × (8 − 20) = 1 022,6 g/L."], ["الهدف: التحقق من إضافة الماء ونزع الدسم. الكثافة هي نسبة الكتلة الحجمية للحليب إلى الكتلة الحجمية للماء في 20 °C.", "ملء مخبار (éprouvette) بحوالي 50 مل من الحليب؛ إدخال مقياس كثافة الحليب (lactodensimètre) بلطف دون تركه؛ انتظار الاستقرار؛ قراءة الكثافة والحرارة.", "التصحيح: D20 = D(T) + 0,2 × (T − 20)، مع D(T) = 1 000 + القيمة المقروءة.", "مثال: قراءة 25 في 8 °C ← D20 = 1 025 + 0,2 × (8 − 20) = 1 022,6 غ/ل."]], "k": ["Toujours corriger la lecture à 20 °C : c'est l'erreur la plus fréquente.", "صحّح القراءة دائمًا إلى 20 °C: إنه الخطأ الأكثر شيوعًا."], "q": ["Lecture 25 à 8 °C. Quelle est la densité corrigée à 20 °C ?", "قراءة 25 في 8 °C. ما هي الكثافة المصحَّحة في 20 °C؟"], "o": [["1 025 g/L", "1 027,4 g/L", "1 022,6 g/L"], ["1 025 غ/ل", "1 027,4 غ/ل", "1 022,6 غ/ل"]], "a": 2, "w": ["1 025 + 0,2 × (8 − 20) = 1 025 − 2,4 = 1 022,6 g/L.", "1 025 + 0,2 × (8 − 20) = 1 025 − 2,4 = 1 022,6 غ/ل."], "g": [20, 28, 34]}, {"img": "l06_23", "t": ["Densité haute ou densité basse ?", "كثافة مرتفعة أم كثافة منخفضة؟"], "st": [["Valeur normale : 1 028 à 1 033 g/L à 20 °C, moyenne 1 030.", "Supérieure à 1 033 : écrémage frauduleux ; on a retiré la matière grasse, plus légère que l'eau, donc le reste est plus dense.", "Inférieure à 1 028 : mouillage ; l'eau ajoutée rapproche la densité de celle de l'eau, soit 1 000.", "Piège : une densité normale ne prouve rien ; un lait à la fois mouillé et écrémé retrouve une densité normale. Il faut croiser avec la MG et l'extrait sec."], ["القيمة الطبيعية: 1 028 إلى 1 033 غ/ل في 20 °C، بمتوسط 1 030.", "أعلى من 1 033: نزع دسم احتيالي؛ نُزعت المادة الدسمة الأخف من الماء، فصار الباقي أكثر كثافة.", "أقل من 1 028: إضافة الماء؛ الماء المضاف يُقرّب الكثافة من كثافة الماء، أي 1 000.", "فخ: الكثافة العادية لا تُثبت شيئًا؛ فالحليب المضاف إليه الماء والمنزوع الدسم معًا يسترجع كثافة عادية. يجب المقارنة مع الدسم والمادة الجافة."]], "k": ["Un chiffre ne conclut rien tout seul : c'est le croisement qui décide.", "رقم واحد لا يحسم شيئًا: المقارنة هي التي تقرر."], "q": ["Une densité à 20 °C de 1 026 g/L indique :", "كثافة 1 026 غ/ل في 20 °C تدل على:"], "o": [["Un écrémage", "Un mouillage", "Un lait normal"], ["نزع الدسم", "إضافة الماء", "حليب طبيعي"]], "a": 1, "w": ["Sous 1 028 g/L : l'eau ajoutée a rapproché la densité de 1 000.", "تحت 1 028 غ/ل: الماء المضاف قرّب الكثافة من 1 000."], "g": [20, 34, 58]}, {"img": "l06_25", "t": ["Le lait supportera-t-il la chaleur ?", "هل سيتحمل الحليب الحرارة؟"], "st": [["Test à l'ébullition : 5 mL de lait portés à ébullition dans un tube ; s'il caille ou floconne, il est refusé.", "Il est positif dès 26 °D environ ; un tube et une flamme suffisent, réponse en moins d'une minute.", "Test à l'alcool : lait et alcool à 68 ou 75° mélangés volume à volume ; des flocons apparaissent si le lait est instable.", "Plus sensible, il détecte aussi un déséquilibre minéral : c'est le test de référence à la réception.", "Un lait acide coagule dans l'échangeur à plaques et encrasse toute la ligne : plusieurs heures d'arrêt et de nettoyage."], ["اختبار الغليان: تُغلى 5 مل من الحليب في أنبوب؛ إذا تخثر أو ظهرت فيه ندف يُرفض.", "يكون إيجابيًا ابتداءً من حوالي 26 °D؛ يكفي أنبوب ولهب، والجواب في أقل من دقيقة.", "اختبار الكحول: يُخلط الحليب والكحول بتركيز 68 أو 75 درجة حجمًا بحجم؛ تظهر ندف إذا كان الحليب غير ثابت.", "إنه أكثر حساسية، ويكشف أيضًا اختلال التوازن المعدني: إنه الاختبار المرجعي عند الاستقبال.", "الحليب الحامض يتخثر في المبادل الحراري ذي الصفائح (échangeur à plaques) ويوسّخ الخط كله: ساعات من التوقف والتنظيف."]], "k": ["Quelques secondes de test évitent des heures d'arrêt de ligne.", "ثوانٍ قليلة من الاختبار تتجنب ساعات من توقف الخط."], "q": ["Quel test est le plus sensible et sert de référence à la réception ?", "أيّ اختبار هو الأكثر حساسية ويُعدّ مرجعًا عند الاستقبال؟"], "o": [["Le test à l'ébullition", "Le test à l'alcool", "La lecture de la couleur"], ["اختبار الغليان", "اختبار الكحول", "ملاحظة اللون"]], "a": 1, "w": ["Le test à l'alcool détecte aussi un déséquilibre minéral.", "اختبار الكحول يكشف أيضًا اختلال التوازن المعدني."], "g": [11, 12, 20]}], "since": "1.6"}, {"n": 7, "t": ["TP 1 — Acidité Dornic, pH et densité", "الأشغال التطبيقية 1 — حموضة دورنيك، الـ pH والكثافة"], "c": [{"img": "l07_07", "t": ["Trois mesures, trois informations", "ثلاثة قياسات، ثلاث معلومات"], "st": [["Acidité Dornic : elle mesure l'acide lactique déjà formé. Elle dit depuis combien de temps le lait fermente. Référence : 14 à 18 °D.", "pH : il mesure l'acidité libre à l'instant de la mesure. Référence : 6,6 à 6,8. Un pH qui monte signale un lait de mammite ou un ajout alcalin.", "Densité : elle compare la masse volumique du lait à celle de l'eau. Référence : 1 028 à 1 033. En dessous, mouillage ; au-dessus, écrémage.", "Un lait neutralisé frauduleusement a un pH normal et un Dornic anormal : c'est pourquoi on fait toujours les deux."], ["حموضة دورنيك (acidité Dornic): تقيس حمض اللبنيك (acide lactique) المتكوّن من قبل. تدل على مدة تخمّر الحليب. المرجع: 14 إلى 18 °D.", "الـ pH: يقيس الحموضة الحرة لحظة القياس. المرجع: 6,6 إلى 6,8. ارتفاع الـ pH يدل على حليب التهاب الضرع (mammite) أو إضافة مادة قاعدية.", "الكثافة (densité): تقارن الكتلة الحجمية للحليب بكتلة الماء. المرجع: 1 028 إلى 1 033. أقل: إضافة الماء (mouillage)؛ أكثر: نزع الدسم (écrémage).", "الحليب المُعادَل غشًّا (neutralisé) له pH عادي ودورنيك غير عادي: لهذا نقوم دائمًا بالقياسين معًا."]], "k": ["Trois mesures complémentaires, jamais interchangeables : chacune répond à une question différente.", "ثلاثة قياسات متكاملة لا يعوّض أحدها الآخر: كل واحد يجيب عن سؤال مختلف."], "q": ["Un lait a un pH de 6,7 mais une acidité de 11 °D. Que soupçonnes-tu ?", "حليب له pH يساوي 6,7 لكن حموضته 11 °D. ماذا تشكّ؟"], "o": [["Un lait très frais", "Un lait en acidification", "Un lait neutralisé frauduleusement"], ["حليب طازج جدًا", "حليب في طور التحمّض", "حليب مُعادَل غشًّا"]], "a": 2, "w": ["pH normal et Dornic anormal : c'est le signe d'une neutralisation frauduleuse.", "pH عادي ودورنيك غير عادي: هذه علامة المعادلة الغشّية."], "g": [11, 12, 20, 32, 34]}, {"img": "l07_11", "t": ["Le titrage Dornic, geste par geste", "معايرة دورنيك خطوة بخطوة"], "st": [["Remplir la burette de soude Dornic (NaOH N/9) jusqu'au zéro.", "Verser 10 mL de lait dans un bécher et ajouter quelques gouttes de phénolphtaléine.", "Verser la soude goutte à goutte en agitant, jusqu'à persistance d'une couleur rose. Noter le volume versé.", "Calculer : degré Dornic = volume de soude (mL) × 10. Exemple : 1,6 mL donnent 16 °D. 1 °D = 0,1 g d'acide lactique par litre."], ["املأ السحّاحة (burette) بصودا دورنيك (NaOH N/9) حتى الصفر.", "صبّ 10 مل من الحليب في كأس (bécher) وأضف بضع قطرات من الفينول فتالين (phénolphtaléine).", "صبّ الصودا قطرة قطرة مع التحريك حتى يثبت لون وردي. سجّل الحجم المصبوب.", "احسب: درجة دورنيك = حجم الصودا (مل) × 10. مثال: 1,6 مل تعطي 16 °D. و1 °D = 0,1 غ من حمض اللبنيك في اللتر."]], "k": ["10 mL de lait, phénolphtaléine, soude jusqu'au rose persistant : °D = V × 10.", "10 مل من الحليب، فينول فتالين، صودا حتى الوردي الثابت: °D = الحجم × 10."], "q": ["Tu as versé 1,7 mL de soude. Quelle est l'acidité du lait ?", "صببت 1,7 مل من الصودا. ما حموضة الحليب؟"], "o": [["17 °D", "1,7 °D", "170 °D"], ["17 °D", "1,7 °D", "170 °D"]], "a": 0, "w": ["°D = volume de soude × 10, donc 1,7 × 10 = 17 °D.", "°D = حجم الصودا × 10، إذن 1,7 × 10 = 17 °D."], "g": [11, 12, 38]}, {"img": "l07_13", "t": ["Le poste Dornic : matériel et réactifs", "مركز دورنيك: الأدوات والكواشف"], "st": [["Matériel : burette graduée et support, bécher, pipette 10 mL et poire, pH-mètre étalonné, éprouvette, lactodensimètre.", "Réactifs : soude Dornic NaOH N/9, phénolphtaléine à 1 % dans l'alcool, solutions tampons pH 4 et pH 7.", "Préparer la phénolphtaléine : dissoudre 1 g dans 100 mL d'alcool éthylique à 95°.", "L'indicateur vire de l'incolore au rose en milieu basique : ce virage marque la fin du titrage."], ["الأدوات: سحّاحة مدرّجة وحاملها، كأس، ماصّة (pipette) 10 مل وإجاصة (poire)، جهاز pH معايَر، مخبار (éprouvette)، مكثاف الحليب (lactodensimètre).", "الكواشف (réactifs): صودا دورنيك NaOH N/9، فينول فتالين 1٪ في الكحول، محاليل منظِّمة (solutions tampons) pH 4 وpH 7.", "تحضير الفينول فتالين: إذابة 1 غ في 100 مل من الكحول الإيثيلي 95°.", "يتحوّل الكاشف من عديم اللون إلى الوردي في وسط قاعدي: هذا التحوّل يعلن نهاية المعايرة."]], "k": ["La phénolphtaléine vire au rose en milieu basique : c'est le signal de fin du titrage.", "الفينول فتالين يصير ورديًا في الوسط القاعدي: إنها إشارة نهاية المعايرة."], "q": ["La phénolphtaléine devient rose quand le milieu devient :", "يصبح الفينول فتالين ورديًا عندما يصبح الوسط:"], "o": [["acide", "neutre", "basique"], ["حمضيًا", "متعادلًا", "قاعديًا"]], "a": 2, "w": ["La soude neutralise l'acide lactique puis passe en excès : le milieu devient basique.", "الصودا تعادل حمض اللبنيك ثم تصبح زائدة: يصبح الوسط قاعديًا."], "g": [11, 12, 20, 28, 38]}, {"img": "l07_10", "t": ["Mesurer le pH et répéter les essais", "قياس الـ pH وتكرار المحاولات"], "st": [["Étalonner le pH-mètre avec les solutions tampons.", "Rincer l'électrode à l'eau distillée, la plonger dans le lait, attendre la stabilisation, lire, puis rincer à nouveau.", "Répétabilité : refaire chaque mesure trois fois sur le même lait.", "Un écart important entre essais signale une erreur de geste, pas une variation du lait."], ["عايِر جهاز الـ pH (étalonner) بالمحاليل المنظِّمة.", "اشطف القطب (électrode) بالماء المقطّر، اغمسه في الحليب، انتظر الاستقرار، اقرأ، ثم اشطفه من جديد.", "قابلية التكرار (répétabilité): أعد كل قياس ثلاث مرات على نفس الحليب.", "فرق كبير بين المحاولات يدل على خطأ في الحركة، وليس على تغيّر في الحليب."]], "k": ["Trois essais par mesure : un écart entre essais est une erreur de geste.", "ثلاث محاولات لكل قياس: الفرق بين المحاولات خطأ في الحركة."], "q": ["Tes trois essais Dornic donnent 16, 16 et 21 °D. Que conclus-tu ?", "محاولاتك الثلاث لدورنيك تعطي 16 و16 و21 °D. ماذا تستنتج؟"], "o": [["Le lait a changé entre les essais", "Il y a une erreur de geste à vérifier", "On garde la moyenne sans rien dire"], ["الحليب تغيّر بين المحاولات", "هناك خطأ في الحركة يجب التحقق منه", "نأخذ المعدل دون تعليق"]], "a": 1, "w": ["Sur le même lait, un écart entre essais vient du geste : on vérifie par un nouvel essai.", "على نفس الحليب، الفرق بين المحاولات سببه الحركة: نتحقق بمحاولة جديدة."], "g": [20, 45]}, {"img": "l07_08", "t": ["Lire le lactodensimètre et corriger la densité", "قراءة مكثاف الحليب وتصحيح الكثافة"], "st": [["Remplir l'éprouvette de 50 mL de lait sans faire mousser.", "Plonger doucement le lactodensimètre, attendre son immobilisation, lire la densité et la température.", "Corriger à 20 °C : D₂₀ = D(T) + 0,2 × (T − 20).", "Exemple du cours : lecture 1 025 à 8 °C → D₂₀ = 1 025 + 0,2 × (−12) = 1 022,6 g/L."], ["املأ المخبار بـ 50 مل من الحليب دون تكوين رغوة.", "اغمس مكثاف الحليب بلطف، انتظر توقّفه، ثم اقرأ الكثافة ودرجة الحرارة.", "صحّح إلى 20 °م: D₂₀ = D(T) + 0,2 × (T − 20).", "مثال الدرس: قراءة 1 025 في 8 °م ← D₂₀ = 1 025 + 0,2 × (−12) = 1 022,6 غ/ل."]], "k": ["Sans correction de température, la densité est inexploitable.", "بدون تصحيح الحرارة، لا يمكن استغلال الكثافة."], "q": ["Quelle formule corrige une densité lue à une température T ?", "ما الصيغة التي تصحّح كثافة مقروءة في درجة حرارة T؟"], "o": [["D₂₀ = D(T) − 20", "D₂₀ = D(T) + 0,2 × (T − 20)", "Aucune correction n'est nécessaire"], ["D₂₀ = D(T) − 20", "D₂₀ = D(T) + 0,2 × (T − 20)", "لا حاجة لأي تصحيح"]], "a": 1, "w": ["On ramène toujours la lecture à 20 °C avec D₂₀ = D(T) + 0,2 × (T − 20).", "نُرجِع القراءة دائمًا إلى 20 °م بالصيغة D₂₀ = D(T) + 0,2 × (T − 20)."], "g": [13, 20, 28]}, {"img": "l07_15", "t": ["Les cinq erreurs qui faussent le résultat", "الأخطاء الخمسة التي تُفسد النتيجة"], "st": [["Lait mal mélangé : la crème est remontée, la MG et la densité sont fausses.", "Burette mal lue : lire au bas du ménisque, à hauteur des yeux.", "Virage dépassé : un rose soutenu signifie trop de soude. Le rose doit persister quelques secondes, pas davantage.", "Température oubliée : densité inexploitable. Électrode non rincée : le lait précédent fausse la mesure suivante."], ["حليب غير مخلوط جيدًا: صعدت القشدة، فتكون المادة الدسمة (MG) والكثافة خاطئتين.", "سحّاحة مقروءة بشكل خاطئ: اقرأ أسفل الهلالة (ménisque) في مستوى العينين.", "تجاوز نقطة التحوّل: الوردي الداكن يعني صودا زائدة. يجب أن يثبت الوردي بضع ثوانٍ فقط.", "نسيان الحرارة: كثافة غير قابلة للاستغلال. قطب غير مشطوف: الحليب السابق يُفسد القياس التالي."]], "k": ["On note ce qu'on lit, pas ce qu'on attend ; un résultat surprenant se vérifie par un deuxième essai.", "نسجّل ما نقرأ لا ما نتوقع؛ والنتيجة المفاجئة نتحقق منها بمحاولة ثانية."], "q": ["Ton bécher est rose soutenu à la fin du titrage. Que s'est-il passé ?", "كأسك وردي داكن في نهاية المعايرة. ماذا حدث؟"], "o": [["Tu as versé trop de soude", "Le lait est très frais", "Tu as oublié la phénolphtaléine"], ["صببت صودا أكثر من اللازم", "الحليب طازج جدًا", "نسيت الفينول فتالين"]], "a": 0, "w": ["Un rose soutenu = virage dépassé : le volume noté est trop grand, on refait l'essai.", "الوردي الداكن = تجاوز التحوّل: الحجم المسجَّل أكبر من اللازم، نعيد المحاولة."], "g": [20]}, {"img": "l07_05", "t": ["Sécurité et préparation du poste Dornic", "السلامة وتحضير مركز دورنيك"], "st": [["Tenue : blouse fermée, cheveux attachés, chaussures fermées, pas de téléphone sur la paillasse.", "La soude NaOH N/9 est corrosive : gants obligatoires, pipetage à la poire, jamais à la bouche.", "Échantillons sortis du froid 15 minutes avant, homogénéisés par retournements doux, jamais secoués.", "Laits titrés dans un bidon de récupération ; l'évier est réservé au rinçage à l'eau claire."], ["اللباس: وزرة مغلقة، شعر مربوط، حذاء مغلق، ولا هاتف فوق طاولة العمل (paillasse).", "صودا NaOH N/9 أكّالة (corrosive): القفازات إجبارية، السحب بالإجاصة، وأبدًا بالفم.", "العيّنات تُخرج من البرد قبل 15 دقيقة، وتُجانَس بقلب لطيف، ولا تُرجّ أبدًا.", "الحليب المعايَر في برميل استرجاع؛ والمغسلة مخصّصة للشطف بالماء الصافي فقط."]], "k": ["Un poste mal préparé donne un résultat faux : la rigueur du geste fait la fiabilité de l'analyse.", "المركز غير المحضَّر جيدًا يعطي نتيجة خاطئة: دقة الحركة تصنع موثوقية التحليل."], "q": ["Comment prélève-t-on la soude Dornic ?", "كيف نأخذ صودا دورنيك؟"], "o": [["À la bouche, doucement", "À la pipette avec une poire", "En versant directement du flacon"], ["بالفم بلطف", "بالماصّة مع إجاصة", "بالصبّ مباشرة من القارورة"]], "a": 1, "w": ["La soude est corrosive : pipetage à la poire et gants obligatoires.", "الصودا أكّالة: السحب بالإجاصة والقفازات إجبارية."], "g": [11, 12, 20, 25]}], "since": "1.6"}, {"n": 8, "t": ["Matière grasse, EST et ESD — théorie et calculs", "المادة الدسمة، المستخلص الجاف الكلي والمستخلص الجاف منزوع الدسم — نظرية وحسابات"], "c": [{"img": "l08_03", "t": ["Le lait qui ment deux fois", "الحليب الذي يكذب مرتين"], "st": [["Densité : 1 030 g/L, au milieu de la plage normale. Rien à signaler en apparence.", "Matière grasse : 22 g/L, très bas pour un lait cru qui devrait être entre 30 et 40 g/L.", "Extrait sec : 108 g/L au lieu de 125 à 135 g/L.", "Conclusion : le lait a été écrémé, puis mouillé pour ramener la densité au normal. Deux fraudes s'annulent sur la densité."], ["الكثافة: 1 030 غ/ل، في وسط المجال العادي. لا شيء يبدو غريبًا.", "المادة الدسمة: 22 غ/ل، منخفضة جدًا لحليب خام يجب أن يكون بين 30 و40 غ/ل.", "المستخلص الجاف (extrait sec): 108 غ/ل بدل 125 إلى 135 غ/ل.", "الاستنتاج: نُزع الدسم ثم أُضيف الماء لإرجاع الكثافة إلى العادي. غشّان يلغي أحدهما الآخر على الكثافة."]], "k": ["La densité seule ne permet jamais de conclure : l'extrait sec trahit la double fraude.", "الكثافة وحدها لا تكفي أبدًا للحكم: المستخلص الجاف يكشف الغش المزدوج."], "q": ["Pourquoi une densité normale ne prouve-t-elle pas qu'un lait est conforme ?", "لماذا لا تُثبت الكثافة العادية أن الحليب مطابق؟"], "o": [["Car le lactodensimètre est imprécis", "Car écrémage et mouillage peuvent s'annuler", "Car la densité ne dépend que de la température"], ["لأن مكثاف الحليب غير دقيق", "لأن نزع الدسم وإضافة الماء قد يلغي أحدهما الآخر", "لأن الكثافة لا تتعلق إلا بالحرارة"]], "a": 1, "w": ["L'écrémage fait monter la densité, le mouillage la fait baisser : ensemble, elle paraît normale.", "نزع الدسم يرفع الكثافة وإضافة الماء تخفضها: معًا تبدو عادية."], "g": [34, 58]}, {"img": "l08_07", "t": ["La méthode Gerber : principe et mode opératoire", "طريقة جيربر: المبدأ وطريقة العمل"], "st": [["Principe : l'acide sulfurique dissout tout sauf la matière grasse ; la centrifugation la fait monter au sommet du butyromètre, où on la lit.", "10 mL d'acide sulfurique dans le butyromètre.", "11 mL de lait homogénéisé, versés doucement.", "1 mL d'alcool isoamylique pour faciliter la séparation.", "Fermer et agiter jusqu'à homogénéisation complète.", "Centrifuger 5 minutes à la centrifugeuse Gerber, puis lire."], ["المبدأ: حمض الكبريتيك (acide sulfurique) يذيب كل شيء إلا المادة الدسمة؛ والطرد المركزي (centrifugation) يرفعها إلى أعلى البوتيرومتر (butyromètre) حيث نقرؤها.", "10 مل من حمض الكبريتيك في البوتيرومتر.", "11 مل من الحليب المجانَس، تُصبّ بلطف.", "1 مل من الكحول الإيزوأميلي (alcool isoamylique) لتسهيل الفصل.", "أغلق ورجّ حتى التجانس التام.", "اطرد مركزيًا 5 دقائق في جهاز جيربر، ثم اقرأ."]], "k": ["Acide, lait, alcool isoamylique, centrifugation : la matière grasse se lit directement.", "حمض، حليب، كحول إيزوأميلي، طرد مركزي: المادة الدسمة تُقرأ مباشرة."], "q": ["Dans la méthode Gerber, l'acide sulfurique sert à :", "في طريقة جيربر، حمض الكبريتيك يُستعمل لـ:"], "o": [["colorer la matière grasse", "tuer les bactéries", "dissoudre tous les constituants sauf la MG"], ["تلوين المادة الدسمة", "قتل البكتيريا", "إذابة كل المكوّنات إلا المادة الدسمة"]], "a": 2, "w": ["Seule la matière grasse reste, et la centrifugation la fait remonter.", "تبقى المادة الدسمة وحدها، والطرد المركزي يرفعها."], "sn": ["", "1", "2", "3", "4", "5"], "g": [1, 5, 25, 35]}, {"img": "l08_10", "t": ["Lire un butyromètre sans se tromper", "قراءة البوتيرومتر دون خطأ"], "st": [["Lire à 65 °C au bain-marie : la matière grasse doit rester liquide.", "Lire au bas du ménisque, à hauteur d'œil, jamais en plongée.", "Noter deux graduations : A en haut de la colonne, B en bas. MG en % = A − B ; MG en g/L = (A − B) × 10.", "Exemple : A = 5,0 et B = 3,0 donnent 2,0 %, soit 20 g/L. Colonne trouble ou bouchon noir : on recommence."], ["اقرأ في 65 °م في الحمّام المائي (bain-marie): يجب أن تبقى المادة الدسمة سائلة.", "اقرأ أسفل الهلالة في مستوى العين، وأبدًا من الأعلى.", "سجّل تدريجتين: A في أعلى العمود وB في أسفله. MG بـ ٪ = A − B؛ MG بـ غ/ل = (A − B) × 10.", "مثال: A = 5,0 وB = 3,0 تعطيان 2,0 ٪ أي 20 غ/ل. عمود عكِر أو سدادة سوداء: نعيد."]], "k": ["MG % = A − B, puis × 10 pour les g/L ; on n'estime jamais une colonne trouble.", "MG ٪ = A − B، ثم × 10 للحصول على غ/ل؛ ولا نقدّر أبدًا عمودًا عكِرًا."], "q": ["Une lecture Gerber A = 6,5 et B = 3,0 donne :", "قراءة جيربر A = 6,5 وB = 3,0 تعطي:"], "o": [["3,5 %, soit 35 g/L", "9,5 %, soit 95 g/L", "0,35 %, soit 3,5 g/L"], ["3,5 ٪ أي 35 غ/ل", "9,5 ٪ أي 95 غ/ل", "0,35 ٪ أي 3,5 غ/ل"]], "a": 0, "w": ["6,5 − 3,0 = 3,5 %, puis 3,5 × 10 = 35 g/L.", "6,5 − 3,0 = 3,5 ٪، ثم 3,5 × 10 = 35 غ/ل."], "g": [5]}, {"img": "l08_13", "t": ["Les autres méthodes de dosage de la matière grasse", "الطرق الأخرى لمعايرة المادة الدسمة"], "st": [["Gerber : rapide, peu coûteuse, précise à 0,05 % près. C'est la référence d'atelier, la plus utilisée dans les laiteries marocaines.", "Röse-Gottlieb : extraction des lipides par solvant puis pesée. Plus longue, c'est la méthode officielle d'arbitrage en cas de litige.", "Infrarouge : l'appareil mesure MG, protéines, lactose et extrait sec en trente secondes ; il sert au paiement du lait à la qualité.", "Acido-butyrométrique : variante du Gerber pour crème, fromage frais et yaourt. Le principe reste le même."], ["جيربر: سريعة، قليلة التكلفة، دقيقة إلى 0,05 ٪. إنها مرجع الورشة، الأكثر استعمالًا في معامل الحليب المغربية.", "روز-غوتليب (Röse-Gottlieb): استخلاص الدهون بمذيب ثم الوزن. أطول، وهي الطريقة الرسمية للتحكيم عند النزاع.", "الأشعة تحت الحمراء (infrarouge): الجهاز يقيس الدسم والبروتينات واللاكتوز والمستخلص الجاف في ثلاثين ثانية؛ يُستعمل لأداء ثمن الحليب حسب الجودة.", "الطريقة الحمضية البوتيرومترية: صيغة من جيربر للقشدة والجبن الطري والياغورت. المبدأ نفسه."]], "k": ["La méthode rapide décide à la réception, la méthode officielle tranche en cas de litige.", "الطريقة السريعة تقرّر عند الاستقبال، والطريقة الرسمية تحسم عند النزاع."], "q": ["Quelle est la méthode officielle d'arbitrage en cas de litige ?", "ما الطريقة الرسمية للتحكيم عند النزاع؟"], "o": [["Gerber", "L'infrarouge", "Röse-Gottlieb"], ["جيربر", "الأشعة تحت الحمراء", "روز-غوتليب"]], "a": 2, "w": ["Röse-Gottlieb : extraction par solvant puis pesée, plus longue mais officielle.", "روز-غوتليب: استخلاص بمذيب ثم وزن، أطول لكنها رسمية."], "g": [20, 30, 35, 57]}, {"img": "l08_15", "t": ["EST et ESD : mesurer ou calculer", "المستخلص الجاف الكلي ومنزوع الدسم: القياس أو الحساب"], "st": [["Par étuvage : peser 1 g de lait, sécher à l'étuve à 102 °C ou à la thermobalance, peser le résidu.", "Par calcul (Fleischmann) : EST = 1,2 × MG + 2 665 × (D₂₀ − 1 000) / D₂₀, avec MG et D₂₀ en g/L.", "Puis ESD = EST − MG. Lait normal : EST 125 à 135 g/L, ESD environ 90 g/L.", "Ordre : corriger la densité d'abord, calculer l'EST ensuite, l'ESD en dernier. Un écart EST mesuré / calculé signale une anomalie."], ["بالتجفيف في الفرن (étuvage): زن 1 غ من الحليب، جفّفه في الفرن عند 102 °م أو بالميزان الحراري (thermobalance)، ثم زن البقية.", "بالحساب (فلايشمان Fleischmann): EST = 1,2 × MG + 2 665 × (D₂₀ − 1 000) / D₂₀، مع MG وD₂₀ بـ غ/ل.", "ثم ESD = EST − MG. الحليب العادي: المستخلص الجاف الكلي (EST) من 125 إلى 135 غ/ل، ومنزوع الدسم (ESD) حوالي 90 غ/ل.", "الترتيب: صحّح الكثافة أولًا، ثم احسب EST، ثم ESD في الأخير. فرق بين EST المقاس والمحسوب يدل على خلل."]], "k": ["Densité corrigée → EST (Fleischmann) → ESD = EST − MG.", "كثافة مصحَّحة ← EST (فلايشمان) ← ESD = EST − MG."], "q": ["Comment calcule-t-on l'ESD ?", "كيف نحسب ESD؟"], "o": [["EST + MG", "EST − MG", "EST × MG"], ["EST + MG", "EST − MG", "EST × MG"]], "a": 1, "w": ["L'ESD, c'est tous les solides sauf la matière grasse : EST − MG.", "ESD هو كل المواد الصلبة إلا المادة الدسمة: EST − MG."], "g": [13, 19, 20, 22, 54, 62]}, {"img": "l08_17", "t": ["Trois mesures, quatre verdicts", "ثلاثة قياسات، أربعة أحكام"], "st": [["Densité basse + EST bas + MG normale → mouillage.", "Densité haute + MG basse + ESD normal → écrémage.", "Densité normale + MG basse + EST bas → double fraude. Tout normal → lait conforme.", "L'ESD ne dépend pas de la MG : l'écrémage ne le change pas, mais il chute dès qu'on ajoute de l'eau. Référence : environ 90 g/L, jamais sous 85."], ["كثافة منخفضة + EST منخفض + MG عادية ← إضافة الماء.", "كثافة مرتفعة + MG منخفضة + ESD عادي ← نزع الدسم.", "كثافة عادية + MG منخفضة + EST منخفض ← غش مزدوج. كل شيء عادي ← حليب مطابق.", "ESD لا يتعلق بالمادة الدسمة: نزع الدسم لا يغيّره، لكنه ينخفض بمجرد إضافة الماء. المرجع: حوالي 90 غ/ل، وأبدًا أقل من 85."]], "k": ["La densité soupçonne, la matière grasse oriente, l'extrait sec dégraissé prouve.", "الكثافة تثير الشك، والمادة الدسمة توجّه، والمستخلص الجاف منزوع الدسم يُثبت."], "q": ["Un lait a une densité normale mais un EST bas et une MG basse. Il a subi :", "حليب كثافته عادية لكن EST منخفض والدسم منخفض. لقد تعرّض لـ:"], "o": [["un écrémage seul", "un mouillage seul", "une double fraude"], ["نزع الدسم فقط", "إضافة الماء فقط", "غش مزدوج"]], "a": 2, "w": ["Écrémé puis mouillé : la densité revient au normal, mais l'EST reste bas.", "نُزع دسمه ثم أُضيف له الماء: عادت الكثافة إلى العادي، لكن EST بقي منخفضًا."], "g": [19, 20, 34]}, {"img": "l08_19", "t": ["Exercice des 8 tonnes : conclure", "تمرين 8 أطنان: الاستنتاج"], "st": [["Données : 8 000 L, acidité 19 °D, densité lue 1 025 à 8 °C, MG 32 g/L.", "D₂₀ = 1 025 + 0,2 × (8 − 20) = 1 022,6 g/L.", "EST = 1,2 × 32 + 2 665 × (1 022,6 − 1 000) / 1 022,6 = 38,4 + 58,89 = 97,29 g/L. ESD = 97,29 − 32 = 65,29 g/L.", "Conclusion : EST très inférieur à 125–135 g/L et ESD très sous 90 g/L : le lait a été mouillé."], ["المعطيات: 8 000 ل، حموضة 19 °D، كثافة مقروءة 1 025 في 8 °م، دسم 32 غ/ل.", "D₂₀ = 1 025 + 0,2 × (8 − 20) = 1 022,6 غ/ل.", "EST = 1,2 × 32 + 2 665 × (1 022,6 − 1 000) / 1 022,6 = 38,4 + 58,89 = 97,29 غ/ل. ESD = 97,29 − 32 = 65,29 غ/ل.", "الاستنتاج: EST أقل بكثير من 125–135 غ/ل وESD أقل بكثير من 90 غ/ل: أُضيف الماء إلى الحليب."]], "k": ["L'erreur la plus fréquente est d'oublier de corriger la densité avant le calcul.", "الخطأ الأكثر شيوعًا هو نسيان تصحيح الكثافة قبل الحساب."], "q": ["Dans l'exercice des 8 tonnes, un EST de 97,29 g/L signifie :", "في تمرين 8 أطنان، EST يساوي 97,29 غ/ل يعني:"], "o": [["un lait mouillé", "un lait conforme", "un lait trop riche"], ["حليبًا مضافًا إليه الماء", "حليبًا مطابقًا", "حليبًا غنيًا جدًا"]], "a": 0, "w": ["97,29 g/L est bien en dessous de 125 g/L : de l'eau a été ajoutée après la traite.", "97,29 غ/ل أقل بكثير من 125 غ/ل: أُضيف الماء بعد الحلب."], "g": [11, 12, 13, 19, 20, 34]}, {"img": "l08_22", "t": ["Corriger l'extrait sec par ajout de poudre", "تصحيح المستخلص الجاف بإضافة المسحوق"], "st": [["Formule : Q₂ = (X₀ − X₁) × Q₁ / (X₂ − X₀).", "Q₁, X₁ : lait reçu (8 000 L à 97,29 g/L). X₀ : extrait sec visé (132 g/L). X₂ : poudre à 960 g/kg d'extrait sec.", "Q₂ = (132 − 97,29) × 8 000 / (960 − 132) = 34,71 × 8 000 / 828 ≈ 335 kg de poudre.", "Techniquement possible, commercialement non : corriger la fraude d'un fournisseur revient à l'accepter. Le lot doit être refusé."], ["الصيغة: Q₂ = (X₀ − X₁) × Q₁ / (X₂ − X₀).", "Q₁ وX₁: الحليب المستلَم (8 000 ل بـ 97,29 غ/ل). X₀: المستخلص الجاف المستهدف (132 غ/ل). X₂: مسحوق بـ 960 غ/كغ من المستخلص الجاف.", "Q₂ = (132 − 97,29) × 8 000 / (960 − 132) = 34,71 × 8 000 / 828 ≈ 335 كغ من المسحوق.", "ممكن تقنيًا لكن لا تجاريًا: تصحيح غش المورّد يعني قبوله. يجب رفض الدفعة."]], "k": ["On sait calculer la correction, mais un lait mouillé se refuse et le fournisseur est alerté.", "نعرف حساب التصحيح، لكن الحليب المضاف إليه الماء يُرفض ويُنبَّه المورّد."], "q": ["Que doit faire l'usine face à un lot de lait mouillé ?", "ماذا يجب أن يفعل المصنع أمام دفعة حليب مضاف إليها الماء؟"], "o": [["Le corriger avec de la poudre et l'accepter", "Le refuser et alerter le fournisseur", "Le mélanger discrètement au tank"], ["تصحيحها بالمسحوق وقبولها", "رفضها وتنبيه المورّد", "خلطها خفية في الخزان"]], "a": 1, "w": ["Corriger la fraude reviendrait à l'accepter : le lot est refusé.", "تصحيح الغش يعني قبوله: الدفعة تُرفض."], "g": [20, 34]}], "since": "1.6"}, {"n": 9, "t": ["TP 2 — Matière grasse (Gerber), EST et ESD", "الأشغال التطبيقية 2 — المادة الدسمة (جيربر)، EST وESD"], "c": [{"img": "l09_05", "t": ["Sécurité : l'acide sulfurique concentré", "السلامة: حمض الكبريتيك المركّز"], "st": [["L'acide brûle la peau, les yeux et les vêtements : gants, lunettes et blouse fermée obligatoires, sans exception.", "Ordre de versement : acide d'abord, lait ensuite, alcool en dernier.", "La réaction est exothermique : tenir le butyromètre par le bouchon, jamais par le corps, et agiter bouchon vers le haut.", "Centrifugeuse : butyromètres deux par deux, en vis-à-vis. Projection : rincer 15 minutes à l'eau et informer le formateur."], ["الحمض يحرق الجلد والعينين والملابس: القفازات والنظارات والوزرة المغلقة إجبارية، دون استثناء.", "ترتيب الصبّ: الحمض أولًا، ثم الحليب، ثم الكحول في الأخير.", "التفاعل ناشر للحرارة (exothermique): أمسك البوتيرومتر من السدادة، وأبدًا من جسمه، ورجّه والسدادة إلى الأعلى.", "جهاز الطرد: البوتيرومترات اثنين ا
