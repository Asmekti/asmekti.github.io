gétatives, les thermorésistantes survivent → refroidir vite et garder à 4 °C.", "Stérilisation (> 100 °C) : détruit tout, spores comprises → conservation à température ambiante.", "UHT (135–150 °C, 1–5 s) : détruit tout en quelques secondes → conditionnement aseptique.", "Lait cru (aucun traitement) : rien n'est détruit → chaîne du froid stricte, DLC courte. Plus le barème est sévère, plus la durée de vie est longue… et plus le produit est modifié."], ["البسترة (60–100 درجة): تدمّر الأشكال الخضرية، والمقاومة للحرارة تبقى ← تبريد سريع وحفظ في 4 درجات.", "التعقيم (> 100 درجة): يدمّر كل شيء بما في ذلك الأبواغ ← حفظ في درجة حرارة الغرفة.", "UHT (135–150 درجة، 1–5 ثوانٍ): يدمّر كل شيء في ثوانٍ ← تعبئة معقّمة.", "الحليب الخام (دون معالجة): لا شيء يُدمَّر ← سلسلة تبريد صارمة، DLC قصير. كلما كانت المعالجة أشد، طالت مدة الصلاحية… وتغيّر المنتوج أكثر."]], "k": ["Barème sévère = longue conservation, produit plus modifié.", "معالجة شديدة = حفظ طويل، منتوج أكثر تغيّرًا."], "q": ["Quel lait se conserve à température ambiante ?", "أيّ حليب يُحفظ في درجة حرارة الغرفة؟"], "o": [["Le lait cru", "Le lait pasteurisé", "Le lait UHT"], ["الحليب الخام", "الحليب المبستر", "حليب UHT"]], "a": 2, "w": ["Tous les germes sont détruits et l'emballage est aseptique.", "كل الجراثيم مدمّرة والتعبئة معقّمة."], "g": [46, 60, 64]}, {"img": "s13_23", "t": ["La spore, obstacle du traitement thermique", "البوغ، عائق المعالجة الحرارية"], "st": [["Une forme végétative meurt vers 70 °C ; une spore bactérienne survit à l'ébullition (séance 4).", "C'est la spore qui impose de dépasser 100 °C pour parler de stérilisation.", "Pasteuriser ne stérilise pas : les spores traversent le barème et attendent. La conserve (appertisation) vise justement les spores.", "Un produit pasteurisé se garde toujours au froid. C'est la flore visée qui fixe le barème, jamais l'inverse."], ["الشكل الخضري يموت حوالي 70 درجة؛ أما البوغ البكتيري فيصمد أمام الغليان (الحصة 4).", "البوغ هو الذي يفرض تجاوز 100 درجة لنتحدث عن التعقيم.", "البسترة لا تعقّم: الأبواغ تعبر المعالجة وتنتظر. والتعليب (appertisation) يستهدف الأبواغ بالضبط.", "المنتوج المبستر يُحفظ دائمًا في البرودة. الفلورا المستهدفة هي التي تحدد المعالجة، وليس العكس."]], "k": ["Spore = survit à 100 °C → stérilisation au-delà de 100 °C.", "البوغ = يصمد في 100 درجة ← التعقيم فوق 100 درجة."], "q": ["Pourquoi garder un lait pasteurisé au froid ?", "لماذا نحفظ الحليب المبستر في البرودة؟"], "o": [["Pour le goût uniquement", "Parce que des spores et thermorésistants ont survécu", "Parce qu'il est stérile"], ["من أجل الطعم فقط", "لأن أبواغًا وجراثيم مقاومة للحرارة بقيت حية", "لأنه معقّم"]], "a": 1, "w": ["La pasteurisation n'atteint pas les spores.", "البسترة لا تصل إلى الأبواغ."], "g": [46, 59, 60]}, {"img": "s13_25", "t": ["Le froid contre la chaleur", "البرودة مقابل الحرارة"], "st": [["Le froid ne détruit ni germes ni toxines ; il ralentit ou suspend la multiplication ; son effet est réversible.", "Le froid préserve les qualités du produit frais.", "La chaleur détruit les germes (et certaines toxines) ; son effet est irréversible ; les spores exigent un barème sévère.", "La chaleur modifie le goût, la couleur, les vitamines. Aucun ne remplace l'autre : dans la plupart des filières, ils se combinent."], ["البرودة لا تدمّر الجراثيم ولا السموم؛ تبطئ التكاثر أو توقفه؛ تأثيرها قابل للعكس.", "البرودة تحافظ على جودة المنتوج الطازج.", "الحرارة تدمّر الجراثيم (وبعض السموم)؛ تأثيرها غير قابل للعكس؛ الأبواغ تتطلب معالجة شديدة.", "الحرارة تغيّر الطعم واللون والفيتامينات. لا يعوّض أحدهما الآخر: في أغلب الشُّعب يُجمع بينهما."]], "k": ["Froid = réversible ; chaleur = irréversible.", "البرودة = قابلة للعكس؛ الحرارة = غير قابلة للعكس."], "q": ["Lequel a un effet irréversible sur la flore ?", "أيّهما له تأثير غير قابل للعكس على الفلورا؟"], "o": [["Le froid", "La chaleur", "Aucun des deux"], ["البرودة", "الحرارة", "لا أحد منهما"]], "a": 1, "w": ["Un germe tué par la chaleur ne repart pas.", "الجرثومة التي قتلتها الحرارة لا تعود."], "g": []}, {"img": "s13_27", "t": ["Trois laits, trois traitements", "ثلاثة أنواع حليب، ثلاث معالجات"], "st": [["Lait cru : aucun traitement, flore complète, DLC très courte, chaîne du froid stricte. Vecteur de Campylobacter et Listeria (séance 11).", "Lait pasteurisé : 60 à 100 °C ; flore pathogène détruite, flore thermorésistante présente ; froid, DLC de quelques jours.", "Lait UHT : 135 à 150 °C, 1 à 5 s, conditionnement aseptique ; plusieurs mois à température ambiante.", "Même produit, trois barèmes, trois durées de vie : c'est le sujet du TP."], ["الحليب الخام: دون معالجة، فلورا كاملة، DLC قصير جدًا، سلسلة تبريد صارمة. ناقل لـ Campylobacter و Listeria (الحصة 11).", "الحليب المبستر: 60 إلى 100 درجة؛ الفلورا الممرضة مدمّرة، والفلورا المقاومة للحرارة موجودة؛ تبريد، DLC لبضعة أيام.", "حليب UHT: 135 إلى 150 درجة، 1 إلى 5 ثوانٍ، تعبئة معقّمة؛ عدة أشهر في درجة حرارة الغرفة.", "نفس المنتوج، ثلاث معالجات، ثلاث مدد صلاحية: هذا موضوع الأشغال التطبيقية."]], "k": ["Cru = jours ; pasteurisé = quelques jours au froid ; UHT = mois à l'ambiante.", "خام = أيام؛ مبستر = بضعة أيام في البرودة؛ UHT = أشهر في حرارة الغرفة."], "q": ["Le lait pasteurisé contient encore :", "الحليب المبستر ما زال يحتوي على:"], "o": [["des pathogènes vivants", "une flore thermorésistante", "aucun germe"], ["ممرضات حية", "فلورا مقاومة للحرارة", "لا جرثومة"]], "a": 1, "w": ["Les pathogènes sont détruits, pas les thermorésistants.", "الممرضات مدمّرة، وليس المقاومة للحرارة."], "g": [46, 64]}, {"img": "s13_29", "t": ["Ce que le traitement coûte au produit", "ما تكلّفه المعالجة للمنتوج"], "st": [["Qualités organoleptiques : goût cuit, couleur et texture modifiées ; un lait UHT n'a pas le goût d'un lait pasteurisé.", "Qualités nutritionnelles : une partie des vitamines et des nutriments thermosensibles est détruite.", "Coût énergétique : monter à 150 °C et redescendre en quelques secondes exige équipement et énergie.", "L'arbitrage du technicien : choisir le barème le plus doux qui assure la sécurité et la durée de vie visées."], ["الجودة الحسية (organoleptique): طعم مطبوخ، لون وقوام متغيران؛ حليب UHT ليس له طعم الحليب المبستر.", "الجودة الغذائية: جزء من الفيتامينات والمغذيات الحساسة للحرارة يُدمَّر.", "الكلفة الطاقية: الصعود إلى 150 درجة والنزول في ثوانٍ يتطلب معدات وطاقة.", "اختيار التقني: اختيار أخفّ معالجة تضمن السلامة ومدة الصلاحية المطلوبة."]], "k": ["Sécurité, qualité, coût : le barème le plus doux qui suffit.", "السلامة، الجودة، الكلفة: أخفّ معالجة كافية."], "q": ["Quel est le bon choix de barème ?", "ما هو الاختيار الصحيح للمعالجة؟"], "o": [["Toujours le plus sévère", "Le plus doux qui assure la sécurité visée", "Aucun traitement"], ["الأشد دائمًا", "الأخف الذي يضمن السلامة المطلوبة", "لا معالجة"]], "a": 1, "w": ["Un barème trop sévère abîme le produit inutilement.", "المعالجة الشديدة جدًا تُتلف المنتوج دون فائدة."], "g": [46, 64]}], "since": "1.0"}, {"n": 14, "t": ["Aw, conservateurs, atmosphères et barrières", "نشاط الماء، المواد الحافظة، الأجواء والحواجز"], "c": [{"img": "s14_09", "t": ["Retirer l'eau ou la rendre indisponible", "إزالة الماء أو جعله غير متاح"], "st": [["Séchage : on élimine l'eau libre et une partie de l'eau liée.", "Déshydratation : on retire la plus grande partie de l'eau liée ; l'Aw devient assez basse pour interdire tout développement microbien.", "Sucrage et salage : le sucre ou le sel dissous se lie aux molécules d'eau et les rend indisponibles.", "Sucrer ou saler n'enlève pas l'eau, cela l'occupe : pour le germe, le résultat est le même."], ["التجفيف (séchage): نزيل الماء الحر وجزءًا من الماء المرتبط.", "نزع الماء (déshydratation): نزيل الجزء الأكبر من الماء المرتبط؛ يصبح Aw منخفضًا بما يكفي لمنع كل نمو ميكروبي.", "التسكير والتمليح: السكر أو الملح المذاب يرتبط بجزيئات الماء ويجعلها غير متاحة.", "التسكير أو التمليح لا يزيل الماء بل يشغله: بالنسبة للجرثومة النتيجة واحدة."]], "k": ["Le sel et le sucre occupent l'eau.", "الملح والسكر يشغلان الماء."], "q": ["Comment le sucre conserve-t-il un produit ?", "كيف يحفظ السكر المنتوج؟"], "o": [["Il tue les germes par la chaleur", "Il lie l'eau et la rend indisponible", "Il acidifie fortement"], ["يقتل الجراثيم بالحرارة", "يربط الماء ويجعله غير متاح", "يحمّض بقوة"]], "a": 1, "w": ["Il abaisse l'activité de l'eau.", "يخفض نشاط الماء."], "g": [11]}, {"img": "s14_11", "t": ["L'Aw des produits courants", "نشاط الماء في المنتجات الشائعة"], "st": [["Aw élevée (> 0,95) : viandes, poissons, laits frais. Toutes les flores s'y développent ; froid ou traitement thermique obligatoires.", "Aw intermédiaire (0,60 à 0,90) : charcuteries sèches, fromages affinés, fruits secs. Seules les levures et moisissures osmophiles tiennent.", "Aw basse (< 0,60) : confitures, poudres, épices, lait en poudre. Plus aucune croissance microbienne.", "C'est la table de référence de l'atelier : chaque produit mesuré doit y être placé."], ["Aw مرتفع (> 0,95): اللحوم، الأسماك، الحليب الطازج. كل الفلورا تنمو؛ البرودة أو المعالجة الحرارية إجبارية.", "Aw متوسط (0,60 إلى 0,90): اللحوم المصنعة المجففة، الأجبان المنضّجة، الفواكه الجافة. لا تصمد إلا الخمائر والأعفان المحبة للسكر (osmophiles).", "Aw منخفض (< 0,60): المربى، المساحيق، التوابل، الحليب المجفف. لا نمو ميكروبي إطلاقًا.", "هذا جدول الورشة المرجعي: كل منتوج مَقيس يجب وضعه فيه."]], "k": ["0,95 : tout pousse ; 0,60 : plus rien.", "0,95: كل شيء ينمو؛ 0,60: لا شيء."], "q": ["Un lait en poudre (Aw < 0,60) :", "الحليب المجفف (Aw < 0,60):"], "o": [["permet la croissance de tous les germes", "ne permet plus de croissance microbienne", "doit être congelé"], ["يسمح بنمو كل الجراثيم", "لا يسمح بأي نمو ميكروبي", "يجب تجميده"]], "a": 1, "w": ["Sous 0,60, aucune croissance n'est possible.", "تحت 0,60 لا نمو ممكن."], "g": [11, 44]}, {"img": "s14_13", "t": ["Le poisson salé et la confiture", "السمك المملح والمربى"], "st": [["Salage : le sel dissous fixe les molécules d'eau. Associé au séchage puis au fumage, il conserve viandes et poissons depuis des siècles. « Le sel ne tue pas : il assèche. »", "Sucrage : une confiture à 60 % de sucre a une Aw trop basse pour toute bactérie ; seules quelques moisissures de surface peuvent s'y installer.", "La moisissure sur une confiture arrive par l'air, pas par le pot.", "Ces procédés sont des barrières : ils ne détruisent rien, ils rendent le milieu inhabitable."], ["التمليح: الملح المذاب يثبّت جزيئات الماء. مع التجفيف ثم التدخين، يحفظ اللحوم والأسماك منذ قرون. «الملح لا يقتل: إنه يجفّف».", "التسكير: مربى بـ 60٪ من السكر له Aw منخفض جدًا لأي بكتيريا؛ فقط بعض أعفان السطح يمكن أن تستقر.", "العفن على المربى يأتي من الهواء، وليس من الإناء.", "هذه الطرق حواجز: لا تدمّر شيئًا، بل تجعل الوسط غير صالح للعيش."]], "k": ["Barrière = rendre inhabitable, pas détruire.", "الحاجز = جعل الوسط غير صالح للعيش، وليس التدمير."], "q": ["Le sel conserve le poisson parce qu'il :", "الملح يحفظ السمك لأنه:"], "o": [["tue toutes les bactéries", "assèche en fixant l'eau", "le rend acide"], ["يقتل كل البكتيريا", "يجفّف بتثبيت الماء", "يجعله حمضيًا"]], "a": 1, "w": ["« Le sel ne tue pas : il assèche. »", "«الملح لا يقتل: إنه يجفّف»."], "g": [11]}, {"img": "s14_15", "t": ["Les conservateurs", "المواد الحافظة"], "st": [["Ce sont des composés utilisés à faibles doses.", "Le sel (chlorure de sodium) inhibe en particulier les bacilles à Gram négatif.", "Les nitrates et nitrites, utilisés en charcuterie, bloquent des flores ciblées et fixent la couleur.", "Un conservateur accompagne un procédé, il ne le remplace pas. Chaque conservateur autorisé porte un numéro E."], ["إنها مركبات تُستعمل بجرعات ضعيفة.", "الملح (كلوريد الصوديوم) يثبّط خاصة العصيات سالبة الغرام (Gram négatif).", "النترات والنتريت، المستعملة في اللحوم المصنعة، توقف فلورا محددة وتثبّت اللون.", "المادة الحافظة ترافق طريقة الحفظ ولا تعوّضها. كل مادة حافظة مرخّصة تحمل رقم E."]], "k": ["Faible dose, numéro E, jamais seul.", "جرعة ضعيفة، رقم E، ليس وحده أبدًا."], "q": ["À quoi servent les nitrites en charcuterie ?", "ما دور النتريت في اللحوم المصنعة؟"], "o": [["À sucrer le produit", "À bloquer certaines flores et fixer la couleur", "À stériliser"], ["تسكير المنتوج", "إيقاف بعض الفلورا وتثبيت اللون", "التعقيم"]], "a": 1, "w": ["Double rôle : antimicrobien ciblé et couleur.", "دور مزدوج: مضاد ميكروبي محدد وتثبيت اللون."], "g": [30]}, {"img": "s14_17", "t": ["La fermentation comme conservation", "التخمر كوسيلة حفظ"], "st": [["L'acide produit par les bactéries ou l'alcool produit par les levures protège l'aliment.", "Produits laitiers : l'acide lactique abaisse le pH (séance 12).", "Olives et légumes : saumure et fermentation lactique combinées. Vin et bière : l'alcool protège le produit fini.", "Le paradoxe : on utilise des micro-organismes pour en écarter d'autres ; le ferment occupe la place avant le contaminant."], ["الحمض الذي تنتجه البكتيريا أو الكحول الذي تنتجه الخمائر يحمي الغذاء.", "منتجات الحليب: حمض اللبن يخفض pH (الحصة 12).", "الزيتون والخضر: محلول ملحي وتخمر لبني معًا. النبيذ والجعة: الكحول يحمي المنتوج النهائي.", "المفارقة: نستعمل كائنات دقيقة لإبعاد كائنات أخرى؛ الخميرة تحتل المكان قبل الملوِّث."]], "k": ["Le ferment prend la place avant le contaminant.", "الخميرة تحتل المكان قبل الملوِّث."], "q": ["Comment le yaourt se protège-t-il des bactéries pathogènes ?", "كيف يحمي الياغورت نفسه من البكتيريا الممرضة؟"], "o": [["Par l'alcool", "Par l'acide lactique qui abaisse le pH", "Par le sel"], ["بالكحول", "بحمض اللبن الذي يخفض pH", "بالملح"]], "a": 1, "w": ["Le pH bas écarte les bactéries neutrophiles.", "pH المنخفض يُبعد البكتيريا محبّة التعادل."], "g": []}, {"img": "s14_19", "t": ["Le fumage", "التدخين"], "st": [["La fumée dépose des antiseptiques à la surface du produit et en écarte la flore.", "Séchage puis fumage : action combinée de la déshydratation et des antiseptiques, pour les viandes et poissons.", "Limite : c'est un traitement de surface, il ne protège pas le cœur ; d'où l'importance du séchage préalable.", "C'est le premier exemple de barrières multiples : deux obstacles modérés valent mieux qu'un seul forcé."], ["الدخان يضع مواد مطهّرة على سطح المنتوج ويُبعد عنه الفلورا.", "التجفيف ثم التدخين: تأثير مشترك لنزع الماء والمواد المطهرة، للحوم والأسماك.", "الحد: إنها معالجة سطحية لا تحمي القلب؛ لذلك أهمية التجفيف المسبق.", "إنه أول مثال للحواجز المتعددة: عائقان معتدلان أفضل من عائق واحد مُجهَد."]], "k": ["Fumage = surface ; séchage = cœur.", "التدخين = السطح؛ التجفيف = القلب."], "q": ["Pourquoi sécher avant de fumer ?", "لماذا نجفّف قبل التدخين؟"], "o": [["Pour la couleur", "Parce que le fumage n'agit qu'en surface", "Pour cuire le produit"], ["من أجل اللون", "لأن التدخين يعمل على السطح فقط", "لطهي المنتوج"]], "a": 1, "w": ["Le séchage protège le cœur du produit.", "التجفيف يحمي قلب المنتوج."], "g": [13]}, {"img": "s14_21", "t": ["Les atmosphères modifiées", "الأجواء المعدّلة"], "st": [["On remplace l'air de l'emballage par un mélange gazeux pauvre en oxygène.", "En retirant l'oxygène, on écarte la flore aérobie stricte (séance 7).", "Exemple : salade en sachet — 15 % de CO₂ (bactériostatique) et 80 % d'azote (gaz inerte). Le sous-vide pousse la logique à l'extrême.", "Attention : sans oxygène, les anaérobies sont favorisés, dont Clostridium botulinum. Une atmosphère modifiée se combine toujours avec le froid."], ["نعوّض هواء العبوة بخليط غازي فقير في الأكسجين.", "بإزالة الأكسجين، نُبعد الفلورا الهوائية الإجبارية (الحصة 7).", "مثال: السلطة في كيس — 15٪ CO₂ (مثبّط للبكتيريا) و80٪ آزوت (غاز خامل). التفريغ من الهواء (sous vide) يدفع المنطق إلى أقصاه.", "انتبه: دون أكسجين تُفضَّل اللاهوائية، ومنها Clostridium botulinum. الجو المعدّل يُقرن دائمًا بالبرودة."]], "k": ["Moins d'O₂ = moins d'aérobies… mais attention aux anaérobies.", "أكسجين أقل = هوائية أقل… لكن احذر اللاهوائية."], "q": ["Pourquoi associer l'atmosphère modifiée au froid ?", "لماذا نقرن الجو المعدّل بالبرودة؟"], "o": [["Pour le goût", "Pour bloquer les anaérobies comme C. botulinum", "Ce n'est pas nécessaire"], ["من أجل الطعم", "لإيقاف اللاهوائية مثل C. botulinum", "ليس ضروريًا"]], "a": 1, "w": ["Sans oxygène, les anaérobies ont le champ libre.", "دون أكسجين، يصبح المجال مفتوحًا للاهوائية."], "g": [2, 4]}, {"img": "s14_23", "t": ["Les procédés physiques", "الطرق الفيزيائية"], "st": [["Hautes pressions : 100 à 300 MPa réduisent fortement les formes végétatives, à température ambiante.", "Rayonnements (ultraviolets, gamma, X) : détruisent les germes, mais aussi des vitamines et nutriments.", "Filtration stérilisante : supports poreux (cellulose, verre fritté) aux pores ≤ 0,5 µm, plus petits que la plupart des germes.", "La filtration ne détruit pas, elle retient : elle sépare le germe du produit au lieu de l'attaquer."], ["الضغوط العالية: 100 إلى 300 ميغاباسكال تخفض بقوة الأشكال الخضرية، في درجة حرارة الغرفة.", "الإشعاعات (فوق البنفسجية، غاما، X): تدمّر الجراثيم، لكن أيضًا بعض الفيتامينات والمغذيات.", "الترشيح المعقِّم: دعامات مسامية (سيليلوز، زجاج ملبّد) بمسام ≤ 0,5 ميكرومتر، أصغر من أغلب الجراثيم.", "الترشيح لا يدمّر بل يحجز: يفصل الجرثومة عن المنتوج بدل مهاجمتها."]], "k": ["Filtrer = retenir, pas détruire.", "الترشيح = الحجز، وليس التدمير."], "q": ["La filtration stérilisante utilise des pores d'au plus :", "الترشيح المعقِّم يستعمل مسامًا لا تتجاوز:"], "o": [["5 mm", "0,5 µm", "50 µm"], ["5 مم", "0,5 ميكرومتر", "50 ميكرومتر"]], "a": 1, "w": ["Plus petits que la plupart des micro-organismes.", "أصغر من أغلب الكائنات الدقيقة."], "g": [60]}, {"img": "s14_27", "t": ["La conservation par barrières multiples", "الحفظ بالحواجز المتعددة"], "st": [["Au lieu de forcer un seul paramètre, on superpose plusieurs obstacles modérés (pH, Aw, température…) qu'aucun germe ne franchit tous.", "Charcuterie sèche : salage + séchage + nitrites + froid.", "Salade en sachet : lavage + atmosphère modifiée + froid + DLC courte. Yaourt : pasteurisation + acidification + froid.", "Avantage : chaque obstacle reste doux, le produit garde ses qualités, et l'ensemble reste infranchissable."], ["بدل إجهاد عامل واحد، نراكم عدة عوائق معتدلة (pH، Aw، الحرارة…) لا تتجاوزها أي جرثومة كلها.", "اللحوم المصنعة المجففة: تمليح + تجفيف + نتريت + برودة.", "السلطة في كيس: غسل + جو معدّل + برودة + DLC قصير. الياغورت: بسترة + تحميض + برودة.", "الميزة: كل عائق يبقى خفيفًا، والمنتوج يحتفظ بجودته، والمجموع يبقى غير قابل للتجاوز."]], "k": ["Plusieurs obstacles doux > un seul obstacle forcé.", "عدة عوائق خفيفة > عائق واحد مُجهَد."], "q": ["Les barrières du yaourt sont :", "حواجز الياغورت هي:"], "o": [["salage + fumage", "pasteurisation + acidification + froid", "UHT + sous vide"], ["تمليح + تدخين", "بسترة + تحميض + برودة", "UHT + تفريغ من الهواء"]], "a": 1, "w": ["Trois obstacles modérés combinés.", "ثلاثة عوائق معتدلة مجتمعة."], "g": [11, 13, 46]}], "since": "1.0"}, {"n": 15, "t": ["Hygiène alimentaire et méthode des 5 M", "النظافة الغذائية وطريقة 5 M"], "c": [{"img": "s15_11", "t": ["Les trois familles de dangers", "العائلات الثلاث للمخاطر"], "st": [["Dangers physiques : verre, plastique dur, aiguilles, objets tranchants, épingles, bois, arêtes, os, bijoux.", "Dangers chimiques : additifs et sous-produits (benzopyrène), résidus de médicaments vétérinaires, de nettoyage et désinfection, pesticides.", "Dangers biologiques : bactéries (S. aureus, Salmonella), virus (rotavirus, norovirus, hépatite A), parasites (Anisakis, Taenia), toxines et mycotoxines.", "Le pesticide contre les cafards est un danger chimique : la mesure de maîtrise d'un danger peut en créer un autre."], ["المخاطر الفيزيائية: الزجاج، البلاستيك الصلب، الإبر، الأدوات الحادة، الدبابيس، الخشب، حسك السمك، العظام، الحلي.", "المخاطر الكيميائية: المضافات ونواتجها (البنزوبيرين)، بقايا الأدوية البيطرية، بقايا التنظيف والتطهير، المبيدات.", "المخاطر البيولوجية: بكتيريا (S. aureus، Salmonella)، فيروسات (روتا، نورو، التهاب الكبد A)، طفيليات (Anisakis، Taenia)، سموم وسموم فطرية.", "المبيد ضد الصراصير خطر كيميائي: إجراء التحكم في خطر قد يخلق خطرًا آخر."]], "k": ["Physique, chimique, biologique.", "فيزيائي، كيميائي، بيولوجي."], "q": ["Un résidu de désinfectant dans un produit est un danger :", "بقايا المطهّر في منتوج خطر:"], "o": [["physique", "chimique", "biologique"], ["فيزيائي", "كيميائي", "بيولوجي"]], "a": 1, "w": ["C'est un résidu de nettoyage et désinfection.", "إنها بقايا التنظيف والتطهير."], "g": [20, 22, 41, 45, 65]}, {"img": "s15_13", "t": ["Pourquoi maîtriser l'hygiène", "لماذا نتحكم في النظافة"], "st": [["L'hygiène permet d'obtenir des aliments sains, sûrs et salubres.", "Objectif sanitaire : éviter les maladies et les toxi-infections alimentaires.", "Objectif économique : éviter les pertes de produit, protéger l'image de marque et l'export.", "Objectif réglementaire : respecter la loi — au Maroc, la loi 28-07. Un rappel produit fait manquer les trois d'un coup."], ["النظافة تسمح بالحصول على أغذية سليمة وآمنة وصحية.", "الهدف الصحي: تجنب الأمراض والتسممات الغذائية.", "الهدف الاقتصادي: تجنب خسارة المنتوج، حماية صورة العلامة والتصدير.", "الهدف القانوني: احترام القانون — في المغرب، القانون 28-07. سحب منتوج من السوق يُفشل الأهداف الثلاثة دفعة واحدة."]], "k": ["Sanitaire, économique, réglementaire (loi 28-07).", "صحي، اقتصادي، قانوني (القانون 28-07)."], "q": ["Au Maroc, la sécurité sanitaire des aliments est encadrée par :", "في المغرب، السلامة الصحية للأغذية يؤطرها:"], "o": [["la loi 28-07", "la loi 13-99", "aucun texte"], ["القانون 28-07", "القانون 13-99", "لا نص"]], "a": 0, "w": ["C'est la loi citée par le cours.", "هذا هو القانون المذكور في الدرس."], "g": [33, 62]}, {"img": "s15_15", "t": ["Le diagramme des 5 M", "مخطط 5 M"], "st": [["Un outil visuel pour représenter un problème et ses causes (appelé aussi diagramme d'Ishikawa ou en arêtes de poisson).", "Cinq familles de causes : Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "Une méthode : identifier les domaines importants pour trouver une solution.", "Les bonnes pratiques d'hygiène (BPH) s'organisent selon ces 5 M."], ["أداة بصرية لتمثيل مشكلة وأسبابها (تسمى أيضًا مخطط إيشيكاوا أو عظم السمكة).", "خمس عائلات من الأسباب: المواد (Matières)، المعدات (Matériel)، الوسط (Milieu)، الطرق (Méthodes)، اليد العاملة (Main-d'œuvre).", "طريقة: تحديد المجالات المهمة لإيجاد حل.", "ممارسات النظافة الجيدة (BPH) تُنظَّم حسب هذه الـ 5 M."]], "k": ["Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "المواد، المعدات، الوسط، الطرق، اليد العاملة."], "q": ["Lequel n'est PAS un des 5 M ?", "أيّها ليس من الـ 5 M؟"], "o": [["Milieu", "Marketing", "Main-d'œuvre"], ["Milieu", "Marketing", "Main-d'œuvre"]], "a": 1, "w": ["Les 5 M : Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "الـ 5 M: Matières، Matériel، Milieu، Méthodes، Main-d'œuvre."], "g": [33]}, {"img": "s15_19", "t": ["M1 Matières : la réception", "M1 المواد: الاستلام"], "st": [["Matières = matières premières, ingrédients, additifs, mais aussi eau, emballages, lubrifiants et produits de nettoyage.", "Une matière de mauvaise qualité à l'arrivée donne un mauvais produit fini : la réception est un poste clé.", "Quatre contrôles : qualitatif (origine, agrément du fournisseur, emballages intacts et propres), quantitatif, température, DLC.", "Décision : accepter si conforme, refuser sinon. C'est le seul moment où l'on peut encore refuser."], ["المواد = المواد الأولية، المكونات، المضافات، وأيضًا الماء، مواد التعبئة، مواد التشحيم ومواد التنظيف.", "مادة رديئة عند الوصول تعطي منتوجًا نهائيًا رديئًا: الاستلام منصب أساسي.", "أربع مراقبات: نوعية (المصدر، اعتماد المورّد، سلامة ونظافة التعبئة)، كمية، الحرارة، تاريخ الصلاحية DLC.", "القرار: القبول إذا كان مطابقًا، والرفض إذا لم يكن. إنها اللحظة الوحيدة التي يمكن فيها الرفض."]], "k": ["À la réception on peut refuser ; après, le problème est dedans.", "عند الاستلام يمكننا الرفض؛ بعده، المشكل صار في الداخل."], "q": ["Un camion livre du lait à 12 °C au lieu de 4 °C. On :", "شاحنة توصل حليبًا في 12 درجة بدل 4 درجات. نحن:"], "o": [["accepte et on refroidit", "refuse le lot non conforme", "le mélange au lait conforme"], ["نقبل ونبرّد", "نرفض الدفعة غير المطابقة", "نخلطه مع الحليب المطابق"]], "a": 1, "w": ["Contrôle de température non conforme = refus.", "مراقبة حرارة غير مطابقة = رفض."], "g": []}, {"img": "s15_21", "t": ["M1 Matières : stocker FEFO et FIFO", "M1 المواد: التخزين FEFO و FIFO"], "st": [["Stocker immédiatement dans de bonnes conditions : température conforme, propreté, zéro rongeur ; humidité maîtrisée.", "FEFO (First Expired, First Out) : ce qui périme en premier sort en premier.", "FIFO (First In, First Out) : ce qui est entré en premier sort en premier. Produits chimiques stockés séparément des denrées.", "Erreur classique : ranger le nouveau lot devant l'ancien ; le stock tourne à l'envers et l'ancien périme sur l'étagère."], ["التخزين فورًا في ظروف جيدة: حرارة مطابقة، نظافة، صفر قوارض؛ رطوبة متحكم فيها.", "FEFO (First Expired, First Out): ما تنتهي صلاحيته أولًا يخرج أولًا.", "FIFO (First In, First Out): ما دخل أولًا يخرج أولًا. المواد الكيميائية تُخزَّن منفصلة عن الأغذية.", "خطأ شائع: وضع الدفعة الجديدة أمام القديمة؛ يدور المخزون بالعكس وتنتهي صلاحية القديمة على الرف."]], "k": ["FEFO : date de péremption ; FIFO : date d'entrée.", "FEFO: تاريخ انتهاء الصلاحية؛ FIFO: تاريخ الدخول."], "q": ["FEFO signifie :", "FEFO تعني:"], "o": [["premier entré, premier sorti", "premier périmé, premier sorti", "dernier entré, premier sorti"], ["أول داخل، أول خارج", "أول منتهي الصلاحية، أول خارج", "آخر داخل، أول خارج"]], "a": 1, "w": ["First Expired, First Out.", "First Expired, First Out."], "g": [26]}, {"img": "s15_25", "t": ["M2 Matériel : nature et conception", "M2 المعدات: الطبيعة والتصميم"], "st": [["Matériaux en contact avec l'aliment : compatibles, résistants, lisses. Inox, verre et aluminium sont préférés au plastique ; le bois est interdit.", "Peinture ou revêtement en contact avec le produit : de qualité alimentaire (logo réglementaire).", "Conception simple : sans angle aigu, sans coin ni angle mort, facilement démontable et nettoyable.", "Codex Alimentarius : au moins 45 cm entre machine et mur, 20 cm entre machine et sol."], ["المواد الملامسة للغذاء: متوافقة، مقاومة، ملساء. الفولاذ المقاوم للصدأ والزجاج والألمنيوم تُفضَّل على البلاستيك؛ الخشب ممنوع.", "الطلاء أو الكسوة الملامسة للمنتوج: من جودة غذائية (شعار قانوني).", "تصميم بسيط: دون زوايا حادة، دون أركان أو زوايا ميتة، سهل التفكيك والتنظيف.", "الـ Codex Alimentarius: على الأقل 45 سم بين الآلة والجدار، و20 سم بين الآلة والأرض."]], "k": ["45 cm du mur, 20 cm du sol ; pas de bois.", "45 سم عن الجدار، 20 سم عن الأرض؛ لا خشب."], "q": ["Quel matériau est interdit au contact des aliments ?", "أيّ مادة ممنوعة في ملامسة الأغذية؟"], "o": [["L'inox", "Le verre", "Le bois"], ["الفولاذ المقاوم للصدأ", "الزجاج", "الخشب"]], "a": 2, "w": ["Poreux, il retient souillures et germes.", "مسامي، يحتفظ بالأوساخ والجراثيم."], "g": []}, {"img": "s15_31", "t": ["M3 Milieu : secteurs et marche en avant", "M3 الوسط: القطاعات والسير إلى الأمام"], "st": [["Le circuit des produits va du sale vers le propre, sans retour en arrière ni croisement : c'est la marche en avant.", "Séparer les secteurs : sale/propre, chaud/froid, emballage/déchet, alimentaire/non alimentaire.", "Un secteur chaud contre un secteur froid donne de la condensation au plafond, donc une contamination.", "Si le local est trop petit, on sépare dans le temps : le propre avant le sale, avec un nettoyage entre les deux."], ["مسار المنتجات يمضي من المتسخ نحو النظيف، دون رجوع ولا تقاطع: إنه السير إلى الأمام (marche en avant).", "فصل القطاعات: متسخ/نظيف، حار/بارد، تعبئة/نفايات، غذائي/غير غذائي.", "قطاع حار بجانب قطاع بارد يعطي تكثفًا في السقف، وبالتالي تلوثًا.", "إذا كان المحل صغيرًا جدًا، نفصل في الزمن: النظيف قبل المتسخ، مع تنظيف بينهما."]], "k": ["Du sale vers le propre, sans retour ni croisement.", "من المتسخ نحو النظيف، دون رجوع ولا تقاطع."], "q": ["La marche en avant interdit :", "السير إلى الأمام يمنع:"], "o": [["d'avancer vers le conditionnement", "les retours en arrière et les croisements", "le nettoyage"], ["التقدم نحو التعبئة", "الرجوع إلى الخلف والتقاطعات", "التنظيف"]], "a": 1, "w": ["Pour éviter les contaminations croisées.", "لتجنب التلوث المتقاطع."], "g": [38]}, {"img": "s15_35", "t": ["M3 Milieu : la lutte contre les nuisibles", "M3 الوسط: مكافحة الآفات"], "st": [["Mouches, cafards, fourmis, rongeurs, oiseaux, chats et chiens menacent la sécurité des aliments ; un cafard peut porter 14 millions de bactéries.", "Rongeurs : postes d'appâts dans des boîtes dédiées, bien entretenus ; plaques collantes avec couvercle transparent.", "Insectes volants : désinsectiseurs bien placés, tubes en verre incassable, entretenus. Rampants : gel, pesticides, fumigation ; oiseaux : ultrasons, répulsifs.", "Le pesticide est lui-même un danger chimique : la mesure de maîtrise doit être maîtrisée à son tour."], ["الذباب، الصراصير، النمل، القوارض، الطيور، القطط والكلاب تهدد سلامة الأغذية؛ الصرصور قد يحمل 14 مليون بكتيريا.", "القوارض: محطات طُعم في علب مخصصة، جيدة الصيانة؛ صفائح لاصقة بغطاء شفاف.", "الحشرات الطائرة: أجهزة قاتلة للحشرات جيدة الموضع، بأنابيب زجاج غير قابل للكسر، مع صيانة. الزاحفة: جل، مبيدات، تبخير؛ الطيور: موجات فوق صوتية، طاردات.", "المبيد نفسه خطر كيميائي: إجراء التحكم يجب التحكم فيه بدوره."]], "k": ["Un nuisible = un réservoir mobile de germes.", "الآفة = مستودع متنقل للجراثيم."], "q": ["Combien de bactéries un cafard peut-il porter ?", "كم بكتيريا يمكن أن يحمل الصرصور؟"], "o": [["Environ 100", "Jusqu'à 14 millions", "Aucune"], ["حوالي 100", "حتى 14 مليونًا", "لا شيء"]], "a": 1, "w": ["C'est le chiffre cité par le cours.", "هذا هو الرقم المذكور في الدرس."], "g": [20]}, {"img": "s15_37", "t": ["M4 Méthodes : la méthode AMER", "M4 الطرق: طريقة AMER"], "st": [["A — Apports : éviter l'arrivée des contaminants ; penser aux 5 M, surtout la main-d'œuvre.", "M — Multiplication : l'empêcher en jouant sur le temps, la température, l'Aw, le sel, le pH.", "E — Élimination : cuire à 70 °C, pasteuriser, stériliser ; nettoyer et désinfecter.", "R — Recontamination : conditionner dès que possible. Tranchage, hachage, broyage exposent le produit : machines très propres. Devise : vite, froid et propre."], ["A — Apports (الإدخال): منع وصول الملوِّثات؛ التفكير في الـ 5 M، خاصة اليد العاملة.", "M — Multiplication (التكاثر): منعه بالتحكم في الوقت، الحرارة، Aw، الملح، pH.", "E — Élimination (الإزالة): الطهي في 70 درجة، البسترة، التعقيم؛ التنظيف والتطهير.", "R — Recontamination (إعادة التلوث): التعبئة في أقرب وقت. التقطيع والفرم والطحن تعرّض المنتوج: آلات نظيفة جدًا. الشعار: بسرعة، بارد ونظيف."]], "k": ["AMER : Apports, Multiplication, Élimination, Recontamination.", "AMER: الإدخال، التكاثر، الإزالة، إعادة التلوث."], "q": ["Emballer le produit dès que possible répond à quelle lettre d'AMER ?", "تعبئة المنتوج في أقرب وقت تجيب عن أي حرف من AMER؟"], "o": [["A", "E", "R"], ["A", "E", "R"]], "a": 2, "w": ["Un aliment emballé est protégé de la recontamination.", "الغذاء المعبّأ محمي من إعادة التلوث."], "g": [3, 11, 22, 46, 60]}, {"img": "s15_41", "t": ["M5 Main-d'œuvre : mains, tenue, santé", "M5 اليد العاملة: اليدان، اللباس، الصحة"], "st": [["Se laver les mains : au sas avant la production, après les toilettes, une pause ou une cigarette.", "Aussi après une poignée de main, un éternuement, toute activité contaminante.", "Comment : lavabo à commande non manuelle, savon liquide, essuie-main à usage unique.", "Ongles courts, pas de bijoux. Les gants ne dispensent pas du lavage.", "Tenue : charlotte couvrant tous les cheveux, couvre-barbe si besoin, blouse claire changée chaque jour, chaussures propres, pédiluve.", "Santé : un malade est écarté des postes à risque ; coupures couvertes d'un pansement de couleur vive et détectable.", "WC séparés par deux portes : les selles contiennent plus de 10⁷ germes/g."], ["غسل اليدين: في المدخل (sas) قبل الإنتاج، بعد المرحاض، بعد الاستراحة أو السيجارة.", "وأيضًا بعد المصافحة، بعد العطس، وبعد كل نشاط ملوِّث.", "الطريقة: مغسلة بتشغيل غير يدوي، صابون سائل، منشفة للاستعمال الواحد.", "أظافر قصيرة، دون حلي. القفازات لا تُغني عن الغسل.", "اللباس: قبعة (charlotte) تغطي كل الشعر، غطاء اللحية عند الحاجة، وزرة فاتحة تُغيَّر يوميًا، أحذية نظيفة، حوض غسل الأقدام.", "الصحة: المريض يُبعد عن المناصب الخطرة؛ الجروح تُغطّى بضمادة بلون زاهٍ وقابلة للكشف.", "المراحيض مفصولة ببابين: البراز يحتوي على أكثر من 10⁷ جرثومة/غ."]], "k": ["Les gants ne remplacent pas le lavage des mains.", "القفازات لا تعوّض غسل اليدين."], "q": ["Pourquoi un pansement de couleur vive et détectable ?", "لماذا ضمادة بلون زاهٍ وقابلة للكشف؟"], "o": [["Pour l'esthétique", "Pour le retrouver s'il tombe dans le produit", "Pour désinfecter la plaie"], ["للمظهر", "لإيجادها إذا سقطت في المنتوج", "لتطهير الجرح"]], "a": 1, "w": ["Elle sera vue à l'œil ou repérée par le détecteur de métaux.", "تُرى بالعين أو يكشفها كاشف المعادن."], "g": []}], "since": "1.0"}, {"n": 16, "t": ["Nettoyage et désinfection", "التنظيف والتطهير"], "c": [{"img": "s16_07", "t": ["Nettoyer et désinfecter", "التنظيف والتطهير"], "st": [["Le nettoyage retire les souillures (organiques, minérales, corps étrangers) et rend la surface visuellement propre ; seul, il ne garantit pas la décontamination.", "La désinfection élimine les micro-organismes et inactive les virus présents sur la surface.", "La désinfection n'est efficace qu'après un nettoyage : sur une surface sale, le désinfectant est neutralisé par la souillure.", "Une surface visuellement propre peut donc rester bactériologiquement sale."], ["التنظيف يزيل الأوساخ (العضوية، المعدنية، الأجسام الغريبة) ويجعل السطح نظيفًا بصريًا؛ وحده لا يضمن إزالة التلوث.", "التطهير يقضي على الكائنات الدقيقة ويعطّل الفيروسات الموجودة على السطح.", "التطهير لا يكون فعالًا إلا بعد التنظيف: على سطح متسخ، الأوساخ تُبطل مفعول المطهّر.", "إذن سطح نظيف بصريًا قد يبقى متسخًا بكتيريولوجيًا."]], "k": ["Toujours nettoyer AVANT de désinfecter.", "دائمًا التنظيف قبل التطهير."], "q": ["Pourquoi nettoyer avant de désinfecter ?", "لماذا ننظف قبل أن نطهّر؟"], "o": [["Pour économiser du désinfectant", "Parce que la souillure neutralise le désinfectant", "L'ordre n'a pas d'importance"], ["لتوفير المطهّر", "لأن الأوساخ تُبطل مفعول المطهّر", "الترتيب ليس مهمًا"]], "a": 1, "w": ["Un désinfectant sur surface sale ne marche pas.", "المطهّر على سطح متسخ لا يعمل."], "g": [22, 65]}, {"img": "s16_09", "t": ["Trois propretés, pas une", "ثلاثة أنواع من النظافة، لا نوع واحد"], "st": [["Physiquement propre : aucune souillure visible.", "Microbiologiquement propre : un niveau acceptable de micro-organismes, sans danger pour le consommateur. Seule l'analyse le voit.", "Chimiquement propre : aucun résidu chimique de production ni de nettoyage-désinfection (N&D).", "Piège : sauter le rinçage final, c'est échanger une propreté microbiologique contre une saleté chimique."], ["نظيف فيزيائيًا: لا أوساخ مرئية.", "نظيف ميكروبيولوجيًا: مستوى مقبول من الكائنات الدقيقة، دون خطر على المستهلك. التحليل وحده يراه.", "نظيف كيميائيًا: لا بقايا كيميائية للإنتاج ولا للتنظيف والتطهير (N&D).", "الفخ: تجاوز الشطف النهائي يعني استبدال نظافة ميكروبيولوجية بوساخة كيميائية."]], "k": ["Physique, microbiologique, chimique.", "فيزيائية، ميكروبيولوجية، كيميائية."], "q": ["Oublier le rinçage final compromet la propreté :", "نسيان الشطف النهائي يُخلّ بالنظافة:"], "o": [["physique", "chimique", "visuelle"], ["الفيزيائية", "الكيميائية", "البصرية"]], "a": 1, "w": ["Il reste des résidus de désinfectant.", "تبقى بقايا المطهّر."], "g": [20, 22]}, {"img": "s16_11", "t": ["La nature de la souillure", "طبيعة الأوساخ"], "st": [["La souillure est un mélange de composés organiques (lipides, protéines, glucides), de minéraux (sels, calcaire, rouille) et de germes.", "Souillures organiques → détergent alcalin.", "Souillures minérales → détergent acide.", "Germes → désinfection, une fois les deux premières retirées. C'est la souillure qui dicte le choix du produit."], ["الأوساخ خليط من مركبات عضوية (دهون، بروتينات، سكريات)، ومعادن (أملاح، كلس، صدأ)، وجراثيم.", "أوساخ عضوية ← منظّف قاعدي (alcalin).", "أوساخ معدنية ← منظّف حمضي (acide).", "الجراثيم ← التطهير، بعد إزالة النوعين الأولين. الأوساخ هي التي تحدد اختيار المنتوج."]], "k": ["Organique → alcalin ; minéral → acide ; germes → désinfectant.", "عضوي ← قاعدي؛ معدني ← حمضي؛ جراثيم ← مطهّر."], "q": ["Du calcaire sur un échangeur s'élimine avec :", "الكلس على المبادل الحراري يُزال بـ:"], "o": [["un détergent alcalin", "un détergent acide", "de l'eau froide seule"], ["منظّف قاعدي", "منظّف حمضي", "ماء بارد فقط"]], "a": 1, "w": ["Le calcaire est une souillure minérale.", "الكلس وسخ معدني."], "g": [22, 23]}, {"img": "s16_13", "t": ["Comment agit un détergent", "كيف يعمل المنظّف"], "st": [["La molécule de détergent est amphiphile : une tête polaire qui aime l'eau (hydrophile), une queue apolaire qui la fuit (hydrophobe).", "La queue se fixe sur la graisse, la tête reste dans l'eau : la salissure est décrochée.", "L'eau emporte ensuite l'ensemble.", "C'est la même structure que les phospholipides de la membrane bactérienne (séance 3)."], ["جزيء المنظّف مزدوج الألفة (amphiphile): رأس قطبي يحب الماء (hydrophile)، وذيل غير قطبي ينفر منه (hydrophobe).", "الذيل يلتصق بالدهون، والرأس يبقى في الماء: فتنفصل الأوساخ.", "ثم يحمل الماء الكل.", "إنها نفس بنية الفوسفوليبيدات في الغشاء البكتيري (الحصة 3)."]], "k": ["Amphiphile = une tête dans l'eau, une queue dans la graisse.", "Amphiphile = رأس في الماء، ذيل في الدهون."], "q": ["La queue hydrophobe d'un détergent se fixe sur :", "الذيل الكاره للماء في المنظّف يلتصق بـ:"], "o": [["l'eau", "la graisse", "le métal"], ["الماء", "الدهون", "المعدن"]], "a": 1, "w": ["Elle fuit l'eau et s'accroche à la salissure grasse.", "ينفر من الماء ويلتصق بالوسخ الدهني."], "g": [23]}, {"img": "s16_15", "t": ["Les trois familles de détergents", "العائلات الثلاث للمنظّفات"], "st": [["Alcalin (dégraissant) : élimine les souillures organiques ; base type : la soude (NaOH).", "Acide (détartrant) : élimine le calcaire et les souillures minérales ; acide type : l'acide phosphorique.", "Neutre : surtout pour l'usage manuel, il ne doit pas attaquer la peau.", "Un détergent contient : une base pour l'organique, un acide pour le minéral, un complexant du calcium (EDTA), parfois une enzyme (lipase)."], ["القاعدي (مزيل الدهون): يزيل الأوساخ العضوية؛ القاعدة النموذجية: الصودا (NaOH).", "الحمضي (مزيل الكلس): يزيل الكلس والأوساخ المعدنية؛ الحمض النموذجي: حمض الفوسفوريك.", "المتعادل: خاصة للاستعمال اليدوي، يجب ألا يؤذي الجلد.", "المنظّف يحتوي: قاعدة للعضوي، حمضًا للمعدني، مركّبًا خالبًا للكالسيوم (EDTA)، وأحيانًا إنزيمًا (lipase)."]], "k": ["Soude = dégraissant ; acide phosphorique = détartrant.", "الصودا = مزيل الدهون؛ حمض الفوسفوريك = مزيل الكلس."], "q": ["La soude (NaOH) est un détergent :", "الصودا (NaOH) منظّف:"], "o": [["acide", "alcalin", "neutre"], ["حمضي", "قاعدي", "متعادل"]], "a": 1, "w": ["C'est une base : elle dégraisse.", "إنها قاعدة: تزيل الدهون."], "g": [23]}, {"img": "s16_21", "t": ["TACT et la roue de Sinner", "TACT وعجلة سينر"], "st": [["T — Température : eau à 40–50 °C.", "A — Action mécanique : brossage, raclage, jet haute pression.", "C — Concentration en détergent.", "T — Temps de contact : 10 à 30 minutes.", "Roue de Sinner : ce qu'on retire à un paramètre doit être compensé par un autre.", "Au-delà de 70 °C, les protéines coagulent et le détergent se décompose.", "Plus chaud n'est pas mieux."], ["T — الحرارة (Température): ماء في 40–50 درجة.", "A — الفعل الميكانيكي (Action mécanique): الفرك، الكشط، النفث بضغط عالٍ.", "C — تركيز المنظّف (Concentration).", "T — زمن التلامس (Temps): 10 إلى 30 دقيقة.", "عجلة سينر: ما ننقصه من عامل يجب تعويضه بعامل آخر.", "فوق 70 درجة تتخثر البروتينات ويتحلل المنظّف.", "الأسخن ليس الأفضل."]], "k": ["TACT : Température, Action, Concentration, Temps.", "TACT: الحرارة، الفعل، التركيز، الزمن."], "q": ["Si on ne peut pas brosser (moins d'action mécanique), on peut :", "إذا لم نستطع الفرك (فعل ميكانيكي أقل)، يمكننا:"], "o": [["réduire aussi le temps", "augmenter le temps ou la concentration", "chauffer à 90 °C"], ["تقليل الزمن أيضًا", "زيادة الزمن أو التركيز", "التسخين إلى 90 درجة"]], "a": 1, "w": ["C'est le principe de compensation de la roue de Sinner.", "هذا مبدأ التعويض في عجلة سينر."], "g": [23, 61]}, {"img": "s16_25", "t": ["Le protocole de N&D en 7 étapes", "بروتوكول التنظيف والتطهير في 7 مراحل"], "st": [["Pré-lavage (souillures peu adhérentes)", "Nettoyage alcalin (organique)", "Rinçage intermédiaire.", "Nettoyage acide (minéral)", "Rinçage intermédiaire.", "Désinfection (réduire les microbes restants, éliminer les pathogènes)", "Rinçage final à l'eau potable (résidus de désinfectant).", "Règle d'or : ne jamais mélanger un détergent et un désinfectant."], ["الغسل المسبق (أوساخ قليلة الالتصاق)", "التنظيف القاعدي (العضوي)", "شطف وسيط.", "التنظيف الحمضي (المعدني)", "شطف وسيط.", "التطهير (تقليل الميكروبات المتبقية، القضاء على الممرضات)", "شطف نهائي بالماء الصالح للشرب (بقايا المطهّر).", "القاعدة الذهبية: لا تخلط أبدًا منظّفًا ومطهّرًا."]], "k": ["Alcalin → rinçage → acide → rinçage → désinfection → rinçage.", "قاعدي ← شطف ← حمضي ← شطف ← تطهير ← شطف."], "q": ["Quelle étape vient juste avant la désinfection ?", "أيّ مرحلة تأتي مباشرة قبل التطهير؟"], "o": [["Le rinçage final", "Un rinçage intermédiaire après le nettoyage acide", "Le pré-lavage"], ["الشطف النهائي", "شطف وسيط بعد التنظيف الحمضي", "الغسل المسبق"]], "a": 1, "w": ["Étape 5 : on retire le détergent acide avant de désinfecter.", "المرحلة 5: نزيل المنظّف الحمضي قبل التطهير."], "sn": ["1", "2", "3", "4", "5", "6", "7", ""], "g": [22, 23]}, {"img": "s16_29", "t": ["Les désinfectants", "المطهّرات"], "st": [["Chlorés : peu coûteux et efficaces, mais corrosifs à forte dose et en milieu acide, sensibles aux souillures, source de mauvais goûts.", "Ammoniums quaternaires : détergents et désinfectants à la fois, mais plus chers et moussants ; bien rincer.", "Eau chaude (82 °C, 20 min) : sans résidus, peu coûteuse, mais non sporicide, entartrante, dangereuse pour les mains.", "Autres : H₂O₂ sans rinçage (emballages UHT), acide peracétique (efficace à froid, mais corrosif et explosif), formol (efficace mais irritant, résidus toxiques)."], ["المركبات الكلورية: رخيصة وفعالة، لكنها أكّالة بجرعة عالية وفي الوسط الحمضي، حساسة للأوساخ، وتسبب طعمًا سيئًا.", "الأمونيوم الرباعي: منظّف ومطهّر في آن واحد، لكنه أغلى ويُكوّن رغوة؛ يجب الشطف الجيد.", "الماء الساخن (82 درجة، 20 دقيقة): دون بقايا، رخيص، لكنه لا يقتل الأبواغ، ويترك الكلس، وخطير على اليدين.", "أخرى: H₂O₂ دون شطف (عبوات UHT)، حمض البيراسيتيك (فعال في البرد لكنه أكّال وقابل للانفجار)، الفورمول (فعال لكنه مهيّج وبقاياه سامة)."]], "k": ["Chlore et ammoniums quaternaires : les deux principaux.", "الكلور والأمونيوم الرباعي: المطهّران الرئيسيان."], "q": ["Quel désinfectant est aussi détergent ?", "أيّ مطهّر هو أيضًا منظّف؟"], "o": [["Le chlore", "Les ammoniums quaternaires", "L'eau chaude"], ["الكلور", "الأمونيوم الرباعي", "الماء الساخن"]], "a": 1, "w": ["Ils ont une double action, mais moussent.", "لهم تأثير مزدوج، لكنهم يكوّنون رغوة."], "g": [20, 22, 23, 64]}, {"img": "s16_33", "t": ["Contrôler l'efficacité", "مراقبة الفعالية"], "st": [["Contrôle visuel et au toucher : simple et indispensable ; si c'est sale, la microbiologie est inutile.", "Contrôle chimique : colorant dans l'eau de rinçage (révèle les souillures) et vérification de la neutralité du pH.", "ATP-métrie : l'ATP de toute matière vivante est dosé par fluorescence en quelques secondes ; peu spécifique, mais permet de re-nettoyer tout de suite.", "Empreinte sur gélose : lames couvertes de géloses nutritives appliquées sur la surface. Tous les résultats sont enregistrés."], ["المراقبة البصرية واللمسية: بسيطة وضرورية؛ إذا كان متسخًا فالتحليل الميكروبيولوجي بلا فائدة.", "المراقبة الكيميائية: ملوّن في ماء الشطف (يكشف الأوساخ) والتحقق من تعادل pH.", "قياس ATP (ATP-métrie): يُقاس ATP لكل مادة حية بالتألق في ثوانٍ؛ قليل التخصص، لكنه يسمح بإعادة التنظيف فورًا.", "البصمة على الآغار: شرائح مغطاة بآغار مغذٍّ تُطبَّق على السطح. كل النتائج تُسجَّل."]], "k": ["ATP-métrie = réponse en secondes ; gélose = réponse en jours.", "قياس ATP = نتيجة في ثوانٍ؛ الآغار = نتيجة في أيام."], "q": ["Quel contrôle donne un résultat en quelques secondes ?", "أيّ مراقبة تعطي نتيجة في ثوانٍ؟"], "o": [["L'empreinte sur gélose", "L'ATP-métrie", "Le dénombrement en boîte"], ["البصمة على الآغار", "قياس ATP", "الإحصاء في العلبة"]], "a": 1, "w": ["Mesure par fluorescence en temps réel.", "قياس بالتألق في الوقت الحقيقي."], "g": [8]}, {"img": "s16_35", "t": ["Le plan de nettoyage et désinfection", "مخطط التنظيف والتطهير"], "st": [["C'est un document écrit, daté, signé et archivé, pour chaque local et chaque appareil.", "Quoi : le local, le matériel ou l'équipement concerné.", "Comment et quand : méthode, outils, TACT et fréquence (par exemple en fin de journée).", "Par qui et avec quelle preuve : le responsable qui signe, les contrôles d'efficacité et leur enregistrement. Ce qui n'est pas écrit n'a pas été fait."], ["إنه وثيقة مكتوبة، مؤرخة، موقّعة ومؤرشفة، لكل محل وكل جهاز.", "ماذا: المحل، أو العتاد، أو التجهيز المعني.", "كيف ومتى: الطريقة، الأدوات، TACT والتواتر (مثلًا في نهاية اليوم).", "من ينفذ وبأي دليل: المسؤول الذي يوقّع، مراقبات الفعالية وتسجيلها. ما ليس مكتوبًا لم يُنجز."]], "k": ["Quoi, comment, quand, qui, preuve.", "ماذا، كيف، متى، من، الدليل."], "q": ["Lors d'un audit, un nettoyage non enregistré est considéré comme :", "أثناء التدقيق، تنظيف غير مسجّل يُعتبر:"], "o": [["fait", "non fait", "à moitié fait"], ["منجزًا", "غير منجز", "منجزًا نصفيًا"]], "a": 1, "w": ["Ce qui n'est pas écrit n'a pas été fait.", "ما ليس مكتوبًا لم يُنجز."], "g": [22, 61]}], "since": "1.0"}], "chaps": [{"id": "A", "t": ["Le monde microbien", "العالم الميكروبي"], "s": [1, 2, 3, 4, 5]}, {"id": "B", "t": ["Croissance et environnement", "النمو والبيئة"], "s": [6, 7, 8, 9]}, {"id": "C", "t": ["Conséquences de la contamination", "عواقب التلوث"], "s": [10, 11, 12]}, {"id": "D", "t": ["Maîtrise de la contamination", "التحكم في التلوث"], "s": [13, 14, 15, 16]}], "ped": {"sess": {"1": {"obj": [["Citer les trois raisons de faire de la microbiologie en usine.", "تذكر الأسباب الثلاثة لإجراء التحاليل الميكروبيولوجية في المصنع."], ["Ordonner les 7 étapes d'une analyse microbiologique.", "ترتّب المراحل السبع للتحليل الميكروبيولوجي."], ["Distinguer les micro-organismes utiles, nuisibles et pathogènes.", "تميّز بين الكائنات الدقيقة النافعة والضارّة والممرضة."]], "sum": [["La microbiologie sert à accepter un lot, vérifier le système et fabriquer.", "علم الأحياء الدقيقة يُستعمل لقبول دفعة، ومراقبة النظام، والتصنيع."], ["Une analyse suit 7 étapes, du matériel stérile au rapport de conformité.", "التحليل يمرّ بسبع مراحل، من الأدوات المعقّمة إلى تقرير المطابقة (conformité)."], ["Observer, cultiver, maîtriser : Leeuwenhoek, Spallanzani, puis Semmelweis, Koch et Pasteur.", "الملاحظة، الزرع، التحكم: ليفنهوك، سبالانزاني، ثم سيملفايس وكوخ وباستور."], ["Cinq besoins : eau, nutriments, température, temps, oxygène. En retirer un bloque la croissance.", "خمس حاجيات: الماء، المغذيات، الحرارة، الوقت، الأكسجين. حذف واحدة يوقف النمو."], ["On favorise les utiles, on limite les nuisibles, on élimine les pathogènes.", "نشجّع النافعة، نحدّ من الضارّة، نقضي على الممرضة."]], "q3": [{"q": ["Au labo, un échantillon arrive avec un emballage déchiré. Que fais-tu à la réception ?", "في المختبر، تصل عيّنة بتغليف ممزّق. ماذا تفعل عند الاستقبال؟"], "o": [["Tu l'analyses normalement", "Tu notes l'anomalie : l'emballage doit être intact", "Tu la mets directement à l'étuve"], ["تحلّلها بشكل عادي", "تسجّل الخلل: يجب أن يكون التغليف سليمًا", "تضعها مباشرة في الحاضنة"]], "a": 1, "w": ["À la réception, on vérifie l'identification, la température et un emballage intact.", "عند الاستقبال نتحقق من التعريف ودرجة الحرارة وسلامة التغليف."]}, {"q": ["Un lot de viande hachée a une belle couleur et une odeur normale. Un collègue veut sauter l'analyse. Ton avis ?", "دفعة لحم مفروم لونها جميل ورائحتها عادية. زميل يريد تجاوز التحليل. ما رأيك؟"], "o": [["Il a raison : rien n'est visible", "On le goûte pour vérifier", "On analyse : pas visible ne veut pas dire pas présent"], ["معه حق: لا شيء ظاهر", "نتذوّقه للتحقق", "نحلّل: عدم الرؤية لا يعني عدم الوجود"]], "a": 2, "w": ["Les pathogènes sont souvent invisibles : seule l'analyse permet d'accepter le lot.", "الممرضات غالبًا غير مرئية: التحليل وحده يسمح بقبول الدفعة."]}]}, "2": {"obj": [["Classer un micro-organisme avec la cellule et le noyau.", "تصنّف كائنًا دقيقًا حسب وجود الخلية والنواة."], ["Légender le schéma de la cellule eucaryote.", "تسمّي أجزاء رسم الخلية حقيقية النواة (eucaryote)."], ["Associer chaque organite à son rôle.", "تربط كل عضيّة (organite) بدورها."]], "sum": [["Cellulaires : algues, protozoaires, champignons, bactéries. Non cellulaires : virus, phages, prions.", "الخلوية: الطحالب، الأوالي، الفطريات، البكتيريا. غير الخلوية: الفيروسات، العاثيات، البريونات."], ["Procaryote : sans noyau, ADN libre. Eucaryote : vrai noyau à double membrane.", "بدائي النواة: بدون نواة، ADN حرّ. حقيقي النواة: نواة حقيقية بغشاء مزدوج."], ["Le noyau commande, la mitochondrie donne l'ATP, le Golgi trie et distribue.", "النواة تقود، الميتوكوندري تعطي ATP، جهاز غولجي يفرز ويوزّع."], ["La membrane laisse passer, la paroi maintient la forme.", "الغشاء يسمح بالمرور، والجدار يحافظ على الشكل."]], "q3": [{"q": ["Au microscope, tu vois une cellule avec noyau, paroi et chloroplastes, prise dans un bassin d'irrigation. C'est :", "تحت المجهر، ترى خلية لها نواة وجدار وصانعات اليخضور، مأخوذة من صهريج سقي. إنها:"], "o": [["une algue", "un protozoaire", "une bactérie"], ["طحلب", "من الأوالي", "بكتيريا"]], "a": 0, "w": ["Noyau = eucaryote ; chloroplastes et paroi = algue. Le protozoaire n'a pas de chloroplastes.", "النواة = حقيقي النواة؛ صانعات اليخضور والجدار = طحلب. الأوالي ليس لها صانعات اليخضور."]}, {"q": ["Un collègue veut cultiver un virus sur une boîte de gélose, comme une bactérie. Qu'en penses-tu ?", "زميل يريد زرع فيروس في علبة وسط زرع (gélose) مثل البكتيريا. ما رأيك؟"], "o": [["Bonne idée, à 37 °C il poussera", "Il faut ajouter plus de nutriments", "Impossible : le virus a besoin d'une cellule hôte"], ["فكرة جيدة، سينمو في 37 درجة", "يجب إضافة مغذيات أكثر", "مستحيل: الفيروس يحتاج إلى خلية مضيفة"]], "a": 2, "w": ["Le virus n'est pas cellulaire : il ne se multiplie que dans une cellule hôte.", "الفيروس ليس خلويًا: لا يتكاثر إلا داخل خلية مضيفة."]}]}, "3": {"obj": [["Distinguer moisissures et levures, et les deux groupes de moisissures.", "تميّز بين العفن والخمائر، وبين مجموعتي العفن."], ["Donner un exemple utile et un exemple nuisible de champignon.", "تعطي مثالًا نافعًا ومثالًا ضارًّا للفطريات."], ["Décrire les modes de reproduction des champignons.", "تصف طرق تكاثر الفطريات."]], "sum": [["Champignons : hétérotrophes, sans chlorophylle. Moisissures filamenteuses, levures unicellulaires.", "الفطريات: غيرية التغذية، بدون يخضور. العفن خيطي، والخمائر أحادية الخلية."], ["Hyphes = filaments ; mycélium = leur ensemble. Non cloisonné = zygomycète ; cloisonné = ascomycète.", "الخيوط الفطرية = خيوط؛ الغزل الفطري = مجموعها. غير مقسّم = لاقحي؛ مقسّم = زقي."], ["Saccharomyces fait lever le pain ; Candida est pathogène.", "Saccharomyces تجعل الخبز ينتفخ؛ و Candida ممرضة."], ["Levure : bourgeonnement (inégal). Moisissure : spores transportées par l'air.", "الخميرة: التبرعم (غير متساوٍ). العفن: أبواغ (spores) ينقلها الهواء."], ["Sexuée : fusion (n + n = 2n), puis méiose, puis spores.", "التكاثر الجنسي: اندماج (n + n = 2n)، ثم انقسام اختزالي، ثم أبواغ."]], "q3": [{"q": ["Dans la réserve d'une boulangerie, tu trouves un pain moisi. Que fais-tu ?", "في مخزن مخبزة، تجد خبزًا متعفّنًا. ماذا تفعل؟"], "o": [["Tu coupes la partie moisie et tu vends le reste", "Tu le laisses, ce n'est qu'un pain", "Tu le jettes en sac fermé et tu nettoies le rayon"], ["تقطع الجزء المتعفّن وتبيع الباقي", "تتركه، إنه مجرد خبز", "ترميه في كيس مغلق وتنظّف الرفّ"]], "a": 2, "w": ["Ses spores voyagent dans l'air et peuvent contaminer tout l'atelier.", "أبواغه تنتقل في الهواء ويمكن أن تلوّث الورشة كلها."]}, {"q": ["Au microscope, un jus altéré montre des cellules ovoïdes avec de petites excroissances. Tu penses à :", "تحت المجهر، عصير فاسد يُظهر خلايا بيضوية عليها بروزات صغيرة. تفكّر في:"], "o": [["des levures qui bourgeonnent", "des bactéries en fission binaire", "des moisissures filamenteuses"], ["خمائر تتبرعم", "بكتيريا في انشطار ثنائي", "عفن خيطي"]], "a": 0, "w": ["Cellules ovoïdes + petite excroissance = bourgeonnement, le mode de la levure.", "خلايا بيضوية + بروز صغير = تبرعم، وهي طريقة الخميرة."]}]}, "4": {"obj": [["Reconnaître les formes des bactéries et légender la cellule bactérienne.", "تتعرّف على أشكال البكتيريا وتسمّي أجزاء الخلية البكتيرية."], ["Expliquer les étapes et les couleurs de la coloration de Gram.", "تشرح مراحل وألوان صبغة غرام (Gram)."], ["Expliquer pourquoi la spore impose l'autoclave.", "تشرح لماذا يفرض البوغ (spore) استعمال الأوتوكلاف."]], "sum": [["Trois formes : coques, bacilles, spiralés.", "ثلاثة أشكال: مكوّرات، عصيات، حلزونية."], ["Constants : paroi, membrane, cytoplasme, chromosome. Facultatifs : capsule, flagelle, pili, spore.", "الثابتة: الجدار، الغشاء، السيتوبلازم، الصبغي. الاختيارية: المحفظة، السوط، الأشعار، البوغ."], ["Gram : violet, lugol, alcool, safranine. Gram + violet, Gram − rose.", "غرام: البنفسجي، اللوغول، الكحول، السافرانين. موجبة غرام بنفسجية، سالبة غرام وردية."], ["Pas de mitochondrie : la membrane produit l'ATP. Division possible toutes les 20 minutes.", "لا ميتوكوندري: الغشاء ينتج ATP. الانقسام ممكن كل 20 دقيقة."], ["La spore survit à 100 °C : il faut l'autoclave pour la détruire.", "البوغ ينجو في 100 درجة: يلزم الأوتوكلاف لتدميره."]], "q3": [{"q": ["Après ta coloration de Gram, même le témoin Gram + est rose. Quelle est la cause probable ?", "بعد صبغة غرام، حتى الشاهد موجب غرام أصبح ورديًا. ما السبب المحتمل؟"], "o": [["Trop peu de violet de gentiane", "L'alcool est resté trop longtemps", "La fuchsine était trop diluée"], ["بنفسجي جنسياني قليل جدًا", "بقي الكحول مدة طويلة جدًا", "الفوكسين كان مخفّفًا جدًا"]], "a": 1, "w": ["L'alcool est l'étape critique : trop long, il décolore aussi les Gram +.", "الكحول هو المرحلة الحرجة: إذا طال، يزيل لون موجبة غرام أيضًا."]}, {"q": ["Pour économiser, un chef veut traiter des conserves de sardines à 100 °C, mais longtemps. Ta réponse ?", "لتوفير المصاريف، يريد رئيس معالجة علب السردين في 100 درجة لكن مدة طويلة. ما جوابك؟"], "o": [["Non : les spores survivent, il faut l'autoclave", "Oui : 100 °C longtemps tue tout", "Oui, si on ajoute du sel"], ["لا: الأبواغ تنجو، يلزم الأوتوكلاف", "نعم: 100 درجة مدة طويلة تقتل كل شيء", "نعم، إذا أضفنا الملح"]], "a": 0, "w": ["Toutes les spores survivent à un chauffage prolongé à 100 °C : il faut dépasser 100 °C.", "كل الأبواغ تنجو من تسخين مطوّل في 100 درجة: يجب تجاوز 100 درجة."]}]}, "5": {"obj": [["Décrire la structure d'un virus et ses quatre caractéristiques.", "تصف بنية الفيروس وخصائصه الأربع."], ["Ordonner les 5 étapes de la multiplication d'un virus.", "ترتّب المراحل الخمس لتكاثر الفيروس."], ["Reconnaître une attaque de bactériophage en laiterie.", "تتعرّف على هجوم العاثية (bactériophage) في معمل الحليب."]], "sum": [["Virus : acellulaire, bien plus petit qu'une bactérie, ADN ou ARN, jamais les deux.", "الفيروس: عديم الخلية، أصغر بكثير من البكتيريا، ADN أو ARN، لا يجمع بينهما أبدًا."], ["Nucléocapside = capside + acide nucléique. Le virus enveloppé est plus sensible aux détergents.", "القفيصة النووية = القفيصة + الحمض النووي. الفيروس المغلّف أكثر حساسية للمنظفات."], ["Cycle : adsorption, pénétration, réplication, assemblage, libération.", "الدورة: الامتزاز، الاختراق، التضاعف، التجميع، التحرر."], ["Le phage attaque les ferments : le lait ne caille pas, la cuve est perdue.", "العاثية تهاجم الخمائر: لا يتخثر الحليب ويضيع الحوض."], ["Le prion : une protéine mal repliée, sans ADN ni ARN.", "البريون: بروتين مطويّ بشكل خاطئ، دون ADN ولا ARN."]], "q3": [{"q": ["Une cuve de lben ne s'acidifie pas. Le levain et la température sont les mêmes qu'hier. Que suspectes-tu ?", "حوض لبن لا يتحمّض. الخميرة الأم والحرارة نفس ما كانت عليه أمس. بماذا تشكّ؟"], "o": [["Une attaque de bactériophages sur les ferments", "Un excès de ferments lactiques", "Des prions dans le lait"], ["هجوم عاثيات على الخمائر", "إفراط في الخمائر اللبنية", "بريونات في الحليب"]], "a": 0, "w": ["Le phage détruit les ferments : l'acidification s'arrête. Il faut changer de souche et désinfecter.", "العاثية تدمّر الخمائر فيتوقف التحمّض. يجب تغيير السلالة والتطهير."]}, {"q": ["En cuisine collective, on nettoie les surfaces au détergent. Quel virus risque de mieux résister ?", "في مطبخ جماعي، ننظّف الأسطح بالمنظّف. أيّ فيروس قد يقاوم أكثر؟"], "o": [["Le virus enveloppé", "Les deux résistent pareil", "Le virus nu"], ["الفيروس المغلّف", "الاثنان يقاومان بنفس الشكل", "الفيروس العاري"]], "a": 2, "w": ["Le détergent attaque l'enveloppe du virus enveloppé. Le virus nu n'en a pas.", "المنظّف يهاجم غلاف الفيروس المغلّف. أما الفيروس العاري فليس له غلاف."]}]}, "6": {"obj": [["Nommer le type trophique d'un micro-organisme avec trois questions.", "تسمية نمط تغذية كائن دقيق بواسطة ثلاثة أسئلة."], ["Citer le rôle de l'azote, du soufre et du phosphore.", "ذكر دور الآزوت والكبريت والفوسفور."], ["Distinguer une souche prototrophe d'une souche auxotrophe.", "التمييز بين سلالة prototrophe وسلالة auxotrophe."]], "sum": [["Trois questions : d'où vient l'énergie, qui donne les électrons, d'où vient le carbone.", "ثلاثة أسئلة: من أين تأتي الطاقة، من يمنح الإلكترونات، من أين يأتي الكربون."], ["Presque tous les germes alimentaires sont chimio-organo-hétérotrophes : ils vivent de ton produit.", "كل الجراثيم الغذائية تقريبًا chimio-organo-hétérotrophes: تعيش من منتوجك."], ["Azote pour les protéines, soufre dans certains acides aminés, phosphore pour l'ATP.", "الآزوت للبروتينات، الكبريت في بعض الأحماض الأمينية، الفوسفور لـ ATP."], ["Un facteur de croissance est une substance que le germe ne sait pas fabriquer.", "عامل النمو مادة لا يستطيع الجرثوم صنعها."], ["Prototrophe : aucun facteur exigé. Auxotrophe : exige un facteur, qu'on nomme toujours.", "Prototrophe: لا يحتاج أي عامل. Auxotrophe: يحتاج عاملًا، ونذكر اسمه دائمًا."]], "q3": [{"q": ["Au labo, une souche isolée d'un jben ne pousse sur milieu minéral + glucose qu'après ajout de thiamine. Tu la décris comment ?", "في المختبر، سلالة معزولة من الجبن لا تنمو على وسط معدني + غلوكوز إلا بعد إضافة الثيامين. كيف تصفها؟"], "o": [["Autotrophe et prototrophe", "Hétérotrophe et prototrophe", "Hétérotrophe et auxotrophe vis-à-vis de la thiamine"], ["ذاتية التغذية و prototrophe", "غيرية التغذية و prototrophe", "غيرية التغذية و auxotrophe تجاه الثيامين"]], "a": 2, "w": ["Elle a besoin de glucose (carbone organique) et de thiamine qu'elle ne fabrique pas.", "تحتاج إلى الغلوكوز (كربون عضوي) وإلى الثيامين الذي لا تصنعه."]}, {"q": ["Tu dois cultiver les bactéries d'un lait de ferme sans savoir lesquelles. Quel milieu prends-tu ?", "عليك زرع بكتيريا حليب ضيعة دون معرفة نوعها. أيّ وسط تختار؟"], "o": [["Un bouillon à l'extrait de viande", "Un milieu minéral avec le CO₂ comme seul carbone", "De l'eau distillée stérile"], ["مرق بمستخلص اللحم", "وسط معدني مع CO₂ كمصدر وحيد للكربون", "ماء مقطّر معقّم"]], "a": 0, "w": ["Les germes du lait sont hétérotrophes ; l'extrait de viande couvre presque tous leurs besoins.", "جراثيم الحليب غيرية التغذية؛ ومستخلص اللحم يغطي تقريبًا كل حاجياتها."]}]}, "7": {"obj": [["Classer un micro-organisme selon la température, le pH et l'oxygène.", "تصنيف كائن دقيق حسب درجة الحرارة وpH والأكسجين."], ["Expliquer pourquoi l'eau libre (Aw) compte plus que l'eau totale.", "شرح لماذا يهم الماء الحر (Aw) أكثر من الماء الكلي."], ["Choisir le levier de l'atelier qui agit sur chaque facteur.", "اختيار رافعة الورشة التي تؤثر على كل عامل."]], "sum": [["Psychrophiles −15 à 20 °C, mésophiles 10 à 40 °C, thermophiles 40 à 80 °C.", "محبّة البرودة من −15 إلى 20، محبّة الاعتدال من 10 إلى 40، محبّة الحرارة من 40 إلى 80 درجة."], ["Le froid ne tue pas : il ralentit. Les psychrophiles continuent au réfrigérateur.", "البرودة لا تقتل: إنها تبطئ. محبّة البرودة تستمر في الثلاجة."], ["Acidifier écarte les bactéries, pas les levures ni les moisissures. pH 4,5 : frontière des conserves.", "التحميض يُبعد البكتيريا، وليس الخمائر ولا العفن. pH 4,5: حدّ المصبّرات."], ["Le vide arrête les aérobies, pas les anaérobies comme Clostridium botulinum.", "التفريغ يوقف الهوائية، وليس اللاهوائية مثل Clostridium botulinum."], ["Sécher, saler, sucrer : on baisse l'Aw. Aucun levier ne suffit seul, on les combine.", "التجفيف، التمليح، التسكير: نخفض Aw. لا رافعة تكفي وحدها، نجمع بينها."]], "q3": [{"q": ["À l'usine de conserve, deux lignes : légumes non acidifiés (pH 6) et légumes acidifiés sous pH 4,5. Laquelle surveilles-tu le plus pour Clostridium botulinum ?", "في مصنع المصبّرات خطّان: خضر غير محمّضة (pH 6) وخضر محمّضة تحت pH 4,5. أيّهما تراقب أكثر بسبب Clostridium botulinum؟"], "o": [["Les légumes acidifiés sous pH 4,5", "Les légumes non acidifiés à pH 6", "Les deux présentent le même risque"], ["الخضر المحمّضة تحت pH 4,5", "الخضر غير المحمّضة في pH 6", "الاثنان لهما نفس الخطر"]], "a": 1, "w": ["Au-dessus de pH 4,5, les bactéries poussent ; au cœur de la boîte, sans air, Clostridium est chez lui.", "فوق pH 4,5 تنمو البكتيريا؛ وفي قلب العلبة، دون هواء، Clostridium في مكانه."]}, {"q": ["Des sardines d'Agadir stockées à 4 °C s'altèrent après quelques jours. Ton chef accuse la chambre froide. Qu'expliques-tu ?", "سردين أكادير المخزّن في 4 درجات يفسد بعد أيام. رئيسك يتّهم غرفة التبريد. ماذا تشرح؟"], "o": [["Des thermophiles ont poussé", "Le froid a tué les bonnes bactéries", "Des psychrophiles continuent de pousser au froid"], ["نمت محبّة الحرارة", "البرودة قتلت البكتيريا النافعة", "محبّة البرودة تستمر في النمو في البرد"]], "a": 2, "w": ["À 4 °C, les mésophiles ralentissent, mais les psychrophiles poussent : le froid a donc une limite.", "في 4 درجات تتباطأ محبّة الاعتدال، لكن محبّة البرودة تنمو: للبرودة إذن حدّ."]}]}, "8": {"obj": [["Citer les trois conditions d'un bon milieu de culture.", "ذكر الشروط الثلاثة لوسط زرع جيد."], ["Choisir entre bouillon et gélose selon le but de l'analyse.", "الاختيار بين المرق والآغار حسب هدف التحليل."], ["Différencier milieu synthétique, empirique, enrichi et sélectif.", "التمييز بين الوسط الاصطناعي والتجريبي والمُغنى والانتقائي."]], "sum": [["Un bon milieu couvre les besoins, est isotonique et a un pH proche de l'optimum.", "الوسط الجيد يغطي الحاجيات، ومتساوي التوتر، وله pH قريب من الأمثل."], ["Bouillon : on voit un trouble. Gélose : on compte des colonies.", "المرق: نرى عكارة. الآغار: نعدّ المستعمرات."], ["Une colonie est un clone : elle vient d'une seule cellule. On compte en UFC.", "المستعمرة نسيلة: تأتي من خلية واحدة. نعدّ بـ UFC."], ["Synthétique : composition exacte. Empirique : extrait de viande, de levure, peptones.", "اصطناعي: تركيب دقيق. تجريبي: مستخلص اللحم، مستخلص الخميرة، الببتونات."], ["Enrichi : on ajoute pour faire pousser. Sélectif : on ajoute pour empêcher.", "المُغنى: نضيف لكي ينمو. الانتقائي: نضيف لكي نمنع."]], "q3": [{"q": ["Le labo te demande combien de bactéries contient un lait cru. Quel type de milieu utilises-tu ?", "يطلب منك المختبر عدد البكتيريا في حليب خام. أيّ نوع من الأوساط تستعمل؟"], "o": [["Un bouillon liquide", "Une gélose (milieu solide)", "Un milieu synthétique pour E. coli"], ["مرق سائل", "آغار (وسط صلب)", "وسط اصطناعي لـ E. coli"]], "a": 1, "w": ["Pour dénombrer, il faut des colonies séparées : seule la gélose le permet.", "للإحصاء نحتاج مستعمرات منفصلة: الآغار وحده يسمح بذلك."]}, {"q": ["Un germe exigeant ne pousse pas sur la gélose de base. Que proposes-tu au technicien ?", "جرثومة متطلبة لا تنمو على الآغار الأساسي. ماذا تقترح على التقني؟"], "o": [["Ajouter un antibiotique au milieu", "Passer à un milieu synthétique", "Ajouter du sang de mouton au milieu"], ["إضافة مضاد حيوي إلى الوسط", "الانتقال إلى وسط اصطناعي", "إضافة دم الغنم إلى الوسط"]], "a": 2, "w": ["Le sang enrichit le milieu en facteurs de croissance : on ajoute pour faire pousser.", "الدم يُغني الوسط بعوامل النمو: نضيف لكي ينمو."]}]}, "9": {"obj": [["Calculer G, µ et la population N après un temps donné.", "حساب G و µ والساكنة N بعد مدة معينة."], ["Tracer et annoter les six phases de la courbe de croissance.", "رسم وتسمية المراحل الست لمنحنى النمو."], ["Réaliser des dilutions et calculer une concentration en UFC/mL.", "إنجاز تخفيفات وحساب تركيز بـ UFC/mL."]], "sum": [["G est le temps pour doubler ; µ = 1/G est la vitesse de division.", "G هو زمن التضاعف؛ و µ = 1/G هي سرعة الانقسام."], ["Loi de croissance : N = N₀ × 2^(µt).", "قانون النمو: N = N₀ × 2^(µt)."], ["Six phases : latence, accélération, exponentielle, ralentissement, stationnaire, déclin.", "ست مراحل: الكمون، التسارع، الأسّية، التباطؤ، الاستقرار، الانحدار."], ["Allonger la latence par le froid ou l'acidité, c'est gagner du temps de conservation.", "إطالة الكمون بالبرودة أو بالحموضة تعني ربح وقت الحفظ."], ["Dénombrement : dilutions au 1/10 dans l'eau physiologique, boîte entre 15 et 300 colonies.", "الإحصاء: تخفيفات بـ 1/10 في الماء الفيزيولوجي، علبة بين 15 و300 مستعمرة."]], "q3": [{"q": ["Au labo, 1 mL ensemencé par boîte : 10⁻² → 350 colonies, 10⁻³ → 42, 10⁻⁴ → 3. Quel résultat notes-tu ?", "في المختبر، 1 مل مزروع في كل علبة: 10⁻² ← 350 مستعمرة، 10⁻³ ← 42، 10⁻⁴ ← 3. أيّ نتيجة تسجّل؟"], "o": [["10⁻² : 3,5 × 10⁴ UFC/mL", "10⁻³ : 4,2 × 10⁴ UFC/mL", "10⁻⁴ : 3 × 10⁴ UFC/mL"], ["10⁻²: 3,5 × 10⁴ UFC/mL", "10⁻³: 4,2 × 10⁴ UFC/mL", "10⁻⁴: 3 × 10⁴ UFC/mL"]], "a": 1, "w": ["Seule la boîte 10⁻³ est entre 15 et 300 : 42 ÷ 1 × 10³ = 4,2 × 10⁴ UFC/mL.", "العلبة 10⁻³ وحدها بين 15 و300: 42 ÷ 1 × 10³ = 4,2 × 10⁴ UFC/mL."]}, {"q": ["À la coopérative, le lait de ferme arrive le matin et sera transformé demain. Quelle décision protège le mieux le lait ?", "في التعاونية، يصل حليب الضيعة صباحًا وسيُحوَّل غدًا. أيّ قرار يحمي الحليب أكثر؟"], "o": [["Le refroidir dès l'arrivée", "Le refroidir en fin de journée", "Le laisser à température ambiante jusqu'à demain"], ["تبريده منذ وصوله", "تبريده في آخر النهار", "تركه في درجة حرارة الغرفة حتى الغد"]], "a": 0, "w": ["Refroidir tôt allonge la latence : les bactéries n'entrent pas vite en phase exponentielle.", "التبريد المبكر يُطيل الكمون: لا تدخل البكتيريا بسرعة في المرحلة الأسّية."]}]}, "10": {"obj": [["Distinguer la flore originelle de la flore de contamination.", "التمييز بين الفلورا الأصلية (flore originelle) وفلورا التلوث (flore de contamination)."], ["Citer les réservoirs (eau, sol, air, homme) et leurs germes typiques.", "ذكر المستودعات (الماء، التربة، الهواء، الإنسان) وجراثيمها المميزة."], ["Remonter d'un germe trouvé en analyse à sa source probable.", "الرجوع من جرثومة وُجدت في التحليل إلى مصدرها المحتمل."]], "sum": [["Un produit porte déjà une flore originelle ; l'atelier ajoute la flore de contamination.", "المنتوج يحمل أصلًا فلورا أصلية؛ والورشة تضيف فلورا التلوث."], ["Eau : Pseudomonas ; si pollution fécale, entérobactéries, entérocoques, Clostridium.", "الماء: Pseudomonas؛ وإذا كان هناك تلوث برازي: بكتيريا معوية، مكورات معوية، Clostridium."], ["Sol : réservoir riche et permanent, avec les sporulés Bacillus et Clostridium.", "التربة: مستودع غني ودائم، فيه المكوّنة للأبواغ Bacillus و Clostridium."], ["Air : aucun nutriment ; les germes y voyagent seulement sur les poussières.", "الهواء: لا مغذيات فيه؛ الجراثيم تسافر فيه فقط عالقة بالغبار."], ["L'homme est un réservoir : Staphylococcus oriente vers le manipulateur.", "الإنسان مستودع: وجود Staphylococcus يوجّهنا نحو العامل الذي يتداول الغذاء."]], "q3": [{"q": ["Dans une usine de conserve de sardines, l'analyse d'un lot trouve Staphylococcus. Où cherches-tu d'abord la source ?", "في مصنع لتصبير السردين، وجد التحليل Staphylococcus في دفعة. أين تبحث أولًا عن المصدر؟"], "o": [["Chez les manipulateurs : mains, bouche, tenue", "Dans le sol de la cour", "Dans l'air extérieur seulement"], ["عند العمال: الأيدي، الفم، اللباس", "في تربة الساحة", "في الهواء الخارجي فقط"]], "a": 0, "w": ["Staphylococcus vit sur la peau et dans les voies respiratoires : il oriente vers le manipulateur.", "يعيش Staphylococcus على الجلد وفي المجاري التنفسية: فهو يوجّه نحو العامل."]}, {"q": ["Dans une salle de conditionnement, on trouve beaucoup de spores de moisissures dans l'air. On y balaie à sec pendant le travail. Que proposes-tu ?", "في قاعة التعبئة، نجد أبواغ عفن كثيرة في الهواء. ويُكنس المكان كنسًا جافًا أثناء العمل. ماذا تقترح؟"], "o": [["Chauffer l'air de la salle", "Ajouter une ventilation sans rien changer au nettoyage", "Nettoyer sans soulever de poussière, hors production"], ["تسخين هواء القاعة", "إضافة تهوية دون تغيير طريقة التنظيف", "التنظيف دون رفع الغبار، خارج أوقات الإنتاج"]], "a": 2, "w": ["Les germes de l'air voyagent sur les poussières : moins de poussière, moins de germes.", "جراثيم الهواء تسافر عالقة بالغبار: غبار أقل يعني جراثيم أقل."]}]}, "11": {"obj": [["Différencier commensalisme, symbiose, parasitisme et saprophytisme.", "التفريق بين التعايش والتكافل والتطفل والترمّم."], ["Distinguer infection, toxi-infection, intoxination et intoxication.", "التمييز بين العدوى (infection) والتسمم العدوائي (toxi-infection) والتسمم الذيفاني (intoxination) والتسمم (intoxication)."], ["Associer chaque pathogène majeur à ses aliments à risque.", "ربط كل ممرض رئيسي بالأغذية الخطرة المرتبطة به."]], "sum": [["Commensalisme + / 0, symbiose + / +, parasitisme − / +, saprophytisme 0 / 0.", "التعايش + / 0، التكافل + / +، التطفل − / +، الترمّم 0 / 0."], ["Intoxination : la toxine seule rend malade, même sans bactérie vivante.", "التسمم الذيفاني: السمّ وحده يُمرض، حتى دون بكتيريا حية."], ["Salmonella : œufs, viande, lait crus. E. coli ECEH : viande hachée peu cuite.", "السالمونيلا: بيض، لحم، حليب نيء. E. coli ECEH: لحم مفروم قليل الطهي."], ["Campylobacter : volaille, lait cru. Listeria : se multiplie encore à 4 °C.", "كامبيلوباكتر: الدواجن، الحليب النيء. الليستيريا: تتكاثر حتى في 4 درجات."], ["Porteur sain : pas malade mais contaminant. Examens positifs = retrait du poste.", "الحامل السليم: غير مريض لكنه ملوِّث. فحوص إيجابية = إبعاد عن المنصب."]], "q3": [{"q": ["À la cantine, un ouvrier sans symptôme parle au-dessus des plats de salade, sans masque. Que fais-tu ?", "في المطعم الجماعي، عامل بلا أعراض يتكلم فوق أطباق السلطة دون قناع. ماذا تفعل؟"], "o": [["Rien, il n'est pas malade", "Je lui donne seulement des gants", "Je lui fais porter un masque : il peut être porteur sain"], ["لا شيء، فهو ليس مريضًا", "أعطيه القفازات فقط", "أجعله يضع القناع: قد يكون حاملًا سليمًا للجراثيم"]], "a": 2, "w": ["La bouche et les voies respiratoires sont des réservoirs, même chez une personne qui se sent bien.", "الفم والمجاري التنفسية مستودعات للجراثيم، حتى عند شخص يشعر أنه بخير."]}, {"q": ["Une femme enceinte veut acheter un fromage à pâte molle au lait cru, gardé au frigo. Que lui conseilles-tu ?", "امرأة حامل تريد شراء جبن طري من حليب نيء محفوظ في الثلاجة. بماذا تنصحها؟"], "o": [["Oui, le froid bloque tous les germes", "Non, Listeria se multiplie même à 4 °C", "Oui, Listeria ne touche que la viande"], ["نعم، البرد يوقف كل الجراثيم", "لا، الليستيريا تتكاثر حتى في 4 درجات", "نعم، الليستيريا لا تخص إلا اللحم"]], "a": 1, "w": ["Listeria est psychrophile et dangereuse pendant la grossesse ; le fromage à pâte molle au lait cru est un aliment typique.", "الليستيريا محبّة للبرودة وخطيرة أثناء الحمل؛ والجبن الطري من حليب نيء غذاء نموذجي لها."]}]}, "12": {"obj": [["Distinguer phycotoxines et mycotoxines, leurs producteurs et leurs aliments.", "التمييز بين السموم الطحلبية والسموم الفطرية، ومن ينتجها، وفي أي أغذية نجدها."], ["Expliquer pourquoi la cuisson ne détruit pas toujours une toxine.", "شرح لماذا لا يدمّر الطهي السمّ دائمًا."], ["Reconnaître les altérations et les micro-organismes utiles de transformation.", "التعرف على أنواع الإفساد وعلى الكائنات الدقيقة المفيدة في التحويل."]], "sum": [["Phycotoxines : produites par des algues, concentrées par les coquillages ; PSP agit en 5 à 30 minutes.", "السموم الطحلبية: تنتجها الطحالب ويركّزها المحار؛ التسمم PSP يظهر خلال 5 إلى 30 دقيقة."], ["Mycotoxines : moisissures sur céréales, fruits secs, épices ; gratter la moisissure ne suffit pas.", "السموم الفطرية: أعفان على الحبوب والفواكه الجافة والتوابل؛ كشط العفن لا يكفي."], ["Beaucoup de toxines sont thermostables : seule la prévention au stockage marche.", "كثير من السموم مقاومة للحرارة: الوقاية في التخزين وحدها تنجح."], ["Altération : couleur, texture, odeur ; l'odeur apparaît vers 10⁶ à 10⁷ germes/g.", "الإفساد: اللون، القوام، الرائحة؛ تظهر الرائحة عند حوالي 10⁶ إلى 10⁷ جرثومة/غ."], ["Utiles : yaourt (S. thermophilus + L. bulgaricus) ; pain, vin, bière (Saccharomyces cerevisiae).", "المفيدة: الياغورت (S. thermophilus + L. bulgaricus)؛ الخبز والنبيذ والجعة (Saccharomyces cerevisiae)."]], "q3": [{"q": ["Dans l'entrepôt d'une coopérative, un sac de paprika montre des taches de moisissure. Que fais-tu ?", "في مخزن تعاونية، يظهر على كيس من الفلفل الأحمر المطحون (paprika) بقع عفن. ماذا تفعل؟"], "o": [["Je tamise le paprika et je le vends", "Je le chauffe fort pour détruire la toxine", "J'écarte le lot et j'améliore la ventilation du stock"], ["أغربل الفلفل وأبيعه", "أسخّنه بقوة لتدمير السمّ", "أستبعد الدفعة وأحسّن تهوية المخزن"]], "a": 2, "w": ["La mycotoxine est invisible, diffuse et souvent thermostable : on écarte le lot et on agit sur le stockage.", "السمّ الفطري غير مرئي ومنتشر وغالبًا مقاوم للحرارة: نستبعد الدفعة ونعمل على ظروف التخزين."]}, {"q": ["De la viande hachée est restée hors froid au souk toute la matinée. Elle ne sent rien. Un collègue dit qu'elle est sûre. Qu'en penses-tu ?", "بقي لحم مفروم خارج البرد في السوق طوال الصباح. لا رائحة له. زميل يقول إنه سليم. ما رأيك؟"], "o": [["Faux : l'odeur n'apparaît que vers 10⁶ à 10⁷ germes/g", "Vrai : pas d'odeur, donc peu de germes", "Vrai, à condition de bien le cuire"], ["خطأ: الرائحة لا تظهر إلا عند حوالي 10⁶ إلى 10⁷ جرثومة/غ", "صحيح: لا رائحة، إذن جراثيم قليلة", "صحيح، بشرط طهيه جيدًا"]], "a": 0, "w": ["Le nez est un capteur tardif. Le temps hors froid a laissé les germes se multiplier.", "الأنف مستشعر متأخر. الوقت خارج البرد ترك الجراثيم تتكاثر."]}]}, "13": {"obj": [["Distinguer maîtrise du développement et maîtrise de la contamination.", "تميّز بين التحكم في النمو (développement) والتحكم في التلوث (contamination)."], ["Comparer réfrigération, congélation, pasteurisation, stérilisation et UHT.", "تقارن بين التبريد والتجميد والبسترة والتعقيم وUHT."], ["Choisir le barème le plus doux qui assure la sécurité du produit.", "تختار أخفّ معيار حراري (barème) يضمن سلامة المنتوج."]], "sum": [["Deux façons d'agir : sur le germe présent, ou sur son arrivée.", "طريقتان للتدخل: على الجرثومة الموجودة، أو على وصولها."], ["Le froid ralentit sans tuer ; son effet est réversible.", "البرودة تُبطئ ولا تقتل؛ أثرها قابل للرجوع."], ["Les ruptures de la chaîne du froid s'additionnent.", "انقطاعات سلسلة التبريد تتراكم وتُجمع."], ["Pasteurisation 60–100 °C ; stérilisation > 100 °C ; UHT 135–150 °C pendant 1–5 s.", "البسترة 60–100 درجة؛ التعقيم أكثر من 100 درجة؛ UHT من 135 إلى 150 درجة لمدة 1–5 ثوانٍ."], ["La spore survit à l'ébullition : un produit pasteurisé se garde au froid.", "البوغ (spore) يقاوم الغليان: المنتوج المبستر يُحفظ في البرودة."]], "q3": [{"q": ["Dans une laiterie, un lot de lait pasteurisé reste une nuit à température ambiante. Que fais-tu ?", "في مصنع للحليب، بقيت دفعة من الحليب المبستر ليلة كاملة في حرارة الغرفة. ماذا تفعل؟"], "o": [["Tu écartes le lot : les germes survivants ont pu se multiplier.", "Tu le remets au froid : le froid va tout annuler.", "Tu le vends vite : pasteurisé veut dire stérile."], ["تُبعد الدفعة: الجراثيم الناجية ربما تكاثرت.", "تُعيده إلى البرودة: البرودة ستمحو كل شيء.", "تبيعه بسرعة: المبستر يعني معقّم."]], "a": 0, "w": ["Le pasteurisé n'est pas stérile, et le froid ne remet pas le compteur à zéro.", "المبستر ليس معقّمًا، والبرودة لا تُعيد العدّاد إلى الصفر."]}, {"q": ["Ta coopérative veut vendre un lait qui se garde plusieurs mois dans les épiceries sans frigo. Quel traitement ?", "تريد تعاونيتك بيع حليب يُحفظ عدة أشهر عند البقالين بدون ثلاجة. أيّ معالجة تختار؟"], "o": [["Une pasteurisation à 70 °C.", "Une réfrigération à 4 °C.", "Un traitement UHT avec conditionnement aseptique."], ["بسترة في 70 درجة.", "تبريد في 4 درجات.", "معالجة UHT مع تعبئة معقّمة (aseptique)."]], "a": 2, "w": ["Parmi ces choix, seul l'UHT détruit tout et permet des mois à température ambiante.", "من بين هذه الخيارات، وحده UHT يدمّر كل شيء ويسمح بالحفظ أشهرًا في حرارة الغرفة."]}]}, "14": {"obj": [["Expliquer comment le sel, le sucre et le séchage abaissent l'Aw.", "تشرح كيف يخفض الملح والسكر والتجفيف نشاط الماء (Aw)."], ["Citer le rôle des conservateurs, de la fermentation, du fumage et des atmosphères modifiées.", "تذكر دور المواد الحافظة والتخمّر والتدخين والأجواء المعدّلة."], ["Identifier les barrières multiples d'un produit courant.", "تحدد الحواجز المتعددة في منتوج شائع."]], "sum": [["Le sel et le sucre n'enlèvent pas l'eau : ils l'occupent.", "الملح والسكر لا يزيلان الماء: بل يشغلانه."], ["Aw > 0,95 : tout pousse ; Aw < 0,60 : plus aucune croissance.", "Aw أكبر من 0,95: كل شيء ينمو؛ Aw أقل من 0,60: لا نمو إطلاقًا."], ["Un conservateur s'utilise à faible dose, porte un numéro E et ne remplace pas un procédé.", "المادة الحافظة تُستعمل بجرعة ضعيفة، تحمل رقم E، ولا تعوّض طريقة الحفظ."], ["Sans oxygène, les anaérobies profitent : l'atmosphère modifiée va toujours avec le froid.", "بدون أكسجين، تستفيد اللاهوائيات: الجو المعدّل يُرافَق دائمًا بالبرودة."], ["Plusieurs obstacles doux valent mieux qu'un seul obstacle forcé.", "عدة حواجز معتدلة أفضل من حاجز واحد قوي."]], "q3": [{"q": ["Une confiture maison de figues montre une tache de moisissure en surface. D'où vient-elle le plus probablement ?", "ظهرت بقعة عفن على سطح مربّى تين منزلي. من أين أتت على الأرجح؟"], "o": [["Des bactéries du pot, qui résistent au sucre.", "De l'air, au moment de l'ouverture ou du remplissage.", "Du sucre, qui contient des moisissures."], ["من بكتيريا الإناء التي تقاوم السكر.", "من الهواء، عند الفتح أو الملء.", "من السكر الذي يحتوي على العفن."]], "a": 1, "w": ["Aucune bactérie ne pousse dans la confiture ; la moisissure de surface arrive par l'air.", "لا تنمو أي بكتيريا في المربّى؛ عفن السطح يأتي من الهواء."]}, {"q": ["Ton atelier emballe de la viande sous vide. Un collègue propose de la stocker à température ambiante. Ta réponse ?", "مشغلك يعبّئ اللحم تحت الفراغ. زميل يقترح تخزينه في حرارة الغرفة. ما جوابك؟"], "o": [["Non : sans oxygène, les anaérobies comme C. botulinum peuvent se développer ; il faut le froid.", "Oui : sans air, aucun germe ne peut pousser.", "Oui, à condition d'ajouter plus de sel."], ["لا: بدون أكسجين قد تنمو اللاهوائيات مثل C. botulinum؛ يجب التبريد.", "نعم: بدون هواء لا يمكن لأي جرثومة أن تنمو.", "نعم، بشرط إضافة ملح أكثر."]], "a": 0, "w": ["Le sous-vide favorise les anaérobies : il se combine toujours avec le froid.", "التعبئة تحت الفراغ تساعد اللاهوائيات: تُرافَق دائمًا بالبرودة."]}]}, "15": {"obj": [["Classer un danger en physique, chimique ou biologique.", "تصنّف الخطر إلى فيزيائي أو كيميائي أو بيولوجي."], ["Utiliser les 5 M pour chercher les causes d'une contamination.", "تستعمل طريقة 5 M للبحث عن أسباب التلوث."], ["Appliquer les règles de réception, de stockage, de marche en avant et d'hygiène du personnel.", "تطبّق قواعد الاستلام والتخزين والسير إلى الأمام ونظافة المستخدمين."]], "sum": [["Trois familles de dangers : physique, chimique, biologique.", "ثلاث عائلات من الأخطار: فيزيائية، كيميائية، بيولوجية."], ["Les 5 M : Matières, Matériel, Milieu, Méthodes, Main-d'œuvre.", "الـ 5 M: المواد، المعدات، الوسط، الطرق، اليد العاملة."], ["À la réception, on peut refuser ; après, le problème est dans l'usine.", "عند الاستلام يمكن الرفض؛ بعده تصبح المشكلة داخل المصنع."], ["Marche en avant : du sale vers le propre, sans retour ni croisement.", "السير إلى الأمام: من المتّسخ إلى النظيف، دون رجوع ولا تقاطع."], ["AMER : Apports, Multiplication, Élimination, Recontamination. Les gants ne remplacent pas le lavage des mains.", "AMER: الإدخال، التكاثر، الإزالة، إعادة التلوث. القفازات لا تعوّض غسل اليدين."]], "q3": [{"q": ["Des jben ont un goût de javel. Avec les 5 M, dans quelle famille cherches-tu d'abord la cause ?", "قطع من الجبن لها طعم ماء جافيل. باستعمال الـ 5 M، في أيّ عائلة تبحث أولًا عن السبب؟"], "o": [["Main-d'œuvre : la tenue du personnel.", "Milieu : la présence de nuisibles.", "Méthodes : un rinçage oublié après la désinfection."], ["اليد العاملة: لباس المستخدمين.", "الوسط: وجود الحيوانات المؤذية.", "الطرق: شطف منسيّ بعد التطهير."]], "a": 2, "w": ["Un goût de désinfectant signale un résidu chimique : la méthode de nettoyage est en cause.", "طعم المطهّر يدل على بقايا كيميائية: طريقة التنظيف هي المعنية."]}, {"q": ["Dans une petite cuisine de traiteur, légumes terreux et p
