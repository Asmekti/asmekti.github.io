function whoStart(){const qs=shuffle(DATA.who.map((_,i)=>i)).slice(0,5);st.game={type:"who",qs,pos:0,clue:1,score:0,found:0,res:null};if(location.hash==="#y")vWho();else go("y")}
function whoOpts(i){const g=st.game;g.opts=g.opts||{};if(!g.opts[i]){const others=shuffle(DATA.who.map((_,j)=>j).filter(j=>j!==i)).slice(0,3);g.opts[i]=shuffle([i].concat(others))}return g.opts[i]}
function vWho(){
  const l=L(),g=st.game,best=gstats.who||0;
  setTop(T("gWho"),best?`${T("record")} : ${best}`:"",true);
  if(!g||g.type!=="who"){document.getElementById("main").innerHTML=`<div class="end">${mimg("p_mag",140,"margin:0 auto")}<p class="sub">${T("whoIntro")}</p>${best?`<p><b>${T("record")} : ${best}</b></p>`:""}</div><button class="big gold" onclick="whoStart()">${T("play")}</button>`;return}
  if(g.pos>=g.qs.length){
    const rec=g.score>best;if(rec){gstats.who=g.score;save("mr_games",gstats)}
    if(!g.saved){g.saved=1;gameDone(Math.round(g.score/4));if(rec&&g.score>0){confetti();sfx("win")}}
    document.getElementById("pager").innerHTML="";
    document.getElementById("main").innerHTML=`<div class="end">${mimg(g.found>=3?"p_thumb":"c_ask",g.found>=3?130:110,"margin:0 auto")}<p class="sub">${T("whoFound")} : ${g.found}/${g.qs.length}</p><div class="score" dir="ltr">${g.score}</div>
      <p class="sub">${rec?T("newRecord"):`${T("record")} : ${Math.max(best,g.score)}`} · +${Math.round(g.score/4)} XP</p></div>
      <button class="big gold" onclick="whoStart()">${T("again")}</button><button class="big alt" onclick="go('j')">🎮 ${T("games").replace(/^🎮\s*/,"")}</button>`;return}
  const i=g.qs[g.pos],w=DATA.who[i],pts=[40,30,20,10][g.clue-1];
  const clues=w.c.slice(0,g.clue).map((c,j)=>`<li><span class="num">${j+1}</span><p>${esc(c[l])}</p></li>`).join("");
  const opts=whoOpts(i).map((j,k)=>{let cls="";if(g.res){if(j===i)cls="ok";else if(j===g.res.pick)cls="ko"}
    return `<button class="opt ${cls}" ${g.res?"disabled":""} onclick="whoPick(${j})"><span class="lt">${g.res&&j===i?"✓":g.res&&j===g.res.pick?"✗":(l?"أبجد":"abcd")[k]}</span><span>${esc(DATA.who[j].a[l])}</span></button>`}).join("");
  document.getElementById("main").innerHTML=`<div class="meta"><span dir="ltr">${g.pos+1} / ${g.qs.length} · ⭐ ${g.score}</span><span class="etimer" dir="ltr">${g.res?(g.res.ok?"+"+g.res.pts:"0"):"+"+pts}</span></div>
    <div class="card"><div class="body"><div class="mekrow" style="margin:0 0 6px">${mimg(g.res?(g.res.ok?"c_ok":"c_ask"):"c_ask",62)}<div class="bub">${T("whoAsk")}</div></div>
    <ol class="steps">${clues}</ol>
    ${!g.res&&g.clue<4?`<div class="more"><button onclick="whoClue()">🔎 ${T("whoMore")} (−10)</button></div>`:""}
    <div class="quiz">${opts}${g.res?`<div class="why ${g.res.ok?"ok":"ko"}"><b>${g.res.ok?T("good"):T("bad")}</b>${T("seance")} ${w.s} · ${esc(w.a[l])}</div>`:""}</div></div></div>`;
  document.getElementById("pager").innerHTML=g.res?`<div class="pager"><div class="in"><button class="next" onclick="st.game.pos++;st.game.clue=1;st.game.res=null;vWho();window.scrollTo(0,0)">${g.pos===g.qs.length-1?T("finish"):T("next")} ${l?"◂":"▸"}</button></div></div>`:"";
}
function whoClue(){const g=st.game;if(g.res||g.clue>=4)return;g.clue++;vWho()}
function whoPick(j){const g=st.game;if(g.res)return;const i=g.qs[g.pos],ok=j===i,pts=ok?[40,30,20,10][g.clue-1]:0;
  g.res={pick:j,ok,pts};if(ok){g.score+=pts;g.found++;sfx("ok")}else sfx("ko");g.clue=4;markActive();vWho();
  const n=document.querySelector(".pager .next");n&&n.scrollIntoView({behavior:"smooth",block:"end"})}

// --- mini encodeur QR (mode octet, correction M, versions 1 à 10) — d'après l'algorithme de référence (Nayuki)
const QR=(()=>{
  const ECC_CW=[0,10,16,26,18,24,16,18,22,22,26];          // codewords de correction par bloc (niveau M)
  const BLOCKS=[0,1,1,1,2,2,4,4,4,5,5];                    // nombre de blocs (niveau M)
  function rawMods(v){let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r}
  const dataCW=v=>Math.floor(rawMods(v)/8)-ECC_CW[v]*BLOCKS[v];
  function mul(x,y){let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z&255}
  function divisor(d){const r=new Array(d).fill(0);r[d-1]=1;let root=1;for(let i=0;i<d;i++){for(let j=0;j<d;j++){r[j]=mul(r[j],root);if(j+1<d)r[j]^=r[j+1]}root=mul(root,2)}return r}
  function remainder(data,div){const r=div.map(()=>0);for(const b of data){const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))}return r}
  function encode(text){
    const bytes=Array.from(new TextEncoder().encode(text));
    let v=1;for(;v<=10;v++){if(4+(v<10?8:16)+bytes.length*8<=dataCW(v)*8)break}
    if(v>10)throw new Error("QR trop long");
    const bits=[];const put=(val,n)=>{for(let i=n-1;i>=0;i--)bits.push((val>>>i)&1)};
    put(4,4);put(bytes.length,v<10?8:16);bytes.forEach(b=>put(b,8));
    const cap=dataCW(v)*8;put(0,Math.min(4,cap-bits.length));put(0,(8-bits.length%8)%8);
    for(let p=0xEC;bits.length<cap;p^=0xEC^0x11)put(p,8);
    const data=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];data.push(b)}
    // blocs + correction, puis entrelacement
    const nb=BLOCKS[v],ecl=ECC_CW[v],raw=Math.floor(rawMods(v)/8),nShort=nb-raw%nb,shortLen=Math.floor(raw/nb);
    const div=divisor(ecl),blocks=[];
    for(let i=0,k=0;i<nb;i++){const dat=data.slice(k,k+shortLen-ecl+(i<nShort?0:1));k+=dat.length;const ec=remainder(dat,div);if(i<nShort)dat.push(0);blocks.push(dat.concat(ec))}
    const all=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!==shortLen-ecl||j>=nShort)all.push(b[i])});
    // matrice
    const size=v*4+17,M=[],F=[];for(let i=0;i<size;i++){M.push(new Array(size).fill(false));F.push(new Array(size).fill(false))}
    const set=(x,y,d)=>{M[y][x]=d;F[y][x]=true};
    for(let i=0;i<size;i++){set(6,i,i%2===0);set(i,6,i%2===0)}
    const finder=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)set(xx,yy,d!==2&&d!==4)}};
    finder(3,3);finder(size-4,3);finder(3,size-4);
    if(v>=2){const n=Math.floor(v/7)+2,step=v===32?26:Math.ceil((v*4+4)/(n*2-2))*2,pos=[6];for(let p=size-7;pos.length<n;p-=step)pos.splice(1,0,p);
      pos.forEach((a,i)=>pos.forEach((b,j)=>{if(!((i===0&&j===0)||(i===0&&j===n-1)||(i===n-1&&j===0)))for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1)}))}
    const drawFormat=mask=>{const d=(0<<3)|mask;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=((d<<10)|r)^0x5412;const g=i=>((b>>>i)&1)!==0;
      for(let i=0;i<=5;i++)set(8,i,g(i));set(8,7,g(6));set(8,8,g(7));set(7,8,g(8));for(let i=9;i<15;i++)set(14-i,8,g(i));
      for(let i=0;i<8;i++)set(size-1-i,8,g(i));for(let i=8;i<15;i++)set(8,size-15+i,g(i));set(8,size-8,true)};
    drawFormat(0);
    if(v>=7){let r=v;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=v<<12|r;for(let i=0;i<18;i++){const bit=((b>>>i)&1)!==0,a=size-11+i%3,c=Math.floor(i/3);set(a,c,bit);set(c,a,bit)}}
    // placement des données
    let i=0;for(let right=size-1;right>=1;right-=2){if(right===6)right=5;for(let vert=0;vert<size;vert++)for(let j=0;j<2;j++){const x=right-j,up=((right+1)&2)===0,y=up?size-1-vert:vert;if(!F[y][x]&&i<all.length*8){M[y][x]=((all[i>>>3]>>>(7-(i&7)))&1)!==0;i++}}}
    const maskFn=[(x,y)=>(x+y)%2===0,(x,y)=>y%2===0,(x,y)=>x%3===0,(x,y)=>(x+y)%3===0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2===0,(x,y)=>x*y%2+x*y%3===0,(x,y)=>(x*y%2+x*y%3)%2===0,(x,y)=>((x+y)%2+x*y%3)%2===0];
    const applyMask=m=>{for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&maskFn[m](x,y))M[y][x]=!M[y][x]};
    const penalty=()=>{let p=0;
      for(let y=0;y<size;y++){let run=1;for(let x=1;x<=size;x++){if(x<size&&M[y][x]===M[y][x-1])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let x=0;x<size;x++){let run=1;for(let y=1;y<=size;y++){if(y<size&&M[y][x]===M[y-1][x])run++;else{if(run>=5)p+=run-2;run=1}}}
      for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++){const c=M[y][x];if(c===M[y][x+1]&&c===M[y+1][x]&&c===M[y+1][x+1])p+=3}
      const pat=[true,false,true,true,true,false,true,false,false,false,false],pat2=pat.slice().reverse();
      for(let y=0;y<size;y++)for(let x=0;x+11<=size;x++){let a=true,b=true;for(let k=0;k<11;k++){if(M[y][x+k]!==pat[k])a=false;if(M[y][x+k]!==pat2[k])b=false}if(a)p+=40;if(b)p+=40}
      for(let x=0;x<size;x++)for(let y=0;y+11<=size;y++){let a=true,b=true;for(let k=0;k<11;k++){if(M[y+k][x]!==pat[k])a=false;if(M[y+k][x]!==pat2[k])b=false}if(a)p+=40;if(b)p+=40}
      let dark=0;M.forEach(r=>r.forEach(c=>{if(c)dark++}));const tot=size*size;p+=(Math.ceil(Math.abs(dark*20-tot*10)/tot)-1)*10;return p};
    let best=0,bp=Infinity;for(let m=0;m<8;m++){applyMask(m);drawFormat(m);const p=penalty();if(p<bp){bp=p;best=m}applyMask(m)}
    applyMask(best);drawFormat(best);
    return M;
  }
  function svg(text,px,color){const M=encode(text),n=M.length,q=4;let d="";M.forEach((r,y)=>r.forEach((c,x)=>{if(c)d+=`M${x+q} ${y+q}h1v1h-1z`}));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+2*q} ${n+2*q}" width="${px}" height="${px}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="${color||"#12385a"}"/></svg>`}
  return {encode,svg};
})();

let RA=null,RAHOLD=0;
const RATES=[0.8,1,1.2];
function raRate(){const r=+load("mr_rate",1);return RATES.includes(r)?r:1}
function raFs(){const f=+load("mr_rafs",1);return f>=0.9&&f<=1.6?f:1}
function raAutoOn(){return load("mr_rascroll",1)!==0}
function stepNo(c,i){return c.sn?(c.sn[i]||"•"):String(i+1)}
function stepPre(c,i,l){const n=stepNo(c,i);return n==="•"?"":(l?"الخطوة ":"Étape ")+n+"."}
function raWords(t){return esc(t).split(/(\s+)/).map(w=>!w||/^\s+$/.test(w)?w:`<span class="w">${w}</span>`).join("")}
function raHTML(t,pre){return sentences(String(t||"")).map((x,i)=>`<span class="rs"${i===0?` data-p="1"`:""}${i===0&&pre?` data-pre="${esc(pre)}"`:""}>${raWords(x)}</span>`).join(" ")}
["touchmove","wheel"].forEach(ev=>window.addEventListener(ev,()=>{if(RA)RAHOLD=Date.now()},{passive:true}));
function raScroll(el){if(!raAutoOn()||Date.now()-RAHOLD<5000)return;try{el.scrollIntoView({behavior:"smooth",block:"center"})}catch(e){}}
function raRun(root,from,opt){opt=opt||{};
  if(!("speechSynthesis" in window)){toast(T("noVoice"));return false}
  const l=L(),v=pickVoice(l);if(l&&!v&&voiceList(0).length){toast(T("noVoice"),5000);return false}
  const els=[...root.querySelectorAll(".rs")],tok=++SPK,male=v?isMaleVoice(v):false;
  try{speechSynthesis.cancel()}catch(e){}
  RA={root,els,i:Math.max(0,Math.min(from||0,els.length)),tok,opt};const R=RA;
  root.querySelectorAll(".cw,.at").forEach(w=>w.classList.remove("cw","at"));
  els.forEach((e,k)=>{e.classList.toggle("done",k<R.i);e.classList.remove("on")});root.classList.add("raon");RAHOLD=0;
  const next=()=>{if(tok!==SPK)return;els.forEach(e=>e.classList.remove("on"));
    if(R.i>=els.length){root.classList.remove("raon");if(RA===R)RA=null;opt.onEnd&&opt.onEnd();return}
    const el=els[R.i],ws=[...el.querySelectorAll(".w")];el.classList.add("on");el.classList.remove("done");
    opt.onSent&&opt.onSent(R.i,els.length);raScroll(el);
    const pre=el.dataset.pre?speechText(el.dataset.pre,l)+" ":"",body=speechText(el.textContent,l),spoken=pre+body;
    const cum=[];let tot=0;ws.forEach(w=>{cum.push(tot);tot+=w.textContent.length+1});
    const u=new SpeechSynthesisUtterance(spoken);u.lang=v?v.lang:(l?"ar-SA":"fr-FR");if(v)u.voice=v;
    u.rate=(l?0.88:0.92)*raRate();u.pitch=male?1:0.78;
    u.onboundary=e=>{if(tok!==SPK||(e.name&&e.name!=="word")||!ws.length)return;const f=(e.charIndex-pre.length)/Math.max(1,body.length);if(f<0)return;
      const x=f*tot;let k=0;while(k+1<cum.length&&cum[k+1]<=x+0.5)k++;ws.forEach((w,j)=>w.classList.toggle("cw",j===k))};
    const fin=()=>{if(tok!==SPK)return;ws.forEach(w=>w.classList.remove("cw"));el.classList.remove("on");el.classList.add("done");R.i++;
      const nx=els[R.i];setTimeout(next,nx&&nx.dataset.p?380:120)};
    u.onend=fin;u.onerror=e=>{if(tok!==SPK)return;if(e&&(e.error==="not-allowed"||e.error==="synthesis-unavailable")){toast(T("noVoice"));root.classList.remove("raon");RA=null;opt.onStop&&opt.onStop();return}fin()};
    try{speechSynthesis.speak(u)}catch(e){}};
  setTimeout(next,80);return true}

  const body=[encodeURIComponent(name.slice(0,24)),ds,ps,xp].concat(MODID==="micro"?[]:[MODID]).join("~");let ck=0;for(const ch of body)ck=(ck*31+ch.charCodeAt(0))%1296;
  return body+"~"+ck.toString(36).padStart(2,"0")}
function bilanParse(code){try{const p=code.split("~");if(p.length!==5&&p.length!==6)return null;const mod=p.length===6?p[4]:"micro",M=DATA.mods[mod];if(!M)return null;
  const body=p.slice(0,p.length-1).join("~");let ck=0;for(const ch of body)ck=(ck*31+ch.charCodeAt(0))%1296;
  if(ck.toString(36).padStart(2,"0")!==p[p.length-1]||!/^\d{8}$/.test(p[1])||!new RegExp("^[0-9A-]{"+M.seances.length+"}$").test(p[2]))return null;
  return {name:decodeURIComponent(p[0]),date:p[1].slice(6)+"/"+p[1].slice(4,6)+"/"+p[1].slice(0,4),ps:p[2].split("").map(c=>c==="A"?100:c==="-"?0:(+c)*10),mod,st:p[2].split("").map(c=>c!=="-"),xp:+p[3]||0}}catch(e){return null}}
function bilanBody(b,own){const l=L(),lv=LEVELS[lvlOf(b.xp)],M=DATA.mods[b.mod],md=DATA.modules.find(m=>m.id===b.mod);

  if(!r.ok){const x=new Error((j&&(j.message||j.msg||j.error_description||j.error))||("HTTP "+r.status));x.status=r.status;throw x}
  return j}

  const s=NET.s;if(s&&!force&&s.exp>Date.now()/1000+60)return s;

      catch(e){if(e.net||!e.status||e.status>=500||e.status===429)throw e}}   // jeton perdu : nouveau compte
    const j=await sbFetch("/auth/v1/signup",{data:{}});if(!j||!j.access_token)throw new Error("auth");return sbKeep(j)

function vWeb(r){
  clearInterval(NET.poll);NET.poll=null;
  const k=r[0]||"",arg=r.slice(1);
  if(k==="")return wHub();
  if(k==="P")return wProfile();
  if(k==="B")return wBoards();
  if(k==="L")return wLeaguePage();
  if(k==="D")return wChallenge("daily");
  if(k==="T")return wChallenge("tourney");
  if(k==="C")return arg?wDuelLanding(arg):wDuelHome();
  if(k==="Y")return wPlay();
  if(k==="Q")return arg?wRoom(arg):wLiveHome();
  if(k==="O")return wWho();
  if(k==="G")return wGroup();
  if(k==="J")return wJoinGroup(arg);
  if(k==="F")return wBuddies();
  if(k==="A")return wBuddyLanding(arg);
  if(k==="S")return wStickers();
  if(k==="N")return wNotes();
  if(k==="X")return vParty(arg);
  return wHub()}

async function wChallenge(kind){if(!await wGuard())return;const l=L();

function wPlay(){const g=st.wch;if(!g)return go("W");const l=L();
  if(g.pos>=g.cards.length)return wChSubmit();
  const c=g.cards[g.pos],a=g.ch[g.pos];setTop(`${WT("q")} ${g.pos+1} / ${g.cards.length}`,g.c.kind==="duel"?WT("duel"):g.c.kind==="daily"?WT("daily"):WT("tourney"),true);
  const opts=g.order[g.pos].map((oi,j)=>{let cls="";if(a!==undefined){if(oi===c.a)cls="ok";else if(oi===a)cls="ko"}

  wMain(`<div class="wprog"><i style="width:${Math.round(100*g.pos/g.cards.length)}%"></i></div><div class="card"><div class="body"><p class="sub" style="margin:0 0 4px">${esc(c.t[l])}</p><p class="qq">${esc(c.q[l])}</p>${opts}
    ${a!==undefined?`<div class="why ${a===c.a?"ok":"ko"}"><b>${a===c.a?T("good"):T("bad")}</b>${esc(c.w[l])}</div><button class="big" onclick="st.wch.pos++;wPlay();window.scrollTo(0,0)">${g.pos+1<g.cards.length?WT("next"):WT("finish")} ▸</button>`:""}</div></div>`)}

async function wRoomPoll(){const R=st.wr;if(!R||location.hash!=="#WQ"+R.code){clearInterval(NET.poll);return}
  if(R.busy)return;R.busy=1;try{const s=await rpc("room_state",{p_code:R.code});R.busy=0;if(!st.wr||st.wr!==R)return;

function wRoomDraw(p,s){const l=L(),R=st.wr;
  const same=p&&p.state===s.state&&p.qi===s.qi&&!!(p.me&&p.me.answered)===!!(s.me&&s.me.answered);
  setTop((s.kind==="duel"?"⚡ ":s.kind==="practice"?"📚 ":"📡 ")+(s.kind==="duel"?WT("duel"):s.kind==="practice"?WT("practiceNew").split(" (")[0]:WT("live")),"#"+s.code+" · "+modName(s.module),true);
  const pl=s.players||[];
  if(s.state==="lobby"){
    if(same&&document.getElementById("wlob")){document.getElementById("wlob").innerHTML=pl.map(x=>`<span>${wAv(x,44)}<b>${esc(x.p)}</b></span>`).join("");return}
    const u=wLink("WQ"+s.code);
    return wMain(`<div class="wch"><p class="sub">${WT("lobby")}</p><p class="wcode big4">${s.code}</p></div><div class="wlob" id="wlob">${pl.map(x=>`<span>${wAv(x,44)}<b>${esc(x.p)}</b></span>`).join("")}</div>
      ${s.host?`<button class="big gold" onclick="wRoomStart()">▶ ${WT("start")}</button>${wShare((L()?"انضم إلى المسابقة المباشرة على أسمكتي، الرمز ":"Rejoins mon quiz en direct sur Asmekti, code ")+s.code+" 👉 "+u)}`:`<div class="xtra">⏳ ${WT("waitHost")}</div>`}`)}
  if(s.state==="closed"){clearInterval(NET.poll);return wMain(`<div class="end">${mascot("think",80)}<p>${WT("e_salle_commencee")}</p><button class="big" onclick="go('WQ')">${WT("live")}</button></div>`)}
  if(s.state==="end"&&!s.in){clearInterval(NET.poll);return wMain(`<div class="end">${mascot("think",80)}<p>${WT("end")}</p><button class="big" onclick="go('WQ')">${WT("live")}</button></div>`)}
  if(s.state==="end"){if(p&&p.state==="end")return;clearInterval(NET.poll);
    const me=pl.find(x=>x.me),rk=pl.findIndex(x=>x.me)+1;if(me&&!R.xp){R.xp=1;addXP(me.ok*2+(rk&&rk<=3&&pl.length>1?10:0))}
    if(rk===1&&pl.length>1)sfx("win");
    const top=pl.map((x,i)=>Object.assign({r:i+1},x));
    return wMain(`<h2 style="text-align:center">🏁 ${WT("end")}</h2>${wPodium(top,x=>x.s+" pts")}${top.map(x=>wRow(x,`${x.s} pts · ✓${x.ok}`)).join("")}
      <button class="big gold" onclick="wRoomNew('${s.kind==="duel"?"quiz":s.kind}')">↻ ${WT("again")}</button><button class="big alt" onclick="go('W')">🌐 ${WT("hub")}</button>`)}
  const c=wCardById(s.qid);if(!c)return;
  if(!R.order||R.oq!==s.qid){R.oq=s.qid;R.order=shuffle(c.o[0].map((_,i)=>i))}
  const myc=s.me&&s.me.answered?s.me.choice:R.sent[s.qi];
  if(s.state==="q"&&same&&document.getElementById("wtm")){wTimer(s);document.getElementById("wans").textContent=pl.filter(x=>x.ans).length+"/"+pl.length;return}
  const rev=s.state==="reveal";
  const opts=R.order.map((oi,j)=>{let cls="";if(rev){if(oi===s.a)cls="ok";else if(oi===myc)cls="ko"}else if(oi===myc)cls="pick";
    return `<button class="opt ${cls}" ${rev||myc!==undefined||s.wait_ms>0?"disabled":""} onclick="wRoomAns(${oi})"><span class="lt">${(l?"أبجد":"abcd")[j]}</span><span>${esc(c.o[l][oi])}</span></button>`}).join("");
  const top5=pl.slice(0,5).map((x,i)=>wRow(Object.assign({r:i+1},x),`${x.s}${rev&&x.lok!==null&&x.lok!==undefined?(x.lok?" ✅":" ❌"):""}`)).join("");
  wMain(`<div class="wlive"><span>${WT("q")} ${s.qi+1}/${s.n}</span>${s.timer&&!rev?`<div class="wtm"><i id="wtm"></i></div>`:""}<span id="wans">${pl.filter(x=>x.ans).length}/${pl.length}</span></div>
    ${s.wait_ms>0?`<div class="wready">${WT("ready")}</div>`:""}
    <div class="card"><div class="body"><p class="qq">${esc(c.q[l])}</p>${opts}
    ${rev&&s.me?`<div class="why ${s.me.ok?"ok":"ko"}"><b>${s.me.ok?WT("good")+" +"+s.me.pts:WT("bad")}</b>${esc(c.w[l])}</div>`:!rev&&myc!==undefined?`<p class="sub">${WT("answered")}</p>`:""}
    ${rev&&s.host?`<button class="big" onclick="wRoomNext()">${WT("next")} ▸</button>`:""}${!rev&&s.host&&!s.timer?`<button class="big alt" onclick="wRoomNext()">👁 ${L()?"أظهر الجواب":"Montrer la réponse"}</button>`:""}</div></div>
    <div style="margin-top:10px">${top5}</div>`);
  if(rev&&!(p&&p.state==="reveal"&&p.qi===s.qi)&&s.me)sfx(s.me.ok?"ok":"ko");
  if(!rev)wTimer(s)}
function wTimer(s){const t=document.getElementById("wtm");if(!t||!s.timer||s.left_ms==null)return;t.style.width=Math.min(100,Math.round(100*s.left_ms/20000))+"%";t.classList.toggle("hot",s.left_ms<5000)}

     let cl=a!==undefined?(a===S_BY[rr.s].c[rr.i].a?"good":"bad"):(p.ok?"good":p.seen?"seen":"");return `<i class="${cl} ${i===st.pos?"cur":""}"></i>`}).join("");
  document.getElementById("main").innerHTML=`
   <div class="meta"><span dir="ltr">${st.pos+1} / ${d.length}${P(c.img).ok?" · ✓":""}</span><span class="acts"><button id="listen" class="mini" onclick="speak()">${T("listen")}</button><button id="star" class="mini star ${favs[c.img]?"on":""}" aria-label="Favori" onclick="toggleFav('${c.img}')">${favs[c.img]?"★":"☆"}</button></span></div>
   <article class="card" id="card">
     <h2>${raHTML(c.t[l])}</h2>
     <figure onclick="zoom('${c.img}')"><img src="${IMGS[c.img]}" alt=""><span class="zoom">${T("zoom")}</span>${hotDots(c.img)}</figure>${hotFor(c.img)?`<div id="hsinfo"></div>`:""}
     <div class="body"><p class="sec">${T("steps")}</p><ol class="steps">${steps}</ol>${more}${rest}${(c.g&&c.g.length)?`<div class="gchips"><span>📖 ${T("gloCard")} :</span>${c.g.map(i=>`<button onclick="showTerm(${i})">${esc(DATA.glossary[i].t[l].replace(/ \(.*\)$/,""))}</button>`).join("")}</div>`:""}</div>
   </article><div class="dots">${dots}</div>`;
  const last=st.pos===d.length-1;
  document.getElementById("pager").innerHTML=`<div class="pager"><div class="in">
     <button class="prev" ${st.pos===0?"disabled":""} onclick="move(-1)">${l?"›":"‹"}</button>
     <button class="next" onclick="move(1)">${last?T("finish"):T("next")} ${l?"◂":"▸"}</button></div></div>`;
}
function step(n){const r=st.deck[st.pos],k=key(r);st.reveal[k]+=n;cardView();
  if(n===1){const li=document.querySelectorAll("ol.steps li");li.length&&li[li.length-1].scrollIntoView({behavior:"smooth",block:"center"})}
  else{const q=document.querySelector(".key");q&&q.scrollIntoView({behavior:"smooth",block:"center"})}}
function pick(oi){const r=st.deck[st.pos],k=key(r),c=S_BY[r.s].c[r.i];
  if(st.answered[k]!==undefined)return; st.answered[k]=oi; mark(c.img,{ok:oi===c.a}); srsAnswer(c.img,oi===c.a); markActive(); sfx(oi===c.a?"ok":"ko"); addXP(oi===c.a?((st.mode==="r"?15:10)-(st.hint[k]!==undefined?4:0)):2); if(oi===c.a)bump("ok");
  if(st.mode==="r")save("mr_revcount",load("mr_revcount",0)+1); cardView(); checkBadges();
  const w=document.querySelector(".why"); w&&w.scrollIntoView({behavior:"smooth",block:"center"});}
function move(dx){const np=st.pos+dx; if(np<0)return; stopSpeak(); st.pos=np; cardView(); window.scrollTo(0,0)}
function endView(){
  const l=L(), d=st.deck; let ok=0,ans=0;
  d.forEach(r=>{const a=st.answered[key(r)];if(a!==undefined){ans++;if(a===S_BY[r.s].c[r.i].a)ok++}});
  const tot=d.length;
  let btn="";
  if(st.mode==="s"){
    const nx=st.sn+1;
    btn=(S_BY[nx]?`<button class="big" onclick="go('s${nx}')">${T("nextS")}</button>`:"")+
        `<button class="big alt" onclick="again()">${T("again")}</button><button class="big alt" onclick="go('m')">${T("backMod")}</button><button class="big alt" onclick="go('')">🏠 ${T("home")}</button>`;
    setTop(`${T("seance")} ${st.sn}`,S_BY[st.sn].t[l],true);
  }else{
    if(st.mode==="x"){btn=`<button class="big gold" onclick="newExpress()">${T("newExp")}</button>`;setTop(T("expDone"),"",true)}
    else{btn=(st.mode==="r"&&dueList().length?`<button class="big rev" onclick="startReview()">${T("review")}</button>`:"")+(st.mode==="q"?`<button class="big alt" onclick="go('q')">${T("search")}</button>`:"");setTop({r:T("reviewTitle"),f:T("fav").replace(/^★\s*/,""),q:T("search").replace(/^🔍\s*/,""),w:T("examErrors")}[st.mode]||"✓","",true)}
    btn+=`<button class="big alt" onclick="go('')">🏠 ${T("home")}</button>`;
  }
  const emo=ok===tot?"🏆":ok>=tot*0.6?"👍":"💪";
  if(st.mode==="l"&&!st.learnCounted){st.learnCounted=1;bump("learn");addXP(20)}
  if(ok===tot&&tot>=3){confetti();sfx("win")}
  document.getElementById("main").innerHTML=`<div class="end">${mimg(ok===tot?"p_thumb":ok>=tot*0.6?"c_ok":"c_ask",ok===tot?130:110,"margin:0 auto")}
    <h1>${st.mode==="s"?T("done"):st.mode==="x"?T("expDone"):st.mode==="r"?T("revDone"):st.mode==="l"?T("learnDone"):T("allDone")}</h1><p class="sub">${T("yourScore")}</p>
    <div class="score" dir="ltr">${ok} / ${tot}</div></div>${st.mode==="s"?sessSummary(st.sn):""}${btn}`;
  document.getElementById("pager").innerHTML="";
}
function again(){st.deck.forEach(r=>{delete st.hint[key(r)];delete st.answered[key(r)];delete st.reveal[key(r)];delete st.order[key(r)]});st.pos=0;cardView();window.scrollTo(0,0)}
function zoom(img){
  const z=document.createElement("div");z.className="zoomv";
  z.innerHTML=`<img src="${IMGS[img]}" alt=""><button aria-label="Fermer">✕</button><div class="hint">${T("zoomHint")}</div>`;
  z.querySelector("button").onclick=()=>z.remove(); document.body.appendChild(z);
}
// balayage
let tx=null,ty=null;
document.addEventListener("touchstart",e=>{if(!document.getElementById("card")||document.querySelector(".zoomv"))return;tx=e.touches[0].clientX;ty=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx,dy=e.changedTouches[0].clientY-ty;tx=null;
  if(Math.abs(dx)>70&&Math.abs(dx)>1.8*Math.abs(dy)){let dir=dx<0?1:-1;if(st.lang==="ar")dir=-dir;move(dir)}},{passive:true});
function vCover(){
  document.querySelector(".top").style.display="none";
  const c=document.createElement("div");c.className="cover";c.id="cover";
  c.innerHTML=`<img class="wm" src="icons/asmekti-logo-fond-sombre.svg" alt="Asmekti Learn — Rappel de cours"><div class="tif">ⴰⵙⵎⴽⵜⵉ</div>
   <div class="sl" dir="rtl" style="text-align:right"><small>العربية</small><p>درسك في جيبك: تذكير سريع، بطاقة بعد بطاقة، بصور حصصك.</p></div>
   <div class="sl" dir="ltr"><small>ⵜⴰⵎⴰⵣⵉⵖⵜ</small><p>ⴰⵙⵎⴽⵜⵉ ⵏ ⵓⵍⵎⵓⴷ ⴳ ⵓⴼⵓⵙ ⵏⵏⴽ</p></div>
   <div class="sl" dir="ltr"><small>English</small><p>Your course in your pocket: a quick refresher, card by card, with pictures from your sessions.</p></div>
   <div class="sl" dir="ltr"><small>Français</small><p>Ton cours dans la poche : une piqûre de rappel, carte par carte, avec les images de tes séances.</p></div>
   <button class="go" onclick="closeCover()">ابدأ · ⴱⴷⵓ · Start · Commencer</button>
   <div class="cr">يعمل دون إنترنت · ⵉⵜⵜⵅⴷⴰⵎ ⴱⵍⴰ ⵉⵏⵜⵔⵏⵉⵜ · Works offline · Fonctionne sans Internet</div>
   <div class="ver">Version 2.3</div>`;
  document.body.appendChild(c);
}
function closeCover(){const c=document.getElementById("cover");c&&c.remove();save("mr_cover_seen",1);document.querySelector(".top").style.display="";render();if(!profile&&!load("mr_profile_skip",0))go("u");else maybeNews()}
const GO=(()=>{try{return new URLSearchParams(location.search).get("go")}catch(e){return null}})();
if(GO){try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}}
function splash(){const s=document.createElement("div");s.className="splash";s.innerHTML=`<img class="wm" src="icons/asmekti-logo-fond-sombre.svg" alt="Asmekti"><img class="ms" src="${MASC[(mascId()==="yuba"?"y_":"")+"c_talk"]||MASC.c_talk}" alt="">`;
  document.body.appendChild(s);setTimeout(()=>{s.classList.add("out");setTimeout(()=>s.remove(),400)},900)}
if(!location.hash&&!GO&&!((isStandalone()||NATIVE)&&load("mr_cover_seen",0))) vCover();
else if(!location.hash&&(isStandalone()||NATIVE)) splash();
render();
if(GO){setTimeout(()=>{if(GO==="learn")startLearn();else if(GO==="daily")go("WD");else if(GO==="live")go("WQ");else if(GO==="audio")go("a")},GO==="learn"?50:0)}
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest("button,.tile,.opt,a.big");if(b&&!b.disabled)hap()},{passive:true});
nativeInit();
if(location.hash&&location.hash[1]!=="R") maybeNews();
// Mise à jour : détection d'une nouvelle version et bandeau
function forceUpdate(){
  const go=()=>location.reload();
  try{
    Promise.resolve(window.caches?caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))):0)
      .then(()=>navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.update().catch(()=>{})))
      .then(go,go);
  }catch(e){go()}
}
function checkVersion(){
  fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(j=>{
    if(j&&j.v&&j.v!==DATA.v) showUpdateBar();
  }).catch(()=>{});
}
if(!NATIVE&&"serviceWorker" in navigator){
  let hasCtrl=!!navigator.serviceWorker.controller;   // false à la toute première visite
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(hasCtrl) showUpdateBar(); else hasCtrl=true; });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>{
      reg.update().catch(()=>{});
      document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="visible"){ reg.update().catch(()=>{}); checkVersion(); } });
    }).catch(()=>{});
    setTimeout(checkVersion,1500);
  });
}

</script>
