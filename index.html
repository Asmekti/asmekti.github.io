lats cuits passent par la même table. Que fais-tu ?", "في مطبخ ممون صغير، تمرّ الخضر المتربة والأطباق المطبوخة على نفس الطاولة. ماذا تفعل؟"], "o": [["Tu les travailles en même temps pour gagner du temps.", "Tu sépares dans le temps : le propre d'abord, nettoyage, puis le sale.", "Tu ajoutes du sel dans les plats cuits."], ["تشتغل عليهما في نفس الوقت لربح الوقت.", "تفصل بينهما زمنيًا: النظيف أولًا، ثم التنظيف، ثم المتّسخ.", "تضيف الملح إلى الأطباق المطبوخة."]], "a": 1, "w": ["Si le local est trop petit, on sépare dans le temps, avec un nettoyage entre les deux.", "إذا كان المكان ضيقًا، نفصل زمنيًا مع تنظيف بين المرحلتين."]}]}, "16": {"obj": [["Distinguer nettoyage et désinfection, et les trois propretés.", "تميّز بين التنظيف (nettoyage) والتطهير (désinfection)، وبين أنواع النظافة الثلاثة."], ["Choisir le détergent selon la souillure et régler les paramètres TACT.", "تختار المنظّف حسب نوع الوسخ وتضبط عوامل TACT."], ["Appliquer le protocole de N&D en 7 étapes et en contrôler l'efficacité.", "تطبّق بروتوكول التنظيف والتطهير في 7 مراحل وتراقب فعاليته."]], "sum": [["Toujours nettoyer avant de désinfecter : la souillure neutralise le désinfectant.", "نظّف دائمًا قبل التطهير: الوسخ يُبطل مفعول المطهّر."], ["Organique → alcalin ; minéral → acide ; germes → désinfectant.", "عضوي ← منظّف قاعدي؛ معدني ← منظّف حمضي؛ جراثيم ← مطهّر."], ["TACT : Température, Action mécanique, Concentration, Temps ; ils se compensent.", "TACT: الحرارة، الفعل الميكانيكي، التركيز، الزمن؛ وهي تعوّض بعضها."], ["Ne jamais mélanger détergent et désinfectant ; toujours finir par un rinçage à l'eau potable.", "لا تخلط أبدًا منظّفًا ومطهّرًا؛ واختم دائمًا بشطف بالماء الصالح للشرب."], ["Ce qui n'est pas écrit n'a pas été fait.", "ما لم يُكتب لم يُنجَز."]], "q3": [{"q": ["Sur l'échangeur d'une laiterie, tu vois un dépôt blanc et dur de calcaire. Quel produit choisis-tu ?", "على مبادل حراري في مصنع حليب، ترى رواسب كلسية بيضاء وصلبة. أيّ منتوج تختار؟"], "o": [["Un détergent acide.", "Un détergent alcalin (soude).", "Un désinfectant chloré seul."], ["منظّف حمضي.", "منظّف قاعدي (الصودا).", "مطهّر كلوري وحده."]], "a": 0, "w": ["Le calcaire est une souillure minérale : c'est le détergent acide qui l'élimine.", "الكلس وسخ معدني: المنظّف الحمضي هو الذي يزيله."]}, {"q": ["Juste après le nettoyage d'une trancheuse, tu dois savoir tout de suite si elle est propre. Quel contrôle ?", "مباشرة بعد تنظيف آلة التقطيع، يجب أن تعرف فورًا هل هي نظيفة. أيّ مراقبة تختار؟"], "o": [["Une empreinte sur gélose.", "Aucun contrôle : elle brille.", "Une ATP-métrie."], ["بصمة على الهلام (gélose).", "لا مراقبة: إنها تلمع.", "قياس ATP (ATP-métrie)."]], "a": 2, "w": ["L'ATP-métrie répond en quelques secondes : tu peux re-nettoyer tout de suite si besoin.", "قياس ATP يعطي النتيجة في ثوانٍ: يمكنك إعادة التنظيف فورًا عند الحاجة."]}]}}, "card": {"s01_08": {"lvl": 1, "ex": ["À la coopérative laitière, on analyse le lait de ferme avant de l'accepter. Le même lait devient ensuite lben grâce aux ferments.", "في التعاونية الحليبية، نحلّل حليب الضيعة قبل قبوله. ثم يصبح نفس الحليب لبنًا بفضل الخمائر (ferments)."]}, "s01_10": {"lvl": 2, "trap": ["« Du matériel bien lavé suffit. » Faux : il doit être stérile, sinon tu comptes les germes du matériel.", "«أدوات مغسولة جيدًا تكفي». خطأ: يجب أن تكون معقّمة، وإلا ستحسب جراثيم الأدوات."]}, "s01_17": {"lvl": 1, "trap": ["« Pasteur a prouvé le premier le lien maladie-microbe. » Non : c'est Koch, en 1876.", "«باستور أول من أثبت العلاقة بين المرض والميكروب». لا: إنه كوخ (Koch) سنة 1876."], "ex": ["Dans un atelier de découpe de la viande de l'Aïd, le lavage des mains reste la règle de Semmelweis.", "في ورشة تقطيع لحم العيد، يبقى غسل اليدين قاعدة سيملفايس (Semmelweis)."]}, "s01_21": {"lvl": 2, "trap": ["« Après le nettoyage, l'atelier est stérile. » Faux : l'hygiène réduit les microbes, elle ne les supprime pas.", "«بعد التنظيف تصبح الورشة معقّمة». خطأ: النظافة تُقلّص الميكروبات ولا تُلغيها."], "ex": ["Le khlii se garde longtemps : la viande est séchée, on lui retire l'eau.", "الخليع يُحفظ مدة طويلة: اللحم مجفّف، أي نزعنا منه الماء."], "cmp": ["C'est comme un feu : enlève le bois ou l'air, et il s'éteint.", "إنها مثل النار: انزع الحطب أو الهواء فتنطفئ."]}, "s01_24": {"lvl": 2, "trap": ["« Il a l'air normal, donc il est sûr. » Faux : les pathogènes ne laissent souvent aucun signe visible.", "«مظهره عادي، إذن هو آمن». خطأ: الممرضات (pathogènes) غالبًا لا تترك أي علامة ظاهرة."], "ex": ["Le raïb et le jben sont faits par des utiles. Le pain qui moisit est gâté par des nuisibles.", "الرايب والجبن البلدي تصنعهما كائنات نافعة. والخبز الذي يتعفّن تفسده كائنات ضارّة."]}, "s02_10": {"lvl": 1, "cmp": ["Le virus est un passager sans voiture : il lui faut une cellule hôte pour avancer.", "الفيروس راكب بلا سيارة: يحتاج إلى خلية مضيفة (cellule hôte) ليتقدّم."]}, "s02_12": {"lvl": 1, "ex": ["Les bactéries lactiques qui font le lben sont des procaryotes.", "البكتيريا اللبنية التي تصنع اللبن من بدائيات النواة (procaryotes)."]}, "s02_14": {"lvl": 1, "ex": ["La levure du pain du four et la moisissure d'un jben oublié sont des eucaryotes.", "خميرة خبز الفرّان والعفن على جبن بلدي منسي من حقيقيات النواة (eucaryotes)."]}, "s02_16": {"lvl": 1, "trap": ["« Le prion est un tout petit virus. » Non : c'est une protéine seule, sans ADN ni ARN.", "«البريون فيروس صغير جدًا». لا: إنه بروتين وحده، دون ADN ولا ARN."], "ex": ["À la coopérative laitière, un bactériophage peut détruire les ferments du levain.", "في التعاونية الحليبية، يمكن لعاثية (bactériophage) أن تدمّر خمائر الخميرة الأم (levain)."]}, "s02_21": {"lvl": 1, "cmp": ["Noyau = bureau du directeur ; mitochondrie = centrale électrique ; Golgi = service expédition ; vacuole = entrepôt.", "النواة = مكتب المدير؛ الميتوكوندري = محطة الكهرباء؛ غولجي = مصلحة الإرسال؛ الفجوة = المخزن."]}, "s02_23": {"lvl": 1, "trap": ["« La membrane donne sa forme à la cellule. » Non : c'est la paroi. La membrane gère les échanges.", "«الغشاء يعطي الخلية شكلها». لا: إنه الجدار (paroi). الغشاء يدير التبادل."]}, "s02_25": {"lvl": 1}, "s02_29": {"lvl": 1, "ex": ["Dans l'eau verte d'un bassin d'irrigation, les algues ont des chloroplastes ; un protozoaire n'en a pas.", "في الماء الأخضر لصهريج السقي، للطحالب صانعات اليخضور (chloroplastes)؛ أما الأوالي فلا."]}, "s03_17": {"lvl": 2, "ex": ["La moisissure sur un jben oublié se nourrit du fromage lui-même.", "العفن على جبن بلدي منسي يتغذّى من الجبن نفسه."]}, "s03_21": {"lvl": 1, "ex": ["Sur un pain du four oublié dans un sac, les taches visibles sont le mycélium.", "على خبز الفرّان المنسي في كيس، البقع الظاهرة هي الغزل الفطري (mycélium)."], "cmp": ["Une hyphe est un fil ; le mycélium est la pelote de laine emmêlée.", "الخيط الفطري (hyphe) خيط واحد؛ والغزل الفطري كُبّة صوف متشابكة."]}, "s03_23": {"lvl": 2, "cmp": ["Cloisonné = un train avec des wagons ; non cloisonné = un long tuyau sans séparation.", "مقسّم = قطار بعربات؛ غير مقسّم = أنبوب طويل بلا فواصل."]}, "s03_25": {"lvl": 1, "trap": ["« Le sucre empêche toute moisissure. » Faux : Aspergillus glaucum pousse sur les confitures.", "«السكر يمنع كل عفن». خطأ: Aspergillus glaucum ينمو على المربى."], "ex": ["Un pot de confiture de figues ouvert peut moisir en surface malgré le sucre.", "برطمان مربى التين المفتوح قد يتعفّن على سطحه رغم السكر."]}, "s03_29": {"lvl": 1, "trap": ["« Toutes les levures sont utiles. » Non : Candida est pathogène et cause des mycoses.", "«كل الخمائر نافعة». لا: Candida ممرضة وتسبب فطريات جلدية."], "ex": ["La pâte du msemen et du pain du four lève grâce à Saccharomyces.", "عجين المسمّن وخبز الفرّان ينتفخ بفضل Saccharomyces."]}, "s03_31": {"lvl": 2, "ex": ["Un jus d'orange frais vendu au souk mousse en bouteille : des levures fermentent son sucre.", "عصير برتقال طازج يُباع في السوق يُزبد في القنينة: خمائر تخمّر سكّره."]}, "s03_33": {"lvl": 2, "ex": ["Un pain moisi laissé en réserve envoie ses spores dans l'air de toute la boulangerie.", "خبز متعفّن متروك في المخزن يطلق أبواغه في هواء المخبزة كلها."], "cmp": ["Les spores sont comme les graines de pissenlit : le vent les emporte loin.", "الأبواغ مثل بذور الهندباء البرية: تحملها الريح بعيدًا."]}, "s03_35": {"lvl": 1}, "s03_37": {"lvl": 1}, "s04_09": {"lvl": 1, "cmp": ["Coque = une bille ; bacille = un bâtonnet ; spiralé = un tire-bouchon.", "المكوّرة = كُرية؛ العصية = عُصيّة؛ الحلزونية = مفتاح فلّين لولبي."]}, "s04_11": {"lvl": 1, "cmp": ["Constants = le moteur et la carrosserie d'une voiture ; facultatifs = les options.", "الثابتة = محرّك السيارة وهيكلها؛ الاختيارية = التجهيزات الإضافية."]}, "s04_13": {"lvl": 1, "cmp": ["Gram + : un mur épais sans manteau. Gram − : un mur fin avec un manteau gras.", "موجبة غرام: جدار سميك بلا معطف. سالبة غرام: جدار رقيق مع معطف دهني."]}, "s04_17": {"lvl": 2, "trap": ["« Plus on laisse l'alcool, mieux c'est. » Faux : trop long, toutes les bactéries deviennent roses.", "«كلما طال الكحول كان أفضل». خطأ: إذا طال، تصبح كل البكتيريا وردية."], "ex": ["Au laboratoire d'une usine de conserve, le Gram est souvent la première étape d'identification.", "في مختبر مصنع التصبير، صبغة غرام غالبًا أول مرحلة في التعرّف."]}, "s04_19": {"lvl": 2, "trap": ["« La Gram − est rose dès l'alcool. » Non : elle est incolore, puis rose après la fuchsine.", "«سالبة غرام وردية منذ الكحول». لا: تكون عديمة اللون، ثم وردية بعد الفوكسين."]}, "s04_21": {"lvl": 2}, "s04_23": {"lvl": 1, "ex": ["Viande de l'Aïd laissée au chaud : en 1 heure, 3 divisions, 1 bactérie devient 8. Mets-la vite au froid.", "لحم العيد المتروك في الحرارة: في ساعة واحدة 3 انقسامات، بكتيريا واحدة تصبح 8. ضعه بسرعة في البرودة."]}, "s04_27": {"lvl": 2, "ex": ["Dans une coopérative laitière, un biofilm dans un tuyau résiste au détergent grâce à la capsule.", "في تعاونية حليبية، غشاء حيوي (biofilm) داخل أنبوب يقاوم المنظّف بفضل المحفظة (capsule)."], "cmp": ["La capsule est un imperméable collant ; le flagelle est une hélice.", "المحفظة معطف مطري لاصق؛ والسوط مروحة دافعة."]}, "s04_29": {"lvl": 1}, "s04_31": {"lvl": 2, "trap": ["« Faire bouillir détruit tous les microbes. » Faux : les spores survivent à 100 °C.", "«الغليان يقتل كل الميكروبات». خطأ: الأبواغ تنجو في 100 درجة."], "ex": ["À l'usine de conserve de sardines d'Agadir, les boîtes passent à l'autoclave, au-dessus de 100 °C.", "في مصنع تصبير السردين بأكادير، تمرّ العلب في الأوتوكلاف فوق 100 درجة."], "cmp": ["La spore, c'est la bactérie en armure : elle attend que le danger passe.", "البوغ هو البكتيريا وهي تلبس درعًا: تنتظر حتى يمرّ الخطر."]}, "s04_35": {"lvl": 1}, "s05_07": {"lvl": 1, "trap": ["« Je peux voir un virus au microscope du labo. » Non : il faut un microscope électronique.", "«يمكنني رؤية الفيروس بمجهر المختبر». لا: يلزم المجهر الإلكتروني (microscope électronique)."]}, "s05_09": {"lvl": 1, "trap": ["« Un virus contient de l'ADN et de l'ARN. » Faux : c'est l'un ou l'autre, jamais les deux.", "«الفيروس يحتوي على ADN و ARN». خطأ: إما هذا أو ذاك، لا يجمع بينهما أبدًا."]}, "s05_11": {"lvl": 1, "cmp": ["Acide nucléique = la lettre ; capside = l'enveloppe ; nucléocapside = la lettre dans son enveloppe.", "الحمض النووي = الرسالة؛ القفيصة = الظرف؛ القفيصة النووية = الرسالة داخل ظرفها."]}, "s05_13": {"lvl": 2, "cmp": ["L'enveloppe est un manteau gras : le détergent le dissout, comme le savon enlève la graisse.", "الغلاف معطف دهني: المنظّف يذيبه، كما يزيل الصابون الدهون."]}, "s05_15": {"lvl": 1, "trap": ["« Un virus se multiplie dans un plat laissé au chaud. » Non : il ne se multiplie que dans une cellule hôte.", "«الفيروس يتكاثر في طبق متروك في الحرارة». لا: لا يتكاثر إلا داخل خلية مضيفة."], "cmp": ["Le virus est un pirate : il prend l'usine de la cellule pour fabriquer ses copies.", "الفيروس قرصان: يستولي على مصنع الخلية ليصنع نسخه."]}, "s05_17": {"lvl": 1, "trap": ["« Le bactériophage peut rendre l'homme malade. » Non : son seul hôte est une bactérie.", "«العاثية يمكن أن تُمرض الإنسان». لا: مضيفها الوحيد بكتيريا."], "cmp": ["Le phage est une seringue : les fibres se posent, la queue injecte l'ADN.", "العاثية حقنة: الألياف تلتصق، والذيل يحقن ADN."]}, "s05_19": {"lvl": 2, "ex": ["À la coopérative laitière, une cuve de raïb reste liquide le lendemain : on soupçonne un phage.", "في التعاونية الحليبية، حوض رايب يبقى سائلًا في الغد: نشكّ في عاثية."]}, "s05_21": {"lvl": 1}, "s05_23": {"lvl": 2}, "s06_09": {"lvl": 1, "ex": ["Du lait de ferme laissé au souk nourrit ses bactéries : elles tirent leur énergie du lait lui-même.", "حليب ضيعة متروك في السوق يغذي بكتيرياه: تستمد طاقتها من الحليب نفسه."]}, "s06_11": {"lvl": 1, "cmp": ["Lis le nom comme une adresse : chaque morceau donne une information précise.", "اقرأ الاسم كعنوان: كل جزء يعطي معلومة محددة."]}, "s06_13": {"lvl": 2, "trap": ["Erreur : « autotrophe » et « auxotrophe », c'est pareil. Non : auto = carbone du CO₂ ; auxo = besoin d'un facteur de croissance.", "خطأ: «autotrophe» و«auxotrophe» نفس الشيء. لا: auto = كربون من CO₂؛ auxo = حاجة إلى عامل نمو."], "ex": ["Le sucre du jus d'orange ou le lactose du lait : c'est le carbone organique des hétérotrophes.", "سكر عصير البرتقال أو لاكتوز الحليب: هذا هو الكربون العضوي للكائنات غيرية التغذية."]}, "s06_15": {"lvl": 1, "cmp": ["Le nom trophique, c'est comme un nom complet : prénom, nom du père, nom de famille.", "الاسم التغذوي مثل الاسم الكامل: الاسم الشخصي، اسم الأب، اسم العائلة."]}, "s06_19": {"lvl": 1, "ex": ["La viande et le lait sont riches en protéines : ils apportent beaucoup d'azote aux bactéries.", "اللحم والحليب غنيان بالبروتينات: يوفّران كثيرًا من الآزوت للبكتيريا."]}, "s06_21": {"lvl": 2, "cmp": ["Donner de l'extrait de viande à une bactérie, c'est lui donner des briques identiques aux siennes.", "إعطاء مستخلص اللحم للبكتيريا يعني إعطاءها لبنات مماثلة للبناتها."]}, "s06_25": {"lvl": 2, "trap": ["Erreur : dire seulement « auxotrophe ». Il faut préciser la substance : « auxotrophe vis-à-vis de la thiamine ».", "خطأ: قول «auxotrophe» فقط. يجب تحديد المادة: «auxotrophe تجاه الثيامين»."], "cmp": ["Un auxotrophe, c'est un apprenti qui a besoin d'un outil qu'il ne sait pas fabriquer.", "الـ auxotrophe متعلّم يحتاج أداة لا يعرف صنعها."]}, "s06_27": {"lvl": 1, "ex": ["Les lactobacilles du lben et du raïb sont souvent exigeants : ils demandent des facteurs de croissance.", "العصيات اللبنية (lactobacilles) في اللبن والرايب غالبًا متطلبة: تحتاج عوامل نمو."]}, "s07_03": {"lvl": 2, "trap": ["Erreur : « beaucoup d'eau = beaucoup de microbes ». Ce qui compte, c'est l'eau libre, pas l'eau totale.", "خطأ: «ماء كثير = ميكروبات كثيرة». المهم هو الماء الحر، وليس الماء الكلي."], "ex": ["La confiture de figues ou d'abricots d'une coopérative tient des mois grâce au sucre.", "مربى التين أو المشمش في تعاونية يدوم شهورًا بفضل السكر."]}, "s07_09": {"lvl": 2, "trap": ["Erreur : « au réfrigérateur, les microbes meurent ». Non : le froid ralentit, il ne tue pas.", "خطأ: «في الثلاجة تموت الميكروبات». لا: البرودة تبطئ، ولا تقتل."], "ex": ["Les sardines d'Agadir en chambre froide s'altèrent quand même après quelques jours : ce sont les psychrophiles.", "سردين أكادير في غرفة التبريد يفسد رغم ذلك بعد أيام: إنها محبّة البرودة."]}, "s07_12": {"lvl": 2, "ex": ["Le lben et le raïb sont acides : peu de bactéries dangereuses, mais une moisissure peut apparaître en surface.", "اللبن والرايب حمضيان: قليل من البكتيريا الخطيرة، لكن قد يظهر عفن على السطح."]}, "s07_14": {"lvl": 2, "cmp": ["Le pH trace une frontière : au-dessus de 4,5, le pays des bactéries ; en dessous, celui des levures et moisissures.", "pH يرسم حدًّا: فوق 4,5 بلاد البكتيريا؛ وتحته بلاد الخمائر والعفن."], "ex": ["La viande de l'Aïd et les sardines sont dans la zone à risque ; le citron confit, beaucoup moins.", "لحم العيد والسردين في المنطقة الخطرة؛ أما الحامض المصبّر فأقل بكثير."]}, "s07_16": {"lvl": 1, "trap": ["Erreur : « sous vide, plus rien ne pousse ». Faux : les anaérobies et les aéro-anaérobies continuent.", "خطأ: «تحت الفراغ لا ينمو شيء». خطأ: اللاهوائية والهوائية اللاهوائية الاختيارية تستمر."], "ex": ["Au cœur d'une boîte de sardines, il n'y a pas d'air : c'est la place de Clostridium.", "في قلب علبة السردين لا يوجد هواء: هذا مكان Clostridium."]}, "s07_18": {"lvl": 1, "cmp": ["Le sel et le sucre agissent comme une éponge : ils retiennent l'eau et la cachent aux microbes.", "الملح والسكر يعملان كالإسفنجة: يحبسان الماء ويخفيانه عن الميكروبات."], "ex": ["Les olives en saumure : seuls des germes halophiles peuvent y pousser.", "الزيتون في محلول الملح: لا تنمو فيه إلا الجراثيم المحبّة للملح (halophiles)."]}, "s07_22": {"lvl": 1, "trap": ["Erreur : inverser les mots. Hypertonique : l'eau sort, plasmolyse. Hypotonique : l'eau entre, turgescence.", "خطأ: قلب الكلمات. مفرط التوتر: يخرج الماء، بلزمة. ناقص التوتر: يدخل الماء، انتباج."]}, "s07_24": {"lvl": 2, "cmp": ["Chaque levier est un verrou sur la porte : un seul verrou ne suffit pas, on en met plusieurs.", "كل رافعة قفل على الباب: قفل واحد لا يكفي، نضع عدة أقفال."], "ex": ["Le khlii combine plusieurs leviers : viande salée, séchée, puis conservée dans la graisse.", "الخليع يجمع عدة رافعات: لحم مملّح، مجفّف، ثم محفوظ في الدهن."]}, "s08_07": {"lvl": 1, "cmp": ["Un milieu de culture, c'est une cuisine préparée exactement au goût du germe.", "وسط الزرع مطبخ محضّر بالضبط حسب ذوق الجرثوم."]}, "s08_09": {"lvl": 1, "trap": ["Erreur : vouloir compter les bactéries dans un bouillon. Le trouble montre la croissance, mais ne donne pas de nombre.", "خطأ: محاولة عدّ البكتيريا في المرق. العكارة تبيّن النمو، لكنها لا تعطي رقمًا."]}, "s08_11": {"lvl": 1, "cmp": ["Une colonie, c'est une grande famille : tous les membres ont la même mère.", "المستعمرة عائلة كبيرة: كل أفرادها لهم نفس الأم."]}, "s08_13": {"lvl": 1}, "s08_15": {"lvl": 1, "ex": ["Au labo d'une coopérative laitière, les milieux utilisés au quotidien sont des milieux empiriques.", "في مختبر تعاونية الحليب، الأوساط المستعملة يوميًا أوساط تجريبية."]}, "s08_17": {"lvl": 1, "cmp": ["Le milieu enrichi, c'est un repas de fête : on ajoute des plats pour les invités difficiles.", "الوسط المُغنى وليمة: نضيف أطباقًا للضيوف الصعبين."]}, "s08_18": {"lvl": 2, "trap": ["Erreur : confondre enrichi et sélectif. Enrichi aide un germe à pousser ; sélectif empêche les autres de pousser.", "خطأ: الخلط بين المُغنى والانتقائي. المُغنى يساعد جرثومة على النمو؛ والانتقائي يمنع الأخرى من النمو."], "cmp": ["Le milieu sélectif est un gardien à l'entrée : seuls les germes résistants passent.", "الوسط الانتقائي حارس عند الباب: لا تمرّ إلا الجراثيم المقاومة."], "ex": ["Chercher Salmonella dans la viande hachée d'une boucherie du souk demande un milieu sélectif.", "البحث عن Salmonella في اللحم المفروم لجزارة في السوق يتطلب وسطًا انتقائيًا."]}, "s09_03": {"lvl": 2, "cmp": ["C'est comme une nouvelle au souk : une personne la dit à deux, puis quatre, puis tout le souk la connaît.", "مثل خبر في السوق: شخص يقوله لاثنين، ثم لأربعة، ثم يعرفه السوق كله."], "ex": ["Une harira laissée tiède sur le comptoir tout l'après-midi devient un vrai bouillon de culture.", "حريرة متروكة دافئة على الكونتوار طول المساء تصبح وسط زرع حقيقيًا."]}, "s09_09": {"lvl": 2, "cmp": ["G, c'est le temps qu'il faut pour que la population double.", "G هو الوقت اللازم لكي تتضاعف الساكنة."]}, "s09_11": {"lvl": 2, "trap": ["Erreur : mélanger minutes et heures. Pour µ en h⁻¹, convertis d'abord G en heures.", "خطأ: الخلط بين الدقائق والساعات. لحساب µ بـ h⁻¹، حوّل G أولًا إلى ساعات."]}, "s09_15": {"lvl": 2, "trap": ["Erreur : multiplier N₀ par µt. Il faut multiplier par 2 puissance µt.", "خطأ: ضرب N₀ في µt. يجب الضرب في 2 أُسّ µt."]}, "s09_19": {"lvl": 1, "ex": ["Un lben au réfrigérateur est un système fermé : rien n'entre, rien ne sort.", "اللبن في الثلاجة نظام مغلق: لا شيء يدخل، لا شيء يخرج."]}, "s09_21": {"lvl": 1, "ex": ["À la coopérative laitière, on refroidit le lait de ferme dès la collecte pour allonger la latence.", "في تعاونية الحليب، نبرّد حليب الضيعة منذ الجمع لإطالة الكمون."], "cmp": ["La latence, c'est l'apprenti qui s'installe à l'atelier avant de commencer à produire.", "الكمون هو المتعلّم الذي يستقر في الورشة قبل أن يبدأ الإنتاج."]}, "s09_23": {"lvl": 1, "trap": ["Erreur : « en phase stationnaire, les bactéries ne bougent plus ». Elles se divisent et meurent au même rythme.", "خطأ: «في مرحلة الاستقرار البكتيريا لا تتحرك». إنها تنقسم وتموت بنفس الإيقاع."]}, "s09_27": {"lvl": 1, "trap": ["Erreur : croire que Malassez compte les bactéries vivantes. Il compte tout : vivantes et mortes.", "خطأ: الاعتقاد أن مالاسي تعدّ البكتيريا الحية. إنها تعدّ الكل: الحية والميتة."], "ex": ["Dans une pâte de msemen ou de pain, on peut compter les levures au microscope sur cette grille.", "في عجين المسمن أو الخبز، يمكن عدّ الخمائر بالمجهر على هذه الشبكة."]}, "s09_31": {"lvl": 2, "cmp": ["Diluer au 1/10, c'est comme verser un verre de thé dans neuf verres d'eau, encore et encore.", "التخفيف بـ 1/10 يشبه صبّ كأس من الشاي في تسعة كؤوس من الماء، مرة بعد مرة."]}, "s09_35": {"lvl": 2, "trap": ["Erreur : choisir la boîte la plus chargée pour être « plus précis ». Au-delà de 300, les colonies se touchent.", "خطأ: اختيار العلبة الأكثر امتلاءً لتكون «أدق». فوق 300 تتلاصق المستعمرات."]}, "s10_03": {"lvl": 1, "trap": ["« Un lait qui sort du pis est stérile. » Faux : il porte déjà une flore originelle, avant toute manipulation.", "«الحليب الخارج من الضرع معقّم.» خطأ: يحمل أصلًا فلورا أصلية قبل أي تداول."], "ex": ["Le lait de ferme arrive à la coopérative laitière avec sa flore originelle. La traite et les bidons ajoutent la flore de contamination.", "يصل حليب المزرعة إلى التعاونية الحليبية بفلورته الأصلية. والحلب والأواني تضيف فلورا التلوث."]}, "s10_09": {"lvl": 2, "ex": ["Le jour de l'Aïd, une carcasse laissée longtemps au chaud verdit plus vite. Mets-la au froid dès que possible.", "يوم العيد، الذبيحة المتروكة طويلًا في الحرارة تخضرّ بسرعة أكبر. ضعها في البرد في أقرب وقت."], "cmp": ["La flore digestive est un passager déjà à bord. Après l'abattage, plus personne ne la surveille.", "الفلورا الهضمية راكب موجود أصلًا على متن الذبيحة. بعد الذبح، لا أحد يراقبه."]}, "s10_11": {"lvl": 1, "ex": ["Les olives et les figues cueillies au verger portent déjà leur flore originelle sur la peau.", "الزيتون والتين المقطوفان من البستان يحملان أصلًا فلورتهما الأصلية على القشرة."], "cmp": ["La pruine, c'est un ferment « livré avec le fruit ».", "الـ pruine خميرة «تأتي مع الفاكهة»."]}, "s10_13": {"lvl": 2, "trap": ["« Une eau claire et sans odeur est sans danger. » Faux : les germes fécaux sont invisibles. Seule l'analyse le dit.", "«الماء الصافي والعديم الرائحة لا خطر فيه.» خطأ: الجراثيم البرازية غير مرئية. التحليل وحده يكشفها."], "ex": ["L'eau d'un puits proche d'une étable peut recevoir une pollution fécale. On la traite avant de l'utiliser à la laiterie.", "ماء بئر قريبة من إسطبل قد يتعرض لتلوث برازي. نعالجه قبل استعماله في المحلبة."]}, "s10_15": {"lvl": 2, "ex": ["Balayer à sec l'atelier pendant le conditionnement des olives soulève des poussières chargées de germes.", "كنس الورشة كنسًا جافًا أثناء تعبئة الزيتون يرفع غبارًا محمّلًا بالجراثيم."], "cmp": ["La poussière est le taxi des germes dans l'air.", "الغبار هو سيارة الأجرة التي تنقل الجراثيم في الهواء."]}, "s10_17": {"lvl": 2, "trap": ["« Un ouvrier propre et en bonne santé n'apporte aucun germe. » Faux : sa peau, sa bouche et son nez portent une flore abondante.", "«العامل النظيف والسليم لا يحمل أي جرثومة.» خطأ: جلده وفمه وأنفه تحمل فلورا كثيفة."], "ex": ["Au souk, le vendeur qui touche l'argent puis le msemen sans se laver les mains y dépose sa flore.", "في السوق، البائع الذي يلمس النقود ثم المسمن دون غسل يديه ينقل إليه فلورته."]}, "s10_19": {"lvl": 2, "ex": ["Dans une usine de conserve de sardines, un Clostridium oriente vers le sol ou le digestif ; un Staphylococcus, vers les ouvriers.", "في مصنع تصبير السردين، وجود Clostridium يوجّه نحو التربة أو الجهاز الهضمي؛ ووجود Staphylococcus نحو العمال."], "cmp": ["Le tableau est une enquête : le germe trouvé est l'empreinte qui mène au réservoir.", "الجدول تحقيق بوليسي: الجرثومة الموجودة هي البصمة التي تقود إلى المستودع."]}, "s11_10": {"lvl": 1, "cmp": ["Le commensal est un invité qui mange à ta table sans te déranger.", "المتعايش ضيف يأكل من مائدتك دون أن يزعجك."]}, "s11_12": {"lvl": 1, "ex": ["Les racines des fèves et des pois chiches abritent Rhizobium : l'agriculteur met moins d'engrais azoté.", "جذور الفول والحمص تأوي Rhizobium: فيستعمل الفلاح أسمدة آزوتية أقل."]}, "s11_14": {"lvl": 2, "trap": ["« Un aliment qui a bon aspect et bonne odeur est sans danger. » Faux : un pathogène peut être là sans altérer le produit.", "«الغذاء ذو المظهر والرائحة الجيدين لا خطر فيه.» خطأ: قد تكون جرثومة ممرضة موجودة دون أن تفسد المنتوج."], "ex": ["Une harira oubliée hors du frigo devient aigre : c'est une flore d'altération qui mange le produit.", "حريرة منسية خارج الثلاجة تصبح حامضة: إنها فلورا إفساد تأكل المنتوج."], "cmp": ["Le parasite est un voleur qui fait du mal ; le saprophyte est un éboueur qui mange les déchets.", "الطفيلي لص يُلحق الضرر؛ والرمّي عامل نظافة يأكل الفضلات."]}, "s11_18": {"lvl": 1, "trap": ["« Si la cuisson tue la bactérie, le danger disparaît toujours. » Faux : dans une intoxination, la toxine reste dans l'aliment.", "«إذا قتل الطهي البكتيريا، يختفي الخطر دائمًا.» خطأ: في التسمم الذيفاني، يبقى السمّ في الغذاء."], "ex": ["Une conserve maison de légumes ou de poisson mal stérilisée peut contenir la toxine de Clostridium botulinum.", "مُعلّبة منزلية من الخضر أو السمك غير معقّمة جيدًا قد تحتوي على سمّ Clostridium botulinum."], "cmp": ["Intoxination : la bactérie est partie, mais elle a laissé sa bombe, la toxine.", "التسمم الذيفاني: البكتيريا رحلت، لكنها تركت قنبلتها، أي السمّ."]}, "s11_20": {"lvl": 1, "ex": ["Une mayonnaise maison aux œufs crus, laissée au chaud pendant une fête de mariage : terrain idéal pour Salmonella.", "مايونيز منزلي بالبيض النيء، متروك في الحرارة أثناء حفل زفاف: وسط مثالي للسالمونيلا."]}, "s11_22": {"lvl": 1, "trap": ["« E. coli est toujours dangereuse. » Faux : la plupart des souches sont inoffensives ; seules les ECEH sont pathogènes.", "«E. coli خطيرة دائمًا.» خطأ: أغلب السلالات غير ضارة؛ فقط السلالات ECEH ممرضة."], "ex": ["Des kefta de bœuf grillées encore rosées au centre sont à risque. Cuis la viande hachée jusqu'au cœur.", "الكفتة من لحم البقر المشوية والتي بقي وسطها ورديًا فيها خطر. اطهُ اللحم المفروم حتى القلب."]}, "s11_24": {"lvl": 1, "ex": ["Le lait de ferme bu cru et le poulet cru mal manipulé en cuisine sont deux voies classiques de Campylobacter.", "حليب المزرعة المشروب نيئًا والدجاج النيء المتداول بشكل سيئ في المطبخ طريقان معروفان لكامبيلوباكتر."], "cmp": ["Campylobacter a la forme d'un tire-bouchon.", "كامبيلوباكتر له شكل فتّاحة الفلين (tire-bouchon)."]}, "s11_26": {"lvl": 2, "trap": ["« Le frigo protège de tous les germes. » Faux : Listeria se multiplie encore à 4 °C.", "«الثلاجة تحمي من كل الجراثيم.» خطأ: الليستيريا تتكاثر حتى في 4 درجات."], "ex": ["Un jben au lait cru ou du poisson fumé gardés au frigo sont déconseillés à une femme enceinte.", "الجبن (jben) من حليب نيء أو السمك المدخن المحفوظان في الثلاجة غير منصوح بهما للمرأة الحامل."]}, "s11_28": {"lvl": 1, "cmp": ["Chaque ligne est une fiche d'identité : qui, dans quel aliment, comment, et à quoi faire attention.", "كل سطر بطاقة تعريف: من، في أي غذاء، كيف، وما الذي يجب الانتباه إليه."]}, "s11_30": {"lvl": 1, "ex": ["Un pâtissier goûte la crème avec le doigt puis continue. Sans être malade, il peut y déposer ses staphylocoques.", "حلواني يتذوق الكريمة بإصبعه ثم يواصل العمل. دون أن يكون مريضًا، قد يضع فيها مكوراته العنقودية."], "cmp": ["Le porteur sain est comme une valise fermée : on ne voit pas ce qu'elle transporte.", "الحامل السليم مثل حقيبة مغلقة: لا نرى ما تحمله."]}, "s11_32": {"lvl": 1, "ex": ["Dans une laiterie ou un abattoir, un manipulateur aux examens positifs est écarté de la manipulation jusqu'à des examens négatifs.", "في محلبة أو مجزرة، العامل ذو الفحوص الإيجابية يُبعد عن التداول حتى تصبح فحوصه سلبية."]}, "s12_09": {"lvl": 1, "ex": ["Des moules ramassées sur les rochers, sans contrôle sanitaire, peuvent contenir des phycotoxines.", "بلح البحر (moules) المجموع من الصخور دون مراقبة صحية قد يحتوي على سموم طحلبية."], "cmp": ["Le coquillage est une éponge : il filtre l'eau et garde la toxine.", "المحار إسفنجة: يرشّح الماء ويحتفظ بالسمّ."]}, "s12_11": {"lvl": 1, "cmp": ["PSP frappe en minutes, E. coli en jours : une toxine déjà prête agit tout de suite.", "PSP يضرب في دقائق، و E. coli في أيام: السمّ الجاهز يعمل فورًا."]}, "s12_15": {"lvl": 2, "trap": ["« Je gratte la moisissure du pain et je mange le reste. » Faux : la toxine a déjà diffusé dans le produit.", "«أكشط العفن من الخبز وآكل الباقي.» خطأ: السمّ انتشر أصلًا في المنتوج."], "ex": ["Un sac de cumin stocké dans un local humide et mal ventilé du souk peut moisir. On écarte le lot.", "كيس كمون مخزّن في محل رطب وسيئ التهوية في السوق قد يتعفن. نستبعد الدفعة."]}, "s12_17": {"lvl": 1, "cmp": ["La moisissure est la partie visible de l'iceberg ; la toxine est cachée dessous.", "العفن هو الجزء الظاهر من جبل الجليد؛ والسمّ مختبئ تحته."]}, "s12_19": {"lvl": 1, "trap": ["« Bien cuire règle tout. » Faux : beaucoup de toxines sont thermostables et résistent à la cuisson.", "«الطهي الجيد يحل كل شيء.» خطأ: كثير من السموم مقاومة للحرارة وتصمد أمام الطهي."], "cmp": ["Arrêter le voleur ne rend pas l'argent volé : tuer le germe ne détruit pas sa toxine.", "القبض على اللص لا يعيد المال المسروق: قتل الجرثومة لا يدمّر سمّها."]}, "s12_25": {"lvl": 2, "ex": ["Des taches vertes ou bleues sur le pain du four : c'est une couleur qui apparaît, due aux moisissures.", "بقع خضراء أو زرقاء على خبز الفرن: إنه لون يظهر، سببه العفن."]}, "s12_27": {"lvl": 2, "ex": ["Des tomates ou des abricots qui ramollissent dans la caisse : leurs pectines sont attaquées.", "طماطم أو مشمش يلين داخل الصندوق: البكتين فيه يتعرض للتحلّل."], "cmp": ["La pectine est le ciment du fruit : quand les microbes la cassent, le fruit s'effondre.", "البكتين هو إسمنت الفاكهة: حين تكسره الميكروبات، تنهار الفاكهة."]}, "s12_29": {"lvl": 1, "ex": ["Des sardines mal conservées sentent fort le poisson : la triméthylamine fait partie des molécules en cause.", "السردين المحفوظ بشكل سيئ تفوح منه رائحة سمك قوية: ثلاثي ميثيل الأمين (triméthylamine) من الجزيئات المسؤولة."]}, "s12_35": {"lvl": 1, "ex": ["La levure qui fait lever la pâte du pain du four est Saccharomyces cerevisiae.", "الخميرة التي ترفع عجين خبز الفرن هي Saccharomyces cerevisiae."], "cmp": ["La levure est un ouvrier polyvalent : même ouvrier, trois matières premières, trois produits.", "الخميرة عامل متعدد المهام: نفس العامل، ثلاث مواد أولية، ثلاثة منتجات."]}, "s12_37": {"lvl": 2, "trap": ["« Toutes les moisissures sont nuisibles. » Faux : Penicillium roqueforti affine le fromage bleu.", "«كل الأعفان ضارة.» خطأ: Penicillium roqueforti يُنضج الجبن الأزرق."], "ex": ["Le raïb : des bactéries lactiques acidifient le lait, qui coagule. C'est une fermentation lactique.", "الرايب: بكتيريا لبنية تحمّض الحليب فيتخثّر. إنه تخمر لبني."]}, "s13_09": {"lvl": 2, "cmp": ["Maîtriser le développement, c'est freiner le voleur déjà entré. Maîtriser la contamination, c'est fermer la porte.", "التحكم في النمو هو إيقاف اللص الذي دخل. التحكم في التلوث هو إغلاق الباب."]}, "s13_13": {"lvl": 2, "trap": ["Faux : « Congeler la viande de l'Aïd tue les microbes. » Vrai : la congélation les bloque seulement.", "خطأ: «تجميد لحم العيد يقتل الميكروبات». الصحيح: التجميد يوقفها فقط."], "ex": ["La viande de l'Aïd va au congélateur pour des mois, et au réfrigérateur pour quelques jours.", "لحم العيد يوضع في المجمِّد لعدة أشهر، وفي الثلاجة لبضعة أيام."]}, "s13_15": {"lvl": 2, "cmp": ["Le froid, c'est le bouton pause d'un film : il ne rembobine jamais.", "البرودة مثل زر الإيقاف المؤقت في فيلم: لا يُرجِع الشريط أبدًا إلى البداية."], "ex": ["Des sardines débarquées à Agadir restent 2 h au soleil, puis 2 h dans un camion chaud. Cela fait 4 h de croissance.", "سردين مُفرَغ في أكادير يبقى ساعتين في الشمس، ثم ساعتين في شاحنة ساخنة. المجموع 4 ساعات من النمو."]}, "s13_19": {"lvl": 1, "trap": ["Faux : « Pasteurisé veut dire stérile. » Vrai : le produit est assaini, pas stérile.", "خطأ: «مبستر يعني معقّم». الصحيح: المنتوج مُطهَّر جزئيًا فقط، وليس معقّمًا."], "ex": ["Le lait pasteurisé du matin se vend au frais. Le lait UHT attend sur l'étagère de l'épicerie.", "الحليب المبستر يُباع في البرودة. أما حليب UHT فينتظر على رفّ البقال."]}, "s13_21": {"lvl": 2}, "s13_23": {"lvl": 2, "cmp": ["La spore, c'est la bactérie en armure : l'eau bouillante ne la perce pas.", "البوغ هو البكتيريا في درعها: الماء المغلي لا يخترقه."], "ex": ["Dans une usine de conserve de sardines, la stérilisation vise les spores, pas seulement les bactéries actives.", "في مصنع تصبير السردين، يستهدف التعقيم الأبواغ، وليس فقط البكتيريا النشطة."]}, "s13_25": {"lvl": 1}, "s13_27": {"lvl": 1, "ex": ["Le lait de ferme acheté au souk est un lait cru : il se garde au froid et se consomme vite.", "حليب الضيعة المشترى من السوق حليب خام: يُحفظ في البرودة ويُستهلك بسرعة."]}, "s13_29": {"lvl": 2, "trap": ["Faux : « Plus on chauffe, mieux c'est. » Vrai : un barème trop sévère abîme le produit pour rien.", "خطأ: «كلما سخّنّا أكثر كان أفضل». الصحيح: المعيار الحراري الشديد جدًا يُفسد المنتوج دون فائدة."]}, "s14_09": {"lvl": 2, "cmp": ["Le sel et le sucre, ce sont des invités qui occupent toutes les chaises : le germe ne trouve plus où s'asseoir.", "الملح والسكر كضيوف يحتلون كل الكراسي: لا تجد الجرثومة أين تجلس."], "ex": ["Les figues et les abricots séchés au soleil se gardent des mois sans frigo.", "التين والمشمش المجففان في الشمس يُحفظان أشهرًا بدون ثلاجة."]}, "s14_11": {"lvl": 1}, "s14_13": {"lvl": 2, "trap": ["Faux : « Le sel tue les microbes. » Vrai : le sel ne tue pas, il assèche.", "خطأ: «الملح يقتل الميكروبات». الصحيح: الملح لا يقتل، بل يُجفّف."], "ex": ["Le gueddid de l'Aïd : viande salée puis séchée au soleil, avant d'en faire le khlii.", "القديد في العيد: لحم مملّح ثم مجفّف في الشمس، قبل تحضير الخليع."]}, "s14_15": {"lvl": 1, "trap": ["Faux : « Avec un conservateur, l'hygiène compte moins. » Vrai : il accompagne le procédé, il ne le remplace jamais.", "خطأ: «مع المادة الحافظة، النظافة أقل أهمية». الصحيح: هي تُرافق طريقة الحفظ ولا تعوّضها أبدًا."]}, "s14_17": {"lvl": 2, "ex": ["Le lben et le raïb sont protégés par l'acide lactique. Les olives, par la saumure et la fermentation.", "اللبن والرايب يحميهما حمض اللبنيك. والزيتون يحميه المحلول الملحي (saumure) والتخمّر."], "cmp": ["Le ferment, c'est le premier arrivé qui occupe la place au souk : le contaminant ne trouve plus d'espace.", "الخميرة (ferment) هي من يصل أولًا ويحتل المكان في السوق: لا يجد الملوِّث مكانًا."]}, "s14_19": {"lvl": 2}, "s14_21": {"lvl": 2, "trap": ["Faux : « Sans oxygène, plus aucun germe ne pousse. » Vrai : les anaérobies, comme C. botulinum, en profitent.", "خطأ: «بدون أكسجين لا تنمو أي جرثومة». الصحيح: اللاهوائيات مثل C. botulinum تستفيد من ذلك."]}, "s14_23": {"lvl": 1}, "s14_27": {"lvl": 1, "ex": ["Le jben de la coopérative : lait pasteurisé, acidifié, salé, puis gardé au froid.", "جبن التعاونية: حليب مبستر، محمّض، مملّح، ثم محفوظ في البرودة."], "cmp": ["Les barrières, c'est une course d'obstacles : aucun germe ne saute toutes les haies.", "الحواجز كسباق حواجز: لا تستطيع أي جرثومة القفز فوقها جميعًا."]}, "s15_11": {"lvl": 2, "ex": ["Une arête dans une conserve de sardines : danger physique. Salmonella dans un œuf : danger biologique.", "حسكة في علبة سردين: خطر فيزيائي. السالمونيلا في بيضة: خطر بيولوجي."]}, "s15_13": {"lvl": 1}, "s15_15": {"lvl": 1, "cmp": ["Le diagramme ressemble à une arête de sardine : la tête est le problème, les arêtes sont les causes.", "المخطط يشبه حسكة سردينة: الرأس هو المشكلة، والحسكات هي الأسباب."]}, "s15_19": {"lvl": 2, "trap": ["Faux : « Un lait livré tiède, on le refroidit et c'est réglé. » Vrai : les germes ont déjà poussé ; on refuse.", "خطأ: «حليب وصل فاترًا، نبرّده وانتهى الأمر». الصحيح: الجراثيم نمت مسبقًا؛ نرفض الدفعة."]}, "s15_21": {"lvl": 1, "ex": ["Dans le stock d'une épicerie, le raïb qui périme demain sort avant celui qui périme dans cinq jours.", "في مخزن البقال، الرايب الذي تنتهي صلاحيته غدًا يخرج قبل الذي تنتهي بعد خمسة أيام."], "trap": ["Faux : « On range le nouveau lot devant, c'est plus pratique. » Vrai : l'ancien lot périme au fond.", "خطأ: «نضع الدفعة الجديدة في الأمام، هذا أسهل». الصحيح: الدفعة القديمة تفسد في الخلف."]}, "s15_25": {"lvl": 1, "trap": ["Faux : « La planche en bois de la maison convient à l'atelier. » Vrai : le bois est interdit au contact des aliments.", "خطأ: «لوح الخشب المنزلي يصلح للمشغل». الصحيح: الخشب ممنوع في تماس مع الأغذية."]}, "s15_31": {"lvl": 1, "ex": ["Dans une usine de conserve, le poisson entre côté quai, passe au parage, puis à la mise en boîte : jamais de retour.", "في مصنع التصبير، يدخل السمك من جهة الرصيف، ثم التنظيف، ثم التعليب: دون رجوع أبدًا."], "cmp": ["La marche en avant, c'est une rue à sens unique : le produit n'y fait jamais demi-tour.", "السير إلى الأمام شارع ذو اتجاه واحد: المنتوج لا يعود أبدًا إلى الوراء."]}, "s15_35": {"lvl": 1, "ex": ["Un chat de la rue qui entre dans l'atelier de msemen est un nuisible, même s'il semble propre.", "القط الذي يدخل مشغل المسمن حيوان مؤذٍ (nuisible)، حتى لو بدا نظيفًا."]}, "s15_37": {"lvl": 2, "ex": ["La viande hachée pour les kefta : machine très propre, froid, et emballage aussitôt. Vite, froid et propre.", "اللحم المفروم للكفتة: آلة نظيفة جدًا، برودة، وتعبئة فورية. بسرعة، بارد ونظيف."]}, "s15_41": {"lvl": 2, "trap": ["Faux : « J'ai des gants, je n'ai pas besoin de me laver les mains. » Vrai : les gants ne dispensent pas du lavage.", "خطأ: «ألبس القفازات، لا حاجة لغسل يديّ». الصحيح: القفازات لا تُغني عن الغسل."]}, "s16_07": {"lvl": 2, "trap": ["Faux : « La table brille, donc elle est saine. » Vrai : visuellement propre ne veut pas dire sans germes.", "خطأ: «الطاولة تلمع، إذن هي سليمة». الصحيح: النظافة الظاهرة لا تعني غياب الجراثيم."], "cmp": ["Désinfecter une surface sale, c'est peindre un mur plein de poussière : ça ne tient pas.", "تطهير سطح متّسخ كطلاء جدار مغطّى بالغبار: لا يصمد."]}, "s16_09": {"lvl": 2, "ex": ["Après la désinfection d'une cuve à lben, le rinçage final évite un goût de chlore dans le produit.", "بعد تطهير خزان اللبن، يمنع الشطف النهائي ظهور طعم الكلور في المنتوج."]}, "s16_11": {"lvl": 2, "ex": ["Dans une laiterie, les dépôts de lait cuit demandent un alcalin. Le tartre blanc de l'eau dure demande un acide.", "في مصنع الحليب، رواسب الحليب المطبوخ تحتاج منظّفًا قاعديًا. وترسّبات الكلس البيضاء تحتاج منظّفًا حمضيًا."]}, "s16_13": {"lvl": 1, "cmp": ["Le détergent a une main dans l'eau et une main dans la graisse : il tire la graisse vers l'eau.", "للمنظّف يد في الماء ويد في الدهون: يسحب الدهون نحو الماء."], "ex": ["Une marmite de harira grasse : l'eau seule glisse, le détergent décroche la graisse.", "قِدر حريرة دسم: الماء وحده ينزلق، أما المنظّف فينزع الدهون."]}, "s16_15": {"lvl": 1}, "s16_21": {"lvl": 2, "trap": ["Faux : « Plus l'eau est chaude, mieux on nettoie. » Vrai : au-delà de 70 °C, les protéines coagulent.", "خطأ: «كلما كان الماء أسخن كان التنظيف أفضل». الصحيح: فوق 70 درجة تتخثر البروتينات."], "cmp": ["La roue de Sinner, c'est un gâteau en quatre parts : si une part rétrécit, une autre doit grandir.", "عجلة سينر كعكة من أربع قطع: إذا صغرت قطعة، يجب أن تكبر أخرى."]}, "s16_25": {"lvl": 2}, "s16_29": {"lvl": 1}, "s16_33": {"lvl": 1, "cmp": ["L'ATP-métrie, c'est une photo instantanée ; la gélose, c'est un film qu'on regarde des jours plus tard.", "قياس ATP (ATP-métrie) صورة فورية؛ أما الهلام (gélose) ففيلم نشاهده بعد أيام."]}, "s16_35": {"lvl": 1, "ex": ["Dans une usine de conserve, chaque autoclave a sa fiche : quoi, comment, quand, qui, et la signature.", "في مصنع التصبير، لكل جهاز تعقيم (autoclave) بطاقته: ماذا، كيف، متى، من، والتوقيع."]}}, "chap": {"A": {"mnemo": [{"t": ["Les 7 étapes de l'analyse", "المراحل السبع للتحليل"], "x": ["« Sami Range Puis Envoie Ici Les Résultats » : Stériliser, Réceptionner, Préparer l'échantillon, Ensemencer, Incuber, Lire, Rédiger.", "«Sami Range Puis Envoie Ici Les Résultats»: التعقيم، الاستقبال، تحضير العيّنة، الزرع، الحضن، القراءة، التقرير."], "s": [1]}, {"t": ["L'ordre de la coloration de Gram", "ترتيب صبغة غرام"], "x": ["« Va Laver Avant de Sortir » : Violet de gentiane, Lugol, Alcool, Safranine (ou fuchsine).", "«Va Laver Avant de Sortir»: البنفسجي الجنسياني (Violet)، اللوغول (Lugol)، الكحول (Alcool)، السافرانين (Safranine) أو الفوكسين."], "s": [4]}, {"t": ["Le cycle du virus", "دورة الفيروس"], "x": ["« Ahmed Part Rapidement À Larache » : Adsorption, Pénétration, Réplication, Assemblage, Libération.", "«أحمد يذهب بسرعة إلى العرائش» (Ahmed Part Rapidement À Larache): الامتزاز، الاختراق، التضاعف، التجميع، التحرر."], "s": [5]}], "map": {"c": ["Le monde microbien", "عالم الكائنات الدقيقة"], "b": [{"t": ["Pourquoi la microbiologie", "لماذا علم الأحياء الدقيقة"], "i": [["Accepter un lot", "قبول دفعة"], ["Vérifier le système", "مراقبة النظام"], ["Fabriquer : lben, jben, pain", "التصنيع: اللبن، الجبن، الخبز"], ["Utiles, nuisibles, pathogènes", "نافعة، ضارّة، ممرضة"]]}, {"t": ["Classer le vivant", "تصنيف الكائنات الحية"], "i": [["Procaryotes : sans noyau", "بدائيات النواة: بدون نواة"], ["Eucaryotes : vrai noyau", "حقيقيات النواة: نواة حقيقية"], ["Acaryotes : virus, phages, prions", "عديمات الخلية: فيروسات، عاثيات، بريونات"]]}, {"t": ["La cellule eucaryote", "الخلية حقيقية النواة"], "i": [["Noyau : commande", "النواة: القيادة"], ["Mitochondrie : énergie (ATP)", "الميتوكوندري: الطاقة (ATP)"], ["Membrane : échanges ; paroi : forme", "الغشاء: التبادل؛ الجدار: الشكل"], ["Golgi : tri et distribution", "غولجي: الفرز والتوزيع"]]}, {"t": ["Les champignons", "الفطريات"], "i": [["Moisissures : hyphes et mycélium", "العفن: خيوط فطرية وغزل فطري"], ["Levures : unicellulaires, bourgeonnement", "الخمائر: أحادية الخلية، تبرعم"], ["Zygomycètes non cloisonnés, ascomycètes cloisonnés", "اللاقحية غير مقسّمة، الزقية مقسّمة"], ["Spores dans l'air", "أبواغ في الهواء"]]}, {"t": ["La bactérie", "البكتيريا"], "i": [["Coques, bacilles, spiralés", "مكوّرات، عصيات، حلزونية"], ["Éléments constants et facultatifs", "عناصر ثابتة واختيارية"], ["Gram + violet, Gram − rose", "موجبة غرام بنفسجية، سالبة غرام وردية"], ["La spore résiste à 100 °C", "البوغ يقاوم 100 درجة"]]}, {"t": ["Virus, phages, prions", "الفيروسات، العاثيات، البريونات"], "i": [["Capside + acide nucléique", "القفيصة + الحمض النووي"], ["ADN ou ARN, jamais les deux", "ADN أو ARN، لا يجمع بينهما"], ["Le phage détruit les ferments", "العاثية تدمّر الخمائر"], ["Prion : protéine mal repliée", "البريون: بروتين مطويّ خطأ"]]}]}, "case": {"t": ["Le lben qui ne caille pas", "اللبن الذي لا يتخثّر"], "ctx": ["Tu es technicien dans une coopérative laitière du Souss. Chaque matin, le lait de ferme arrive pour faire du lben. Aujourd'hui, une cuve pose problème.", "أنت تقني في تعاونية حليبية بسوس. كل صباح يصل حليب الضيعات لصنع اللبن. اليوم، حوض واحد فيه مشكل."], "steps": [{"q": ["Le camion de lait de ferme arrive. Que fais-tu d'abord ?", "تصل شاحنة حليب الضيعات. ماذا تفعل أولًا؟"], "o": [["Tu verses le lait directement en cuve", "Tu prélèves un échantillon pour décider d'accepter le lot", "Tu ajoutes plus de ferments pour être sûr"], ["تصبّ الحليب مباشرة في الحوض", "تأخذ عيّنة لتقرّر قبول الدفعة", "تضيف خمائر أكثر للاحتياط"]], "a": 1, "fb": ["Bien : la 1re raison de la microbiologie est d'accepter ou refuser un lot. Le lait est accepté.", "أحسنت: السبب الأول لعلم الأحياء الدقيقة هو قبول الدفعة أو رفضها. قُبل الحليب."]}, {"q": ["Le lendemain, la cuve 3 ne s'acidifie pas : le lait ne caille pas. Que suspectes-tu ?", "في الغد، الحوض 3 لا يتحمّض: الحليب لا يتخثّر. بماذا تشكّ؟"], "o": [["Trop de ferments dans la cuve", "Des moisissures dans le lait", "Une attaque de bactériophages sur les ferments"], ["خمائر كثيرة جدًا في الحوض", "عفن في الحليب", "هجوم عاثيات على الخمائر"]], "a": 2, "fb": ["Oui : le phage détruit les ferments lactiques, l'acidification s'arrête. La cuve est perdue.", "نعم: العاثية تدمّر الخمائر اللبنية فيتوقف التحمّض. ضاع الحوض."]}, {"q": ["Le chef veut relancer demain le même levain dans la même cuve, sans rien changer. Ton conseil ?", "الرئيس يريد إعادة نفس الخميرة الأم غدًا في نفس الحوض دون تغيير. ما نصيحتك؟"], "o": [["D'accord, ce n'était qu'un accident", "Doubler la dose du même levain", "Changer de souche et nettoyer-désinfecter à fond"], ["موافق، إنها مجرد صدفة", "مضاعفة كمية نفس الخميرة", "تغيير السلالة وتنظيف وتطهير شامل"]], "a": 2, "fb": ["Exact : ro irs", "المستودعات"], "i": [["Flore originelle + flore de contamination", "فلورا أصلية + فلورا تلوث"], ["Eau : premier vecteur de l'atelier", "الماء: الناقل الأول في الورشة"], ["Sol : riche, sporulés", "التربة: غنية، مكوّنة للأبواغ"], ["Air : transport sur poussières", "الهواء: نقل عبر الغبار"], ["Homme : Staphylococcus", "الإنسان: Staphylococcus"]]}, {"t": ["Relations hôte / germe", "علاقات المضيف والجرثومة"], "i": [["Commensalisme + / 0", "التعايش + / 0"], ["Symbiose + / +", "التكافل + / +"], ["Parasitisme − / +", "التطفل − / +"], ["Saprophytisme 0 / 0", "الترمّم 0 / 0"]]}, {"t": ["Pouvoir pathogène", "القدرة المُمرضة"], "i": [["Infection : multiplication dans les tissus", "العدوى: تكاثر في الأنسجة"], ["Toxi-infection : multiplication + toxines", "التسمم العدوائي: تكاثر + سموم"], ["Intoxination : la toxine seule", "التسمم الذيفاني: السمّ وحده"], ["Intoxication : produits de transformation", "التسمم: نواتج التحويل"]]}, {"t": ["4 pathogènes majeurs", "الممرضات الأربعة الكبرى"], "i": [["Salmonella : œufs, viande, lait crus", "السالمونيلا: بيض، لحم، حليب نيء"], ["E. coli ECEH : viande hachée", "E. coli ECEH: لحم مفروم"], ["Campylobacter : volaille, lait cru", "كامبيلوباكتر: دواجن، حليب نيء"], ["Listeria : pousse à 4 °C", "الليستيريا: تنمو في 4 درجات"], ["Porteur sain : examens obligatoires", "الحامل السليم: فحوص إجبارية"]]}, {"t": ["Toxines", "السموم"], "i": [["Phycotoxines : algues, coquillages", "السموم الطحلبية: طحالب، محار"], ["Mycotoxines : moisissures, céréales, épices", "السموم الفطرية: أعفان، حبوب، توابل"], ["Souvent thermostables : prévenir au stockage", "غالبًا مقاومة للحرارة: الوقاية في التخزين"]]}, {"t": ["Altérations et germes utiles", "الإفساد والجراثيم المفيدة"], "i": [["Couleur, texture, odeur", "اللون، القوام، الرائحة"], ["Odeur vers 10⁶–10⁷ germes/g", "الرائحة عند 10⁶–10⁷ جرثومة/غ"], ["Yaourt : S. thermophilus + L. bulgaricus", "الياغورت: S. thermophilus + L. bulgaricus"], ["Pain, vin, bière : Saccharomyces cerevisiae", "الخبز، النبيذ، الجعة: Saccharomyces cerevisiae"]]}]}, "case": {"t": ["Diarrhées après le jben de la coopérative", "إسهال بعد جبن التعاونية"], "ctx": ["Tu es technicien stagiaire dans une coopérative laitière. Elle fabrique du lben et du jben avec du lait de ferme. Plusieurs clients se plaignent de diarrhées après avoir mangé du jben.", "أنت تقني متدرب في تعاونية حليبية. تصنع اللبن والجبن (jben) من حليب المزرعة. عدة زبناء يشتكون من الإسهال بعد أكل الجبن."], "steps": [{"q": ["Le laboratoire trouve des entérocoques dans l'eau du puits qui sert à laver le matériel. Que conclus-tu ?", "وجد المختبر مكورات معوية في ماء البئر المستعمل لغسل المعدات. ماذا تستنتج؟"], "o": [["L'eau vient d'une source pure", "L'eau a une pollution fécale : il faut la traiter", "L'eau contient trop de chlore"], ["الماء من عين نقية", "في الماء تلوث برازي: يجب معالجته", "في الماء كلور زائد"]], "a": 1, "fb": ["Les entérocoques sont des germes intestinaux. L'eau est traitée, par exemple par chloration, avant usage.", "المكورات المعوية جراثيم معوية. يُعالَج الماء، مثلًا بالكلورة، قبل استعماله."]}, {"q": ["Le contrôle médical montre qu'une ouvrière porte Salmonella. Elle se sent très bien. Que décides-tu ?", "أظهرت المراقبة الطبية أن عاملة تحمل السالمونيلا. وهي تشعر أنها بخير. ماذا تقرر؟"], "o": [["Elle quitte le poste de manipulation tant que ses examens sont positifs", "Elle continue avec des gants", "Elle continue : elle n'est pas malade"], ["تغادر منصب التداول ما دامت فحوصها إيجابية", "تستمر مع ارتداء القفازات", "تستمر: فهي ليست مريضة"]], "a": 0, "fb": ["C'est une porteuse saine. L'arrêté n° 983-13 impose son retrait du poste tant que les examens restent positifs.", "إنها حاملة سليمة للجراثيم. القرار رقم 983-13 يفرض إبعادها عن المنصب ما دامت الفحوص إيجابية."]}, {"q": ["Le jben est stocké à 4 °C. Le responsable dit : « Au froid, aucun pathogène ne se multiplie. » Qu'en penses-tu ?", "يُخزَّن الجبن في 4 درجات. يقول المسؤول: «في البرد لا تتكاثر أي جرثومة ممرضة.» ما رأيك؟"], "o": [["Il a raison", "Il a raison, sauf pour Salmonella", "Il a tort : Listeria se multiplie encore à 4 °C"], ["هو على حق", "هو على حق، إلا بالنسبة للسالمونيلا", "هو مخطئ: الليستيريا تتكاثر حتى في 4 درجات"]], "a": 2, "fb": ["Listeria est psychrophile. Un fromage à pâte molle au lait cru est un aliment typique pour elle.", "الليستيريا محبّة للبرودة. والجبن الطري من حليب نيء غذاء نموذجي لها."]}, {"q": ["Un lot de jben présente des taches de moisissure. Un ouvrier propose d'enlever les taches et de vendre le reste. Que réponds-tu ?", "دفعة من الجبن تظهر عليها بقع عفن. يقترح عامل إزالة البقع وبيع الباقي. بماذا تجيب؟"], "o": [["D'accord, si on enlève bien les taches", "Non : on écarte le lot, la toxine a pu diffuser", "D'accord, si on cuit le jben ensuite"], ["موافق، إذا أزلنا البقع جيدًا", "لا: نستبعد الدفعة، فالسمّ قد يكون انتشر", "موافق، إذا طهونا الجبن بعد ذلك"]], "a": 1, "fb": ["La mycotoxine est invisible et diffuse dans le produit. Beaucoup de toxines résistent aussi à la cuisson.", "السمّ الفطري غير مرئي وينتشر في المنتوج. وكثير من السموم تقاوم الطهي أيضًا."]}, {"q": ["Pour la suite, que proposes-tu pour le lait de ferme utilisé pour le jben ?", "في المستقبل، ماذا تقترح بالنسبة لحليب المزرعة المستعمل في صنع الجبن؟"], "o": [["L'utiliser cru mais plus vite", "Y ajouter du sel", "Le pasteuriser avant la fabrication"], ["استعماله نيئًا لكن بسرعة أكبر", "إضافة الملح إليه", "بسترته قبل التصنيع"]], "a": 2, "fb": ["Le lait non pasteurisé est un aliment à risque pour Campylobacter, E. coli ECEH et Listeria.", "الحليب غير المبستر غذاء خطر بالنسبة لكامبيلوباكتر و E. coli ECEH والليستيريا."]}], "end": ["Tu as remonté aux sources (eau, manipulateur), tenu compte de Listeria au froid et des mycotoxines. Une contamination a souvent plusieurs causes à traiter ensemble.", "رجعت إلى المصادر (الماء، العامل)، وأخذت بعين الاعتبار الليستيريا في البرد والسموم الفطرية. التلوث غالبًا له عدة أسباب يجب معالجتها معًا."]}, "hot": {"s10_19": [{"x": 21, "y": 11, "t": ["L'eau", "الماء"], "d": ["Pseudomonas vient du sol et des plantes ; entérobactéri "t": ["Une journée à la coopérative laitière", "يوم في تعاونية الحليب"], "ctx": ["Tu es technicien dans une coopérative laitière du Souss. Elle fabrique du lait pasteurisé, du lben et du jben. Aujourd'hui, tu suis le produit de la réception au nettoyage.", "أنت تقني في تعاونية حليب بسوس. تصنع الحليب المبستر واللبن والجبن. اليوم تتبع المنتوج من الاستلام إلى التنظيف."], "steps": [{"q": ["7 h : un éleveur livre un bidon de lait à 12 °C au lieu de 4 °C. Que décides-tu ?", "الساعة 7: مربٍّ يسلّم إناء حليب في 12 درجة بدل 4 درجات. ماذا تقرر؟"], "o": [["Tu l'acceptes et tu le refroidis.", "Tu refuses ce lot non conforme.", "Tu le mélanges au lait conforme."], ["تقبله وتبرّده.", "ترفض هذه الدفعة غير المطابقة.", "تخلطه مع الحليب المطابق."]], "a": 1, "fb": ["La réception est le seul moment où l'on peut refuser. Mélanger contaminerait tout le tank.", "الاستلام هو اللحظة الوحيدة التي يمكن فيها الرفض. الخلط سيلوّث الخزان كله."]}, {"q": ["8 h : le lait accepté est pasteurisé. À quoi dois-tu penser juste après ?", "الساعة 8: الحليب المقبول يُبستر. بماذا يجب أن تفكر مباشرة بعد ذلك؟"], "o": [["Le laisser refroidir lentement dans la salle.", "Rien : il est stérile maintenant.", "Le refroidir vite et le garder à 4 °C."], ["تركه يبرد ببطء في القاعة.", "لا شيء: أصبح معقّمًا الآن.", "تبريده بسرعة وحفظه في 4 درجات."]], "a": 2, "fb": ["Les thermorésistants et les spores ont survécu. Le froid rapide freine leur multiplication.", "المقاومة للحرارة والأبواغ نجت. التبريد السريع يُبطئ تكاثرها."]}, {"q": ["11 h : en chambre froide, un nouveau lot de lben arrive. Où le ranges-tu ?", "الساعة 11: في غرفة التبريد، تصل دفعة جديدة من اللبن. أين تضعها؟"], "o": [["Derrière l'ancien lot, qui périme plus tôt.", "Devant l'ancien lot, c'est plus rapide.", "N'importe où, tant qu'il fait froid."], ["خلف الدفعة القديمة التي تنتهي صلاحيتها أولًا.", "أمام الدفعة القديمة، هذا أسرع.", "في أي مكان، ما دام المكان باردًا."]], "a": 0, "fb": ["C'est le FEFO : ce qui périme en premier sort en premier. Sinon, l'ancien lot  PSP."]]}, {"a": ["Mycotoxine", "السمّ الفطري"], "s": 12, "c": [["Je suis produite par des moisissures, pas par des bactéries.", "تنتجني الأعفان وليس البكتيريا."], ["On me trouve sur les céréales, les fruits secs et les épices.", "أوجد في الحبوب والفواكه الجافة والتوابل."], ["Gratter la partie moisie ne m'enlève pas.", "كشط الجزء المتعفن لا يزيلني."], ["À long terme, je peux provoquer des cancers.", "على المدى الطويل يمكن أن أسبب السرطان."]]}, {"a": ["Pseudomonas", "Pseudomonas"], "s": 10, "c": [["J'ai besoin d'air : je suis aérobie.", "أحتاج الهواء: أنا هوائية."], ["Je vis dans l'eau non polluée et dans le sol.", "أعيش في الماء غير الملوث وفي التربة."], ["Le cours me cite comme exemple d'alcalophile.", "يذكرني الدرس مثالًا على محبّة القاعدية."], ["Avec les Clostridies, je rends la viande de l'Aïd verdâtre.", "مع الـ Clostridies أجعل لحم العيد مخضرًّا."]]}, {"a": ["Lactobacillus bulgaricus", "Lactobacillus bulgaricus"], "s": 12, "c": [["Je suis une bactérie lactique.", "أنا بكتيريا لبنية."], ["J'acidifie le lait jusqu'à le faire coaguler.", "أحمّض الحليب حتى يتخثر."], ["Je travaille en duo avec Streptococcus thermophilus.", "أعمل في ثنائي مع Streptococcus thermophilus."], ["Sans moi, pas de yaourt.", "بدوني لا يوجد ياغورت."]]}]}, "lait": {"seances": [{"n": 1, "t": ["Le lait : définition, sécrétion et traite", "الحليب: التعريف، الإفراز والحلب"], "c": [{"img": "l01_10", "t": ["La filière laitière au Maroc", "قطاع الحليب في المغرب"], "st": [["Dans le monde, la production approchée de lait est de 888 millions de tonnes en 2020 ; l'Europe est la première région productrice.", "Au Maroc : 1,6 à 1,8 million de vaches laitières, chez environ 260 000 éleveurs ; 82 % de la production vient des bassins laitiers (Gharb, Loukkos, Tadla, Chaouia, Souss-Massa, Saïss).", "La filière pèse 13 milliards de dirhams de chiffre d'affaires et 450 000 emplois permanents (2023).", "2 700 centres de collecte, dont 1 900 coopératives, refroidissent le lait ; 13 opérateurs industriels transforment plus de 86 % du lait collecté.", "Consommation : 72 L par an et par habitant au Maroc (environ 200 g par jour), sous le minimum de 250 g par jour recommandé par l'OMS."], ["في العالم، يُقدَّر إنتاج الحليب بـ 888 مليون طن سنة 2020؛ وأوروبا هي أول منطقة منتجة.", "في المغرب: من 1,6 إلى 1,8 مليون بقرة حلوب، عند حوالي 260 000 مربٍّ؛ و82 % من الإنتاج يأتي من الأحواض الحليبية (الغرب، اللوكوس، تادلة، الشاوية، سوس ماسة، سايس).", "يحقق القطاع رقم معاملات قدره 13 مليار درهم و450 000 منصب شغل دائم (2023).", "2 700 مركز تجميع (centres de collecte)، منها 1 900 تعاونية، تبرّد الحليب؛ و13 فاعلًا صناعيًا يحوّلون أكثر من 86 % من الحليب المُجمَّع.", "الاستهلاك: 72 لترًا في السنة لكل مواطن في المغرب (حوالي 200 غ يوميًا)، أقل من الحد الأدنى الذي توصي به منظمة الصحة العالمية وهو 250 غ يوميًا."]], "k": ["Le centre de collecte est le premier maillon du froid entre l'éleveur et l'usine.", "مركز التجميع هو أول حلقة في سلسلة التبريد بين المربّي والمصنع."], "q": ["Quel est le rôle d'un centre de collecte ?", "ما هو دور مركز التجميع؟"], "o": [["Fabriquer le fromage", "Collecter le lait des éleveurs et le refroidir", "Analyser les pathogènes du lait en 48 h"], ["صناعة الجبن", "جمع حليب المربّين وتبريده", "تحليل الممرضات في الحليب خلال 48 ساعة"]], "a": 1, "w": ["Les centres de collecte, souvent des coopératives, collectent et refroidissent le lait avant l'usine.", "مراكز التجميع، وغالبًا ما تكون تعاونيات، تجمع الحليب وتبرّده قبل إرساله إلى المصنع."], "g": [20]}, {"img": "l01_12", "t": ["Les trois races laitières du Maroc", "السلالات الحلوب الثلاث في المغرب"], "st": [["Prim'Holstein : robe noire et blanche, la plus répandue au Maroc et dans le monde ; très forte production, mais exigeante en alimentation et sensible à la chaleur.", "Montbéliarde : robe rouge et blanche ; un peu moins de lait, mais un lait plus riche en protéines, adapté à la fromagerie.", "Oulmès-Zaër : race locale marocaine, rustique, résistante à la chaleur et aux conditions difficiles ; production plus faible, adaptée aux élevages extensifs.", "Le choix de la race est un choix technologique : un lait riche en protéines donne plus de fromage par litre."], ["البريم هولشتاين (Prim'Holstein): لون أسود وأبيض، الأكثر انتشارًا في المغرب والعالم؛ إنتاج مرتفع جدًا، لكنها تتطلب تغذية جيدة وحساسة للحرارة.", "المونبليارد (Montbéliarde): لون أحمر وأبيض؛ حليب أقل قليلًا، لكنه أغنى بالبروتينات ومناسب لصناعة الجبن.", "أولماس زعير (Oulmès-Zaër): سلالة محلية مغربية، صلبة وتقاوم الحرارة والظروف الصعبة؛ إنتاجها أضعف، وتناسب التربية الموسّعة.", "اختيار السلالة اختيار تكنولوجي: الحليب الغني بالبروتينات يعطي جبنًا أكثر في كل لتر."]], "k": ["Prim'Holstein pour la quantité, Montbéliarde pour la fromagerie, Oulmès-Zaër pour la rusticité.", "البريم هولشتاين للكمية، والمونبليارد لصناعة الجبن، وأولماس زعير للصلابة."], "q": ["Quelle race donne un lait plus riche en protéines, adapté à la fromagerie ?", "أيّ سلالة تعطي حليبًا أغنى بالبروتينات ومناسبًا لصناعة الجبن؟"], "o": [["La Prim'Holstein", "L'Oulmès-Zaër", "La Montbéliarde"], ["البريم هولشتاين", "أولماس زعير", "المونبليارد"]], "a": 2, "w": ["La Montbéliarde produit un peu moins de lait, mais plus riche en protéines.", "المونبليارد تنتج حليبًا أقل قليلًا لكنه أغنى بالبروتينات."], "g": [20]}, {"img": "l01_15", "t": ["La définition réglementaire du lait", "التعريف التنظيمي للحليب"], "st": [["Définition générale : un liquide blanc mat, légèrement visqueux, dont la composition varie selon l'espèce et même selon la race.", "Définition réglementaire (décret n° 2-00-425 du 7 décembre 2000) : le produit de la sécrétion mammaire normale, obtenue par une ou plusieurs traites, sans aucune addition ni soustraction.", "Sécrétion normale : un lait de vache malade ou un colostrum n'est pas du lait. Sans addition : pas d'eau (mouillage). Sans soustraction : pas de matière grasse retirée (écrémage frauduleux).", "« Lait » sans autre indication = lait de vache. Pour les autres espèces, il faut le nom : lait de chèvre, lait de chamelle."], ["التعريف العام: سائل أبيض غير لامع، لزج قليلًا، يتغير تركيبه حسب النوع الحيواني وحتى حسب السلالة.", "التعريف التنظيمي (المرسوم رقم 2-00-425 بتاريخ 7 دجنبر 2000): ناتج الإفراز الطبيعي للضرع، المحصَّل عليه بحلبة واحدة أو أكثر، دون أي إضافة أو نزع.", "إفراز طبيعي: حليب بقرة مريضة أو اللبأ (colostrum) ليس حليبًا. دون إضافة: إضافة الماء غش (mouillage). دون نزع: نزع المادة الدسمة غش (écrémage frauduleux).", "كلمة «حليب» وحدها = حليب البقر. أما الأنواع الأخرى فيجب ذكر اسمها: حليب الماعز، حليب الناقة."]], "k": ["Sécrétion mammaire normale, une ou plusieurs traites, sans addition ni soustraction.", "إفراز طبيعي للضرع، حلبة واحدة أو أكثر، دون إضافة أو نزع."], "q": ["Un producteur ajoute de l'eau à son lait. Quel terme de la définition est violé ?", "منتج يضيف الماء إلى حليبه. أيّ عنصر من التعريف لم يُحترم؟"], "o": [["Sans addition", "Sécrétion normale", "Une ou plusieurs traites"], ["دون إضافة", "إفراز طبيعي", "حلبة واحدة أو أكثر"]], "a": 0, "w": ["Ajouter de l'eau est une addition : c'est le mouillage, une fraude.", "إضافة الماء هي إضافة: إنه الغش بالماء (mouillage)."], "g": [9, 20, 34, 58]}, {"img": "l01_16", "t": ["Le cycle de lactation", "دورة الإدرار"], "st": [["Le démarrage : la lactation commence après la naissance du veau (vêlage) ; le lait des premiers jours est le colostrum.", "Le pic : la production monte rapidement, atteint un maximum, puis décroît régulièrement.", "Le tarissement : fin de la lactation, la vache se repose avant le vêlage suivant.", "Durée moyenne d'une lactation chez la vache : environ 305 jours, soit dix mois, puis environ deux mois de tarissement."], ["البداية: يبدأ الإدرار (lactation) بعد ولادة العجل (vêlage)؛ وحليب الأيام الأولى هو اللبأ.", "الذروة (pic): يرتفع الإنتاج بسرعة، ويبلغ حدًّا أقصى، ثم ينخفض بانتظام.", "التجفيف (tarissement): نهاية الإدرار، ترتاح البقرة قبل الولادة الموالية.", "المدة المتوسطة للإدرار عند البقرة: حوالي 305 أيام، أي عشرة أشهر، ثم حوالي شهرين من التجفيف."]], "k": ["Démarrage, pic, décroissance, tarissement : environ 10 mois de lactation et 2 mois de repos.", "بداية، ذروة، انخفاض، تجفيف: حوالي 10 أشهر من الإدرار وشهران من الراحة."], "q": ["Quelle est la durée moyenne d'une lactation chez la vache ?", "ما هي المدة المتوسطة للإدرار عند البقرة؟"], "o": [["Environ 305 jours", "Environ 160 jours", "Environ 450 jours"], ["حوالي 305 أيام", "حوالي 160 يومًا", "حوالي 450 يومًا"]], "a": 0, "w": ["Une lactation dure environ 305 jours, soit dix mois.", "يدوم الإدرار حوالي 305 أيام، أي عشرة أشهر."], "g": [9, 20, 50]}, {"img": "l01_17", "t": ["Lait ou colostrum ?", "حليب أم لبأ؟"], "st": [["Le lait : sécrétion normale à partir de la deuxième semaine ; environ 3,2 % de protéines et 3,2 % de matière grasse ; destiné à la transformation.", "Le colostrum : le lait de la première semaine après le vêlage ; 14 % de protéines dont 6 % d'anticorps, 6,7 % de matière grasse, riche en vitamine A et en minéraux.", "Le colostrum est l'unique moyen de défense du jeune veau : il lui est réservé.", "Trop riche en protéines, il coagule à la chaleur : impropre à la transformation, il est détecté et refusé à la réception."], ["الحليب: إفراز طبيعي ابتداءً من الأسبوع الثاني؛ حوالي 3,2 % بروتينات و3,2 % مادة دسمة؛ موجَّه للتحويل.", "اللبأ (colostrum): حليب الأسبوع الأول بعد الولادة؛ 14 % بروتينات منها 6 % أجسام مضادة، و6,7 % مادة دسمة، غني بالفيتامين A والمعادن.", "اللبأ هو وسيلة الدفاع الوحيدة للعجل الصغير: فهو مخصص له.", "لأنه غني جدًا بالبروتينات، يتخثر بالحرارة: غير صالح للتحويل، ويُكشف ويُرفض عند الاستقبال."]], "k": ["Le colostrum appartient au veau : à l'usine, c'est un lait anormal, refusé.", "اللبأ ملك للعجل: في المصنع هو حليب غير طبيعي ويُرفض."], "q": ["Pourquoi le colostrum est-il impropre à la transformation ?", "لماذا اللبأ غير صالح للتحويل؟"], "o": [["Il manque de matière grasse", "Il est trop acide dès la traite", "Trop riche en protéines, il coagule à la chaleur"], ["لأنه فقير في المادة الدسمة", "لأنه حامض جدًا منذ الحلب", "لأنه غني جدًا بالبروتينات فيتخثر بالحرارة"]], "a": 2, "w": ["Sa richesse en protéines le fait coaguler dès qu'on le chauffe.", "غناه بالبروتينات يجعله يتخثر بمجرد تسخينه."], "g": [9, 20]}, {"img": "l01_18", "t": ["La mamelle, usine à lait", "الضرع، مصنع الحليب"], "st": [["La mamelle est divisée en quatre quartiers indépendants, chacun avec son trayon : un quartier peut être infecté sans les autres.", "Le lait est stocké dans la citerne, puis s'écoule par le canal du trayon, fermé par un sphincter.", "La traite est l'action de tirer le lait de la mamelle, à la main ou avec une machine à traire.", "Le canal du trayon est la porte d'entrée des bactéries : toute l'hygiène de traite sert à le protéger."], ["ينقسم الضرع (mamelle) إلى أربعة أرباع (quartiers) مستقلة، لكل منها حلمة (trayon): قد يُصاب ربع دون الأرباع الأخرى.", "يُخزَّن الحليب في الصهريج (citerne)، ثم يسيل عبر قناة الحلمة المغلقة بعضلة عاصرة (sphincter).", "الحلب (traite) هو استخراج الحليب من الضرع، باليد أو بآلة الحلب.", "قناة الحلمة هي باب دخول البكتيريا: كل نظافة الحلب هدفها حمايتها."]], "k": ["Quatre quartiers, une citerne, un canal fermé par un sphincter : la porte d'entrée des bactéries.", "أربعة أرباع، صهريج، وقناة تغلقها عضلة عاصرة: إنها باب دخول البكتيريا."], "q": ["Par où les bactéries entrent-elles dans la mamelle ?", "من أين تدخل البكتيريا إلى الضرع؟"], "o": [["Par le canal du trayon", "Par la citerne", "Par la peau des quartiers"], ["عبر قناة الحلمة", "عبر الصهريج", "عبر جلد الأرباع"]], "a": 0, "w": ["Le canal du trayon est la porte d'entrée des bactéries.", "قناة الحلمة هي باب دخول البكتيريا."], "g": [20]}, {"img": "l01_21", "t": ["Les bonnes pratiques de traite", "الممارسات الجيدة للحلب"], "st": [["Avant : laver et rincer les pieds (pédiluve) ; laver, rincer et sécher chaque trayon ; éliminer les premiers jets dans un bol à fond noir.", "Les premiers jets sont les plus chargés en bactéries ; leur aspect révèle un lait anormal ou une mammite.", "Pendant : dans une salle de traite propre ; traite rapide et non interrompue (l'hormone de l'éjection n'agit que quelques minutes), complète, sans trop pousser.", "Après : désinfecter les trayons, car le sphincter reste ouvert quelques minutes ; laver, désinfecter et sécher tout le matériel.", "Immédiatement : refroidir le lait à environ 4 °C dès qu'il a quitté le pis."], ["قبل الحلب: غسل الأرجل وشطفها (حوض القدمين pédiluve)؛ غسل كل حلمة وشطفها وتجفيفها؛ التخلص من الدفقات الأولى في وعاء ذي قعر أسود.", "الدفقات الأولى هي الأكثر حملًا للبكتيريا؛ ومظهرها يكشف حليبًا غير طبيعي أو التهاب الضرع (mammite).", "أثناء الحلب: في قاعة حلب نظيفة؛ حلب سريع دون انقطاع (هرمون إدرار الحليب لا يعمل إلا بضع دقائق)، وكامل، دون إفراط.", "بعد الحلب: تطهير الحلمات لأن العضلة العاصرة تبقى مفتوحة بضع دقائق؛ غسل كل الأدوات وتطهيرها وتجفيفها.", "فورًا: تبريد الحليب إلى حوالي 4 °C بمجرد خروجه من الضرع."]], "k": ["Trayons propres, premiers jets éliminés, traite rapide et complète, désinfection, froid à 4 °C.", "حلمات نظيفة، دفقات أولى مُتخلَّص منها، حلب سريع وكامل، تطهير، وتبريد إلى 4 °C."], "q": ["Pourquoi désinfecte-t-on les trayons juste après la traite ?", "لماذا نطهّر الحلمات مباشرة بعد الحلب؟"], "o": [["Pour augmenter la production", "Parce que le sphincter reste ouvert quelques minutes", "Pour refroidir le lait"], ["لزيادة الإنتاج", "لأن العضلة العاصرة تبقى مفتوحة بضع دقائق", "لتبريد الحليب"]], "a": 1, "w": ["Le canal reste ouvert : la désinfection empêche les bactéries d'entrer et de provoquer une mammite.", "القناة تبقى مفتوحة: التطهير يمنع دخول البكتيريا وحدوث التهاب الضرع."], "g": [32]}, {"img": "l01_24", "t": ["La mammite", "التهاب الضرع"], "st": [["La mammite est une infection, une inflammation de la mamelle, provoquée par des bactéries qui pénètrent par le canal du trayon.", "Causes : traite incomplète, matériel sale, trayons non désinfectés, litière souillée ; une traite trop poussée blesse aussi la mamelle.", "Conséquences : lait impropre à la transformation, chute de production, traitement antibiotique.", "Conséquence cachée : après traitement, le lait contient des antibiotiques ; il est refusé à l'usine, car il détruit les ferments du yaourt."], ["التهاب الضرع (mammite) عدوى، أي التهاب في الضرع، تسببه بكتيريا تدخل عبر قناة الحلمة.", "الأسباب: حلب غير كامل، أدوات متسخة، حلمات غير مطهَّرة، فراش ملوث؛ والحلب المفرط يجرح الضرع أيضًا.", "النتائج: حليب غير صالح للتحويل، انخفاض الإنتاج، علاج بالمضادات الحيوية (antibiotiques).", "النتيجة الخفية: بعد العلاج يحتوي الحليب على مضادات حيوية؛ فيُرفض في المصنع لأنه يقتل خمائر الياغورت."]], "k": ["Une mammite coûte deux fois : moins de lait, puis du lait aux antibiotiques refusé.", "التهاب الضرع يكلّف مرتين: حليب أقل، ثم حليب بمضادات حيوية مرفوض."], "q": ["Pourquoi un lait de vache traitée aux antibiotiques est-il refusé à l'usine ?", "لماذا يُرفض في المصنع حليب بقرة عولجت بالمضادات الحيوية؟"], "o": [["Il a un goût sucré", "Il est trop gras", "Il détruit les ferments du yaourt"], ["لأن طعمه حلو", "لأنه غني جدًا بالدسم", "لأنه يقتل خمائر الياغورت"]], "a": 2, "w": ["Les antibiotiques détruisent les ferments : la cuve de yaourt ne prend pas.", "المضادات الحيوية تقتل الخمائر: فلا يتماسك ياغورت الحوض."], "g": [20, 32, 57]}, {"img": "l01_25", "t": ["Pourquoi refroidir à 4 °C ?", "لماذا التبريد إلى 4 °C؟"], "st": [["À 30 °C, le nombre de bactéries explose en quelques heures : le lait est perdu avant d'arriver à l'usine.", "À 15 et 25 °C, la multiplication est plus lente, mais elle démarre dans les premières heures.", "À 4 °C, la courbe reste presque plate pendant 24 heures : l'activité des micro-organismes devient très faible.", "Le lait doit être collecté et traité dans les 24 à 48 h ; au-delà, même à 4 °C, les psychrotrophes dégradent protéines et matière grasse."], ["في 30 °C، يتضاعف عدد البكتيريا بشكل كبير خلال ساعات قليلة: يضيع الحليب قبل وصوله إلى المصنع.", "في 15 و25 °C، التكاثر أبطأ، لكنه يبدأ في الساعات الأولى.", "في 4 °C، يبقى المنحنى شبه مستوٍ طوال 24 ساعة: يصبح نشاط الكائنات الدقيقة ضعيفًا جدًا.", "يجب جمع الحليب ومعالجته خلال 24 إلى 48 ساعة؛ بعدها، حتى في 4 °C، تُفسد البكتيريا المحبة للبرودة (psychrotrophes) البروتينات والمادة الدسمة."]], "k": ["Le froid ne tue pas les bactéries, il les endort : il conserve la qualité, il ne la crée pas.", "البرودة لا تقتل البكتيريا بل تُنوّمها: تحفظ الجودة ولا تصنعها."], "q": ["Que fait le froid à 4 °C aux bactéries du lait ?", "ماذا تفعل البرودة في 4 °C ببكتيريا الحليب؟"], "o": [["Il les tue toutes", "Il ralentit fortement leur activité", "Il les fait disparaître en 24 h"], ["تقتلها كلها", "تُبطئ نشاطها بقوة", "تُزيلها خلال 24 ساعة"]], "a": 1, "w": ["Le froid endort les bactéries ; ce qui est déjà contaminé le reste.", "البرودة تُنوّم البكتيريا؛ وما كان ملوثًا يبقى ملوثًا."], "g": [20]}], "since": "1.6"}, {"n": 2, "t": ["Qualité et quantité du lait : les facteurs de variation", "جودة الحليب وكميته: عوامل التغيّر"], "c": [{"img": "l02_05", "t": ["Cinq facteurs, trois familles", "خمسة عوامل، ثلاث عائلات"], "st": [["La quantité et la qualité du lait dépendent de cinq facteurs : l'alimentation, le stade de lactation, la saison, la race, l'état de santé.", "Trois familles : l'animal, la conduite d'élevage, le milieu. Tout facteur se range dans l'une d'elles.", "Deux effets : un facteur agit sur le volume, sur la composition, et le plus souvent sur les deux.", "Deux critères mesurés : taux de matière grasse (MG) environ 40 g/L, taux de matière protéique (MP) environ 32 g/L.", "L'usine ne peut rien changer à la ferme : elle s'adapte, c'est la standardisation."], ["كمية الحليب وجودته تتعلقان بخمسة عوامل: التغذية، مرحلة الإدرار، الفصل، السلالة، الحالة الصحية.", "ثلاث عائلات: الحيوان، طريقة التربية، الوسط. كل عامل ينتمي إلى إحداها.", "أثران: العامل يؤثر في الحجم أو في التركيب، وفي أغلب الأحيان في الاثنين.", "معياران يُقاسان: نسبة المادة الدسمة (MG) حوالي 40 غ/ل، ونسبة المادة البروتينية (MP) حوالي 32 غ/ل.", "المصنع لا يستطيع تغيير شيء في الضيعة: إنه يتكيّف، وهذا هو التوحيد القياسي (standardisation)."]], "k": ["Trois familles, deux effets, un seul levier pour l'usine : la standardisation.", "ثلاث عائلات، أثران، ووسيلة واحدة للمصنع: التوحيد القياسي."], "q": ["Quel est le seul levier de l'usine face à un lait qui varie ?", "ما هي الوسيلة الوحيدة للمصنع أمام حليب متغيّر؟"], "o": [["Changer la race des vaches", "La standardisation", "Modifier la ration des vaches"], ["تغيير سلالة الأبقار", "التوحيد القياسي", "تعديل علف الأبقار"]], "a": 1, "w": ["L'usine n'agit pas sur la ferme : elle ajuste la composition du lait reçu.", "المصنع لا يتدخل في الضيعة: إنه يضبط تركيب الحليب المستلَم."], "g": [20, 48]}, {"img": "l02_07", "t": ["Les facteurs liés à l'animal", "العوامل المرتبطة بالحيوان"], "st": [["La race : Prim'Holstein, beaucoup de lait peu riche ; Montbéliarde, moins de lait mais plus de protéines ; Oulmès-Zaër, rustique à faible volume.", "L'âge et le rang de lactation : la production augmente jusqu'à la troisième ou quatrième lactation, puis décline.", "L'état de santé : une mammite fait chuter le volume, monte les chlorures et les cellules, et dégrade l'aptitude fromagère.", "Ces facteurs ne se corrigent pas : ils se choisissent, au moment de constituer le troupeau."], ["السلالة: البريم هولشتاين حليب كثير قليل الغنى؛ المونبليارد حليب أقل لكن بروتينات أكثر؛ أولماس زعير صلبة بحجم ضعيف.", "العمر ورتبة الإدرار: يرتفع الإنتاج حتى الإدرار الثالث أو الرابع، ثم ينخفض.", "الحالة الصحية: التهاب الضرع يُخفض الحجم، ويرفع الكلوريدات (chlorures) والخلايا، ويُضعف القابلية لصناعة الجبن.", "هذه العوامل لا تُصحَّح: بل تُختار عند تكوين القطيع."]], "k": ["Les facteurs de l'animal ne se corrigent pas : ils se choisissent.", "عوامل الحيوان لا تُصحَّح: بل تُختار."], "q": ["Jusqu'à quel rang de lactation la production d'une vache augmente-t-elle ?", "حتى أيّ رتبة إدرار يرتفع إنتاج البقرة؟"], "o": [["La 3e ou 4e lactation", "La 1re lactation", "La 8e lactation"], ["الإدرار الثالث أو الرابع", "الإدرار الأول", "الإدرار الثامن"]], "a": 0, "w": ["La production monte jusqu'à la 3e ou 4e lactation, puis décline.", "يرتفع الإنتاج حتى الإدرار الثالث أو الرابع ثم ينخفض."], "g": [32]}, {"img": "l02_09", "t": ["Le stade de lactation, le facteur le plus puissant", "مرحلة الإدرار، العامل الأقوى"], "st": [["Jours 1 à 5 : le colostrum, impropre à la collecte ; trop riche, il coagule à la chaleur.", "Semaines 4 à 8 : le pic ; volume maximal, mais taux de MG et de protéines au plus bas.", "Mois 3 à 7 : la descente ; le volume baisse lentement, les taux remontent.", "Mois 8 à 10 : la fin ; peu de lait, mais le plus riche de toute la lactation.", "Un troupeau qui vêle tout en même temps livre une matière première très irrégulière."], ["الأيام 1 إلى 5: اللبأ، غير صالح للتجميع؛ غني جدًا ويتخثر بالحرارة.", "الأسابيع 4 إلى 8: الذروة؛ حجم أقصى، لكن نسبتا الدسم والبروتينات في أدنى مستوى.", "الأشهر 3 إلى 7: الانخفاض؛ الحجم ينقص ببطء والنسب ترتفع من جديد.", "الأشهر 8 إلى 10: النهاية؛ حليب قليل لكنه الأغنى طوال الإدرار.", "القطيع الذي يلد كله في الوقت نفسه يسلّم مادة أولية غير منتظمة جدًا."]], "k": ["Volume et richesse varient en sens inverse : beaucoup de lait pauvre au pic, peu de lait riche en fin.", "الحجم والغنى يتغيّران في اتجاهين متعاكسين: حليب كثير فقير في الذروة، وحليب قليل غني في النهاية."], "q": ["Au pic de lactation, le lait est :", "في ذروة الإدرار، يكون الحليب:"], "o": [["Abondant et pauvre", "Rare et riche", "Abondant et riche"], ["كثيرًا وفقيرًا", "قليلًا وغنيًا", "كثيرًا وغنيًا"]], "a": 0, "w": ["Au pic, volume maximal mais taux de MG et de protéines au plus bas.", "في الذروة، الحجم أقصى لكن نسبتا الدسم والبروتينات في أدنى مستوى."], "g": [9]}, {"img": "l02_10", "t": ["Vache, chèvre, brebis", "البقرة، الماعز، النعجة"], "st": [["La vache : 310 jours de lactation, environ 20 kg de lait par jour ; elle fournit l'essentiel de la collecte industrielle.", "La chèvre : 270 jours et 2,6 kg par jour ; des volumes faibles, valorisés en fromages fermiers.", "La brebis : 160 jours et 1,7 kg par jour ; le lait le plus riche en extrait sec, d'où d'excellents rendements fromagers.", "Une vache produit environ huit fois plus qu'une chèvre, mais un lait moins concentré."], ["البقرة: 310 أيام من الإدرار، حوالي 20 كغ من الحليب يوميًا؛ توفر أغلب التجميع الصناعي.", "الماعز: 270 يومًا و2,6 كغ يوميًا؛ أحجام ضعيفة تُثمَّن في أجبان الضيعة.", "النعجة: 160 يومًا و1,7 كغ يوميًا؛ الحليب الأغنى بالمادة الجافة (extrait sec)، ومنه مردود جبن ممتاز.", "البقرة تنتج حوالي ثماني مرات أكثر من الماعز، لكن حليبها أقل تركيزًا."]], "k": ["Plus une espèce donne de lait, moins il est concentré : la brebis donne peu, mais beaucoup de fromage par litre.", "كلما أعطى النوع حليبًا أكثر كان أقل تركيزًا: النعجة تعطي قليلًا لكن جبنًا كثيرًا في كل لتر."], "q": ["Quelle espèce donne le lait le plus riche en extrait sec ?", "أيّ نوع يعطي الحليب الأغنى بالمادة الجافة؟"], "o": [["La vache", "La chèvre", "La brebis"], ["البقرة", "الماعز", "النعجة"]], "a": 2, "w": ["La brebis : peu de lait, mais le plus riche en extrait sec.", "النعجة: حليب قليل لكنه الأغنى بالمادة الجافة."], "g": [20, 41]}, {"img": "l02_11", "t": ["Les facteurs liés à la conduite d'élevage", "العوامل المرتبطة بطريقة التربية"], "st": [["L'alimentation, le facteur le plus rapide : une ration déséquilibrée fait chuter le taux protéique en quelques jours ; un excès de concentré fait chuter le taux butyreux.", "Le rythme et la qualité de la traite : une traite incomplète laisse en mamelle le lait le plus gras et prépare une mammite ; des horaires irréguliers font baisser le volume.", "Le confort et l'abreuvement : privée d'eau, la vache baisse immédiatement ; une vache boit 100 à 150 L par jour en été.", "Ces facteurs se corrigent, et vite : ce sont les leviers de l'éleveur et du technicien de collecte."], ["التغذية، العامل الأسرع: علف غير متوازن يُخفض نسبة البروتين في أيام قليلة؛ والإفراط في العلف المركّز يُخفض نسبة الدسم (taux butyreux).", "إيقاع الحلب وجودته: الحلب غير الكامل يترك في الضرع الحليب الأغنى بالدسم ويُمهّد لالتهاب الضرع؛ والمواعيد غير المنتظمة تُخفض الحجم.", "الراحة والسقي: البقرة المحرومة من الماء ينخفض إنتاجها فورًا؛ البقرة تشرب من 100 إلى 150 لترًا يوميًا في الصيف.", "هذه العوامل تُصحَّح وبسرعة: إنها وسائل المربّي وتقني التجميع."]], "k": ["L'alimentation est le facteur qui agit le plus vite sur la composition du lait.", "التغذية هي العامل الذي يؤثر بأسرع شكل في تركيب الحليب."], "q": ["Quel facteur agit le plus vite sur le taux protéique ?", "ما العامل الذي يؤثر بأسرع شكل في نسبة البروتين؟"], "o": [["L'âge de l'animal", "La race", "L'alimentation"], ["عمر الحيوان", "السلالة", "التغذية"]], "a": 2, "w": ["Une ration déséquilibrée fait chuter le taux protéique en quelques jours.", "العلف غير المتوازن يُخفض نسبة البروتين في أيام قليلة."], "g": [20, 32]}, {"img": "l02_13", "t": ["Lait d'hiver, lait d'été", "حليب الشتاء وحليب الصيف"], "st": [["Hiver, lait riche : l'animal mange normalement ; taux butyreux et protéique au plus haut ; rendement fromager élevé ; volumes plus faibles qu'au printemps.", "Été, lait pauvre : stress thermique, l'ingestion chute dès 28 à 30 °C ; taux au plus bas de l'année.", "En été : rendement fromager dégradé, coagulation plus lente, cellules et flore en hausse.", "La saison ne se corrige pas : elle s'anticipe, en planifiant les fabrications exigeantes hors des mois chauds."], ["الشتاء، حليب غني: الحيوان يأكل بشكل عادي؛ نسبتا الدسم والبروتين في أعلى مستوى؛ مردود جبن مرتفع؛ أحجام أقل من الربيع.", "الصيف، حليب فقير: إجهاد حراري، والأكل ينخفض ابتداءً من 28 إلى 30 °C؛ النسب في أدنى مستوى في السنة.", "في الصيف: مردود جبن ضعيف، تخثر أبطأ، وارتفاع الخلايا والفلورا الميكروبية.", "الفصل لا يُصحَّح: بل يُتوقَّع، بتخطيط الصناعات الأكثر تطلبًا خارج الأشهر الحارة."]], "k": ["La saison s'anticipe : les fromages supportent mal le lait d'été.", "الفصل يُتوقَّع: الأجبان لا تتحمل جيدًا حليب الصيف."], "q": ["En été, le rendement fromager :", "في الصيف، مردود الجبن:"], "o": [["Augmente", "Diminue", "Ne change pas"], ["يرتفع", "ينخفض", "لا يتغيّر"]], "a": 1, "w": ["Le lait d'été contient moins de MG et de protéines : moins de fromage par litre.", "حليب الصيف فيه دسم وبروتينات أقل: جبن أقل في كل لتر."], "g": [41, 42]}, {"img": "l02_15", "t": ["Du taux du lait au rendement de l'atelier", "من نسب الحليب إلى مردود الورشة"], "st": [["Rendement fromager : il dépend de la caséine et de la MG ; 1 L donne environ 100 g de fromage à pâte pressée ; −2 g de protéines/L = plusieurs kilos perdus par tonne.", "Rendement beurrier : il suit le taux butyreux. MG (kg) = volume (L) × taux (g/L) ÷ 1 000.", "Exemple : 10 000 L à 41 g/L = 410 kg ; 10 000 L à 33 g/L = 330 kg ; 80 kg de MG en moins, près d'un cinquième du beurre.", "Standardisation : plus le lait s'écarte de la cible, plus il faut écrémer, remélanger, manipuler : énergie et pertes.", "Le lait est donc payé au taux de MG et de protéines, corrigé de la qualité hygiénique, jamais au simple litre."], ["مردود الجبن: يتعلق أولًا بالكازين (caséine) والدسم؛ لتر حليب يعطي حوالي 100 غ من الجبن المضغوط؛ نقص 2 غ من البروتين في اللتر = ضياع عدة كيلوغرامات من الجبن في كل طن.", "مردود الزبدة: يتبع نسبة الدسم. الدسم (كغ) = الحجم (ل) × النسبة (غ/ل) ÷ 1 000.", "مثال: 10 000 ل بـ 41 غ/ل = 410 كغ؛ 10 000 ل بـ 33 غ/ل = 330 كغ؛ أي 80 كغ من الدسم أقل، قرابة خُمس الزبدة.", "التوحيد القياسي: كلما ابتعد الحليب عن الهدف، وجب نزع الدسم وإعادة الخلط والمعالجة أكثر: طاقة وخسائر.", "لذلك يُدفع ثمن الحليب حسب نسبتي الدسم والبروتين، مع تصحيح بالجودة الصحية، وليس باللتر فقط."]], "k": ["Facteur d'élevage → variation de composition → variation de rendement → coût.", "عامل تربية ← تغيّر في التركيب ← تغيّر في المردود ← تكلفة."], "q": ["Combien de kg de MG contiennent 10 000 L de lait à 33 g/L ?", "كم كيلوغرامًا من الدسم في 10 000 لتر من الحليب بـ 33 غ/ل؟"], "o": [["33 kg", "330 kg", "3 300 kg"], ["33 كغ", "330 كغ", "3 300 كغ"]], "a": 1, "w": ["10 000 × 33 ÷ 1 000 = 330 kg de matière grasse.", "10 000 × 33 ÷ 1 000 = 330 كغ من المادة الدسمة."], "g": [20, 41, 42, 48]}, {"img": "l02_17", "t": ["La qualité hygiénique se joue à la ferme", "الجودة الصحية تُحسم في الضيعة"], "st": [["À température ambiante, la flore du lait double toutes les vingt minutes : tout retard se paie.", "Ce qui la dégrade : matériel de traite mal nettoyé, refroidissement tardif ou insuffisant, mammites non détectées.", "Ce qui la protège : élimina
