# Fabrique l'app Android d'Asmekti (APK) et la publie dans « Releases » — automatique à chaque changement de version
name: Asmekti Android
on:
  push:
    branches: [main]
    paths: ["version.json", "android-app/**", ".github/workflows/android.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Numéro de version
        run: |
          VN=$(python3 -c "import json;print(json.load(open('version.json'))['v'])")
          VC=$(python3 -c "v='$VN'.split('.')+['0'];print(int(v[0])*100+int(v[1]))")
          echo "VN=$VN" >> "$GITHUB_ENV"; echo "VC=$VC" >> "$GITHUB_ENV"; echo "Version $VN (code $VC)"
      - name: Copie de l'app web
        run: |
          mkdir -p android-app/www
          rsync -a --exclude android-app --exclude .github --exclude .git --exclude sw.js --exclude '*.md' ./ android-app/www/
          ls android-app/www | head
      - name: Projet Android (Capacitor)
        working-directory: android-app
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1F5A8C' --iconBackgroundColorDark '#1F5A8C' --splashBackgroundColor '#1F5A8C' --splashBackgroundColorDark '#12385a'
          npx cap sync android
          sed -i -E "s/versionCode [0-9]+/versionCode ${VC}/; s/versionName \"[^\"]*\"/versionName \"${VN}\"/" android/app/build.gradle
          M=android/app/src/main/AndroidManifest.xml
          grep -q TTS_SERVICE "$M" || sed -i 's#</manifest>#    <queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n</manifest>#' "$M"
          S=android/app/src/main/res/values/styles.xml
          grep -q windowOptOutEdgeToEdgeEnforcement "$S" || { sed -i 's#<resources>#<resources xmlns:tools="http://schemas.android.com/tools">#' "$S"; sed -i -E 's#(<style name="AppTheme\.NoActionBar"[^>]*>)#\1\n        <item name="android:windowOptOutEdgeToEdgeEnforcement" tools:targetApi="35">true</item>#' "$S"; }
          grep -n "OptOut" "$S"
          mkdir -p android/app/src/main/res/drawable && cp res/ic_stat_asmekti.png android/app/src/main/res/drawable/
          grep -nE "versionCode|versionName" android/app/build.gradle
      - name: Compilation
        working-directory: android-app/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace
      - name: Signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Ajoutez les secrets ANDROID_KEYSTORE_B64 et ANDROID_KEYSTORE_PASS (Settings > Secrets and variables > Actions)"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks.p12"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=android-app/android/app/build/outputs/apk/release/app-release-unsigned.apk
          "$BT/zipalign" -p -f 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/ks.p12" --ks-type PKCS12 --ks-key-alias asmekti --ks-pass env:KS_PASS --key-pass env:KS_PASS --out Asmekti.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs Asmekti.apk | head -3
          rm -f "$RUNNER_TEMP/ks.p12"
          ls -la Asmekti.apk
      - name: Publication (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VN }}
          name: Asmekti ${{ env.VN }}
          body: "App Android d'Asmekti Learn, version ${{ env.VN }}. Téléchargez **Asmekti.apk** ci-dessous et ouvrez-le sur le téléphone."
          files: Asmekti.apk
          make_latest: true
          overwrite_files: true
